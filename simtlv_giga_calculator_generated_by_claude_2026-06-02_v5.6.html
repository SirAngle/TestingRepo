// Parser override for topups; topup products are restricted to 30 days max.
function parseGlobalProducts(apiResponse, simType, options = {}) {
  const html = apiResponse?.data?.products || "";
  const doc = new DOMParser().parseFromString(html, "text/html");
  const maxValidityDays = options.maxValidityDays ?? 30;

  let products = [...doc.querySelectorAll(".esim-global-product-item")].map(item => {
    const text = selector =>
      item.querySelector(selector)?.textContent.trim().replace(/\s+/g, " ") || "";

    const gbText = text(".package-gb");
    const daysText = text(".package-days");
    const priceText = text(".price-wrap");
    const baseLink = item.querySelector("a.buy-now-with-icon");

    const dataGB = parseFloat(gbText.match(/[\d.]+/)?.[0] || 0);
    const validityDays = getValidityDays(daysText);
    const basePriceILS = getShekelAmount(priceText);

    const base = {
      quantity: 1,
      totalILS: basePriceILS,
      perUnitILS: basePriceILS,
      productId: baseLink?.dataset.id || null,
      checkoutUrl: baseLink?.href || null
    };

    const deals = [...item.querySelectorAll(".buy-now-bundle-wrap")].map(row => {
      const label = row.querySelector(".bundle-text")?.textContent.trim().replace(/\s+/g, " ") || "";
      const link = row.querySelector("a.buy-now-bundle");
      const checkoutUrl = link?.href || null;
      const quantity = getQuantityFromBundle(label, checkoutUrl);
      const totalILS = getShekelAmount(label);

      return {
        quantity,
        totalILS,
        perUnitILS: quantity ? round2(totalILS / quantity) : 0,
        label,
        productId: link?.dataset.id || null,
        checkoutUrl
      };
    }).filter(d => d.quantity > 1 && d.totalILS > 0);

    const validPrices = [base.perUnitILS, ...deals.map(d => d.perUnitILS)].filter(Boolean);

    return {
      simType,
      dataGB,
      validityDays,
      base,
      deals,
      bestPerUnitILS: validPrices.length ? Math.min(...validPrices) : null
    };
  }).filter(p =>
    p.dataGB > 0 &&
    p.base.totalILS > 0 &&
    p.validityDays !== null &&
    p.validityDays <= maxValidityDays
  );

  if (options.dedupe) products = dedupePackages(products);
  return products;
}

function dedupePackages(packages) {
  const seen = new Set();
  return (packages || []).filter(pkg => {
    const key = [
      pkg.base?.productId,
      pkg.dataGB,
      pkg.validityDays,
      pkg.base?.totalILS,
      pkg.base?.checkoutUrl
    ].join("|");
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

// Display filter for global/topup packages; topups pass maxValidityDays: 30.
function getDisplayGlobalPackages(packages, simplified = true, options = {}) {
  const maxValidityDays = options.maxValidityDays ?? 30;
  let valid = (packages || []).filter(p => p.validityDays !== null && p.validityDays <= maxValidityDays);

  if (simplified) {
    valid = valid.filter(p => p.dataGB !== 1 && p.dataGB !== 7);
  }

  valid = valid.sort((a,b) => a.dataGB - b.dataGB || a.validityDays - b.validityDays || a.base.totalILS - b.base.totalILS);

  if (simplified) {
    const thirtyDay = valid.filter(p => p.validityDays === 30);
    return thirtyDay.length ? thirtyDay : valid;
  }

  return valid;
}

function renderTopupProducts(result) {
  const displayPackages = getDisplayGlobalPackages(result.packages || [], isSimplified("topup"), { maxValidityDays: 30 });
  const copyTextValue = formatGlobalPlanListText(displayPackages);
  const copyButton = copyTextValue
    ? `<button class="global-copy-btn" onclick='copyText(${JSON.stringify(copyTextValue)})'>📋 העתק</button>`
    : "";

  if (!displayPackages.length) {
    return `<div class="topup-products"><div class="global-empty">לא נמצאו חבילות טופאפ מתאימות ל‑ICCID והמדינות שנבחרו.</div></div>`;
  }

  // Fixed canonical slots: every catalog renders the same GB positions.
  // A size the current SIM type doesn't offer renders as a RED row instead of
  // disappearing — positions never move between V1/V2/V3.
  const CANONICAL_TOPUP_GBS = [1, 2, 3, 5, 7, 10, 15, 20, 25, 50];
  const simplifiedHidden = isSimplified("topup") ? new Set([1, 7]) : new Set();
  const presentSizes = displayPackages.map(p => Number(p.dataGB));
  const slots = Array.from(new Set([...CANONICAL_TOPUP_GBS, ...presentSizes]))
    .filter(gb => !simplifiedHidden.has(gb))
    .sort((a, b) => a - b);

  const byGb = {};
  [...displayPackages]
    .sort((a, b) => (a.dataGB - b.dataGB) || (b.validityDays - a.validityDays))
    .forEach(pkg => { (byGb[Number(pkg.dataGB)] ||= []).push(pkg); });

  const rows = slots.map(gb => {
    const pkgs = byGb[gb];
    if (!pkgs || !pkgs.length) {
      return `
      <div class="topup-line is-missing" title="החבילה הזו לא קיימת בסוג הסים הנוכחי">
        <span class="topup-line-text">${gb} גיגה – לא קיים</span>
        <span class="tl-deal"></span>
        <span class="tl-missing-pad"></span>
      </div>
    `;
    }
    return pkgs.map(pkg => {
      // Row text is the base triple only — the deal lives in its fixed slot,
      // so every row has identical geometry (muscle memory).
      const line = `${pkg.dataGB} גיגה – ${pkg.validityDays} ימים – ₪${pkg.base.totalILS}`;
      return `
      <div class="topup-line">
        <span class="topup-line-text">${escapeHtml(line)}</span>
        ${renderTopupPurchaseLinks(pkg, result)}
      </div>
    `;
    }).join("");
  }).join("");

  return `
    <div class="topup-products">
      <div class="topup-products-titlebar">
        <div class="topup-products-title">חבילות טופאפ · 30 ימים</div>
        ${copyButton}
      </div>
      <div class="topup-lines-grid">${rows}</div>
    </div>
  `;
}

      const saved = localStorage.getItem(TOPUP_AUTO_CATALOG_STORAGE_KEY) || localStorage.getItem(TOPUP_VERSION_CATALOG_STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === "object") topupState.catalogCache = parsed;
      }
    } catch (e) {
      console.warn("Could not load automatic topup catalog cache", e);
    }
  }
}

function persistTopupCatalogCache() {
  try {
    localStorage.setItem(TOPUP_AUTO_CATALOG_STORAGE_KEY, JSON.stringify(topupState.catalogCache || {}));
  } catch (e) {
    console.warn("Could not save automatic topup catalog cache", e);
  }
}

function getTopupProfile() {
  ensureAutoTopupState();
  return TOPUP_VERSION_PROFILES[topupState.simVersion] || TOPUP_VERSION_PROFILES.esim_v3;
}

function setTopupVersion(version) {

// ---- ICCID → SIM-type autodetection ----------------------------------------
// Prefix table derived from real card samples. NOTE: 12 digits is NOT always
// enough — 894801000001x opens both V3 (…14…) and V2 (…12…); the 8948010-00000
// family only disambiguates at digit 13, so those entries are 13 digits long.
// Longest matching prefix wins. Extend this table as new ranges appear.
const ICCID_TYPE_PREFIXES = [
  { prefix: "894310",        type: "psim_v1" }, // all V1 samples
  { prefix: "893720",        type: "psim_v2" }, // e.g. 8937204017…
  { prefix: "8948010010",    type: "esim_v3" }, // e.g. 8948010010054…
  { prefix: "8948010000012", type: "psim_v2" },
  { prefix: "8948010000059", type: "psim_v2" },
  { prefix: "8948010000060", type: "psim_v2" },
  { prefix: "8948010000014", type: "esim_v3" },
  { prefix: "8948010000027", type: "esim_v3" },
  { prefix: "8948010000038", type: "esim_v3" },
  { prefix: "8948010000052", type: "esim_v3" },
  { prefix: "8948010000063", type: "esim_v3" },
  { prefix: "8948010000077", type: "esim_v3" },
  { prefix: "8948010000095", type: "esim_v3" },
];

function detectSimTypeFromIccid(iccid) {
  const ic = normalizeIccid(iccid);
  if (ic.length < 13) return null;
  let best = null;
  for (const rule of ICCID_TYPE_PREFIXES) {
    if (ic.startsWith(rule.prefix) && (!best || rule.prefix.length > best.prefix.length)) best = rule;
  }
  return best ? best.type : null;
}

function autoDetectAndSwitchSimType(iccid) {
  const ic = normalizeIccid(iccid);
  if (ic.length < 18) return; // wait for a full ICCID — no flicker mid-typing
  const type = detectSimTypeFromIccid(ic);
  if (!type) return;
  ensureAutoTopupState();
  if (topupState.simVersion === type) return;
  setTopupVersion(type);
  showCopyToast(`🔍 זוהה ${TOPUP_VERSION_PROFILES[type].label} — הוחלף אוטומטית`);
}

function setTopupCustomerIccid(value, rerender = false) {
  ensureAutoTopupState();
  const iccid = normalizeIccid(value);
  topupState.customerIccid = iccid;
  topupState.iccid = iccid;
  const input = document.getElementById("topupIccid");
  if (input && input.value !== iccid) input.value = iccid;
  try { localStorage.setItem("simtlv_topup_customer_iccid_20260529", iccid); } catch (e) {}
  autoDetectAndSwitchSimType(iccid);
  if (rerender) renderAll();
}

// ---- Quote template ---------------------------------------------------------
// Editable message template with placeholders; persisted per browser.
const QUOTE_TEMPLATE_KEY = "simtlv_quote_template_v1";
const DEFAULT_QUOTE_TEMPLATE =
`מחירון גלישה — {country} ✈️

📱 eSIM · 30 ימים:
{esim_plans}

💳 סים פיזי · 30 ימים:
{psim_plans}`;
let quoteTemplate = DEFAULT_QUOTE_TEMPLATE;
try {
  const savedTpl = localStorage.getItem(QUOTE_TEMPLATE_KEY);
  if (savedTpl && savedTpl.trim()) quoteTemplate = savedTpl;
} catch (e) {}

function buildQuoteText() {
  if (!selected.length) return null;

  const names = selected.map(c => c.name.he).join(", ");

  const esimZone = Math.max(...selected.map(c => c.esimZone ?? c.zone));
  const esimCountry = selected.find(c => (c.esimZone ?? c.zone) === esimZone);
  const esimPlans = esimCountry ? [...esimCountry.plans.esim].sort((a,b)=>a.dataGB-b.dataGB) : [];
  const esimLines = esimPlans.map(p => `${p.dataGB} גיגה – 30 ימים – ₪${Math.round(p.priceUSD * USD_TO_ILS)}`).join("\n");

  const physZone = Math.max(...selected.map(c => c.physicalZone ?? c.zone));
  const physCountry = selected.find(c => (c.physicalZone ?? c.zone) === physZone);
  const physPlans = physCountry ? [...physCountry.plans.physical].sort((a,b)=>a.dataGB-b.dataGB) : [];
  const physLines = physPlans.map(p => `${p.dataGB} גיגה – 30 ימים – ₪${p.priceILS}`).join("\n");

  if (!esimLines && !physLines) return null;

  return quoteTemplate
    .replaceAll("{country}", names)
    .replaceAll("{esim_plans}", esimLines || "—")
    .replaceAll("{psim_plans}", physLines || "—")
    .replaceAll("{date}", new Date().toLocaleDateString("he-IL"));
}

function copyQuote() {
  if (!selected.length) { alert("בחר מדינה קודם"); return; }
  const text = buildQuoteText();
  if (!text) { alert("אין חבילות זמינות ליעד הזה"); return; }
  copyText(text);
}

function openQuoteEditor() {
  const modal = document.getElementById("quoteModal");
  const ta = document.getElementById("quoteTemplateArea");
  if (!modal || !ta) return;
  ta.value = quoteTemplate;
  modal.classList.add("open");
}

function closeQuoteEditor() {
  const modal = document.getElementById("quoteModal");
  if (modal) modal.classList.remove("open");
}

function saveQuoteTemplate() {
  const ta = document.getElementById("quoteTemplateArea");
  if (!ta) return;
  quoteTemplate = ta.value.trim() ? ta.value : DEFAULT_QUOTE_TEMPLATE;
  try { localStorage.setItem(QUOTE_TEMPLATE_KEY, quoteTemplate); } catch (e) {}
  closeQuoteEditor();
  showCopyToast("✓ התבנית נשמרה");
}

function resetQuoteTemplate() {
  quoteTemplate = DEFAULT_QUOTE_TEMPLATE;
  const ta = document.getElementById("quoteTemplateArea");
  if (ta) ta.value = quoteTemplate;
  try { localStorage.setItem(QUOTE_TEMPLATE_KEY, quoteTemplate); } catch (e) {}
}

function toggleTopupBatchMode() {
  ensureAutoTopupState();
  topupState.batchMode = !topupState.batchMode;
  renderAll();
}

function setTopupBatchIccids(value) {
  ensureAutoTopupState();
  topupState.batchRaw = String(value || "");
  topupState.batchIccids = topupState.batchRaw
    .split(/[\n,;]+/)
    .map(s => normalizeIccid(s))
    .filter(ic => ic.length >= 18);
  // Live-update the counter on the toggle without a focus-stealing re-render.
  const btn = document.querySelector(".topup-batch-toggle");
  if (btn) btn.textContent = `📚 מרובה${topupState.batchIccids.length ? ` · ${topupState.batchIccids.length}` : ""}`;
  if (topupState.batchIccids.length) autoDetectAndSwitchSimType(topupState.batchIccids[0]);
}

function setTopupIccid(value, rerender = false) {
  setTopupCustomerIccid(value, rerender);
}

function getZoneRepresentative(zone) {
  const z = Number(zone);
  return data.find(c => Number(c.zone) === z) || null;
}

function getAllZoneRepresentatives() {
  const byZone = new Map();
  data.forEach(country => {
    const z = Number(country.zone);
    if (!byZone.has(z)) byZone.set(z, country);
  });
  return [...byZone.entries()]
    .sort((a,b) => Number(a[0]) - Number(b[0]))
    .map(([zone, country]) => ({ zone: Number(zone), country }));
}

function getSelectedTopupCountries() {
  // Match base-plan behavior: topups operate on the active (highest) zone.
  // Without this, a mixed-zone selection (e.g. US zone 1 + JP zone 2) would
  // put off-zone ISOs into fly_countries while pricing against the top zone.
  const zone = getHighestZone();
  if (zone === null) return [];
  return selected.filter(c => c.zone === zone);
}

function getSelectedTopupZone() {
  return getHighestZone();
}

function getSelectedTopupActiveCountries() {
  const zone = getSelectedTopupZone();
  if (zone === null) return [];
  return selected.filter(c => Number(c.zone) === Number(zone));
}

function getSelectedTopupCountryNamesForUrl() {
  return getSelectedTopupCountries()
    .map(c => c.name?.he || c.name?.en || c.iso)
    .filter(Boolean)
    .join("|");
}

function getTopupCatalogKey(countries = getTopupCountries(), simVersion = getTopupProfile().id) {
  const profileId = simVersion || "esim_v3";
  if (profileId === "esim_v3") {
    const zone = getSelectedTopupZone();
    return zone === null ? "esim_v3|none" : `esim_v3|zone:${zone}`;
  }
  if (profileId === "psim_v2") {
    const zone = getSelectedTopupZone();
    return zone === null ? "psim_v2|none" : `psim_v2|zone:${zone}`;
  }
  if (profileId === "psim_v1") return "psim_v1|europe:DE";
  return `${profileId}|${getTopupCountryKey(countries)}`;
}

function getTopupCatalogKeyForZone(profileId, zone) {
  if (profileId === "psim_v2") return `psim_v2|zone:${Number(zone)}`;
  if (profileId === "esim_v3") return `esim_v3|zone:${Number(zone)}`;
  if (profileId === "psim_v1") return "psim_v1|europe:DE";
  return `${profileId}|zone:${Number(zone)}`;
}

function isV1CountryAllowed(country) {
  const iso = String(country?.iso || "").toUpperCase();
  const he = String(country?.name?.he || "").trim();
  return TOPUP_V1_EUROPE_ALLOWED_ISOS.has(iso) || TOPUP_V1_EUROPE_ALLOWED_HE.has(he);
}

function getV1DisallowedCountries(countries = getTopupCountries()) {
  return (countries || []).filter(c => !isV1CountryAllowed(c));
}

function validateTopupSelectionForProfile(profile = getTopupProfile(), countries = getTopupCountries()) {
  if (!countries.length) return "בחר מדינה אחת לפחות.";
  if (profile.id === "psim_v1") {
    const bad = getV1DisallowedCountries(countries);
    if (bad.length) {
      const names = bad.map(c => c.name?.he || c.iso).join(", ");
      return `V1 pSIM מוגבל לאירופה בלבד. היעדים הבאים חסומים ל‑V1: ${names}`;
    }
  }
  return "";
}

function firstGlobalCacheForZone(zone) {
  const rep = data.find(c => Number(c.zone) === Number(zone) && globalCache[c.iso]);
  return rep ? globalCache[rep.iso] : null;
}

function getGlobalCacheRepresentativeForSelected() {
  const active = getSelectedTopupActiveCountries();
  return active.find(c => globalCache[c.iso]) || data.find(c => Number(c.zone) === Number(getSelectedTopupZone()) && globalCache[c.iso]) || null;
}

function getCheckoutUrlInfo(url) {
  const out = { flyCountries: "", productZone: "", physicalSimType: "", countryNameInRegion: "" };
  if (!url) return out;
  try {
    const u = new URL(url);
    out.flyCountries = u.searchParams.get("fly_countries") || "";
    out.productZone = u.searchParams.get("product_zone") || "";
    out.physicalSimType = u.searchParams.get("physical_sim_type") || "";
    out.countryNameInRegion = u.searchParams.get("country_name_in_region") || "";
  } catch (e) {}
  return out;
}

function clonePackage(pkg) {
  return JSON.parse(JSON.stringify(pkg));
}

function rewritePackageUrls(pkg, rewriter) {
  const cloned = clonePackage(pkg);
  if (cloned.base?.checkoutUrl) cloned.base.checkoutUrl = rewriter(cloned.base.checkoutUrl, cloned.base.quantity || 1);
  if (Array.isArray(cloned.deals)) {
    cloned.deals = cloned.deals.map(d => ({ ...d, checkoutUrl: rewriter(d.checkoutUrl, d.quantity || 1) }));
  }
  return cloned;
}

function rewriteEsimV3TopupUrlFromManual(url, countries = getSelectedTopupCountries(), zone = getSelectedTopupZone(), quantity = 1) {
  if (!url) return url;
  const isos = (countries || []).map(c => c.iso).filter(Boolean).sort();
  try {
    const u = new URL(url);
    if (isos.length) u.searchParams.set("fly_countries", isos.join("|"));
    if (zone !== null && zone !== undefined) u.searchParams.set("product_zone", String(Number(zone)));
    u.searchParams.delete("physical_sim_type");
    u.searchParams.delete("country_name_in_region");
    u.searchParams.delete("quantity");
    u.searchParams.delete("empty_cart");
    u.searchParams.set("ref", "R41IMUNU");
    return u.toString().replace(/%7C/gi, "|");
  } catch (e) {
    return String(url);
  }
}

function rewritePhysicalTopupUrlForSelected(url, profileId, countries = getSelectedTopupCountries()) {
  if (!url) return url;
  const countryNames = getSelectedTopupCountryNamesForUrl();
  try {
    const u = new URL(url);
    if (countryNames) u.searchParams.set("country_name_in_region", countryNames);
    // fly_countries must reflect the customer's selection — NOT the zone-probe
    // representative country (e.g. UZ) used to fetch a zone-wide V2 catalog.
    if (profileId === "psim_v1") {
      u.searchParams.set("fly_countries", "REUP");
    } else {
      const isos = (countries || []).map(c => c.iso).filter(Boolean);
      if (isos.length) u.searchParams.set("fly_countries", isos.slice().sort().join("|"));
    }
    u.searchParams.delete("quantity");
    u.searchParams.delete("empty_cart");
    u.searchParams.set("ref", "R41IMUNU");
    return u.toString().replace(/%7C/gi, "|");
  } catch (e) {
    return String(url);
  }
}

function materializeTopupCatalogForSelected(catalog, profile = getTopupProfile()) {
  if (!catalog) return null;
  const countries = getSelectedTopupCountries();
  const zone = getSelectedTopupZone();
  const materialized = JSON.parse(JSON.stringify(catalog));
  materialized.requestedCountries = countries.map(c => ({ iso: c.iso, he: c.name.he, en: c.name.en, zone: c.zone }));
  materialized.profileId = profile.id;
  materialized.profileLabel = profile.label;
  materialized.kind = profile.label;
  materialized.kindShort = profile.short;
  materialized.customerIccid = topupState.customerIccid || "";

  if (profile.id === "esim_v3") {
    materialized.zone = zone;
    materialized.packages = (materialized.packages || []).map(pkg =>
      rewritePackageUrls(pkg, rawUrl => rewriteEsimV3TopupUrlFromManual(rawUrl, countries, zone))
    );
  } else {
    materialized.packages = (materialized.packages || []).map(pkg =>
      rewritePackageUrls(pkg, rawUrl => rewritePhysicalTopupUrlForSelected(rawUrl, profile.id, countries))
    );
  }

  materialized.checkoutInfo = getCheckoutUrlInfo(materialized.packages?.[0]?.base?.checkoutUrl || "");
  return materialized;
}

function buildEsimV3CatalogFromManualPrices() {
  ensureAutoTopupState();
  const zone = getSelectedTopupZone();
  const countries = getSelectedTopupCountries();
  if (zone === null || !countries.length) return null;

  const rep = getGlobalCacheRepresentativeForSelected();
  const cached = rep ? globalCache[rep.iso] : firstGlobalCacheForZone(zone);
  if (!cached || !Array.isArray(cached.esim) || !cached.esim.length) {
    const zoneRep = getZoneRepresentative(zone);
    if (zoneRep) ensureGlobalCountry(zoneRep);
    countries.forEach(c => ensureGlobalCountry(c));
    return null;
  }

  const packages = (cached.esim || []).map(pkg => rewritePackageUrls(pkg, rawUrl => rewriteEsimV3TopupUrlFromManual(rawUrl, countries, zone)));
  const firstUrl = packages[0]?.base?.checkoutUrl || "";
  return {
    catalogKey: getTopupCatalogKey(countries, "esim_v3"),
    profileId: "esim_v3",
    profileLabel: TOPUP_VERSION_PROFILES.esim_v3.label,
    kind: TOPUP_VERSION_PROFILES.esim_v3.label,
    kindShort: TOPUP_VERSION_PROFILES.esim_v3.short,
    source: "manual_global_esim_prices_no_topup_scan",
    probeIccid: "manual-prices",
    iccid: "",
    customerIccid: topupState.customerIccid || "",
    requestedCountries: countries.map(c => ({ iso: c.iso, he: c.name.he, en: c.name.en, zone: c.zone })),
    zone,
    searchPhysical: 0,
    simTypeText: "eSIM V3",
    regionCode: countries.map(c => c.iso).sort().join("|"),
    regionName: "",
    checkoutInfo: getCheckoutUrlInfo(firstUrl),
    packages
  };
}

async function fetchPhysicalCatalogByProbe(profile, countries, catalogKey) {
  const errors = [];
  for (const probeIccid of profile.probeIccids) {
    try {
      const result = await fetchTopupPackages(probeIccid, countries);
      if (result && Array.isArray(result.packages) && result.packages.length) {
        result.catalogKey = catalogKey;
        result.profileId = profile.id;
        result.profileLabel = profile.label;
        result.probeIccid = probeIccid;
        result.iccid = probeIccid;
        result.customerIccid = topupState.customerIccid || "";
        result.kindShort = profile.short;
        result.kind = profile.label;
        return materializeTopupCatalogForSelected(result, profile) || result;
      }
      errors.push(`${shortIccid(probeIccid)}: empty catalog`);
    } catch (err) {
      errors.push(`${shortIccid(probeIccid)}: ${String(err.message || err)}`);
    }
  }
  throw new Error(`לא הצלחתי לטעון קטלוג ${profile.label}. ${errors.join(" · ")}`);
}

function getV1GermanyCountry() {
  return data.find(c => String(c.iso).toUpperCase() === TOPUP_V1_GERMANY_PROBE_ISO) || {
    iso: "DE",
    name: { he: "גרמניה", en: "Germany" },
    zone: 1,
    plans: { esim: [], physical: [] }
  };
}

async function fetchTopupCatalogByProbe(profile, countries) {
  ensureAutoTopupState();

  if (profile.id === "esim_v3") {
    const catalog = buildEsimV3CatalogFromManualPrices();
    if (catalog) return catalog;
    throw new Error("מחירי eSIM V3 עדיין נטענים מהאתר הידני. זה לא סריקת טופאפ; חכה שהטעינה האוטומטית תסתיים או בחר מדינה שוב.");
  }

  if (profile.id === "psim_v2") {
    const zone = getSelectedTopupZone();
    const rep = getZoneRepresentative(zone);
    if (!rep) throw new Error(`לא נמצאה מדינת נציג לאזור ${zone}`);
    return fetchPhysicalCatalogByProbe(profile, [rep], getTopupCatalogKeyForZone("psim_v2", zone));
  }

  if (profile.id === "psim_v1") {
    const validation = validateTopupSelectionForProfile(profile, getSelectedTopupCountries());
    if (validation) throw new Error(validation);
    return fetchPhysicalCatalogByProbe(profile, [getV1GermanyCountry()], "psim_v1|europe:DE");
  }

  return fetchPhysicalCatalogByProbe(profile, countries, getTopupCatalogKey(countries, profile.id));
}

function getCurrentTopupCatalog() {
  ensureAutoTopupState();
  const profile = getTopupProfile();
  if (profile.id === "esim_v3") return buildEsimV3CatalogFromManualPrices();

  const validation = validateTopupSelectionForProfile(profile, getSelectedTopupCountries());
  if (validation) return null;

  const key = getTopupCatalogKey(getSelectedTopupCountries(), profile.id);
  const cached = topupState.catalogCache?.[key] || null;
  return cached ? materializeTopupCatalogForSelected(cached, profile) : null;
}


function isCatalogCachedForProfile(profile, countries = getSelectedTopupCountries()) {
  if (!countries.length) return false;
  if (profile.id === "esim_v3") return !!buildEsimV3CatalogFromManualPrices();
  if (profile.id === "psim_v1" && getV1DisallowedCountries(countries).length) return false;
  return !!topupState.catalogCache?.[getTopupCatalogKey(countries, profile.id)];
}

function getTopupPreloadStats(countries = getTopupCountries()) {
  ensureAutoTopupState();
  const profiles = Object.values(TOPUP_VERSION_PROFILES).filter(profile => {
    if (profile.id !== "psim_v1") return true;
    return !getV1DisallowedCountries(countries).length;
  });
  const total = profiles.length;
  const cached = profiles.filter(profile => isCatalogCachedForProfile(profile, countries)).length;
  return { total, cached, missing: Math.max(0, total - cached) };
}

async function scanTopupCatalogForSelected(forceRefresh = false) {
  ensureAutoTopupState();
  const countries = getSelectedTopupCountries();
  const profile = getTopupProfile();
  const validation = validateTopupSelectionForProfile(profile, countries);
  if (validation) {
    topupState.error = validation;
    topupState.catalogResult = null;
    renderAll();
    return;
  }

  if (profile.id === "esim_v3") {
    const result = buildEsimV3CatalogFromManualPrices();
    topupState.catalogResult = result;
    topupState.result = result;
    topupState.error = result ? "" : "מחירי eSIM V3 עדיין נטענים אוטומטית מהאתר הידני.";
    renderAll();
    return;
  }

  const key = getTopupCatalogKey(countries, profile.id);
  if (!forceRefresh && topupState.catalogCache?.[key]) {
    topupState.catalogResult = getCurrentTopupCatalog();
    topupState.result = topupState.catalogResult;
    topupState.error = "";
    renderAll();
    return;
  }

  topupState.loading = true;
  topupState.error = "";
  topupState.catalogResult = null;
  renderAll();

  try {
    const result = await fetchTopupCatalogByProbe(profile, countries);
    topupState.catalogCache[key] = JSON.parse(JSON.stringify(result));
    topupState.catalogResult = getCurrentTopupCatalog();
    topupState.result = topupState.catalogResult;
    persistTopupCatalogCache();
  } catch (err) {
    topupState.error = String(err.message || err);
  } finally {
    topupState.loading = false;
    renderAll();
  }
}


async function preloadTopupsForSelected(forceRefresh = false) {
  ensureAutoTopupState();
  const countries = getSelectedTopupCountries();
  if (!countries.length) {
    topupState.error = "בחר מדינה אחת לפחות לפני טעינת קטלוגים.";
    renderAll();
    return;
  }

  const jobs = [];
  const zone = getSelectedTopupZone();
  const v2Key = getTopupCatalogKeyForZone("psim_v2", zone);
  if (forceRefresh || !topupState.catalogCache?.[v2Key]) {
    const rep = getZoneRepresentative(zone);
    if (rep) jobs.push({ profile: TOPUP_VERSION_PROFILES.psim_v2, countries: [rep], key: v2Key, label: `V2 zone ${zone}` });
  }

  const v1Key = "psim_v1|europe:DE";
  if (!getV1DisallowedCountries(countries).length && (forceRefresh || !topupState.catalogCache?.[v1Key])) {
    jobs.push({ profile: TOPUP_VERSION_PROFILES.psim_v1, countries: [getV1GermanyCountry()], key: v1Key, label: "V1 Germany/Europe" });
  }

  // V3 eSIM intentionally has no topup scan. It is derived from manual website eSIM prices.
  if (!jobs.length) {
    topupState.preloadMessage = "";
    topupState.preloading = false;
    topupState.error = "";
    topupState.catalogResult = getCurrentTopupCatalog();
    topupState.result = topupState.catalogResult;
    renderAll();
    return;
  }

  topupState.preloading = true;
  topupState.preloadDone = 0;
  topupState.preloadTotal = jobs.length;
  topupState.preloadErrors = 0;
  topupState.preloadErrorList = [];
  topupState.preloadMessage = `טוען אוטומטית ${jobs.length} קטלוגים חסרים…`;
  topupState.error = "";
  renderAll();

  await mapWithConcurrency(jobs, 3, async job => {
    try {
      const result = await fetchPhysicalCatalogByProbe(job.profile, job.countries, job.key);
      topupState.catalogCache[job.key] = JSON.parse(JSON.stringify(result));
    } catch (err) {
      topupState.preloadErrors++;
      topupState.preloadErrorList.push(`${job.label}: ${String(err.message || err)}`);
    } finally {
      topupState.preloadDone++;
      topupState.preloadMessage = `טוען קטלוגים: ${topupState.preloadDone}/${topupState.preloadTotal}`;
      persistTopupCatalogCache();
      renderAll();
    }
  });

  topupState.preloading = false;
  topupState.preloadMessage = `טעינה אוטומטית ליעד הסתיימה${topupState.preloadErrors ? ` · שגיאות: ${topupState.preloadErrors}` : ""}`;
  topupState.catalogResult = getCurrentTopupCatalog();
  topupState.result = topupState.catalogResult;
  renderAll();
}

async function preloadAllV2Zones(forceRefresh = false) {
  ensureAutoTopupState();
  const reps = getAllZoneRepresentatives();
  const jobs = reps
    .map(rep => ({ ...rep, key: getTopupCatalogKeyForZone("psim_v2", rep.zone) }))
    .filter(job => forceRefresh || !topupState.catalogCache?.[job.key]);

  if (!jobs.length) return { done: reps.length, errors: 0 };

  let done = 0;
  let errors = 0;
  await mapWithConcurrency(jobs, TOPUP_V2_ZONE_PRELOAD_CONCURRENCY, async job => {
    try {
      const result = await fetchPhysicalCatalogByProbe(TOPUP_VERSION_PROFILES.psim_v2, [job.country], job.key);
      topupState.catalogCache[job.key] = JSON.parse(JSON.stringify(result));
    } catch (err) {
      errors++;
      topupState.autoPreloadErrors.push(`V2 אזור ${job.zone}: ${String(err.message || err)}`);
    } finally {
      done++;
      topupState.autoPreloadMessage = `טעינה אוטומטית: V2 לפי אזורים ${done}/${jobs.length}`;
      persistTopupCatalogCache();
      renderAll();
    }
  });
  return { done, errors };
}

async function preloadV1Germany(forceRefresh = false) {
  ensureAutoTopupState();
  const key = "psim_v1|europe:DE";
  if (!forceRefresh && topupState.catalogCache?.[key]) return { done: 1, errors: 0 };
  try {
    const result = await fetchPhysicalCatalogByProbe(TOPUP_VERSION_PROFILES.psim_v1, [getV1GermanyCountry()], key);
    topupState.catalogCache[key] = JSON.parse(JSON.stringify(result));
    persistTopupCatalogCache();
    return { done: 1, errors: 0 };
  } catch (err) {
    topupState.autoPreloadErrors.push(`V1 Germany: ${String(err.message || err)}`);
    return { done: 0, errors: 1 };
  }
}

async function autostartTopupCatalogPreload(forceRefresh = false) {
  ensureAutoTopupState();
  if (!data.length || topupState.autoPreloading) return;
  if (topupState.autoPreloadStarted && !forceRefresh) return;

  topupState.autoPreloadStarted = true;
  topupState.autoPreloading = true;
  topupState.autoPreloadDone = false;
  topupState.autoPreloadErrors = [];
  topupState.autoPreloadMessage = "טוען קטלוג טופאפ…";
  setExportStatus(topupState.autoPreloadMessage);
  renderAll();

  // V3 eSIM: use existing manual website package scanner by zone. No topup scan.
  // This preloads the normal website catalog once per zone, then V3 topup URLs are built from it.
  const globalPromise = startGlobalPreloadAll(false).catch(err => {
    topupState.autoPreloadErrors.push(`V3/manual: ${String(err.message || err)}`);
  });

  const v2Promise = preloadAllV2Zones(forceRefresh);
  const v1Promise = preloadV1Germany(forceRefresh);

  await Promise.allSettled([globalPromise, v2Promise, v1Promise]);

  topupState.autoPreloading = false;
  topupState.autoPreloadDone = true;
  const zoneTotal = getAllZoneRepresentatives().length;
  const v2Cached = getAllZoneRepresentatives().filter(rep => !!topupState.catalogCache?.[getTopupCatalogKeyForZone("psim_v2", rep.zone)]).length;
  const v1Cached = !!topupState.catalogCache?.["psim_v1|europe:DE"];
  const globalZones = getLoadedZoneCount();
  topupState.autoPreloadMessage = `מוכן: V3 מחירי אתר ${globalZones}/${getTotalZoneCount()} אזורים, V2 ${v2Cached}/${zoneTotal} אזורים, V1 Germany ${v1Cached ? "טעון" : "חסר"}${topupState.autoPreloadErrors.length ? ` · שגיאות: ${topupState.autoPreloadErrors.length}` : ""}`;
  setExportStatus(topupState.autoPreloadMessage);
  persistTopupCatalogCache();
  renderAll();
}

function scheduleAutoEnsureTopupForSelection() {
  ensureAutoTopupState();
  if (!selected.length || topupState.autoEnsureRunning) return;
  const profile = getTopupProfile();
  if (profile.id === "esim_v3") {
    const zone = getSelectedTopupZone();
    if (zone !== null && !firstGlobalCacheForZone(zone)) {
      const rep = getZoneRepresentative(zone);
      if (rep) ensureGlobalCountry(rep);
    }
    return;
  }
  if (!getCurrentTopupCatalog()) {
    topupState.autoEnsureRunning = true;
    setTimeout(() => {
      preloadTopupsForSelected(false).finally(() => { topupState.autoEnsureRunning = false; });
    }, 20);
  }
}

function buildTopupCheckoutUrl(url, quantityOverride = 1, forceEmptyCart = cartSettings.emptyCart, customerIccidOverride = null) {
  if (!url) return url;
  const qty = parseInt(quantityOverride || 1, 10);
  const customerIccid = normalizeIccid(customerIccidOverride ?? topupState.customerIccid ?? topupState.iccid ?? "");
  const profile = getTopupProfile();

  try {
    const u = new URL(url);
    u.searchParams.set("ref", "R41IMUNU");
    if (customerIccid) u.searchParams.set("your_iccid", customerIccid);

    if (profile.id === "esim_v3") {
      const countries = getSelectedTopupCountries();
      const zone = getSelectedTopupZone();
      if (countries.length) u.searchParams.set("fly_countries", countries.map(c => c.iso).sort().join("|"));
      if (zone !== null) u.searchParams.set("product_zone", String(Number(zone)));
      u.searchParams.delete("country_name_in_region");
      u.searchParams.delete("physical_sim_type");
    } else {
      const names = getSelectedTopupCountryNamesForUrl();
      if (names) u.searchParams.set("country_name_in_region", names);
      // V1 pSIM topups always use the REUP region code, never a literal country.
      if (profile.id === "psim_v1") {
        u.searchParams.set("fly_countries", "REUP");
      }
      // (V2 fly_countries is already set to the selected ISOs during URL rewrite.)
    }

    if (forceEmptyCart) u.searchParams.set("empty_cart", "true");
    else u.searchParams.delete("empty_cart");

    if (Number.isFinite(qty) && qty > 1) u.searchParams.set("quantity", String(qty));
    else u.searchParams.delete("quantity");

    return u.toString().replace(/%7C/gi, "|");
  } catch (e) {
    return String(url);
  }
}

function requireTopupCustomerIccid() {

}

function registerTopupPackage(pkg, result) {
  const profile = getTopupProfile();
  const selectedKey = profile.id === "psim_v1" ? "EUROPE" : String(getSelectedTopupZone() || "zone");
  const key = ["topup", profile.id, selectedKey, pkg.base?.productId || "noid", pkg.dataGB, pkg.validityDays]
    .join("_")
    .replace(/[^a-zA-Z0-9_\-]/g, "_");
  orderPackageRegistry[key] = { simType: "topup", pkg, result };
  return key;
}

function setTopupOrderQuantity(key) {
  const entry = orderPackageRegistry[key];
  if (!entry) return;

  // Batch mode: one click adds a line per pasted ICCID.
  const batch = topupState.batchMode ? (topupState.batchIccids || []) : null;
  if (topupState.batchMode && (!batch || !batch.length)) {
    alert("הדבק לפחות ICCID אחד תקין (18+ ספרות) בתיבת המרובה.");
    return;
  }
  const iccids = batch && batch.length ? batch : [requireTopupCustomerIccid()].filter(Boolean);
  if (!iccids.length) return;

  const input = document.getElementById(`qty_${key}`);
  const qty = parseInt(input?.value, 10);

  if (!Number.isFinite(qty) || qty <= 0) {
    iccids.forEach(ic => {
      orderBuilderItems = orderBuilderItems.filter(x => x.key !== `${key}::${ic}`);
    });
    renderAll();
    return;
  }

  const { pkg } = entry;
  const variant = chooseOrderVariant(pkg, qty);
  if (!variant.checkoutUrl) {
    alert("אין קישור טופאפ לחבילה הזו");
    return;
  }

  const profile = getTopupProfile();
  iccids.forEach(customerIccid => {
    // Identify the cart line by package + ICCID, so topping up several
    // different cards with the same package adds separate lines.
    const itemKey = `${key}::${customerIccid}`;
    orderBuilderItems = orderBuilderItems.filter(x => x.key !== itemKey);
    const label = `טופאפ ${profile.short} · ${pkg.dataGB}GB / ${pkg.validityDays} ימים · ICCID ${shortIccid(customerIccid)} ×${qty}`;
    orderBuilderItems.push({
      key: itemKey,
      simType: "topup",
      topup: true,
      preserveUrl: true,
      dataGB: pkg.dataGB,
      validityDays: pkg.validityDays,
      qty,
      label,
      checkoutUrl: variant.checkoutUrl,
      productId: variant.productId,
      isBase: variant.isBase,
      isos: [],
      perUnitILS: variant.perUnitILS,
      totalILS: variant.totalILS,
      source: variant.source,
      topupIccid: customerIccid,
      topupProfile: profile.id
    });
  });

  orderBuilderItems.sort((a,b) => {
    const rank = { physical_sim: 1, esim: 2, topup: 3 };
    const ra = rank[a.simType] || 9;
    const rb = rank[b.simType] || 9;
    if (ra !== rb) return ra - rb;
    if ((a.topupIccid || "") !== (b.topupIccid || "")) return String(a.topupIccid || "").localeCompare(String(b.topupIccid || ""));
    return Number(a.dataGB || 0) - Number(b.dataGB || 0);
  });

  renderAll();
}

function renderTopupMeta(result) {
  const info = result.checkoutInfo || {};
  const requested = (result.requestedCountries || []).map(c => c.iso).join("|");
  const countriesLabel = (result.requestedCountries || []).map(c => c.he).join(" | ");
  const searchUrlJson = JSON.stringify(result.requestUrl || "");
  const customerIccid = normalizeIccid(topupState.customerIccid || "");
  const sourceLabel = result.source === "manual_global_esim_prices_no_topup_scan"
    ? "מקור: מחירי eSIM ידניים קיימים, בלי סריקת טופאפ"
    : result.profileId === "psim_v2"
      ? `מקור: סריקת V2 אחת לאזור ${String(result.zone ?? getSelectedTopupZone() ?? "")}`
      : result.profileId === "psim_v1"
        ? "מקור: סריקת V1 גרמניה בלבד"
        : "מקור: קטלוג טופאפ";

  // All technical detail collapses into one tooltip instead of a pill row.
  const tip = [
    result.profileLabel || result.kind || getTopupProfile().label,
    sourceLabel,
    result.probeIccid ? `probe: ${shortIccid(result.probeIccid)}` : "",
    countriesLabel ? `מדינות: ${countriesLabel}` : "",
    requested ? `selected: ${requested}` : "",
    (result.zone !== null && result.zone !== undefined) ? `zone: ${result.zone}` : "",
    info.flyCountries ? `fly_countries=${info.flyCountries}` : "",
    info.productZone ? `product_zone=${info.productZone}` : "",
    info.physicalSimType ? info.physicalSimType : "",
  ].filter(Boolean).join("\n");

  return `
    <div class="topup-meta-bar">
      <button class="info-tip" data-tip="${escapeHtml(tip)}">i</button>
      <span class="topup-meta-label ${customerIccid ? 'ok' : ''}">${customerIccid ? `✓ ICCID ${escapeHtml(shortIccid(customerIccid))}` : "הקלד ICCID לקוח להזמנה"}</span>
      ${result.requestUrl ? `<button class="global-copy-btn" onclick='copyText(${escapeHtml(searchUrlJson)})' title="העתק API URL">📋 API URL</button>` : ""}
    </div>
  `;
}

function buildOrderItemUrl(item, index) {
  const isFirst = index === 0;
  // A "deal" checkout URL points at a bundle product (e.g. a pair) that already
  // contains the full quantity — adding quantity=N would order N bundles.
  const isDeal = item.source === "deal" || item.isBase === false;
  const urlQty = isDeal ? 1 : item.qty;
  if (item.preserveUrl || item.topup) {
    return buildTopupCheckoutUrl(item.checkoutUrl, urlQty, isFirst && cartSettings.emptyCart, item.topupIccid || topupState.customerIccid || topupState.iccid || "");
  }
  return buildCheckoutUrl(item.checkoutUrl, item.isBase, item.isos || selected.map(c => c.iso), urlQty, isFirst && cartSettings.emptyCart);
}

function getGeneratedOrderLink() {
  const payload = {
    version: 4,
    emptyCart: cartSettings.emptyCart,
    items: orderBuilderItems.map(item => ({
      label: item.label,
      checkoutUrl: item.checkoutUrl,
      qty: item.qty,
      isBase: item.isBase,
      isos: item.isos,
      totalILS: item.totalILS,
      preserveUrl: !!item.preserveUrl,
      topup: !!item.topup,
      topupIccid: item.topupIccid || "",
      topupProfile: item.topupProfile || ""
    }))
  };
  const url = new URL(window.location.href);
  url.search = "";
  url.hash = "";
  url.searchParams.set(ORDER_PAYLOAD_PARAM, encodeOrderPayload(payload));
  return url.toString();
}

function renderAll() {
  const resultsEl = document.getElementById("results");
  const cartEl = document.getElementById("cart");
  if (!resultsEl) return;

  if (!selected.length) {
    resultsEl.innerHTML =
      `<div class="center-empty">
        <span class="ce-emoji">🌍</span>
        <h2>בחר מדינה כדי להתחיל</h2>
        <p>חפש מדינה בסרגל למעלה. המחירים נטענים אוטומטית, וההשוואה תופיע כאן.</p>
      </div>`;
    if (cartEl) cartEl.innerHTML = window.__renderEmptyCart();
    if (window.__updateCartFab) window.__updateCartFab();
    persistSession();
    return;
  }

  orderPackageRegistry = {};
  loadPersistedTopupCache();
  ensureAutoTopupState();

  // Build only the active tab.
  let tabContent = "";
  if (activeTab === "basic") {
    tabContent = renderZoneNote() + renderGlobalPlans();
  } else if (activeTab === "gigaboost") {
    tabContent = renderZoneNote() + renderGigaboostChooser() + renderPhysicalPlans() + renderEsimPlans();
  } else if (activeTab === "copy") {
    tabContent =
      `<div class="ref-strip">` +
      renderCreditPricing() +
      renderPhysical() +
      renderWallet() +
      renderCustomAmount() +
      `</div>`;
  } else if (activeTab === "topup") {
    tabContent = renderTopupScannerPanel();
  }

  resultsEl.innerHTML = `<div class="results-grid">` + tabContent + `</div>`;

  // Keep the tab buttons' active state in sync (e.g. after session restore).
  document.querySelectorAll(".tab-btn").forEach(b =>
    b.classList.toggle("is-active", b.dataset.tab === activeTab)
  );

  if (cartEl) {
    const cartHtml = renderOrderBuilderPanel();
    cartEl.innerHTML = cartHtml && cartHtml.trim() ? cartHtml : window.__renderEmptyCart();
  }
  if (window.__updateCartFab) window.__updateCartFab();

  updateMasterSimplifyLabel();
  scheduleAutoEnsureTopupForSelection();
  persistSession();
}



</script>

</body>
</html>
