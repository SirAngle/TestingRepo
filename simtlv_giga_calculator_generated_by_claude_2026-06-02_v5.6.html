<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מחשבון גיגה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=Suez+One&display=swap" rel="stylesheet">

<style>
/* =========================================================
   מחשבון גיגה · UI redesign
   Refined, professional light theme. Indigo primary with
   emerald/rose accents kept distinct from the price badges.
   ========================================================= */

:root{
  --bg:#e9ecf2;
  --surface:#ffffff;
  --surface-2:#f5f6fa;
  --line:#e6e9f0;
  --line-strong:#d7dbe6;
  --text:#1b1f2a;
  --muted:#6b7280;

  --primary:#3b3fd8;
  --primary-700:#2c2fb0;
  --primary-100:#dfe1fb;
  --primary-50:#eef0ff;

  --accent:#0ea371;
  --accent-700:#0a7d57;

  --good-bg:#e7f7ee; --good:#0c7a44; --good-bd:#b8e6cb;
  --bad-bg:#fdecef;  --bad:#b01030;  --bad-bd:#f6c2cd;
  --same-bg:#eef1f6; --same:#4b5566; --same-bd:#d3d9e4;

  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 2px 8px -4px rgba(16,24,40,.10);
  --shadow-lg:0 2px 6px rgba(16,24,40,.06), 0 10px 24px -12px rgba(16,24,40,.20);
  --radius:14px;
}

*{ box-sizing:border-box; }

html{ -webkit-text-size-adjust:100%; }

body{
  font-family:'Assistant', system-ui, Arial, sans-serif;
  color:var(--text);
  font-size:13px;
  line-height:1.45;
  direction:rtl;
  margin:0;
  padding:0;
  height:100vh;
  overflow:hidden;
  background:var(--bg);
}

/* ===== Ops-terminal shell: ink topbar + full-width content ===== */
:root{
  --ink:#101319;
  --ink-2:#1a1f2a;
  --ink-line:rgba(255,255,255,.12);
  --chip-gold:linear-gradient(135deg,#e8c66a 0%,#c9a24a 45%,#f0d78a 100%);
}
.app{
  display:flex; flex-direction:column;
  height:100vh; width:100vw;
  position:relative; z-index:1;
}
.topbar{
  flex:0 0 auto;
  display:flex; align-items:center; gap:14px;
  height:48px; padding:0 14px;
  background:var(--ink);
  color:#e8ecf4;
  border-bottom:1px solid var(--ink-line);
}
.brand{ display:flex; align-items:center; gap:9px; flex:0 0 auto; }
.brand-name{ font-family:'Suez One',serif; font-size:16px; color:#fff; letter-spacing:.01em; }

/* Signature: SIM-chip glyph (gold contact pad) */
.sim-chip{
  width:26px; height:20px; flex:none; position:relative;
  background:var(--chip-gold);
  border-radius:5px 5px 5px 9px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25), 0 1px 2px rgba(0,0,0,.4);
}
.sim-chip::before{
  content:""; position:absolute; inset:4px 5px;
  border:1px solid rgba(80,55,10,.55); border-radius:3px;
  background:
    linear-gradient(rgba(80,55,10,.55), rgba(80,55,10,.55)) 50% 0/1px 100% no-repeat,
    linear-gradient(rgba(80,55,10,.55), rgba(80,55,10,.55)) 0 50%/100% 1px no-repeat;
}
.sim-chip.small{ width:20px; height:15px; border-radius:4px 4px 4px 7px; }
.sim-chip.small::before{ inset:3px 4px; }

/* Topbar: search */
.tb-search{ flex:0 0 240px; }
.tb-search .search-wrap{ position:relative; }
.tb-search input{
  width:100%; box-sizing:border-box;
  background:var(--ink-2); color:#e8ecf4;
  border:1px solid var(--ink-line); border-radius:9px;
  padding:7px 30px 7px 10px; font-size:12.5px; font-family:inherit;
}
.tb-search input::placeholder{ color:#8a93a6; }
.tb-search input:focus{ outline:none; border-color:var(--primary); }
.tb-search .search-icon{
  position:absolute; inset-inline-start:auto; inset-inline-end:9px; top:50%;
  transform:translateY(-50%); width:14px; height:14px; color:#8a93a6; pointer-events:none;
}
.tb-search .suggestions{ top:calc(100% + 6px); }

/* Topbar: selected chips strip (scrolls horizontally, never wraps the bar) */
.tb-chips{
  flex:1 1 auto; min-width:0;
  display:flex; align-items:center; gap:8px;
}
.tb-chips .chips{
  margin:0; flex:1 1 auto; min-width:0;
  display:flex; flex-wrap:nowrap; gap:6px;
  overflow-x:auto; overflow-y:hidden; padding:2px 0;
  scrollbar-width:thin;
}
.tb-chips .chips::-webkit-scrollbar{ height:5px; }
.tb-chips .chips::-webkit-scrollbar-thumb{ background:var(--ink-line); border-radius:99px; }
.tb-chips .chip{ flex:0 0 auto; }

/* Topbar: options cluster */
.tb-options{ flex:0 0 auto; display:flex; align-items:center; gap:8px; }
.tb-options .opt-switch{ color:#c6cdda; border-color:var(--ink-line); background:var(--ink-2); }
.tb-options .opt-qty{ color:#c6cdda; border-color:var(--ink-line); background:var(--ink-2); }
.tb-options .opt-qty input{ background:var(--ink); color:#e8ecf4; border-color:var(--ink-line); }
.tb-options .opt-btn{
  background:var(--ink-2); color:#c6cdda; border:1px solid var(--ink-line);
}
.tb-options .opt-btn.is-on{ color:#fff; border-color:var(--primary); }
.json-btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 11px; border-radius:9px; cursor:pointer;
  background:var(--ink-2); color:#e8ecf4; border:1px solid var(--ink-line);
  font-family:'Assistant'; font-weight:700; font-size:12px; transition:all .15s;
}
.json-btn:hover{ border-color:var(--chip-gold); background:#232a38; }

/* Status line under topbar — collapses when empty */
.topbar-status{ margin:0; padding:0 14px; font-size:11.5px; }
.topbar-status:empty{ display:none; }
.topbar-status:not(:empty){ padding-top:6px; }

/* Content */
.content{
  flex:1 1 auto; min-height:0;
  overflow-y:auto; overflow-x:hidden;
  padding:12px 14px 70px;
}
.content::-webkit-scrollbar{ width:9px; }
.content::-webkit-scrollbar-thumb{
  background:var(--line-strong); border-radius:999px; border:2px solid transparent; background-clip:padding-box;
}

/* ===== Cart: floating chip badge + drawer ===== */
.cart-fab{
  position:fixed; bottom:18px; inset-inline-start:18px; z-index:800;
  display:flex; align-items:center; gap:8px;
  padding:10px 14px; border-radius:999px; cursor:pointer;
  background:var(--ink); color:#fff; border:1px solid var(--ink-line);
  font-family:'Assistant'; font-weight:800; font-size:14px;
  box-shadow:0 6px 20px rgba(16,19,25,.35);
  transition:transform .15s, box-shadow .15s;
}
.cart-fab:hover{ transform:translateY(-2px); box-shadow:0 10px 26px rgba(16,19,25,.42); }
.cart-fab-count{
  min-width:20px; height:20px; padding:0 6px; border-radius:999px;
  display:grid; place-items:center; font-size:12px;
  background:var(--ink-2); color:#8a93a6;
}
.cart-fab.has-items .cart-fab-count{ background:var(--accent); color:#fff; }
.cart-drawer{
  position:fixed; top:0; bottom:0; right:0; z-index:790;
  width:360px; max-width:92vw;
  background:#fff; border-left:1px solid var(--line-strong);
  box-shadow:-14px 0 40px rgba(16,19,25,.18);
  transform:translateX(105%);
  transition:transform .22s ease;
  display:flex; flex-direction:column;
}
.cart-drawer.open{ transform:translateX(0); }
.cart-drawer-head{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:12px 14px; background:var(--ink); color:#fff;
  font-family:'Suez One',serif; font-size:15px;
}
.cart-drawer-close{
  background:transparent; border:0; color:#c6cdda; font-size:15px; cursor:pointer;
  padding:4px 8px; border-radius:7px;
}
.cart-drawer-close:hover{ background:var(--ink-2); color:#fff; }
.cart-drawer > #cart{ flex:1 1 auto; overflow-y:auto; padding:12px 14px; }

/* Empty states */
.cart-empty{
  text-align:center; color:var(--muted); font-size:12.5px; line-height:1.7;
  padding:34px 16px; border:1.5px dashed var(--line-strong); border-radius:var(--radius);
  background:rgba(245,246,250,.6);
}
.cart-empty .ce-emoji{ font-size:26px; display:block; margin-bottom:7px; opacity:.7; }
.center-empty{
  height:100%; min-height:60vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; color:var(--muted); gap:10px;
}
.center-empty .ce-emoji{ font-size:46px; opacity:.6; }
.center-empty h2{ font-family:'Suez One',serif; font-size:22px; color:var(--text); margin:0; }
.center-empty p{ margin:0; font-size:13px; max-width:340px; }

.container{
  position:relative;
  z-index:1;
  max-width:1180px;
  margin:0 auto;
}

/* staggered entrance */
@keyframes rise{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
.container > *{ animation:rise .5s ease both; }
.container > *:nth-child(2){ animation-delay:.06s; }
.container > *:nth-child(3){ animation-delay:.12s; }
.container > *:nth-child(4){ animation-delay:.18s; }

/* ---------- Loading overlay ---------- */
#loading{
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background:rgba(233,236,242,.82);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  font-size:16px;
}
.loading-inner{
  display:flex; align-items:center; gap:12px;
  background:#fff; border:1px solid var(--line);
  box-shadow:var(--shadow); padding:16px 22px; border-radius:14px;
  font-weight:600; color:var(--text);
}
.spinner{
  width:22px; height:22px; border-radius:50%;
  border:3px solid var(--primary-100); border-top-color:var(--primary);
  animation:spin .8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------- Header ---------- */
.brand{ display:flex; align-items:center; gap:14px; }
.brand-mark{
  font-size:30px; line-height:1;
  width:58px; height:58px; flex:none;
  display:grid; place-items:center;
  background:linear-gradient(150deg, #ffffff, #eef0ff);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
}
/* ---------- Panels (toolbar / controls) ---------- */
.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
  margin-bottom:14px;
}
/* ---------- Buttons ---------- */
button{
  font-family:inherit; font-weight:600;
  color:var(--text);
  background:#fff;
  border:1px solid var(--line-strong);
  border-radius:9px;
  padding:6px 11px;
  font-size:12.5px; line-height:1.2;
  cursor:pointer;
  transition:background .15s, color .15s, border-color .15s, box-shadow .15s, transform .12s;
}
button:hover{
  background:var(--surface-2);
  border-color:var(--primary);
  color:var(--primary);
  transform:translateY(-1px);
  box-shadow:var(--shadow-sm);
}
button:active{ transform:translateY(0); }
button:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }

.btn-primary{
  background:var(--primary); color:#fff;
  border-color:transparent;
  padding:11px 18px; font-size:13.5px; border-radius:11px;
  box-shadow:0 1px 2px rgba(59,63,216,.25);
}
.btn-primary:hover{
  background:var(--primary-700); color:#fff; border-color:transparent;
  box-shadow:0 8px 18px -8px rgba(59,63,216,.55);
}

/* ---------- Fields & inputs ---------- */
input{
  width:100%;
  background:var(--surface); color:var(--text);
  border:1px solid var(--line-strong);
  border-radius:11px;
  padding:11px 13px;
  font-size:14px; font-family:inherit;
  margin:0;
  transition:border-color .15s, box-shadow .15s, background .15s;
}
input::placeholder{ color:#9aa1ad; }
input:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 4px var(--primary-50);
  background:#fff;
}

.search-wrap{ position:relative; }
.search-icon{
  position:absolute; inset-inline-start:13px; top:50%;
  transform:translateY(-50%);
  width:18px; height:18px; color:#9aa1ad; pointer-events:none;
}
#search{ padding-inline-start:40px; }

.custom-row{ display:flex; gap:8px; align-items:stretch; }
.custom-row #customAmount{ flex:1; }
.custom-row .btn-primary{ white-space:nowrap; }

#selected:not(:empty) + .hint{ display:none; }

/* ---------- Suggestions dropdown ---------- */
.suggestions{
  position:absolute; inset-inline:0; top:calc(100% + 6px); z-index:60;
  background:#fff;
  color:var(--text); /* explicit: inside the dark topbar it would inherit near-white */
  border:1px solid var(--line-strong);
  border-radius:12px;
  box-shadow:var(--shadow-lg);
  max-height:280px; overflow:auto;
  display:none; padding:5px;
}
.suggestions div{
  padding:9px 11px; border-radius:8px; cursor:pointer;
  font-size:13.5px; transition:background .12s, color .12s;
}
.suggestions div:hover{ background:var(--primary-50); color:var(--primary-700); }
.suggestions::-webkit-scrollbar{ width:10px; }
.suggestions::-webkit-scrollbar-thumb{
  background:#c7cdd9; border-radius:999px; border:2px solid #fff;
}

/* ---------- Selected chips ---------- */
.chips{ display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
.clear-countries-btn{
  display:none; align-items:center; gap:4px;
  font-family:'Assistant'; font-size:10.5px; font-weight:700;
  padding:3px 9px; border-radius:999px; cursor:pointer;
  background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad-bd);
  text-transform:none; letter-spacing:0; line-height:1.4;
}
.clear-countries-btn:hover{ background:#fbd9e1; }
.chip{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--primary-50); color:var(--primary-700);
  border:1px solid var(--primary-100);
  padding-block:6px; padding-inline-start:12px; padding-inline-end:6px;
  border-radius:999px;
  font-size:13px; font-weight:600;
}
.chip span{
  margin:0; cursor:pointer;
  width:18px; height:18px; flex:none;
  display:grid; place-items:center;
  border-radius:50%;
  background:rgba(59,63,216,.12); color:var(--primary-700);
  font-size:11px; line-height:1;
  transition:background .15s, color .15s, transform .2s;
}
.chip span:hover{ background:var(--bad); color:#fff; transform:rotate(90deg); }

/* ---------- Status banner ---------- */
.status{
  display:none; margin-top:12px;
  background:var(--primary-50);
  border:1px solid var(--primary-100);
  color:#33406b;
  border-radius:10px;
  padding:10px 12px;
  font-size:12.5px; line-height:1.45;
  white-space:pre-wrap;
  direction:ltr; text-align:left;
  font-variant-numeric:tabular-nums;
}

/* ---------- Results ---------- */
.results-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
  gap:10px;
  margin-top:0;
  align-content:start;
  align-items:start;
}
.block{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:11px 12px;
  transition:box-shadow .2s, transform .2s, border-color .2s;
}
.block:hover{ box-shadow:var(--shadow-lg); }
.block h3{
  font-family:'Assistant'; font-weight:800;
  font-size:14px; margin:0 0 6px;
}
.block > button{ margin-bottom:8px; }
.block > button + button{ margin-inline-start:6px; }

pre{
  font-family:'Assistant', system-ui, sans-serif;
  margin:6px 0 0;
  padding:8px 10px;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:9px;
  font-size:12px; line-height:1.5;
  color:#2a2f3a;
  white-space:pre-wrap;
  font-variant-numeric:tabular-nums;
}

/* ---------- Global (new API) cards ---------- */
.global-clean-card{ grid-column:1 / -1; padding:12px 14px; }
.global-clean-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  border-bottom:1px solid var(--line);
  padding-bottom:9px; margin-bottom:10px;
}
.global-clean-head h3{
  margin:0; font-family:'Assistant'; font-weight:800; font-size:15px;
}
.global-clean-subtitle{
  color:var(--muted); font-size:12px; margin-top:4px;
  max-width:62ch; line-height:1.45;
}
.global-clean-grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(280px, 1fr));
  gap:12px;
}
.global-sim-column{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px; min-width:0;
}
.global-sim-titlebar{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  margin-bottom:8px;
}
.global-sim-title{ font-size:14px; font-weight:800; color:var(--text); }
.global-copy-btn{ font-size:12px; padding:5px 9px; }

.global-lines{ display:grid; gap:0; }
.global-line{
  display:grid; grid-template-columns:minmax(0,1fr) auto;
  align-items:center; gap:10px;
  padding:8px 6px; margin-inline:-6px;
  border-bottom:1px solid var(--line);
  border-radius:8px;
  font-size:13px; line-height:1.3;
  transition:background .12s;
}
.global-line:hover{ background:rgba(59,63,216,.045); }
.global-line:last-child{ border-bottom:0; }
.global-line-text{ min-width:0; overflow-wrap:normal; word-break:keep-all; font-weight:500; display:flex; align-items:center; flex-wrap:wrap; gap:6px; }

.global-links{ display:flex; gap:6px; white-space:nowrap; }
.global-links a{
  display:inline-flex; align-items:center;
  border:1px solid var(--line-strong); background:#fff; color:var(--text);
  text-decoration:none; border-radius:999px;
  padding:4px 11px; font-size:12px; font-weight:600;
  transition:background .15s, color .15s, border-color .15s, box-shadow .15s, transform .12s;
}
.global-links a:hover{
  background:var(--primary); color:#fff; border-color:var(--primary);
  transform:translateY(-1px); box-shadow:var(--shadow-sm);
}

.price-badge{
  display:inline-block; border-radius:999px;
  padding:2px 8px; margin-inline-start:6px;
  font-size:11px; font-weight:700; line-height:1.4;
  vertical-align:middle;
}
.price-badge.good{ background:var(--good-bg); color:var(--good); border:1px solid var(--good-bd); }
.price-badge.bad{  background:var(--bad-bg);  color:var(--bad);  border:1px solid var(--bad-bd); }
.price-badge.same{ background:var(--same-bg); color:var(--same); border:1px solid var(--same-bd); }

.global-empty,
.global-error-text{ color:var(--muted); font-size:12.5px; padding:6px 0; }
.global-error-text{ color:var(--bad); }

.global-loading-card{ grid-column:1 / -1; }
.global-loading-card h3{ font-weight:800; margin:0 0 6px; }
.global-loading-card p{ color:var(--muted); margin:0 0 8px; }

/* ---------- Quick-order rows (eSIM / physical) ---------- */
.order-row{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  margin-bottom:7px;
}
.order-gb{
  min-width:48px; font-weight:800; font-size:13px;
  color:var(--text); font-variant-numeric:tabular-nums;
}
.oa-open, .oa-copy, .lk-open, .lk-copy{
  font-size:12px; padding:5px 10px; border-radius:8px; line-height:1.2;
}
.oa-open{ background:var(--primary); color:#fff; border-color:transparent; }
.oa-open:hover{ background:var(--primary-700); color:#fff; border-color:transparent; }
.oa-copy{ background:#fff; color:var(--primary-700); border-color:var(--primary-100); }
.oa-copy:hover{ background:var(--primary-50); color:var(--primary-700); border-color:var(--primary); }

/* ---------- Global checkout link groups ---------- */
.link-group{
  display:inline-flex; align-items:center; gap:4px;
  background:#fff; border:1px solid var(--line-strong);
  border-radius:999px; padding:2px 4px 2px 8px;
}
.link-group + .link-group{ margin-inline-start:6px; }
.link-label{ font-size:11.5px; font-weight:700; color:var(--muted); }
.lk-open, .lk-copy{
  padding:3px 8px; border-radius:999px; font-size:12px;
}
.lk-open{ background:var(--primary); color:#fff; border-color:transparent; text-decoration:none; }
.lk-open:hover{ background:var(--primary-700); color:#fff; transform:translateY(-1px); box-shadow:var(--shadow-sm); }
.lk-copy{ background:var(--surface-2); color:var(--primary-700); border-color:var(--line-strong); }
.lk-copy:hover{ background:var(--primary-50); color:var(--primary-700); border-color:var(--primary); }

/* ---------- Zone filter note ---------- */
.zone-note{
  grid-column:1 / -1;
  display:flex; align-items:flex-start; gap:12px;
  background:linear-gradient(180deg, #fffaf0, #fff6e6);
  border:1px solid #f3dca8;
}
.zone-note-badge{
  flex:none; align-self:center;
  background:#a9610b; color:#fff;
  font-weight:800; font-size:12px;
  padding:5px 11px; border-radius:999px;
  white-space:nowrap;
}
.zone-note-text{ font-size:13px; line-height:1.5; color:#5b4310; }
.zone-note-text b{ font-weight:800; color:#3f2f08; }

/* ---------- Card header (title + actions) ---------- */
.block-tools{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; flex-wrap:wrap; margin-bottom:10px;
}
.block-tools h3{ margin:0; }
.block-actions{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.copy-btn{ font-size:12px; padding:6px 10px; }
.zone-pill{
  display:inline-block; margin-inline-start:6px;
  background:var(--primary-50); color:var(--primary-700);
  border:1px solid var(--primary-100);
  border-radius:999px; padding:1px 9px;
  font-size:12px; font-weight:700; vertical-align:middle;
}

/* ---------- Simplify on/off switch ---------- */
.simplify-btn{
  display:inline-flex; align-items:center; gap:8px;
  font-weight:700; font-size:12px; padding:5px 11px;
  border-radius:999px;
}
.simplify-btn .sw{
  width:26px; height:15px; border-radius:999px; flex:none;
  position:relative; background:#c7ccd6; transition:background .18s;
}
.simplify-btn .sw::after{
  content:""; position:absolute; top:2px; inset-inline-end:2px;
  width:11px; height:11px; border-radius:50%;
  background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25);
  transition:inset-inline-end .18s;
}
.simplify-btn.is-on{
  background:var(--good-bg); color:var(--accent-700); border-color:var(--good-bd);
}
.simplify-btn.is-on .sw{ background:var(--accent); }
.simplify-btn.is-on .sw::after{ inset-inline-end:13px; }
.simplify-btn.is-off{ background:#fff; color:var(--muted); border-color:var(--line-strong); }
.simplify-btn.is-on:hover{ background:#daf3e5; color:var(--accent-700); border-color:var(--accent); transform:translateY(-1px); }
.simplify-btn.is-off:hover{ background:var(--surface-2); color:var(--text); border-color:var(--primary); transform:translateY(-1px); }

/* ---------- Display & cart options bar ---------- */
.options-bar{
  display:flex; align-items:center; flex-wrap:wrap; gap:10px;
  margin-top:14px; padding-top:14px;
  border-top:1px dashed var(--line-strong);
}
.opt-btn{ font-size:12.5px; font-weight:700; padding:8px 13px; border-radius:10px; }
.opt-btn.is-on{ background:var(--good-bg); color:var(--accent-700); border-color:var(--good-bd); }
.opt-btn.is-on:hover{ background:#daf3e5; border-color:var(--accent); color:var(--accent-700); transform:translateY(-1px); }
.opt-btn.is-off{ background:var(--surface-2); color:var(--muted); }
.opt-btn.is-off:hover{ background:#fff; border-color:var(--primary); color:var(--text); transform:translateY(-1px); }

/* checkbox-driven switch */
.opt-switch{
  display:inline-flex; align-items:center; gap:8px; cursor:pointer;
  font-size:12.5px; font-weight:600; color:var(--text);
  background:#fff; border:1px solid var(--line-strong);
  border-radius:10px; padding:7px 12px; user-select:none;
}
.opt-switch input{ position:absolute; opacity:0; width:0; height:0; }
.opt-switch .sw{
  width:30px; height:17px; border-radius:999px; flex:none; position:relative;
  background:#c7ccd6; transition:background .18s;
}
.opt-switch .sw::after{
  content:""; position:absolute; top:2px; inset-inline-end:2px;
  width:13px; height:13px; border-radius:50%; background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.25); transition:inset-inline-end .18s;
}
.opt-switch input:checked + .sw{ background:var(--primary); }
.opt-switch input:checked + .sw::after{ inset-inline-end:15px; }
.opt-switch input:focus-visible + .sw{ outline:2px solid var(--primary); outline-offset:2px; }

.opt-qty{
  display:inline-flex; align-items:center; gap:8px;
  font-size:12.5px; font-weight:600; color:var(--text);
  background:#fff; border:1px solid var(--line-strong);
  border-radius:10px; padding:5px 12px;
}
.opt-qty input{
  width:64px; padding:5px 8px; border-radius:8px;
  border:1px solid var(--line-strong); font-size:13px;
  font-variant-numeric:tabular-nums; text-align:center;
}



/* ---------- Manual website savings emphasis ---------- */
.global-clean-card.manual-priority{
  border-color:#b8e6cb;
  box-shadow:0 1px 2px rgba(16,24,40,.05), 0 18px 40px -20px rgba(14,163,113,.40);
}
.global-line.is-cheaper{
  background:linear-gradient(90deg, rgba(14,163,113,.09), rgba(255,255,255,0));
  border-inline-start:4px solid var(--accent);
  padding-inline-start:9px;
}
.global-line.is-cheaper:hover{ background:rgba(14,163,113,.11); }
.price-badge.best{
  background:#0ea371;
  color:#fff;
  border-color:#0ea371;
  box-shadow:0 4px 12px -8px rgba(14,163,113,.75);
}
.purchase-actions{
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
}
.number-order-group{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:#fff;
  border:1px solid var(--line-strong);
  border-radius:999px;
  padding:2px 4px 2px 8px;
  white-space:nowrap;
}
.number-order-group input{
  width:54px;
  height:26px;
  padding:3px 6px;
  border-radius:999px;
  font-size:12px;
  text-align:center;
  font-variant-numeric:tabular-nums;
}
.number-order-group .lk-set{
  padding:3px 9px;
  border-radius:999px;
  background:var(--accent);
  border-color:transparent;
  color:#fff;
  font-size:12px;
}
.number-order-group .lk-set:hover{ background:var(--accent-700); color:#fff; border-color:transparent; }

/* ---------- Generated order builder ---------- */
.order-builder-card{
  grid-column:auto;
  border-color:#c9cef8;
  box-shadow:none;
  padding:0;
  background:transparent;
  border:0;
}
.order-builder-card:hover{ box-shadow:none; }
.order-builder-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--line);
  padding-bottom:12px;
  margin-bottom:12px;
}
.order-builder-head h3{ margin:0; font-size:16px; font-weight:800; }
.order-builder-lines{ display:grid; gap:8px; }
.order-builder-line{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto;
  gap:8px;
  align-items:center;
  padding:9px 10px;
  border:1px solid var(--line);
  background:var(--surface-2);
  border-radius:11px;
}
.order-builder-label{ font-weight:700; font-size:13px; min-width:0; overflow-wrap:anywhere; }
.order-builder-price{ direction:ltr; font-weight:800; font-size:13px; color:var(--accent-700); white-space:nowrap; }
.order-builder-remove{ padding:4px 9px; border-radius:999px; color:var(--bad); }
.order-builder-footer{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:10px;
  margin-top:14px;
  padding-top:14px;
  border-top:1px dashed var(--line-strong);
}
.order-builder-total{ font-weight:800; color:var(--text); font-size:15px; text-align:center; }
.order-builder-actions{ display:flex; flex-direction:column; gap:8px; }
.order-builder-actions button{ width:100%; justify-content:center; }
.order-builder-actions .run-order{ background:var(--accent); color:#fff; border-color:transparent; font-size:14px; padding:12px; }
.order-builder-actions .run-order:hover{ background:var(--accent-700); color:#fff; border-color:transparent; }

/* ---------- Integrated order runner ---------- */
.order-overlay{
  position:fixed;
  inset:0;
  z-index:10000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(10,15,26,.68);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
}
.order-overlay.is-open{ display:flex; }
.order-runner-card{
  width:min(440px, 100%);
  direction:ltr;
  text-align:center;
  background:#111827;
  color:#e8f0f8;
  border:1px solid rgba(26,157,224,.18);
  border-radius:20px;
  padding:32px 30px;
  box-shadow:0 24px 70px -32px rgba(0,0,0,.75);
  position:relative;
  overflow:hidden;
}
.order-runner-card::before{
  content:""; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, #1a9de0, transparent);
}
.order-runner-logo{ font-size:24px; font-weight:800; color:#fff; letter-spacing:-.3px; }
.order-runner-logo span{ color:#1a9de0; }
.order-runner-sub{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#7a95b0; margin:2px 0 26px; }
.order-runner-icon{
  width:62px; height:62px; margin:0 auto 16px;
  display:grid; place-items:center;
  border-radius:50%;
  background:rgba(26,157,224,.10);
  border:1px solid rgba(26,157,224,.30);
  font-size:27px;
}
.order-runner-title{ font-size:21px; font-weight:800; color:#fff; margin-bottom:6px; }
.order-runner-status{ color:#7a95b0; font-size:13px; line-height:1.5; min-height:38px; }
.order-runner-items{
  margin:20px 0 0;
  text-align:left;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;
  padding:12px;
  max-height:180px;
  overflow:auto;
}
.order-runner-item{
  display:flex; gap:9px; align-items:center;
  padding:5px 0;
  color:#e8f0f8;
  font-size:12.5px;
}
.order-runner-item + .order-runner-item{ border-top:1px solid rgba(255,255,255,.055); }
.order-runner-dot{ width:6px; height:6px; border-radius:50%; background:#1a9de0; flex:none; }
.order-runner-qty{ margin-left:auto; color:#7a95b0; font-size:11px; }
.order-runner-progress{ display:flex; justify-content:center; gap:7px; margin-top:18px; }
.order-runner-progress span{ width:8px; height:8px; border-radius:50%; background:rgba(26,157,224,.22); }
.order-runner-progress span.done{ background:#22d3a0; }
.order-runner-progress span.active{ background:#1a9de0; transform:scale(1.35); }
.order-runner-close{
  position:absolute;
  top:10px;
  right:10px;
  width:30px; height:30px;
  border-radius:50%;
  background:rgba(255,255,255,.06);
  color:#e8f0f8;
  border:1px solid rgba(255,255,255,.08);
}
body.order-mode{
  padding:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0a0f1a;
}
body.order-mode::before{ display:none; }
body.order-mode .app{ display:block; max-width:460px; width:100%; height:auto; padding:20px; }
body.order-mode .cart-fab,
body.order-mode .cart-drawer,
body.order-mode .topbar,
body.order-mode .tabs,
body.order-mode .topbar-status{ display:none; }
.standalone-order-card{ width:100%; }
.standalone-order-card .order-runner-card{ width:100%; }
.standalone-order-card .run-order{ margin-top:20px; width:100%; padding:14px 20px; border-radius:12px; font-weight:800; background:#1a9de0; color:#fff; border:0; }
.standalone-order-card .run-order:hover{ background:#0d7ab8; color:#fff; }



/* ---------- Top-up scanner ---------- */

.topup-controls .version-select-wrap{ flex:0 0 auto; }
.topup-controls .version-select-wrap select{ width:auto; min-width:118px; padding:9px 12px; }
.topup-iccid-input{

.topup-inventory-actions button{ padding:8px 11px; border-radius:10px; }
.topup-preload-main{ background:var(--accent); color:#fff; border-color:transparent; }
.topup-preload-main:hover{ background:var(--accent-700); color:#fff; border-color:transparent; }
.topup-cache-stat{

  align-items:center;
  gap:6px;
  background:#fff;

  padding:5px 10px;
  font-size:12px;

}
.topup-cache-stat.good{ color:var(--accent-700); background:var(--good-bg); border-color:var(--good-bd); }
.topup-preload-progress{

}

}
.topup-patterns{

  font-size:11px;
  font-weight:800;
  letter-spacing:.05em;
  text-transform:uppercase;
}
.topup-pattern-row{
  display:flex;
  gap:8px;
  align-items:flex-start;

}
.topup-quick-list{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:8px 0 12px;
}
.topup-quick-chip{
  border-radius:999px;
  padding:5px 9px;
  background:#fff;
  border:1px solid var(--line-strong);

}

@media (max-width:760px){
  .topup-controls{ grid-template-columns:1fr; }

/* ---------- Quick-order: compact inline-price chips ---------- */
/* Gigaboost plans: a ledger — one fixed grid row per plan. Nothing wraps,
   nothing squishes: GB | price | (flex space) | link | copy. */
.plan-orders.grid{ display:flex; flex-direction:column; gap:2px; }
.plan-orders.grid .order-row{
  display:grid;
  grid-template-columns:44px minmax(0,1fr) auto auto;
  align-items:center;
  gap:8px;
  margin-bottom:0;
  background:transparent;
  border:0;
  border-radius:7px;
  padding:3px 8px;
  min-width:0;
  flex:none;
}
.plan-orders.grid .order-row:nth-child(even){ background:rgba(16,19,25,.035); }
.plan-orders.grid .order-row:hover{ background:rgba(47,107,255,.07); }
.order-price{
  direction:ltr; font-weight:800; font-size:12.5px;
  color:var(--accent-700); white-space:nowrap;
  margin-inline-end:0; text-align:start;
}
.plan-orders.grid .oa-open,
.plan-orders.grid .oa-copy{ padding:3px 9px; font-size:11.5px; height:24px; line-height:1; flex:none; justify-self:end; }

/* ---------- Reusable hover tooltip ---------- */
.info-tip{
  display:inline-flex; align-items:center; justify-content:center;
  width:22px; height:22px; border-radius:50%; cursor:help; flex:none;
  background:var(--surface-2); border:1px solid var(--line-strong);
  color:var(--muted); font-size:12px; font-weight:800; position:relative;
}
.info-tip:hover{ background:#fff; color:var(--primary-700); border-color:var(--primary); }
.info-tip:hover::after{
  content:attr(data-tip);
  position:absolute; top:calc(100% + 8px); right:0;
  z-index:300; width:max-content; max-width:300px;
  background:#1b1f2a; color:#fff; font-weight:500; font-size:12px; line-height:1.55;
  padding:9px 12px; border-radius:10px; white-space:pre-line; text-align:right;
  box-shadow:var(--shadow-lg); pointer-events:none;
}

/* ---------- Topup rows: horizontal grid (was one-per-row) ---------- */
/* Topup packages: fixed geometry for muscle memory.
   Two fixed columns (no auto-fill re-wrapping), rows sorted by GB, and every
   row is the same grid: text | deal-slot(fixed) | link | copy | qty | set. */
.topup-lines-grid{
  display:grid;
  grid-template-columns:1fr 1fr;

  const n = (typeof orderBuilderItems !== "undefined" && orderBuilderItems) ? orderBuilderItems.length : 0;
  el.textContent = String(n);
  fab.classList.toggle("has-items", n > 0);

<script>
let USD_TO_ILS = 3.3;
try {
  const savedRate = parseFloat(localStorage.getItem("simtlv_usd_rate"));
  if (Number.isFinite(savedRate) && savedRate > 0) USD_TO_ILS = savedRate;
} catch (e) {}
{
  const rateEl = document.getElementById("usdRate");
  if (rateEl) rateEl.value = USD_TO_ILS;
}

function setUsdRate(value) {
  const rate = parseFloat(value);
  if (!Number.isFinite(rate) || rate <= 0) return;
  USD_TO_ILS = rate;
  try { localStorage.setItem("simtlv_usd_rate", String(rate)); } catch (e) {}
  renderAll();
}

const WALLET = [
  { usd: 13.33, ils: 44 },
  { usd: 30.24, ils: 88 },
  { usd: 63, ils: 175 }
];

const PHYSICAL = [
  { usd: 15, ils: 74 },
  { usd: 25, ils: 99 },
  { usd: 63, ils: 175 }
];

// ---- Editable reference pricing (persisted) -------------------------------
// The $/₪ tiers can be adjusted (e.g. a bonus: ₪74 buys $17.5 instead of $15).
// Overrides live in localStorage and are applied onto WALLET/PHYSICAL in place.
const DEFAULT_WALLET = WALLET.map(r => ({ ...r }));
const DEFAULT_PHYSICAL = PHYSICAL.map(r => ({ ...r }));
const REF_STORE_KEY = "simtlv_ref_overrides_v1";
const refEdit = { wallet: false, physical: false };

function refArr(kind) { return kind === "wallet" ? WALLET : PHYSICAL; }

function loadRefOverrides() {
  try {
    const raw = JSON.parse(localStorage.getItem(REF_STORE_KEY) || "null");
    if (!raw) return;
    for (const kind of ["wallet", "physical"]) {
      if (!Array.isArray(raw[kind])) continue;
      const arr = refArr(kind);
      arr.length = 0;
      raw[kind].forEach(r => {
        const usd = parseFloat(r.usd), ils = parseFloat(r.ils);
        if (Number.isFinite(usd) && Number.isFinite(ils)) arr.push({ usd, ils });
      });
      if (!arr.length) (kind === "wallet" ? DEFAULT_WALLET : DEFAULT_PHYSICAL).forEach(r => arr.push({ ...r }));
    }
  } catch (e) {}
}

function saveRefOverrides() {
  try {
    localStorage.setItem(REF_STORE_KEY, JSON.stringify({ wallet: WALLET, physical: PHYSICAL }));
  } catch (e) {}
}

function toggleRefEdit(kind) {
  refEdit[kind] = !refEdit[kind];
  renderAll();
}

function setRefValue(kind, i, field, val) {
  const arr = refArr(kind);
  const num = parseFloat(val);
  if (!arr[i] || !Number.isFinite(num) || num < 0) { renderAll(); return; }
  arr[i][field] = num;
  saveRefOverrides();
  renderAll();
}

function addRefRow(kind) {
  refArr(kind).push({ usd: 0, ils: 0 });
  saveRefOverrides();
  renderAll();
}

function removeRefRow(kind, i) {
  const arr = refArr(kind);
  if (arr.length <= 1) return; // keep at least one tier
  arr.splice(i, 1);
  saveRefOverrides();
  renderAll();
}

function resetRefRows(kind) {
  const arr = refArr(kind);
  const defs = kind === "wallet" ? DEFAULT_WALLET : DEFAULT_PHYSICAL;
  arr.length = 0;
  defs.forEach(r => arr.push({ ...r }));
  saveRefOverrides();
  renderAll();
}

  sessionRestoring = true;
  try {
    if (TAB_IDS.includes(saved.activeTab)) activeTab = saved.activeTab;

const REGION_ISOS = {

  "מרכז אמריקה והקריביים": "AG AI AW BB BL BQ BS BZ CR CU CW DM DO GD GP GT HN HT JM KN KY LC MF MQ MS NI PA PR SV SX TC TT VC VG VI",
  "אסיה": "AF AM AZ BD BN BT CN GE HK ID IN JP KG KH KP KR KZ LA LK MM MN MO MV MY NP PH PK SG TH TJ TL TM TW UZ VN",
  "המזרח התיכון": "AE BH EG IL IQ IR JO KW LB OM PS QA SA SY TR YE",

  "אוקיאניה": "AS AU CK FJ FM GU KI MH MP NC NF NR NU NZ PF PG PW SB TO TV VU WF WS",
};
const ISO_REGION = {};
for (const [region, isos] of Object.entries(REGION_ISOS)) {
  for (const iso of isos.split(/\s+/)) ISO_REGION[iso] = region;
}
function regionOfIso(iso) { return ISO_REGION[iso] || "אחר"; }

// Group countries by region → client-ready text block.
function formatCountriesByRegion(countries) {
  const byRegion = {};
  for (const c of countries) (byRegion[regionOfIso(c.iso)] ||= []).push(c.name.he);
  const lines = [];
  for (const region of REGION_ORDER) {
    const names = byRegion[region];
    if (!names || !names.length) continue;
    lines.push(`${region}: ${names.sort((a, b) => a.localeCompare(b, "he")).join(", ")}`);
  }
  return lines.join("\n");
}

const GLOBAL_API_DATE_RANGE = "05/29/2026 - 05/29/2026";
const GLOBAL_SIM_TYPES = ["physical_sim", "esim"];
const GLOBAL_PRELOAD_CONCURRENCY = Infinity;

const GLOBAL_CACHE_STORAGE_KEY = "simtlv_global_cache_v7_zone_validated";
const GLOBAL_CACHE_TTL_MS = 12 * 60 * 60 * 1000; // auto-expire scans after 12h
let globalCachePrev = {}; // expired same-zone entries kept as diff baselines
let globalPreloadRunning = false;
let globalPreloadDone = false;

// Compare two cached scans and list per-package price movements.
// Small dismissible strip listing what moved since the previous scan.
function renderPriceChangesBanner(result) {
  const changes = result?.priceChanges;
  if (!changes || !changes.length || result?.priceChangesDismissed) return "";
  const label = ch => `${ch.simType === "esim" ? "eSIM" : "פיזי"} ${ch.dataGB}GB ₪${ch.from}→₪${ch.to}`;
  const shown = changes.slice(0, 6).map(label).join(" · ");
  const more = changes.length > 6 ? ` (+${changes.length - 6})` : "";
  return `
    <div class="price-changes-banner">
      <span>📈 שינויי מחיר מאז הסריקה הקודמת: ${escapeHtml(shown + more)}</span>
      <button onclick="dismissPriceChanges('${escapeHtml(result.assignedIso || "")}')" title="הסתר">✕</button>
    </div>`;
}

function dismissPriceChanges(iso) {
  if (globalCache[iso]) {
    globalCache[iso].priceChangesDismissed = true;
    persistGlobalCache();
  }
  renderAll();
}

function computePriceChanges(oldEntry, newEntry) {
  if (!oldEntry || !newEntry) return [];
  const changes = [];
  for (const simType of GLOBAL_SIM_TYPES) {
    const oldPkgs = oldEntry[simType] || [];
    for (const np of (newEntry[simType] || [])) {
      const op = oldPkgs.find(p => p.dataGB === np.dataGB && p.validityDays === np.validityDays);
      const from = op?.base?.totalILS, to = np?.base?.totalILS;
      if (Number.isFinite(from) && Number.isFinite(to) && from !== to) {
        changes.push({ simType, dataGB: np.dataGB, validityDays: np.validityDays, from, to });
      }
    }
  }
  return changes;
}

function loadPersistedGlobalCache() {
  try {
    const saved = localStorage.getItem(GLOBAL_CACHE_STORAGE_KEY);
    if (!saved) return;
    const parsed = JSON.parse(saved);
    if (!parsed || typeof parsed !== "object") return;

    // Automatic freshness: an entry survives only if (a) its recorded zone
    // still matches the country's current zone (zones change — e.g. Singapore
    // moved 2 → 3) AND (b) it is younger than the TTL, so in-zone price
    // changes also self-heal without anyone noticing stale data first.
    const now = Date.now();
    const validated = {};
    let dropped = 0;
    for (const [iso, entry] of Object.entries(parsed)) {
      const country = data.find(c => c.iso === iso);
      const entryZone = Number(entry?.assignedZone ?? entry?.zone ?? entry?.global_zone);
      const fresh = Number.isFinite(entry?.cachedAt) && (now - entry.cachedAt) < GLOBAL_CACHE_TTL_MS;
      if (country && fresh && Number.isFinite(entryZone) && Number(country.zone) === entryZone) {
        validated[iso] = entry;
      } else {
        dropped++;
        // Same-zone expirations become diff baselines: when the fresh scan
        // lands we can report what changed since the last one.
        if (country && Number.isFinite(entryZone) && Number(country.zone) === entryZone) {
          globalCachePrev[iso] = entry;
        }
      }
    }
    globalCache = validated;
    if (dropped) console.info(`globalCache: dropped ${dropped} stale/expired entries`);
  } catch (e) {
    console.warn("Could not load saved global API cache", e);
  }
}

function persistGlobalCache() {
  try {
    localStorage.setItem(GLOBAL_CACHE_STORAGE_KEY, JSON.stringify(globalCache));
  } catch (e) {
    console.warn("Could not save global API cache", e);
  }
}

async function startGlobalPreloadAll(forceRefresh = false) {
  if (!data.length || globalPreloadRunning) return;

  globalPreloadRunning = true;
  globalPreloadDone = false;

  const zoneRepresentatives = getZoneRepresentatives(forceRefresh);

  if (!zoneRepresentatives.length) {
    globalPreloadRunning = false;
    globalPreloadDone = true;
    setExportStatus(`מחירי API חדש כבר טעונים לפי אזורים: ${getLoadedZoneCount()}/${getTotalZoneCount()} אזורים`);
    renderAll();
    return;
  }

  let completed = 0;
  const totalRequests = zoneRepresentatives.length * GLOBAL_SIM_TYPES.length;
  setExportStatus(`טוען לפי אזורים בלבד: 0/${zoneRepresentatives.length} אזורים | ${totalRequests} בקשות API`);

  await Promise.all(zoneRepresentatives.map(async rep => {
    try {
      const global = await fetchGlobalBothTypesForCountry(rep.country);
      assignGlobalResultToZone(rep.zone, global);
    } catch (err) {
      assignGlobalErrorToZone(rep.zone, err);
    } finally {
      completed++;
      persistGlobalCache();
      setExportStatus(`טוען לפי אזורים בלבד: ${completed}/${zoneRepresentatives.length} אזורים הסתיימו`);
      renderAll();
    }
  }));

  persistGlobalCache();
  globalPreloadRunning = false;
  globalPreloadDone = true;
  setExportStatus(`טעינת API חדש הסתיימה: ${getLoadedZoneCount()}/${getTotalZoneCount()} אזורים, ${Object.keys(globalCache).length}/${data.length} מדינות`);
  renderAll();
}

function getTotalZoneCount() {
  return new Set(data.map(c => c.zone)).size;
}

function getLoadedZoneCount() {
  const zones = new Set();
  data.forEach(c => {
    if (globalCache[c.iso]) zones.add(c.zone);
  });
  return zones.size;
}

function getZoneRepresentatives(forceRefresh = false) {
  const byZone = new Map();

  data.forEach(country => {
    if (!byZone.has(country.zone)) byZone.set(country.zone, country);
  });

  return [...byZone.entries()]
    .filter(([zone]) => forceRefresh || !data.some(c => c.zone === zone && globalCache[c.iso]))
    .map(([zone, country]) => ({ zone, country }));
}

function cloneGlobalResultForCountry(global, country) {
  const clone = JSON.parse(JSON.stringify(global));

  GLOBAL_SIM_TYPES.forEach(simType => {
    clone[simType] = (clone[simType] || []).map(pkg => rewritePackageLinksForCountry(pkg, country));
  });

  clone.source = "zone_representative";
  clone.assignedIso = country.iso;
  clone.assignedZone = country.zone;
  clone.cachedAt = Date.now();
  const prev = globalCache[country.iso] || globalCachePrev[country.iso];
  const changes = computePriceChanges(prev, clone);
  if (changes.length) clone.priceChanges = changes;
  delete globalCachePrev[country.iso];

  return clone;
}

function rewritePackageLinksForCountry(pkg, country) {
  const cloned = JSON.parse(JSON.stringify(pkg));

  function rewrite(url, quantity = 1) {
    if (!url) return url;
    try {
      const u = new URL(url);
      u.searchParams.set("fly_countries", country.iso);
      u.searchParams.set("product_zone", `PG_${country.zone}`);
      u.searchParams.set("empty_cart", "true");
      u.searchParams.set("ref", "R41IMUNU");
      u.searchParams.set("quantity", String(quantity || 1));
      return u.toString();
    } catch (e) {
      let out = String(url)
        .replace(/fly_countries=[^&]*/g, `fly_countries=${encodeURIComponent(country.iso)}`)
        .replace(/product_zone=PG_\d+/g, `product_zone=PG_${country.zone}`);

      const joiner = out.includes("?") ? "&" : "?";
      return `${out}${joiner}empty_cart=true&ref=R41IMUNU&quantity=${encodeURIComponent(quantity || 1)}`;
    }
  }

  if (cloned.base) cloned.base.checkoutUrl = rewrite(cloned.base.checkoutUrl, cloned.base.quantity || 1);
  if (Array.isArray(cloned.deals)) {
    cloned.deals = cloned.deals.map(d => ({ ...d, checkoutUrl: rewrite(d.checkoutUrl, d.quantity || 1) }));
  }

  return cloned;
}

function assignGlobalResultToZone(zone, global) {
  data.filter(c => c.zone === zone).forEach(country => {
    globalCache[country.iso] = cloneGlobalResultForCountry(global, country);
  });
}

function assignGlobalErrorToZone(zone, err) {
  data.filter(c => c.zone === zone).forEach(country => {
    globalCache[country.iso] = {
      physical_sim: [],
      esim: [],
      zone,
      cachedAt: Date.now(),
      errors: [{ simType: "all", message: String(err.message || err) }]
    };
  });
}

function setExportStatus(text) {

function downloadJSON(filename, object) {
  const jsonString = JSON.stringify(object, null, 2);
  const blob = new Blob([jsonString], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function getValidityDays(daysText) {
  const text = String(daysText || "").replace(/\s+/g, " ").trim();

  if (text.includes("5") && text.includes("שנ")) return 1825;
  if (text.includes("שנה") || text.includes("לשנה")) return 365;

  const m = text.match(/\d+/);
  return m ? parseInt(m[0], 10) : null;
}

function getShekelAmount(text) {
  const clean = String(text || "").replace(/,/g, "").replace(/\s+/g, " ");

  const beforeSymbol = [...clean.matchAll(/(\d+(?:\.\d+)?)\s*₪/g)].map(m => Number(m[1]));
  if (beforeSymbol.length) return beforeSymbol[beforeSymbol.length - 1];

  const afterSymbol = [...clean.matchAll(/₪\s*(\d+(?:\.\d+)?)/g)].map(m => Number(m[1]));
  if (afterSymbol.length) return afterSymbol[afterSymbol.length - 1];

  return 0;
}

function getQuantityFromBundle(label, href) {
  try {
    const url = new URL(href);
    const q = parseInt((url.searchParams.get("quantity") || "").trim(), 10);
    if (q > 1) return q;
  } catch (e) {}

  const clean = String(label || "").replace(/\s+/g, " ").trim();

  if (clean.includes("זוג")) return 2;

  const units = clean.match(/(\d+)\s*(יח|יח׳|כרטיס|כרטיסים)/);
  if (units) return parseInt(units[1], 10);

  return 2;
}


async function fetchGlobalPackagesForCountry(iso, simType) {
  const params = new URLSearchParams();

  params.set("action", "esim_global_ajax");
  params.set("task", "search_packages");
  params.set("on_what_dates", GLOBAL_API_DATE_RANGE);
  params.append("fly_countries[]", iso);
  params.set("sim_type", simType);

  const url = "https://simtlv.co.il/wp-admin/admin-ajax.php?" + params.toString();
  const res = await fetch(url);

  if (!res.ok) {
    throw new Error(`${simType} ${iso}: HTTP ${res.status}`);
  }

  const json = await res.json();

  return {
    iso,
    simType,
    zone: json?.data?.zone ?? null,
    packages: parseGlobalProducts(json, simType),
    rawSuccess: json?.success === true
  };
}

async function fetchGlobalBothTypesForCountry(country) {
  const result = {
    physical_sim: [],
    esim: [],
    errors: []
  };

  const fetchedResults = await Promise.allSettled(
    GLOBAL_SIM_TYPES.map(simType => fetchGlobalPackagesForCountry(country.iso, simType))
  );

  fetchedResults.forEach((outcome, index) => {
    const simType = GLOBAL_SIM_TYPES[index];

    if (outcome.status === "fulfilled") {
      const fetched = outcome.value;
      result[simType] = fetched.packages;
      if (fetched.zone !== null) result.zone = fetched.zone;
    } else {
      result.errors.push({
        simType,
        message: String(outcome.reason?.message || outcome.reason)
      });
    }
  });

  return result;
}


async function ensureGlobalCountry(country) {
  if (!country || !country.iso) return;
  if (globalCache[country.iso] || globalLoading[country.iso]) return;

  globalLoading[country.iso] = true;
  renderAll();

  try {
    const global = await fetchGlobalBothTypesForCountry(country);
    global.assignedZone = country.zone;
    global.cachedAt = Date.now();
    const prev = globalCache[country.iso] || globalCachePrev[country.iso];
    const changes = computePriceChanges(prev, global);
    if (changes.length) global.priceChanges = changes;
    delete globalCachePrev[country.iso];
    globalCache[country.iso] = global;
    persistGlobalCache();
  } catch (err) {
    globalCache[country.iso] = {
      physical_sim: [],
      esim: [],
      assignedZone: country.zone,
      cachedAt: Date.now(),
      errors: [{ simType: 'all', message: String(err.message || err) }]
    };
    persistGlobalCache();
  } finally {
    globalLoading[country.iso] = false;
    renderAll();
  }
}

function loadGlobalForSelected() {
  selected.forEach(c => ensureGlobalCountry(c));
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function mapAllAtOnce(items, worker) {
  return Promise.all(items.map((item, index) => worker(item, index)));
}

async function mapWithConcurrency(items, limit, worker) {
  const results = new Array(items.length);
  let index = 0;

  async function runWorker() {
    while (index < items.length) {
      const current = index++;
      results[current] = await worker(items[current], current);
      await sleep(120);
    }
  }

  await Promise.all(
    Array.from({ length: Math.min(limit, items.length) }, runWorker)
  );

  return results;
}

function gb(amount, price) {
  return amount / price;
}

function applySimplify(value) {
  const nearestInt = Math.round(value);

  if (Math.abs(value - nearestInt) < 0.05) {
    return nearestInt;
  }

  return Math.floor(value * 2) / 2;
}

function toggleSimplify(key) {
  simplifyState[key] = !isSimplified(key);
  renderAll();
}

// A clear on/off switch so it's obvious whether simplify is active.
function simplifyToggle(key) {
  const on = isSimplified(key);
  const tip = on
    ? "פישוט פעיל — לחץ כדי להציג את כל החבילות / הספרות המלאות"
    : "פישוט כבוי — מוצגות כל החבילות והערכים המלאים";
  return `
    <button class="simplify-btn ${on ? 'is-on' : 'is-off'}"
            onclick="toggleSimplify('${key}')"
            aria-pressed="${on}"
            title="${tip}">
      <span class="sw" aria-hidden="true"></span>פישוט ${on ? '· פעיל' : '· כבוי'}
    </button>
  `;
}

function copySection(btn) {
  // The <pre> lives at the .block level, not inside the button's immediate
  // parent (.block-actions), so search the whole card.
  const root = btn.closest(".block") || btn.parentElement || document;
  const pre = root.querySelector("pre");
  if (pre) copyText(pre.textContent);
  else showCopyToast("אין מה להעתיק");
}

function fallbackCopyText(text) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-9999px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    document.execCommand("copy");
    document.body.removeChild(ta);
    return true;
  } catch (e) { return false; }
}

function copyText(text) {
  text = String(text == null ? "" : text);
  // navigator.clipboard only exists in a secure context (https / localhost).
  // On file:// it is undefined, so fall back to execCommand.
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      .then(() => showCopyToast())
      .catch(() => showCopyToast(fallbackCopyText(text) ? null : "ההעתקה נכשלה"));
  } else {
    showCopyToast(fallbackCopyText(text) ? null : "ההעתקה נכשלה");
  }
}

let __copyToastTimer = null;
function showCopyToast(msg) {
  let t = document.getElementById("copyToast");
  if (!t) {
    t = document.createElement("div");
    t.id = "copyToast";
    t.style.cssText = "position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#1b1f2a;color:#fff;padding:10px 18px;border-radius:999px;font-family:'Assistant',sans-serif;font-weight:700;font-size:13px;z-index:9999;opacity:0;transition:all .25s ease;box-shadow:0 12px 32px rgba(0,0,0,.28);pointer-events:none;";
    document.body.appendChild(t);
  }
  t.textContent = msg || "✓ הועתק ללוח";
  requestAnimationFrame(() => { t.style.opacity = "1"; t.style.transform = "translateX(-50%) translateY(0)"; });
  clearTimeout(__copyToastTimer);
  __copyToastTimer = setTimeout(() => {
    t.style.opacity = "0";
    t.style.transform = "translateX(-50%) translateY(20px)";
  }, 1400);
}

// Highest-zone filtering: when countries from different zones are selected,
// a plan must cover all of them, so it is priced at the highest zone among
// them. We therefore only DISPLAY prices for that highest zone.
function getHighestZone() {
  if (!selected.length) return null;
  return Math.max(...selected.map(c => c.zone));
}

function getActiveSelected() {
  const highestZone = getHighestZone();
  if (highestZone === null) return [];
  return selected.filter(c => c.zone === highestZone);
}

function hasMixedZones() {
  return new Set(selected.map(c => c.zone)).size > 1;
}

function buildOrderLink(type, gbAmount) {
  if (!selected.length) return "";

  // Direct payment links, verified against the live API. The country segment
  // accepts a comma-joined list (encoded %2C), e.g. DE%2CEG:
  //   eSIM: https://app.simtlv.co.il/{ISOs}/{gb}gb/esim/{token}?ref=R41IMUNU
  //   pSIM: https://app.simtlv.co.il/{ISOs}/{gb}gb/physical/{id}?ref=R41IMUNU
  // The plan id comes from the zone that prices the card (top per-type zone).
  const zoneField = type === "esim" ? "esimZone" : "physicalZone";
  const topZone = Math.max(...selected.map(c => c[zoneField] ?? c.zone));
  const country = selected.find(c => (c[zoneField] ?? c.zone) === topZone) || selected[0];
  const plan = (country.plans[type === "esim" ? "esim" : "physical"] || [])
    .find(p => Number(p.dataGB) === Number(gbAmount));
  const isoSegment = encodeURIComponent(selected.map(c => c.iso).join(","));

  if (plan && plan.appId !== undefined && plan.appId !== null && plan.appId !== "") {
    const kind = type === "esim" ? "esim" : "physical";
    return `https://app.simtlv.co.il/${isoSegment}/${gbAmount}gb/${kind}/${plan.appId}?ref=R41IMUNU`;
  }

  // Fallback: old constructed link if the API entry had no id.
  const base = type === "esim"
    ? "https://app.simtlv.co.il/esim/package"
    : "https://app.simtlv.co.il/physicalsim/package";
  return `${base}?ref=R41IMUNU&countries=${isoSegment}&plan=${gbAmount}gb`;
}

// Generic link — the customer picks the plan; covers all selected countries.
function buildGenericAppLink() {
  if (!selected.length) return "";
  const isoSegment = encodeURIComponent(selected.map(c => c.iso).join(","));
  return `https://app.simtlv.co.il/${isoSegment}?ref=R41IMUNU`;
}

  if (!selected.length) return "";

  return `

      </span>

}

function copyOrderLink(type, gbAmount) {
  const url = buildOrderLink(type, gbAmount);

const search = document.getElementById("search");
const suggestions = document.getElementById("suggestions");

if (search && suggestions) {
search.addEventListener("input", () => {
  const val = search.value.toLowerCase().trim();
  suggestions.innerHTML = "";

  if (!val) {
    suggestions.style.display = "none";
    return;
  }

  let matches = data.filter(c =>
    c.name.en.toLowerCase().includes(val) ||
    c.name.he.includes(val) ||
    c.iso.toLowerCase().includes(val)
  );

  matches.sort((a,b) => {
    function score(c) {
      let s = 0;
      if (c.name.he.startsWith(val)) s += 3;
      if (c.name.en.toLowerCase().startsWith(val)) s += 2;
      if (c.iso.toLowerCase().startsWith(val)) s += 2;
      if (c.name.he.includes(val)) s += 1;
      return s;
    }
    return score(b) - score(a);
  });

  matches.slice(0,10).forEach(c => {
    const div = document.createElement("div");
    div.textContent =
      `${c.name.he} (Zone ${c.zone}) ($${c.credit_price_per_gb})`;

    div.onclick = () => addCountry(c);
    suggestions.appendChild(div);
  });

  suggestions.style.display = matches.length ? "block" : "none";
});

search.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    const first = suggestions.firstChild;
    if (first) first.click();
  }
});
}

function getOldComparablePriceILS(country, simType, dataGB) {
  if (!country) return null;

  if (simType === "esim") {
    const match = (country.plans.esim || []).find(p => Number(p.dataGB) === Number(dataGB));
    return match ? round2(Number(match.priceUSD) * USD_TO_ILS) : null;
  }

  if (simType === "physical_sim") {
    const match = (country.plans.physical || []).find(p => Number(p.dataGB) === Number(dataGB));
    return match ? Number(match.priceILS) : null;
  }

  return null;
}

function comparePriceMark(newPrice, oldPrice) {
  if (!oldPrice || !newPrice) return "";

  const diff = round2(newPrice - oldPrice);

  if (diff < 0) {
    return `<span class="price-badge good best">האתר זול ב-${Math.abs(diff)}₪ לכל סים</span>`;
  }

  if (diff > 0) {
    return `<span class="price-badge bad">האתר יקר ב-${diff}₪</span>`;
  }

  return `<span class="price-badge same">זהה</span>`;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getBestDeal(pkg) {
  if (!pkg.deals || !pkg.deals.length) return null;
  return [...pkg.deals].sort((a,b) => a.perUnitILS - b.perUnitILS || a.quantity - b.quantity)[0];
}

function formatDealShort(deal) {
  if (!deal) return "";
  if (deal.quantity === 2) return `זוג ב${deal.totalILS} ש"ח`;
  return `${deal.quantity} יח׳ ב${deal.totalILS} ש"ח`;
}

function formatGlobalPlanLine(pkg) {
  const parts = [
    `${pkg.dataGB} גיגה`,
    `${pkg.validityDays} ימים`,
    `₪${pkg.base.totalILS}`
  ];

  const bestDeal = getBestDeal(pkg);
  if (bestDeal) {
    parts.push(`${formatDealShort(bestDeal)} (₪${bestDeal.perUnitILS} לכרטיס)`);
  }

  return parts.join(" – ");
}

function formatTopupPlanLine(pkg) {
  const bestDeal = getBestDeal(pkg);
  const parts = [
    `${pkg.dataGB} גיגה`,
    `${pkg.validityDays} ימים`,
    `₪${pkg.base.totalILS}`
  ];

  if (bestDeal) {
    const dealLabel = bestDeal.quantity === 2
      ? `זוג ₪${bestDeal.totalILS}`
      : `${bestDeal.quantity}× ₪${bestDeal.totalILS}`;
    parts.push(`${dealLabel} (₪${bestDeal.perUnitILS} לכרטיס)`);
  }

  return parts.join(" – ");
}


function formatGlobalPlanListText(displayPackages) {
  return (displayPackages || []).map(formatGlobalPlanLine).join("\n");
}

// Make a checkout link cover every country of the zone, not just one.
// The SimTLV checkout expects countries pipe-separated, e.g. fly_countries=KH|VN.
// It also honours empty_cart (clear cart first) and quantity (WooCommerce).
function buildCheckoutUrl(url, isBase, isos, quantityOverride = null, forceEmptyCart = cartSettings.emptyCart) {
  if (!url) return url;
  const list = (isos || []).slice().sort();   // stable order, e.g. KH|VN

  const explicitQty = quantityOverride !== null && quantityOverride !== undefined;
  const qty = explicitQty
    ? parseInt(quantityOverride, 10)
    : (isBase ? parseInt(cartSettings.quantity || 1, 10) : null);

  try {
    const u = new URL(url);
    if (list.length) u.searchParams.set("fly_countries", list.join("|"));
    u.searchParams.set("ref", "R41IMUNU");

    if (forceEmptyCart) u.searchParams.set("empty_cart", "true");
    else u.searchParams.delete("empty_cart");

    if (Number.isFinite(qty) && qty > 1) u.searchParams.set("quantity", String(qty));
    else if (explicitQty || isBase) u.searchParams.set("quantity", "1");

    // Keep the pipe readable like the real site (KH|VN, not KH%7CVN).
    return u.toString().replace(/%7C/gi, "|");
  } catch (e) {
    let out = String(url);
    if (list.length) {
      out = out.includes("fly_countries=")
        ? out.replace(/fly_countries=[^&]*/g, `fly_countries=${list.join("|")}`)
        : out + (out.includes("?") ? "&" : "?") + `fly_countries=${list.join("|")}`;
    }
    const joiner = out.includes("?") ? "&" : "?";
    if (forceEmptyCart && !out.includes("empty_cart=")) out += `${joiner}empty_cart=true`;
    return out;
  }
}


function registerOrderPackage(simType, pkg, isos) {
  const key = [simType, pkg.base?.productId || "noid", pkg.dataGB, pkg.validityDays]
    .join("_")
    .replace(/[^a-zA-Z0-9_\-]/g, "_");
  orderPackageRegistry[key] = { simType, pkg, isos: (isos || []).slice().sort() };
  return key;
}

function getBuilderQtyForKey(key) {
  const item = orderBuilderItems.find(x => x.key === key);
  return item ? item.qty : "";
}

function chooseOrderVariant(pkg, qty) {
  const exactDeal = (pkg.deals || [])
    .filter(d => d.checkoutUrl && Number(d.quantity) === Number(qty))
    .sort((a,b) => a.perUnitILS - b.perUnitILS)[0];

  if (exactDeal) {
    return {
      isBase: false,
      source: "deal",
      checkoutUrl: exactDeal.checkoutUrl,
      productId: exactDeal.productId,
      perUnitILS: exactDeal.perUnitILS,
      totalILS: exactDeal.totalILS,
      sourceLabel: formatDealShort(exactDeal)
    };
  }

  return {
    isBase: true,
    source: "base",
    checkoutUrl: pkg.base?.checkoutUrl,
    productId: pkg.base?.productId,
    perUnitILS: pkg.base?.perUnitILS,
    totalILS: round2((pkg.base?.perUnitILS || 0) * qty),
    sourceLabel: "מחיר יחיד לפי מספר"
  };
}

function setPackageOrderQuantity(key) {
  const entry = orderPackageRegistry[key];
  if (!entry) return;

  const input = document.getElementById(`qty_${key}`);
  const qty = parseInt(input?.value, 10);

  orderBuilderItems = orderBuilderItems.filter(x => x.key !== key);

  if (!Number.isFinite(qty) || qty <= 0) {
    renderAll();
    return;
  }

  const { simType, pkg, isos } = entry;
  const variant = chooseOrderVariant(pkg, qty);

  if (!variant.checkoutUrl) {
    alert("אין קישור הזמנה לחבילה הזו");
    return;
  }

  const label = `${simTypeHebrew(simType)} ${pkg.dataGB}GB ×${qty} · ${variant.perUnitILS}₪ ליח׳ · ${variant.sourceLabel}`;

  orderBuilderItems.push({
    key,
    simType,
    dataGB: pkg.dataGB,
    validityDays: pkg.validityDays,
    qty,
    label,
    checkoutUrl: variant.checkoutUrl,
    productId: variant.productId,
    isBase: variant.isBase,
    isos,
    perUnitILS: variant.perUnitILS,
    totalILS: variant.totalILS,
    source: variant.source
  });

  orderBuilderItems.sort((a,b) => {
    if (a.simType !== b.simType) return a.simType === "physical_sim" ? -1 : 1;
    return a.dataGB - b.dataGB;
  });

  renderAll();
}

function removeOrderBuilderItem(key) {
  orderBuilderItems = orderBuilderItems.filter(x => x.key !== key);
  renderAll();
}

function clearOrderBuilder() {
  orderBuilderItems = [];
  renderAll();
}

function renderGlobalPurchaseLinks(pkg, isos, simType) {
  const bestDeal = getBestDeal(pkg);
  const key = registerOrderPackage(simType, pkg, isos);
  const qtyValue = getBuilderQtyForKey(key);

  function linkGroup(label, url, isBase, extraClass = "") {
    if (!url) return "";
    const finalUrl = buildCheckoutUrl(url, isBase, isos);
    const safeUrl = escapeHtml(finalUrl);
    const jsUrl = escapeHtml(JSON.stringify(finalUrl));
    const qtyNote = isBase && cartSettings.quantity > 1 ? ` ×${cartSettings.quantity}` : "";
    return `
      <span class="link-group ${extraClass}">
        <span class="link-label">${label}${qtyNote}</span>
        <a class="lk-open" href="${safeUrl}" target="_blank" rel="noopener" title="פתח קישור הזמנה (${label}) בלשונית חדשה">🔗</a>
        <button class="lk-copy" onclick='copyText(${jsUrl})' title="העתק קישור הזמנה (${label}) ללוח">📋</button>
      </span>
    `;
  }

  const dealLabel = bestDeal
    ? `דיל ${bestDeal.perUnitILS}₪/סים`
    : "";

  const numberControl = `
    <span class="number-order-group" title="בחר כמות לחבילה הזו והוסף אותה להזמנה המשולבת">
      <span class="link-label">מספר</span>
      <input id="qty_${key}" type="number" min="0" step="1" value="${escapeHtml(qtyValue)}" placeholder="0"
             onkeydown="if(event.key==='Enter'){setPackageOrderQuantity('${key}')}">
      <button class="lk-set" onclick="setPackageOrderQuantity('${key}')">קבע</button>
    </span>
  `;

  const baseGroup = linkGroup("יחיד", pkg.base?.checkoutUrl, true);
  const dealGroup = bestDeal ? linkGroup(dealLabel, bestDeal.checkoutUrl, false, "best-deal-link") : "";

  return `<div class="global-links purchase-actions">${baseGroup}${dealGroup}${numberControl}</div>`;
}

function renderGlobalPlanRows(country, simType, displayPackages, isos) {
  if (!displayPackages.length) {
    return `<div class="global-empty">לא נמצאו חבילות רלוונטיות.</div>`;
  }

  return displayPackages.map(pkg => {
    const oldPrice = getOldComparablePriceILS(country, simType, pkg.dataGB);
    const bestPrice = pkg.bestPerUnitILS || pkg.base?.perUnitILS;
    const cheaper = oldPrice && bestPrice && bestPrice < oldPrice;
    const mark = comparePriceMark(bestPrice, oldPrice);
    const rowClass = cheaper ? "global-line is-cheaper" : "global-line";

    const bestDeal = getBestDeal(pkg);
    const baseLine = `${pkg.dataGB} גיגה · ${pkg.validityDays} ימים · ${pkg.base.totalILS}₪`;
    const dealLabel = bestDeal
      ? ` · ${bestDeal.quantity === 2 ? "זוג" : bestDeal.quantity + " יח׳"} ${bestDeal.totalILS}₪`
      : "";
    const dealTip = bestDeal
      ? `<button class="info-tip" data-tip="${escapeHtml(bestDeal.perUnitILS + ' ש"ח לכרטיס')}">i</button>`
      : "";

    return `
      <div class="${rowClass}">
        <div class="global-line-text">${escapeHtml(baseLine + dealLabel)}${mark}${dealTip}</div>
        ${renderGlobalPurchaseLinks(pkg, isos, simType)}
      </div>
    `;
  }).join("");
}

function renderGlobalSimColumn(country, simType, displayPackages, isos) {
  const typeZone = simType === "esim"
    ? (country.esimZone ?? country.zone)
    : (country.physicalZone ?? country.zone);
  const typeLabel = simType === "esim"
    ? `בסיסי · eSIM · אזור ${typeZone}`
    : `בסיסי · סים פיזי · אזור ${typeZone}`;
  const destCount = countriesForTypeZone(simType, typeZone).length;
  const listText = formatGlobalPlanListText(displayPackages);
  const copyTextValue = listText
    ? `חבילות ${simType === "esim" ? "סים וירטואלי" : "סים פיזי"} ל-${destCount} יעדים:\n${listText}`
    : "";
  const copyButton = copyTextValue
    ? `<button class="global-copy-btn" onclick='copyText(${JSON.stringify(copyTextValue)})'>📋 העתק</button>`
    : "";

  return `
    <div class="global-sim-column">
      <div class="global-sim-titlebar">
        <div class="global-sim-title">${typeLabel}</div>
        ${copyButton}
      </div>
      <div class="global-lines">
        ${renderGlobalPlanRows(country, simType, displayPackages, isos)}
      </div>
    </div>
  `;
}

// Force a fresh fetch for all countries of a zone (clears their cache first).
function refreshGlobalZone(zone) {
  selected.filter(c => c.zone === zone).forEach(c => { delete globalCache[c.iso]; });
  persistGlobalCache();
  loadGlobalForSelected();
}

  return `
    <div class="block global-clean-card manual-priority">
      <div class="global-clean-head">
        <div>

          <div class="global-clean-subtitle">${escapeHtml(countryNames)}</div>
        </div>
        <div class="block-actions">
          ${simplifyToggle(key)}
          <button onclick="copyZoneCountries(${zone})" title="העתק את כל קודי המדינות באזור ${zone} (מופרד בפסיק)">📋 כל מדינות האזור</button>
          <button onclick="refreshGlobalZone(${zone})" title="רענן מחירים מה‑API">🔄 רענן</button>
        </div>
      </div>
      ${renderPriceChangesBanner(cached)}
      <div class="global-clean-grid">
        ${renderGlobalSimColumn(rep, "physical_sim", physical, isos)}
        ${renderGlobalSimColumn(rep, "esim", esim, isos)}
      </div>

function renderGlobalPlans() {
  if (!selected.length) return "";

  // All "active" countries share the highest zone; show them as ONE card.
  const active = getActiveSelected();
  if (!active.length) return "";

  const zone = active[0].zone;
  const countryNames = active.map(c => c.name.he).join(", ");
  const rep = active.find(c => globalCache[c.iso]);
  const loading = active.some(c => globalLoading[c.iso]);

  if (!rep) {
    if (loading) {
      return `
        <div class="block global-loading-card">
          <h3>מחירים חדשים — אזור ${zone}</h3>
          <div class="global-clean-subtitle">${escapeHtml(countryNames)}</div>
          <p>טוען API חדש...</p>
        </div>
      `;
    }
    return `
      <div class="block global-loading-card">
        <h3>מחירים חדשים — אזור ${zone}</h3>
        <div class="global-clean-subtitle">${escapeHtml(countryNames)}</div>
        <p>עוד לא נטען.</p>
        <button onclick="loadGlobalForSelected()">טען עכשיו</button>
      </div>
    `;
  }

  return renderGlobalZoneBlock(zone, active, globalCache[rep.iso]);
}



function orderRunnerMarkup(items, title = "Your Order is Ready", status = "Tap below to add everything to your cart.", showButton = false) {
  const itemRows = items.map(item => `
    <div class="order-runner-item">
      <span class="order-runner-dot"></span>
      <span>${escapeHtml(item.label)}</span>
      <span class="order-runner-qty">Qty: ${escapeHtml(item.qty)}</span>
    </div>
  `).join("");

  const dots = items.map((_, i) => `<span id="orderDot_${i}"></span>`).join("");

  return `
    <div class="order-runner-card">
      <button class="order-runner-close" onclick="closeOrderOverlay()" title="סגור">×</button>
      <div class="order-runner-logo">Sim<span>TLV</span></div>
      <div class="order-runner-sub">Generated Order</div>
      <div class="order-runner-icon" id="orderRunnerIcon">🛒</div>
      <div class="order-runner-title" id="orderRunnerTitle">${escapeHtml(title)}</div>
      <div class="order-runner-status" id="orderRunnerStatus">${escapeHtml(status)}</div>
      <div class="order-runner-items">${itemRows}</div>
      <div class="order-runner-progress" id="orderRunnerProgress">${dots}</div>
      ${showButton ? `<button class="run-order" onclick="startGeneratedOrderItems(window.__standaloneOrderItems || [])">Proceed to Checkout →</button>` : ""}
    </div>
  `;
}

function openOrderOverlay(items) {
  let overlay = document.getElementById("orderOverlay");
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "orderOverlay";
    overlay.className = "order-overlay";
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = orderRunnerMarkup(items, "Preparing your order", "Please keep this page open while each item is added.");
  overlay.classList.add("is-open");
}

function closeOrderOverlay() {
  const overlay = document.getElementById("orderOverlay");
  if (overlay) overlay.classList.remove("is-open");
}

function setOrderRunnerProgress(activeIndex, itemsLength) {
  for (let i = 0; i < itemsLength; i++) {
    const dot = document.getElementById(`orderDot_${i}`);
    if (!dot) continue;
    dot.className = i < activeIndex ? "done" : (i === activeIndex ? "active" : "");
  }
}

function setOrderRunnerText(title, status, icon = "🛒") {
  const titleEl = document.getElementById("orderRunnerTitle");
  const statusEl = document.getElementById("orderRunnerStatus");
  const iconEl = document.getElementById("orderRunnerIcon");
  if (titleEl) titleEl.textContent = title;
  if (statusEl) statusEl.textContent = status;
  if (iconEl) iconEl.textContent = icon;
}

function sleepOrder(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function startGeneratedOrderItems(items) {
  if (!items || !items.length) {
    alert("אין פריטים להזמנה");
    return;
  }

  openOrderOverlay(items);

  const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
    || (navigator.maxTouchPoints > 1);
  const features = isMobile ? "" : "width=1,height=1,left=-9999,top=-9999";

  // Browsers allow only ONE popup per user gesture, so with 3+ items any
  // extra window.open gets silently blocked and those items never reach the
  // cart. Instead we open a single named window inside the click gesture and
  // NAVIGATE it from item to item — re-navigating an existing window needs no
  // popup permission, so any number of items works with exactly one popup.
  let bg = null;
  if (items.length > 1) {
    try { bg = window.open("about:blank", "simtlv_bg_runner", features); } catch (e) { bg = null; }
    if (!bg) {
      closeOrderOverlay();
      alert("הדפדפן חסם את חלון הרקע. אשר חלונות קופצים (Popups) לאתר הזה ונסה שוב.");
      return;
    }
    try { bg.blur(); window.focus(); } catch (e) {}
  }

  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    const url = buildOrderItemUrl(item, i);

    setOrderRunnerProgress(i, items.length);
    setOrderRunnerText(i === 0 ? "Preparing your order" : "Almost there", `Adding ${item.label}…`, "🛒");

    if (i < items.length - 1) {
      try { bg.location.href = url; bg.blur(); window.focus(); } catch (e) {}
      await sleepOrder(3600);
    } else {
      try { if (bg && !bg.closed) bg.close(); } catch (e) {}
      setOrderRunnerText("Loading checkout", "Final item is being added. Redirecting to checkout…", "✨");
      setOrderRunnerProgress(items.length - 1, items.length);
      await sleepOrder(700);
      window.location.href = url;
    }
  }
}

function startGeneratedOrderFromBuilder() {
  startGeneratedOrderItems(orderBuilderItems.slice());
}

function encodeOrderPayload(payload) {
  const json = JSON.stringify(payload);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  return encoded.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
}

function decodeOrderPayload(value) {
  const padded = String(value || "").replace(/-/g, "+").replace(/_/g, "/") + "===".slice((String(value || "").length + 3) % 4);
  return JSON.parse(decodeURIComponent(escape(atob(padded))));
}


function copyGeneratedOrderLink() {
  if (!orderBuilderItems.length) {
    alert("אין פריטים להזמנה");
    return;
  }
  copyText(getGeneratedOrderLink());
  setExportStatus("קישור הזמנה משולבת הועתק ללוח.");
}

function renderStandaloneOrderPortal() {
  const loadingEl = document.getElementById("loading");
  if (loadingEl) loadingEl.style.display = "none";

  let items = [];
  try {
    const raw = new URLSearchParams(window.location.search).get(ORDER_PAYLOAD_PARAM);
    const payload = decodeOrderPayload(raw);
    cartSettings.emptyCart = payload.emptyCart !== false;
    items = Array.isArray(payload.items) ? payload.items : [];
  } catch (e) {
    items = [];
  }

  window.__standaloneOrderItems = items;
  document.body.classList.add("order-mode");
  const container = document.querySelector(".app");
  if (!container) return;

  if (!items.length) {
    container.innerHTML = `<div class="order-runner-card"><div class="order-runner-title">Link error</div><div class="order-runner-status">Missing or invalid order data.</div></div>`;
    return;
  }

  container.innerHTML = `<div class="standalone-order-card">${orderRunnerMarkup(items, "Your Order is Ready", "Your generated bundle is ready. Tap below to add everything to the cart.", true)}</div>`;
}

function renderCustomAmount() {
  const input = document.getElementById("customAmount");

  if (!input.value || !selected.length) return "";

  const usd = parseFloat(input.value);
  if (isNaN(usd)) return "";

  const on = isSimplified('custom');
  let text = `$${usd}\n`;

  let rows = selected.map(c => {
    const raw = usd / c.credit_price_per_gb;
    return {
      name: c.name.he,
      gb: on ? applySimplify(raw) : parseFloat(raw.toFixed(1))
    };
  });

  rows.sort((a,b)=>b.gb-a.gb);

  rows.forEach(r=>{
    text += `${r.name} = ${r.gb} גיגה\n`;
  });

  return `
    <div class="block">
      <div class="block-tools">
        <h3>סכום מותאם ($${usd})</h3>
        <div class="block-actions">
          ${simplifyToggle('custom')}
          <button class="copy-btn" onclick="copySection(this)" title="העתק">📋 העתק</button>
        </div>
      </div>
      <pre>${text}</pre>
    </div>
  `;
}

function renderZoneNote() {

  const highestZone = getHighestZone();
  const zonesList = [...new Set(selected.map(c => c.zone))].sort((a,b)=>a-b).join(", ");
