<!-- ═══════════════════════════════════════════════════════════════════════
  מחשבון גיגה (SimTLV Giga Calculator)
  Generated by Claude · 2026-07-15 · v5.7

  WHAT THIS FILE IS
  ─────────────────
  An internal sales/ops terminal for SimTLV resellers, delivered as ONE
  self-contained HTML file (deliberate — the file is distributed by hand
  to staff and runs from disk via file:// or any static host). There is
  no build step, no bundler, no framework, and no dependency beyond two
  Google Fonts. All persistent state lives in the browser's localStorage.

  Do NOT split this file into modules unless the distribution model
  changes. See the companion maintenance guide:
  simtlv_giga_calculator_docs_generated_by_claude_*_v*.md

  FILE MAP (four zones, in order)
  ───────────────────────────────
    1. <style>      — the full stylesheet. LAYERED: base reset → design
                      tokens → components → "v4 density layer" at the end
                      that intentionally overrides earlier rules.
                      Ordering matters; do not reorder blocks casually.
    2. Shell HTML   — the static skeleton: top bar, tab bar, #results
                      (all dynamic content renders here), cart FAB +
                      drawer, quote-template modal.
    3. Shell script — 3 tiny helpers that must exist before first paint.
    4. Main script  — constants, state, data loading, business logic,
                      link builders, renderers. Classic global-scope
                      script (no modules). See its table of contents.

  NON-NEGOTIABLES (each has bitten before — see the maintenance guide)
  ────────────────────────────────────────────────────────────────────
    * UI is Hebrew, RTL throughout. RTL comes from CSS `direction`, so
      [dir="rtl"] attribute selectors DO NOT match in this document.
    * The referral code (REFERRAL_CODE constant in the main script) must
      appear on every customer-facing URL this tool produces.
    * Deal/bundle checkout URLs never get a quantity multiplier.
    * Exactly ONE window.open per user gesture (see the order runner).
  ═══════════════════════════════════════════════════════════════════════ -->

<style>
/* =========================================================================
   מחשבון גיגה · STYLESHEET
   Refined, professional light theme. Indigo primary with emerald/rose
   accents kept distinct from the price badges.

   ⚠ LAYERING RULE — READ BEFORE EDITING ⚠
   ----------------------------------------
   This sheet is written in layers, and equal-specificity rules resolve by
   ORDER. The final "v4 density layer" (search for that banner near the
   bottom) intentionally overrides earlier component rules. When you need
   to override something, add the rule to the END of the density layer and
   DELETE the rule it supersedes — do not stack a third layer on top.

   Historical incidents this rule exists to prevent:
     * a generic `input:focus{background:#fff}` late in the sheet made
       top-bar inputs white-on-white the moment they were focused;
     * `.tb-options .opt-btn.is-on` lost its background to a later,
       equally specific `.opt-btn.is-on`;
     * the suggestions dropdown inherited the dark top bar's near-white
       text onto its own white background.
   Rule of thumb: anything rendered inside the dark top bar needs an
   explicit `color` AND explicit `:focus` colors.

   TABLE OF CONTENTS (in source order)
   -----------------------------------
     1. Design tokens (:root custom properties) + base reset
     2. Ops-terminal shell: ink top bar, brand chip, search, chips,
        options cluster, status line, scrollable content area
     3. Cart: floating FAB + right-edge slide-in drawer, empty states
     4. Loading overlay + spinner
     5. Panels, buttons, inputs, suggestions dropdown, selected chips
     6. Results grid + generic .block card + <pre> price text
     7. "Global" (manual-site) cards: columns, price rows, badges
     8. Quick-order rows (eSIM / physical ledgers), link groups
     9. Zone note, card headers, simplify switch, options bar
    10. Manual-site savings emphasis, number-order group
    11. Generated order builder + integrated order runner + order-mode
        (standalone portal: body.order-mode hides all normal chrome —
        any NEW chrome must be appended to its display:none list)
    12. Top-up scanner card: controls, status, inventory, patterns,
        quick chips, fixed-geometry package rows (muscle memory!)
    13. Reusable hover tooltip (.info-tip)
    14. Responsive breakpoints + reduced-motion
    15. ===== v4 density layer ===== (deliberate overrides; keep last)

   RTL REMINDERS
   -------------
     * Direction is set via CSS `direction:rtl` on <body>, NOT via a dir
       attribute — so [dir] selectors never match here.
     * Drawers/tooltips that must open toward the reading direction are
       anchored with physical right/left, not inset-inline-*.
     * The cart drawer hides at translateX(105%) — off the RIGHT edge.
   ========================================================================= */

:root{
  --bg:#e9ecf2;
  --surface:#ffffff;
  --surface-2:#f5f6fa;
  --line:#e6e9f0;
  --line-strong:#d7dbe6;
  --text:#1b1f2a;
  --muted:#6b7280;

  --primary:#3b3fd8;
  --primary-700:#2c2fb0;
  --primary-100:#dfe1fb;
  --primary-50:#eef0ff;

  --accent:#0ea371;
  --accent-700:#0a7d57;

  --good-bg:#e7f7ee; --good:#0c7a44; --good-bd:#b8e6cb;
  --bad-bg:#fdecef;  --bad:#b01030;  --bad-bd:#f6c2cd;
  --same-bg:#eef1f6; --same:#4b5566; --same-bd:#d3d9e4;

  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 2px 8px -4px rgba(16,24,40,.10);
  --shadow-lg:0 2px 6px rgba(16,24,40,.06), 0 10px 24px -12px rgba(16,24,40,.20);
  --radius:14px;
}

*{ box-sizing:border-box; }

html{ -webkit-text-size-adjust:100%; }

body{
  font-family:'Assistant', system-ui, Arial, sans-serif;
  color:var(--text);
  font-size:13px;
  line-height:1.45;
  direction:rtl;
  margin:0;
  padding:0;
  height:100vh;
  overflow:hidden;
  background:var(--bg);
}

/* ===== Ops-terminal shell: ink topbar + full-width content ===== */
:root{
  --ink:#101319;
  --ink-2:#1a1f2a;
  --ink-line:rgba(255,255,255,.12);
  --chip-gold:linear-gradient(135deg,#e8c66a 0%,#c9a24a 45%,#f0d78a 100%);
}
.app{
  display:flex; flex-direction:column;
  height:100vh; width:100vw;
  position:relative; z-index:1;
}
.topbar{
  flex:0 0 auto;
  display:flex; align-items:center; gap:14px;
  height:48px; padding:0 14px;
  background:var(--ink);
  color:#e8ecf4;
  border-bottom:1px solid var(--ink-line);
}
.brand{ display:flex; align-items:center; gap:9px; flex:0 0 auto; }
.brand-name{ font-family:'Suez One',serif; font-size:16px; color:#fff; letter-spacing:.01em; }

/* Signature: SIM-chip glyph (gold contact pad) */
.sim-chip{
  width:26px; height:20px; flex:none; position:relative;
  background:var(--chip-gold);
  border-radius:5px 5px 5px 9px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25), 0 1px 2px rgba(0,0,0,.4);
}
.sim-chip::before{
  content:""; position:absolute; inset:4px 5px;
  border:1px solid rgba(80,55,10,.55); border-radius:3px;
  background:
    linear-gradient(rgba(80,55,10,.55), rgba(80,55,10,.55)) 50% 0/1px 100% no-repeat,
    linear-gradient(rgba(80,55,10,.55), rgba(80,55,10,.55)) 0 50%/100% 1px no-repeat;
}
.sim-chip.small{ width:20px; height:15px; border-radius:4px 4px 4px 7px; }
.sim-chip.small::before{ inset:3px 4px; }

/* Topbar: search */
.tb-search{ flex:0 0 240px; }
.tb-search .search-wrap{ position:relative; }
.tb-search input{
  width:100%; box-sizing:border-box;
  background:var(--ink-2); color:#e8ecf4;
  border:1px solid var(--ink-line); border-radius:9px;
  padding:7px 30px 7px 10px; font-size:12.5px; font-family:inherit;
}
.tb-search input::placeholder{ color:#8a93a6; }
.tb-search input:focus{ outline:none; border-color:var(--primary); }
.tb-search .search-icon{
  position:absolute; inset-inline-start:auto; inset-inline-end:9px; top:50%;
  transform:translateY(-50%); width:14px; height:14px; color:#8a93a6; pointer-events:none;
}
.tb-search .suggestions{ top:calc(100% + 6px); }

/* Topbar: selected chips strip (scrolls horizontally, never wraps the bar) */
.tb-chips{
  flex:1 1 auto; min-width:0;
  display:flex; align-items:center; gap:8px;
}
.tb-chips .chips{
  margin:0; flex:1 1 auto; min-width:0;
  display:flex; flex-wrap:nowrap; gap:6px;
  overflow-x:auto; overflow-y:hidden; padding:2px 0;
  scrollbar-width:thin;
}
.tb-chips .chips::-webkit-scrollbar{ height:5px; }
.tb-chips .chips::-webkit-scrollbar-thumb{ background:var(--ink-line); border-radius:99px; }
.tb-chips .chip{ flex:0 0 auto; }

/* Topbar: options cluster */
.tb-options{ flex:0 0 auto; display:flex; align-items:center; gap:8px; }
.tb-options .opt-switch{ color:#c6cdda; border-color:var(--ink-line); background:var(--ink-2); }
.tb-options .opt-qty{ color:#c6cdda; border-color:var(--ink-line); background:var(--ink-2); }
.tb-options .opt-qty input{ background:var(--ink); color:#e8ecf4; border-color:var(--ink-line); }
.tb-options .opt-btn{
  background:var(--ink-2); color:#c6cdda; border:1px solid var(--ink-line);
}
.tb-options .opt-btn.is-on{ color:#fff; border-color:var(--primary); }
.json-btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 11px; border-radius:9px; cursor:pointer;
  background:var(--ink-2); color:#e8ecf4; border:1px solid var(--ink-line);
  font-family:'Assistant'; font-weight:700; font-size:12px; transition:all .15s;
}
.json-btn:hover{ border-color:var(--chip-gold); background:#232a38; }

/* Status line under topbar — collapses when empty */
.topbar-status{ margin:0; padding:0 14px; font-size:11.5px; }
.topbar-status:empty{ display:none; }
.topbar-status:not(:empty){ padding-top:6px; }

/* Content */
.content{
  flex:1 1 auto; min-height:0;
  overflow-y:auto; overflow-x:hidden;
  padding:12px 14px 70px;
}
.content::-webkit-scrollbar{ width:9px; }
.content::-webkit-scrollbar-thumb{
  background:var(--line-strong); border-radius:999px; border:2px solid transparent; background-clip:padding-box;
}

/* ===== Cart: floating chip badge + drawer ===== */
.cart-fab{
  position:fixed; bottom:18px; inset-inline-start:18px; z-index:800;
  display:flex; align-items:center; gap:8px;
  padding:10px 14px; border-radius:999px; cursor:pointer;
  background:var(--ink); color:#fff; border:1px solid var(--ink-line);
  font-family:'Assistant'; font-weight:800; font-size:14px;
  box-shadow:0 6px 20px rgba(16,19,25,.35);
  transition:transform .15s, box-shadow .15s;
}
.cart-fab:hover{ transform:translateY(-2px); box-shadow:0 10px 26px rgba(16,19,25,.42); }
.cart-fab-count{
  min-width:20px; height:20px; padding:0 6px; border-radius:999px;
  display:grid; place-items:center; font-size:12px;
  background:var(--ink-2); color:#8a93a6;
}
.cart-fab.has-items .cart-fab-count{ background:var(--accent); color:#fff; }
.cart-drawer{
  position:fixed; top:0; bottom:0; right:0; z-index:790;
  width:360px; max-width:92vw;
  background:#fff; border-left:1px solid var(--line-strong);
  box-shadow:-14px 0 40px rgba(16,19,25,.18);
  transform:translateX(105%);
  transition:transform .22s ease;
  display:flex; flex-direction:column;
}
.cart-drawer.open{ transform:translateX(0); }
.cart-drawer-head{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:12px 14px; background:var(--ink); color:#fff;
  font-family:'Suez One',serif; font-size:15px;
}
.cart-drawer-close{
  background:transparent; border:0; color:#c6cdda; font-size:15px; cursor:pointer;
  padding:4px 8px; border-radius:7px;
}
.cart-drawer-close:hover{ background:var(--ink-2); color:#fff; }
.cart-drawer > #cart{ flex:1 1 auto; overflow-y:auto; padding:12px 14px; }

/* Empty states */
.cart-empty{
  text-align:center; color:var(--muted); font-size:12.5px; line-height:1.7;
  padding:34px 16px; border:1.5px dashed var(--line-strong); border-radius:var(--radius);
  background:rgba(245,246,250,.6);
}
.cart-empty .ce-emoji{ font-size:26px; display:block; margin-bottom:7px; opacity:.7; }
.center-empty{
  height:100%; min-height:60vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; color:var(--muted); gap:10px;
}
.center-empty .ce-emoji{ font-size:46px; opacity:.6; }
.center-empty h2{ font-family:'Suez One',serif; font-size:22px; color:var(--text); margin:0; }
.center-empty p{ margin:0; font-size:13px; max-width:340px; }

.container{
  position:relative;
  z-index:1;
  max-width:1180px;
  margin:0 auto;
}

/* staggered entrance */
@keyframes rise{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
.container > *{ animation:rise .5s ease both; }
.container > *:nth-child(2){ animation-delay:.06s; }
.container > *:nth-child(3){ animation-delay:.12s; }
.container > *:nth-child(4){ animation-delay:.18s; }

/* ---------- Loading overlay ---------- */
#loading{
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background:rgba(233,236,242,.82);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  font-size:16px;
}
.loading-inner{
  display:flex; align-items:center; gap:12px;
  background:#fff; border:1px solid var(--line);
  box-shadow:var(--shadow); padding:16px 22px; border-radius:14px;
  font-weight:600; color:var(--text);
}
.spinner{
  width:22px; height:22px; border-radius:50%;
  border:3px solid var(--primary-100); border-top-color:var(--primary);
  animation:spin .8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------- Header ---------- */
.brand{ display:flex; align-items:center; gap:14px; }
.brand-mark{
  font-size:30px; line-height:1;
  width:58px; height:58px; flex:none;
  display:grid; place-items:center;
  background:linear-gradient(150deg, #ffffff, #eef0ff);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
}
/* ---------- Panels (toolbar / controls) ---------- */
.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
  margin-bottom:14px;
}
/* ---------- Buttons ---------- */
button{
  font-family:inherit; font-weight:600;
  color:var(--text);
  background:#fff;
  border:1px solid var(--line-strong);
  border-radius:9px;
  padding:6px 11px;
  font-size:12.5px; line-height:1.2;
  cursor:pointer;
  transition:background .15s, color .15s, border-color .15s, box-shadow .15s, transform .12s;
}
button:hover{
  background:var(--surface-2);
  border-color:var(--primary);
  color:var(--primary);
  transform:translateY(-1px);
  box-shadow:var(--shadow-sm);
}
button:active{ transform:translateY(0); }
button:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }

.btn-primary{
  background:var(--primary); color:#fff;
  border-color:transparent;
  padding:11px 18px; font-size:13.5px; border-radius:11px;
  box-shadow:0 1px 2px rgba(59,63,216,.25);
}
.btn-primary:hover{
  background:var(--primary-700); color:#fff; border-color:transparent;
  box-shadow:0 8px 18px -8px rgba(59,63,216,.55);
}

/* ---------- Fields & inputs ---------- */
input{
  width:100%;
  background:var(--surface); color:var(--text);
  border:1px solid var(--line-strong);
  border-radius:11px;
  padding:11px 13px;
  font-size:14px; font-family:inherit;
  margin:0;
  transition:border-color .15s, box-shadow .15s, background .15s;
}
input::placeholder{ color:#9aa1ad; }
input:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 4px var(--primary-50);
  background:#fff;
}

.search-wrap{ position:relative; }
.search-icon{
  position:absolute; inset-inline-start:13px; top:50%;
  transform:translateY(-50%);
  width:18px; height:18px; color:#9aa1ad; pointer-events:none;
}
#search{ padding-inline-start:40px; }

.custom-row{ display:flex; gap:8px; align-items:stretch; }
.custom-row #customAmount{ flex:1; }
.custom-row .btn-primary{ white-space:nowrap; }

#selected:not(:empty) + .hint{ display:none; }

/* ---------- Suggestions dropdown ---------- */
.suggestions{
  position:absolute; inset-inline:0; top:calc(100% + 6px); z-index:60;
  background:#fff;
  color:var(--text); /* explicit: inside the dark topbar it would inherit near-white */
  border:1px solid var(--line-strong);
  border-radius:12px;
  box-shadow:var(--shadow-lg);
  max-height:280px; overflow:auto;
  display:none; padding:5px;
}
.suggestions div{
  padding:9px 11px; border-radius:8px; cursor:pointer;
  font-size:13.5px; transition:background .12s, color .12s;
}
.suggestions div:hover{ background:var(--primary-50); color:var(--primary-700); }
.suggestions::-webkit-scrollbar{ width:10px; }
.suggestions::-webkit-scrollbar-thumb{
  background:#c7cdd9; border-radius:999px; border:2px solid #fff;
}

/* ---------- Selected chips ---------- */
.chips{ display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
.clear-countries-btn{
  display:none; align-items:center; gap:4px;
  font-family:'Assistant'; font-size:10.5px; font-weight:700;
  padding:3px 9px; border-radius:999px; cursor:pointer;
  background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad-bd);
  text-transform:none; letter-spacing:0; line-height:1.4;
}
.clear-countries-btn:hover{ background:#fbd9e1; }
.chip{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--primary-50); color:var(--primary-700);
  border:1px solid var(--primary-100);
  padding-block:6px; padding-inline-start:12px; padding-inline-end:6px;
  border-radius:999px;
  font-size:13px; font-weight:600;
}
.chip span{
  margin:0; cursor:pointer;
  width:18px; height:18px; flex:none;
  display:grid; place-items:center;
  border-radius:50%;
  background:rgba(59,63,216,.12); color:var(--primary-700);
  font-size:11px; line-height:1;
  transition:background .15s, color .15s, transform .2s;
}
.chip span:hover{ background:var(--bad); color:#fff; transform:rotate(90deg); }

/* ---------- Status banner ---------- */
.status{
  display:none; margin-top:12px;
  background:var(--primary-50);
  border:1px solid var(--primary-100);
  color:#33406b;
  border-radius:10px;
  padding:10px 12px;
  font-size:12.5px; line-height:1.45;
  white-space:pre-wrap;
  direction:ltr; text-align:left;
  font-variant-numeric:tabular-nums;
}

/* ---------- Results ---------- */
.results-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
  gap:10px;
  margin-top:0;
  align-content:start;
  align-items:start;
}
.block{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:11px 12px;
  transition:box-shadow .2s, transform .2s, border-color .2s;
}
.block:hover{ box-shadow:var(--shadow-lg); }
.block h3{
  font-family:'Assistant'; font-weight:800;
  font-size:14px; margin:0 0 6px;
}
.block > button{ margin-bottom:8px; }
.block > button + button{ margin-inline-start:6px; }

pre{
  font-family:'Assistant', system-ui, sans-serif;
  margin:6px 0 0;
  padding:8px 10px;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:9px;
  font-size:12px; line-height:1.5;
  color:#2a2f3a;
  white-space:pre-wrap;
  font-variant-numeric:tabular-nums;
}

/* ---------- Global (new API) cards ---------- */
.global-clean-card{ grid-column:1 / -1; padding:12px 14px; }
.global-clean-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  border-bottom:1px solid var(--line);
  padding-bottom:9px; margin-bottom:10px;
}
.global-clean-head h3{
  margin:0; font-family:'Assistant'; font-weight:800; font-size:15px;
}
.global-clean-subtitle{
  color:var(--muted); font-size:12px; margin-top:4px;
  max-width:62ch; line-height:1.45;
}
.global-clean-grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(280px, 1fr));
  gap:12px;
}
.global-sim-column{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px; min-width:0;
}
.global-sim-titlebar{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  margin-bottom:8px;
}
.global-sim-title{ font-size:14px; font-weight:800; color:var(--text); }
.global-copy-btn{ font-size:12px; padding:5px 9px; }

.global-lines{ display:grid; gap:0; }
.global-line{
  display:grid; grid-template-columns:minmax(0,1fr) auto;
  align-items:center; gap:10px;
  padding:8px 6px; margin-inline:-6px;
  border-bottom:1px solid var(--line);
  border-radius:8px;
  font-size:13px; line-height:1.3;
  transition:background .12s;
}
.global-line:hover{ background:rgba(59,63,216,.045); }
.global-line:last-child{ border-bottom:0; }
.global-line-text{ min-width:0; overflow-wrap:normal; word-break:keep-all; font-weight:500; display:flex; align-items:center; flex-wrap:wrap; gap:6px; }

.global-links{ display:flex; gap:6px; white-space:nowrap; }
.global-links a{
  display:inline-flex; align-items:center;
  border:1px solid var(--line-strong); background:#fff; color:var(--text);
  text-decoration:none; border-radius:999px;
  padding:4px 11px; font-size:12px; font-weight:600;
  transition:background .15s, color .15s, border-color .15s, box-shadow .15s, transform .12s;
}
.global-links a:hover{
  background:var(--primary); color:#fff; border-color:var(--primary);
  transform:translateY(-1px); box-shadow:var(--shadow-sm);
}

.price-badge{
  display:inline-block; border-radius:999px;
  padding:2px 8px; margin-inline-start:6px;
  font-size:11px; font-weight:700; line-height:1.4;
  vertical-align:middle;
}
.price-badge.good{ background:var(--good-bg); color:var(--good); border:1px solid var(--good-bd); }
.price-badge.bad{  background:var(--bad-bg);  color:var(--bad);  border:1px solid var(--bad-bd); }
.price-badge.same{ background:var(--same-bg); color:var(--same); border:1px solid var(--same-bd); }

.global-empty,
.global-error-text{ color:var(--muted); font-size:12.5px; padding:6px 0; }
.global-error-text{ color:var(--bad); }

.global-loading-card{ grid-column:1 / -1; }
.global-loading-card h3{ font-weight:800; margin:0 0 6px; }
.global-loading-card p{ color:var(--muted); margin:0 0 8px; }

/* ---------- Quick-order rows (eSIM / physical) ---------- */
.order-row{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  margin-bottom:7px;
}
.order-gb{
  min-width:48px; font-weight:800; font-size:13px;
  color:var(--text); font-variant-numeric:tabular-nums;
}
.oa-open, .oa-copy, .lk-open, .lk-copy{
  font-size:12px; padding:5px 10px; border-radius:8px; line-height:1.2;
}
.oa-open{ background:var(--primary); color:#fff; border-color:transparent; }
.oa-open:hover{ background:var(--primary-700); color:#fff; border-color:transparent; }
.oa-copy{ background:#fff; color:var(--primary-700); border-color:var(--primary-100); }
.oa-copy:hover{ background:var(--primary-50); color:var(--primary-700); border-color:var(--primary); }

/* ---------- Global checkout link groups ---------- */
.link-group{
  display:inline-flex; align-items:center; gap:4px;
  background:#fff; border:1px solid var(--line-strong);
  border-radius:999px; padding:2px 4px 2px 8px;
}
.link-group + .link-group{ margin-inline-start:6px; }
.link-label{ font-size:11.5px; font-weight:700; color:var(--muted); }
.lk-open, .lk-copy{
  padding:3px 8px; border-radius:999px; font-size:12px;
}
.lk-open{ background:var(--primary); color:#fff; border-color:transparent; text-decoration:none; }
.lk-open:hover{ background:var(--primary-700); color:#fff; transform:translateY(-1px); box-shadow:var(--shadow-sm); }
.lk-copy{ background:var(--surface-2); color:var(--primary-700); border-color:var(--line-strong); }
.lk-copy:hover{ background:var(--primary-50); color:var(--primary-700); border-color:var(--primary); }

/* ---------- Zone filter note ---------- */
.zone-note{
  grid-column:1 / -1;
  display:flex; align-items:flex-start; gap:12px;
  background:linear-gradient(180deg, #fffaf0, #fff6e6);
  border:1px solid #f3dca8;
}
.zone-note-badge{
  flex:none; align-self:center;
  background:#a9610b; color:#fff;
  font-weight:800; font-size:12px;
  padding:5px 11px; border-radius:999px;
  white-space:nowrap;
}
.zone-note-text{ font-size:13px; line-height:1.5; color:#5b4310; }
.zone-note-text b{ font-weight:800; color:#3f2f08; }

/* ---------- Card header (title + actions) ---------- */
.block-tools{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; flex-wrap:wrap; margin-bottom:10px;
}
.block-tools h3{ margin:0; }
.block-actions{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.copy-btn{ font-size:12px; padding:6px 10px; }
.zone-pill{
  display:inline-block; margin-inline-start:6px;
  background:var(--primary-50); color:var(--primary-700);
  border:1px solid var(--primary-100);
  border-radius:999px; padding:1px 9px;
  font-size:12px; font-weight:700; vertical-align:middle;
}

/* ---------- Simplify on/off switch ---------- */
.simplify-btn{
  display:inline-flex; align-items:center; gap:8px;
  font-weight:700; font-size:12px; padding:5px 11px;
  border-radius:999px;
}
.simplify-btn .sw{
  width:26px; height:15px; border-radius:999px; flex:none;
  position:relative; background:#c7ccd6; transition:background .18s;
}
.simplify-btn .sw::after{
  content:""; position:absolute; top:2px; inset-inline-end:2px;
  width:11px; height:11px; border-radius:50%;
  background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25);
  transition:inset-inline-end .18s;
}
.simplify-btn.is-on{
  background:var(--good-bg); color:var(--accent-700); border-color:var(--good-bd);
}
.simplify-btn.is-on .sw{ background:var(--accent); }
.simplify-btn.is-on .sw::after{ inset-inline-end:13px; }
.simplify-btn.is-off{ background:#fff; color:var(--muted); border-color:var(--line-strong); }
.simplify-btn.is-on:hover{ background:#daf3e5; color:var(--accent-700); border-color:var(--accent); transform:translateY(-1px); }
.simplify-btn.is-off:hover{ background:var(--surface-2); color:var(--text); border-color:var(--primary); transform:translateY(-1px); }

/* ---------- Display & cart options bar ---------- */
.options-bar{
  display:flex; align-items:center; flex-wrap:wrap; gap:10px;
  margin-top:14px; padding-top:14px;
  border-top:1px dashed var(--line-strong);
}
.opt-btn{ font-size:12.5px; font-weight:700; padding:8px 13px; border-radius:10px; }
.opt-btn.is-on{ background:var(--good-bg); color:var(--accent-700); border-color:var(--good-bd); }
.opt-btn.is-on:hover{ background:#daf3e5; border-color:var(--accent); color:var(--accent-700); transform:translateY(-1px); }
.opt-btn.is-off{ background:var(--surface-2); color:var(--muted); }
.opt-btn.is-off:hover{ background:#fff; border-color:var(--primary); color:var(--text); transform:translateY(-1px); }

/* checkbox-driven switch */
.opt-switch{
  display:inline-flex; align-items:center; gap:8px; cursor:pointer;
  font-size:12.5px; font-weight:600; color:var(--text);
  background:#fff; border:1px solid var(--line-strong);
  border-radius:10px; padding:7px 12px; user-select:none;
}
.opt-switch input{ position:absolute; opacity:0; width:0; height:0; }
.opt-switch .sw{
  width:30px; height:17px; border-radius:999px; flex:none; position:relative;
  background:#c7ccd6; transition:background .18s;
}
.opt-switch .sw::after{
  content:""; position:absolute; top:2px; inset-inline-end:2px;
  width:13px; height:13px; border-radius:50%; background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.25); transition:inset-inline-end .18s;
}
.opt-switch input:checked + .sw{ background:var(--primary); }
.opt-switch input:checked + .sw::after{ inset-inline-end:15px; }
.opt-switch input:focus-visible + .sw{ outline:2px solid var(--primary); outline-offset:2px; }

.opt-qty{
  display:inline-flex; align-items:center; gap:8px;
  font-size:12.5px; font-weight:600; color:var(--text);
  background:#fff; border:1px solid var(--line-strong);
  border-radius:10px; padding:5px 12px;
}
.opt-qty input{
  width:64px; padding:5px 8px; border-radius:8px;
  border:1px solid var(--line-strong); font-size:13px;
  font-variant-numeric:tabular-nums; text-align:center;
}



/* ---------- Manual website savings emphasis ---------- */
.global-clean-card.manual-priority{
  border-color:#b8e6cb;
  box-shadow:0 1px 2px rgba(16,24,40,.05), 0 18px 40px -20px rgba(14,163,113,.40);
}
.global-line.is-cheaper{
  background:linear-gradient(90deg, rgba(14,163,113,.09), rgba(255,255,255,0));
  border-inline-start:4px solid var(--accent);
  padding-inline-start:9px;
}
.global-line.is-cheaper:hover{ background:rgba(14,163,113,.11); }
.price-badge.best{
  background:#0ea371;
  color:#fff;
  border-color:#0ea371;
  box-shadow:0 4px 12px -8px rgba(14,163,113,.75);
}
.purchase-actions{
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
}
.number-order-group{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:#fff;
  border:1px solid var(--line-strong);
  border-radius:999px;
  padding:2px 4px 2px 8px;
  white-space:nowrap;
}
.number-order-group input{
  width:54px;
  height:26px;
  padding:3px 6px;
  border-radius:999px;
  font-size:12px;
  text-align:center;
  font-variant-numeric:tabular-nums;
}
.number-order-group .lk-set{
  padding:3px 9px;
  border-radius:999px;
  background:var(--accent);
  border-color:transparent;
  color:#fff;
  font-size:12px;
}
.number-order-group .lk-set:hover{ background:var(--accent-700); color:#fff; border-color:transparent; }

/* ---------- Generated order builder ---------- */
.order-builder-card{
  grid-column:auto;
  border-color:#c9cef8;
  box-shadow:none;
  padding:0;
  background:transparent;
  border:0;
}
.order-builder-card:hover{ box-shadow:none; }
.order-builder-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--line);
  padding-bottom:12px;
  margin-bottom:12px;
}
.order-builder-head h3{ margin:0; font-size:16px; font-weight:800; }
.order-builder-lines{ display:grid; gap:8px; }
.order-builder-line{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto;
  gap:8px;
  align-items:center;
  padding:9px 10px;
  border:1px solid var(--line);
  background:var(--surface-2);
  border-radius:11px;
}
.order-builder-label{ font-weight:700; font-size:13px; min-width:0; overflow-wrap:anywhere; }
.order-builder-price{ direction:ltr; font-weight:800; font-size:13px; color:var(--accent-700); white-space:nowrap; }
.order-builder-remove{ padding:4px 9px; border-radius:999px; color:var(--bad); }
.order-builder-footer{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:10px;
  margin-top:14px;
  padding-top:14px;
  border-top:1px dashed var(--line-strong);
}
.order-builder-total{ font-weight:800; color:var(--text); font-size:15px; text-align:center; }
.order-builder-actions{ display:flex; flex-direction:column; gap:8px; }
.order-builder-actions button{ width:100%; justify-content:center; }
.order-builder-actions .run-order{ background:var(--accent); color:#fff; border-color:transparent; font-size:14px; padding:12px; }
.order-builder-actions .run-order:hover{ background:var(--accent-700); color:#fff; border-color:transparent; }

/* ---------- Integrated order runner ---------- */
.order-overlay{
  position:fixed;
  inset:0;
  z-index:10000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(10,15,26,.68);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
}
.order-overlay.is-open{ display:flex; }
.order-runner-card{
  width:min(440px, 100%);
  direction:ltr;
  text-align:center;
  background:#111827;
  color:#e8f0f8;
  border:1px solid rgba(26,157,224,.18);
  border-radius:20px;
  padding:32px 30px;
  box-shadow:0 24px 70px -32px rgba(0,0,0,.75);
  position:relative;
  overflow:hidden;
}
.order-runner-card::before{
  content:""; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, #1a9de0, transparent);
}
.order-runner-logo{ font-size:24px; font-weight:800; color:#fff; letter-spacing:-.3px; }
.order-runner-logo span{ color:#1a9de0; }
.order-runner-sub{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#7a95b0; margin:2px 0 26px; }
.order-runner-icon{
  width:62px; height:62px; margin:0 auto 16px;
  display:grid; place-items:center;
  border-radius:50%;
  background:rgba(26,157,224,.10);
  border:1px solid rgba(26,157,224,.30);
  font-size:27px;
}
.order-runner-title{ font-size:21px; font-weight:800; color:#fff; margin-bottom:6px; }
.order-runner-status{ color:#7a95b0; font-size:13px; line-height:1.5; min-height:38px; }
.order-runner-items{
  margin:20px 0 0;
  text-align:left;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;
  padding:12px;
  max-height:180px;
  overflow:auto;
}
.order-runner-item{
  display:flex; gap:9px; align-items:center;
  padding:5px 0;
  color:#e8f0f8;
  font-size:12.5px;
}
.order-runner-item + .order-runner-item{ border-top:1px solid rgba(255,255,255,.055); }
.order-runner-dot{ width:6px; height:6px; border-radius:50%; background:#1a9de0; flex:none; }
.order-runner-qty{ margin-left:auto; color:#7a95b0; font-size:11px; }
.order-runner-progress{ display:flex; justify-content:center; gap:7px; margin-top:18px; }
.order-runner-progress span{ width:8px; height:8px; border-radius:50%; background:rgba(26,157,224,.22); }
.order-runner-progress span.done{ background:#22d3a0; }
.order-runner-progress span.active{ background:#1a9de0; transform:scale(1.35); }
.order-runner-close{
  position:absolute;
  top:10px;
  right:10px;
  width:30px; height:30px;
  border-radius:50%;
  background:rgba(255,255,255,.06);
  color:#e8f0f8;
  border:1px solid rgba(255,255,255,.08);
}
body.order-mode{
  padding:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0a0f1a;
}
body.order-mode::before{ display:none; }
body.order-mode .app{ display:block; max-width:460px; width:100%; height:auto; padding:20px; }
body.order-mode .cart-fab,
body.order-mode .cart-drawer,
body.order-mode .topbar,
body.order-mode .tabs,
body.order-mode .topbar-status{ display:none; }
.standalone-order-card{ width:100%; }
.standalone-order-card .order-runner-card{ width:100%; }
.standalone-order-card .run-order{ margin-top:20px; width:100%; padding:14px 20px; border-radius:12px; font-weight:800; background:#1a9de0; color:#fff; border:0; }
.standalone-order-card .run-order:hover{ background:#0d7ab8; color:#fff; }



/* ---------- Top-up scanner ---------- */
.topup-scanner-card{
  grid-column:1 / -1;
  border-color:#c9cef8;
  box-shadow:0 1px 2px rgba(16,24,40,.05), 0 18px 40px -22px rgba(59,63,216,.42);
}
.topup-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  border-bottom:1px solid var(--line);
  padding-bottom:12px;
  margin-bottom:13px;
}
.topup-head h3{ margin:0; font-size:17px; font-weight:800; }
.topup-controls{
  display:flex;
  flex-wrap:nowrap;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}
.topup-controls .version-select-wrap{ flex:0 0 auto; }
.topup-controls .version-select-wrap select{ width:auto; min-width:118px; padding:9px 12px; }
.topup-iccid-input{
  flex:1 1 auto; min-width:0;
  direction:ltr; text-align:left; font-variant-numeric:tabular-nums;
  background:#fff; border:1px solid var(--line-strong); border-radius:11px;
  padding:9px 12px; font-size:13px; color:var(--text);
}
.topup-head-countries{ font-weight:500; color:var(--muted); font-size:13px; }
.topup-scan-btn{
  flex:0 0 auto;
  background:var(--primary);
  color:#fff;
  border-color:transparent;
  padding:9px 14px;
  border-radius:11px;
  font-size:15px;
}
.topup-scan-btn:hover{ background:var(--primary-700); color:#fff; border-color:transparent; }
.topup-status{
  padding:10px 12px;
  border-radius:11px;
  background:var(--primary-50);
  border:1px solid var(--primary-100);
  color:#33406b;
  font-size:12.5px;
  line-height:1.45;
  margin-bottom:12px;
}
.topup-status.error{
  background:var(--bad-bg);
  border-color:var(--bad-bd);
  color:var(--bad);
}
.topup-status.loading{
  display:flex;
  align-items:center;
  gap:10px;
}
.topup-mini-spinner{
  width:17px;
  height:17px;
  border-radius:50%;
  border:2px solid var(--primary-100);
  border-top-color:var(--primary);
  animation:spin .8s linear infinite;
  flex:none;
}
.topup-meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:12px;
}
.topup-meta-bar{
  display:flex; align-items:center; gap:10px;
  margin:2px 0 12px;
}
.topup-meta-label{ font-size:12.5px; font-weight:700; color:var(--muted); }
.topup-meta-label.ok{ color:var(--accent-700); }
.topup-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(290px, 1fr));
  gap:12px;
}
.topup-products{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
}
.topup-products-titlebar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:8px;
}
.topup-products-title{ font-size:14px; font-weight:800; color:var(--text); }
.topup-line{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  padding:8px 6px;
  margin-inline:-6px;
  border-bottom:1px solid var(--line);
  border-radius:8px;
  font-size:13px;
}
.topup-line:last-child{ border-bottom:0; }
.topup-line:hover{ background:rgba(59,63,216,.045); }
.topup-line-text{ min-width:0; overflow-wrap:anywhere; font-weight:500; }
.topup-actions{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; white-space:nowrap; }
.topup-order-tag{
  display:inline-block;
  margin-inline-start:6px;
  background:#eef0ff;
  color:var(--primary-700);
  border:1px solid var(--primary-100);
  border-radius:999px;
  padding:2px 8px;
  font-size:11px;
  font-weight:800;
}

.topup-select-wrap label,
.topup-inventory label{
  display:block;
  font-size:12.5px;
  font-weight:700;
  color:var(--muted);
  margin-bottom:6px;
}
.topup-select-wrap select{
  width:100%;
  background:#fff;
  border:1px solid var(--line-strong);
  border-radius:11px;
  padding:10px 12px;
  font-size:14px;
  font-family:inherit;
  color:var(--text);
}
.topup-inventory{
  margin:10px 0 12px;
  background:linear-gradient(180deg, #fbfcff, #f5f6fa);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
}
.topup-inventory-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:8px;
}
.topup-inventory-title{ font-weight:800; font-size:13.5px; color:var(--text); }
.topup-inventory-sub{ color:var(--muted); font-size:12px; margin-top:2px; line-height:1.45; }
.topup-inventory textarea{
  width:100%;
  min-height:74px;
  resize:vertical;
  direction:ltr;
  text-align:left;
  font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size:12.5px;
  line-height:1.45;
  background:#fff;
  color:var(--text);
  border:1px solid var(--line-strong);
  border-radius:10px;
  padding:10px 11px;
}
.topup-inventory-actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  align-items:center;
  margin-top:9px;
}
.topup-inventory-actions button{ padding:8px 11px; border-radius:10px; }
.topup-preload-main{ background:var(--accent); color:#fff; border-color:transparent; }
.topup-preload-main:hover{ background:var(--accent-700); color:#fff; border-color:transparent; }
.topup-cache-stat{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:#fff;
  border:1px solid var(--line-strong);
  color:var(--muted);
  border-radius:999px;
  padding:5px 10px;
  font-size:12px;
  font-weight:700;
}
.topup-cache-stat.good{ color:var(--accent-700); background:var(--good-bg); border-color:var(--good-bd); }
.topup-preload-progress{
  margin-top:8px;
  padding:9px 11px;
  background:var(--primary-50);
  border:1px solid var(--primary-100);
  border-radius:10px;
  color:#33406b;
  font-size:12.5px;
  line-height:1.45;
}
.topup-preload-progress.error{
  background:var(--bad-bg);
  border-color:var(--bad-bd);
  color:var(--bad);
}

.topup-default-note{
  margin-top:8px;
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
}
.topup-patterns{
  margin-top:10px;
  display:grid;
  gap:6px;
  background:#fff;
  border:1px dashed var(--line-strong);
  border-radius:11px;
  padding:10px;
}
.topup-pattern-title{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  letter-spacing:.05em;
  text-transform:uppercase;
}
.topup-pattern-row{
  display:flex;
  gap:8px;
  align-items:flex-start;
  flex-wrap:wrap;
  font-size:12.5px;
  line-height:1.45;
}
.topup-pattern-name{
  flex:0 0 auto;
  font-weight:800;
  color:var(--text);
}
.topup-pattern-value{
  direction:ltr;
  text-align:left;
  color:#33406b;
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  overflow-wrap:anywhere;
}
.topup-quick-list{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:8px 0 12px;
}
.topup-quick-chip{
  border-radius:999px;
  padding:5px 9px;
  background:#fff;
  border:1px solid var(--line-strong);
  color:var(--text);
  font-size:12px;
  font-weight:700;
}
.topup-quick-chip.cached{
  background:var(--good-bg);
  color:var(--accent-700);
  border-color:var(--good-bd);
}
.topup-quick-chip.active{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

@media (max-width:760px){
  .topup-controls{ grid-template-columns:1fr; }
  .topup-line{ grid-template-columns:1fr; }
  .topup-actions{ white-space:normal; }
}

/* ---------- Quick-order: compact inline-price chips ---------- */
/* Gigaboost plans: a ledger — one fixed grid row per plan. Nothing wraps,
   nothing squishes: GB | price | (flex space) | link | copy. */
.plan-orders.grid{ display:flex; flex-direction:column; gap:2px; }
.plan-orders.grid .order-row{
  display:grid;
  grid-template-columns:44px minmax(0,1fr) auto auto;
  align-items:center;
  gap:8px;
  margin-bottom:0;
  background:transparent;
  border:0;
  border-radius:7px;
  padding:3px 8px;
  min-width:0;
  flex:none;
}
.plan-orders.grid .order-row:nth-child(even){ background:rgba(16,19,25,.035); }
.plan-orders.grid .order-row:hover{ background:rgba(47,107,255,.07); }
.order-price{
  direction:ltr; font-weight:800; font-size:12.5px;
  color:var(--accent-700); white-space:nowrap;
  margin-inline-end:0; text-align:start;
}
.plan-orders.grid .oa-open,
.plan-orders.grid .oa-copy{ padding:3px 9px; font-size:11.5px; height:24px; line-height:1; flex:none; justify-self:end; }

/* ---------- Reusable hover tooltip ---------- */
.info-tip{
  display:inline-flex; align-items:center; justify-content:center;
  width:22px; height:22px; border-radius:50%; cursor:help; flex:none;
  background:var(--surface-2); border:1px solid var(--line-strong);
  color:var(--muted); font-size:12px; font-weight:800; position:relative;
}
.info-tip:hover{ background:#fff; color:var(--primary-700); border-color:var(--primary); }
.info-tip:hover::after{
  content:attr(data-tip);
  position:absolute; top:calc(100% + 8px); right:0;
  z-index:300; width:max-content; max-width:300px;
  background:#1b1f2a; color:#fff; font-weight:500; font-size:12px; line-height:1.55;
  padding:9px 12px; border-radius:10px; white-space:pre-line; text-align:right;
  box-shadow:var(--shadow-lg); pointer-events:none;
}

/* ---------- Topup rows: horizontal grid (was one-per-row) ---------- */
/* Topup packages: fixed geometry for muscle memory.
   Two fixed columns (no auto-fill re-wrapping), rows sorted by GB, and every
   row is the same grid: text | deal-slot(fixed) | link | copy | qty | set. */
.topup-lines-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:2px 18px;
}
.topup-line{
  display:grid;
  grid-template-columns:minmax(0,1fr) 118px 26px 26px 42px auto;
  align-items:center;
  gap:6px;
  border:0; border-radius:8px; background:transparent;
  margin-inline:0; padding:3px 9px; font-size:12.5px;
  min-height:30px;
}
.topup-lines-grid .topup-line:nth-child(4n+1),
.topup-lines-grid .topup-line:nth-child(4n+2){ background:rgba(16,19,25,.035); }
.topup-lines-grid .topup-line:hover{ background:rgba(59,63,216,.07); }
.topup-line-text{
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  font-weight:700; min-width:0;
}
.tl-deal{
  display:inline-flex; align-items:center; justify-content:flex-end; gap:3px;
  min-width:0; overflow:hidden;
}
.tl-deal-label{
  font-size:10.5px; font-weight:800; color:var(--accent-700);
  background:var(--good-bg); border:1px solid var(--good-bd);
  border-radius:999px; padding:1px 7px; white-space:nowrap;
}
.topup-line .lk-open,
.topup-line .lk-copy{ height:24px; min-width:26px; padding:2px 6px; font-size:11px; line-height:1; }
.topup-line .lk-set{ height:24px; padding:2px 10px; font-size:11.5px; line-height:1; }
.topup-line .lk-open:disabled,
.topup-line .lk-copy:disabled{ opacity:.25; cursor:default; }
.tl-qty{
  width:42px; height:24px; padding:2px 4px; font-size:11.5px;
  text-align:center; border:1px solid var(--line-strong); border-radius:8px;
  background:#fff; font-variant-numeric:tabular-nums;
}
.tl-qty:focus{ outline:none; border-color:var(--primary); }
/* Missing plan slots: same geometry, unmistakably red */
.topup-line.is-missing{
  background:var(--bad-bg) !important;
  border:1px dashed var(--bad-bd);
}
.topup-line.is-missing .topup-line-text{ color:var(--bad); font-weight:800; }
.tl-missing-pad{ grid-column:3 / -1; }
.topup-products-titlebar{ margin-bottom:6px; }
@media (max-width:1150px){
  .topup-lines-grid{ grid-template-columns:1fr; }
  .topup-lines-grid .topup-line:nth-child(4n+1),
  .topup-lines-grid .topup-line:nth-child(4n+2){ background:transparent; }
  .topup-lines-grid .topup-line:nth-child(odd){ background:rgba(16,19,25,.035); }
}

/* ---------- Responsive ---------- */
@media (max-width:850px){
  .global-clean-grid{ grid-template-columns:1fr; }
}
@media (max-width:600px){
  body{ padding:16px 12px 48px; }
  .brand-mark{ width:50px; height:50px; font-size:26px; border-radius:15px; }
    .global-line{ grid-template-columns:1fr; gap:6px; }
  .global-links{ justify-content:flex-start; }
  .custom-row{ flex-direction:column; }
    .plan-orders{ min-width:0; width:100%; }
}

@media (prefers-reduced-motion:reduce){
  *{ animation:none !important; transition:none !important; }
}
/* ===== v4 density layer ===== */

/* Gigaboost generic chooser strip */
.chooser-strip{
  grid-column:1 / -1;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:8px 12px;
}
.chooser-label{ font-size:13px; font-weight:700; }
.chooser-actions{ display:inline-flex; gap:6px; }
.chooser-actions .oa-open,
.chooser-actions .oa-copy{ height:26px; padding:3px 12px; font-size:12px; }

/* Tabs */
.tabs{
  flex:0 0 auto;
  display:flex; align-items:center; gap:6px;
  padding:7px 14px 0;
  background:var(--bg);
  border-bottom:1px solid var(--line-strong);
}
.tab-btn{
  display:inline-flex; align-items:center; gap:7px;
  padding:7px 16px 8px;
  border:1px solid transparent; border-bottom:0;
  border-radius:10px 10px 0 0;
  background:transparent; color:var(--muted);
  font-family:'Assistant'; font-size:13px; font-weight:700; cursor:pointer;
  margin-bottom:-1px;
  transition:color .12s, background .12s;
}
.tab-btn:hover{ color:var(--text); background:rgba(16,19,25,.04); }
.tab-btn.is-active{
  background:var(--surface); color:var(--text);
  border-color:var(--line-strong);
  border-bottom:1px solid var(--surface);
}
.tab-btn kbd{
  font-family:inherit; font-size:10px; font-weight:800;
  background:rgba(16,19,25,.08); color:var(--muted);
  border-radius:5px; padding:1px 5px; line-height:1.4;
}
.tab-btn.is-active kbd{ background:var(--primary); color:#fff; }

/* בסיסי rows: compact the pill controls that made rows chonky */
.global-line-text{ font-size:12.5px; gap:5px; }
.global-line .link-group,
.global-line .number-order-group{ padding:1px 3px 1px 6px; gap:3px; }
.global-line .link-label{ font-size:10.5px; }
.global-line .lk-open,
.global-line .lk-copy,
.global-line .lk-set{ height:23px; min-width:0; padding:2px 8px; font-size:11.5px; line-height:1; }
.global-line .number-order-group input{ width:38px; height:23px; padding:2px 4px; font-size:11.5px; }
.price-badge{ font-size:10.5px; padding:2px 7px; }
.global-line .info-tip{ width:18px; height:18px; font-size:10.5px; }
.global-lines{ gap:1px; }

/* The generic input:focus rule flips backgrounds to white — inside the dark
   topbar that made typed text (near-white) invisible. Keep them dark. */
.tb-search input:focus{
  background:var(--ink-2); color:#e8ecf4;
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(47,107,255,.28);
}
.tb-options .opt-qty input:focus{
  background:var(--ink); color:#e8ecf4;
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(47,107,255,.28);
}

/* Batch ICCID mode */
.topup-batch-toggle{
  flex:0 0 auto; padding:9px 12px; border-radius:11px; cursor:pointer;
  background:#fff; border:1px solid var(--line-strong); color:var(--text);
  font-size:12px; font-weight:700; font-family:inherit; white-space:nowrap;
}
.topup-batch-toggle.is-on{ background:var(--primary); color:#fff; border-color:var(--primary); }
.topup-batch-area{
  width:100%; box-sizing:border-box; margin-bottom:12px;
  direction:ltr; text-align:left; font-variant-numeric:tabular-nums;
  background:#fff; border:1px solid var(--line-strong); border-radius:11px;
  padding:9px 12px; font-size:13px; font-family:inherit; resize:vertical; min-height:64px;
}
.topup-batch-area:focus{ outline:none; border-color:var(--primary); }

/* Quote template editor modal */
.quote-modal{
  position:fixed; inset:0; z-index:900; display:none;
  align-items:center; justify-content:center;
  background:rgba(16,19,25,.55);
}
.quote-modal.open{ display:flex; }
.quote-modal-card{
  width:520px; max-width:92vw; background:#fff; border-radius:14px;
  box-shadow:0 24px 60px rgba(16,19,25,.35); overflow:hidden;
  display:flex; flex-direction:column;
}
.quote-modal-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 14px; background:var(--ink); color:#fff;
  font-family:'Suez One',serif; font-size:15px;
}
.quote-modal-legend{
  padding:9px 14px; font-size:12px; color:var(--muted);
  border-bottom:1px solid var(--line);
}
.quote-modal-legend code{
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:6px; padding:1px 6px; font-size:11.5px; direction:ltr; display:inline-block;
}
#quoteTemplateArea{
  border:0; outline:none; resize:vertical; min-height:170px;
  padding:12px 14px; font-family:inherit; font-size:13.5px; line-height:1.6;
}
.quote-modal-actions{
  display:flex; gap:8px; justify-content:flex-end;
  padding:10px 14px; border-top:1px solid var(--line); background:var(--surface-2);
}
.quote-modal-actions button{
  padding:7px 16px; border-radius:9px; cursor:pointer; font-family:inherit;
  font-size:13px; font-weight:700; border:1px solid var(--line-strong); background:#fff; color:var(--text);
}
.quote-modal-actions .quote-save{ background:var(--accent); color:#fff; border-color:transparent; }

/* Price-change banner */
.price-changes-banner{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:#fff7e0; border:1px solid #f0dfa8; color:#7a5c10;
  border-radius:10px; padding:7px 11px; margin-bottom:10px;
  font-size:12.5px; font-weight:700;
}
.price-changes-banner button{
  background:transparent; border:0; color:#7a5c10; cursor:pointer;
  font-size:13px; padding:2px 6px; border-radius:6px;
}
.price-changes-banner button:hover{ background:rgba(122,92,16,.12); }

/* Topbar פישוט button: explicit colors for both states.
   (Base .opt-btn.is-on set a light mint background that combined with the
   topbar's white text → unreadable white-on-light.) */
.tb-options .opt-btn.is-on{ background:var(--primary); color:#fff; border-color:var(--primary); }
.tb-options .opt-btn.is-on:hover{ background:var(--primary-700); color:#fff; border-color:var(--primary-700); transform:none; }
.tb-options .opt-btn.is-off{ background:var(--ink-2); color:#c6cdda; border-color:var(--ink-line); }
.tb-options .opt-btn.is-off:hover{ background:#232a38; color:#fff; border-color:var(--ink-line); transform:none; }

/* Reference pricing editor */
.ref-editor{
  display:flex; flex-direction:column; gap:6px;
  background:var(--surface-2); border:1px dashed var(--line-strong);
  border-radius:9px; padding:8px 9px; margin-bottom:7px;
}
.ref-edit-row{ display:flex; align-items:center; gap:8px; }
.ref-edit-row label{
  display:inline-flex; align-items:center; gap:4px;
  font-size:12px; font-weight:800; color:var(--muted);
}
.ref-edit-row input{
  width:74px; padding:5px 7px; border-radius:8px;
  border:1px solid var(--line-strong); background:#fff;
  font-size:12.5px; font-family:inherit; direction:ltr; text-align:left;
  font-variant-numeric:tabular-nums;
}
.ref-edit-row input:focus{ outline:none; border-color:var(--primary); }
.ref-edit-del{
  margin-inline-start:auto; padding:3px 8px; border-radius:999px;
  background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad-bd);
  cursor:pointer; font-size:11px;
}
.ref-edit-actions{ display:flex; gap:6px; padding-top:2px; }
.ref-edit-actions button{
  font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:8px;
  border:1px solid var(--line-strong); background:#fff; color:var(--text); cursor:pointer;
}
.ref-edit-actions .ref-edit-done{ background:var(--accent); color:#fff; border-color:transparent; margin-inline-start:auto; }

/* Topbar chips: compact pills */
.tb-chips .chip{
  padding-block:3px; padding-inline-start:9px; padding-inline-end:4px;
  font-size:11.5px; gap:6px;
}
.tb-chips .chip span{ width:15px; height:15px; font-size:10px; }
.tb-chips .clear-countries-btn{ flex:0 0 auto; }

/* Reference strip: the four sparse cards become one compact 4-up band */
.ref-strip{
  grid-column:1 / -1;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
  gap:8px;
}
.ref-strip .block{ padding:9px 11px; }
.ref-strip .block h3{ font-size:12.5px; margin-bottom:4px; }
.ref-strip pre{ font-size:11.5px; line-height:1.45; padding:7px 9px; margin-top:4px; }
.ref-strip .block-tools{ margin-bottom:4px; padding-bottom:4px; }

/* Dense table-style price rows: zebra instead of per-row borders */
.global-line{
  border:0 !important;
  border-radius:7px;
  padding:2px 8px;
  min-height:26px;
}
.global-lines .global-line:nth-child(even){ background:rgba(16,19,25,.033); }
.global-line:hover{ background:rgba(47,107,255,.07) !important; }
.global-line.is-cheaper{ background:rgba(14,163,113,.09); }
.global-line.is-cheaper:nth-child(even){ background:rgba(14,163,113,.12); }

/* Cards: tighter chrome, Suez One section identity */
.block{ padding:9px 11px; border-radius:12px; }
.block h3, .global-clean-head h3{ font-family:'Suez One',serif; font-weight:400; letter-spacing:.01em; }
.global-clean-card{ padding:10px 12px; }
.global-clean-head{ padding-bottom:7px; margin-bottom:8px; }
.results-grid{ gap:8px; }

/* Gigaboost ledger + topup ledger sizing lives in the component section above. */
.order-gb{ min-width:40px; font-size:12px; }

/* Cart drawer internals inherit the old rail styles */
.cart-drawer .order-builder-card{ padding:0; background:transparent; border:0; box-shadow:none; }

/* Keyboard focus visibility on dark topbar */
.topbar :focus-visible{ outline:2px solid var(--primary); outline-offset:1px; }

@media (prefers-reduced-motion: reduce){
  .cart-drawer{ transition:none; }
  .cart-fab{ transition:none; }
}

/* Narrow screens: options collapse under the bar */
@media (max-width:1100px){
  .topbar{ flex-wrap:wrap; height:auto; padding:8px 12px; row-gap:8px; }
  .tb-search{ flex:1 1 200px; }
  .tb-chips{ order:4; flex-basis:100%; }
}
</style>
</head>

<body>

<!-- ═════════════════════════════════════════════════════════════════════
  SHELL HTML — the static skeleton.
  Everything dynamic is rendered by the main script into #results (the
  active tab's content) and #cart (the drawer's contents). The elements
  below are the only ones that exist before the first render.
  ═════════════════════════════════════════════════════════════════════ -->

<!-- Full-screen loading overlay, shown until the initial API fetches in
     the boot sequence finish (or fail — failures repurpose this element
     as the error card). -->
<div id="loading">
  <div class="loading-inner">
    <span class="spinner"></span>
    <span>טוען נתונים…</span>
  </div>
</div>

<div class="app">

  <!-- ░░ TOP BAR · brand / country search / selected chips / options ░░
       48px ink-dark bar. Every input inside it carries explicit dark
       colors INCLUDING :focus states (see the CSS layering banner). -->
  <header class="topbar">
    <div class="brand">
      <span class="sim-chip" aria-hidden="true"></span>
      <span class="brand-name">מחשבון גיגה</span>
    </div>

    <!-- Country search with a suggestions dropdown. The input listener
         lives in the main script (EVENT WIRING section); Enter picks the
         first suggestion. -->
    <div class="tb-search">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="search" placeholder="חפש מדינה / ISO" autocomplete="off">
        <div class="suggestions" id="suggestions"></div>
      </div>
    </div>

    <!-- Selected-country chips strip: scrolls horizontally, never wraps
         the bar. renderSelected() fills #selected; the clear-all button
         is toggled visible whenever at least one country is selected. -->
    <div class="tb-chips">
      <div class="chips" id="selected"></div>
      <button id="clearCountriesBtn" class="clear-countries-btn" onclick="clearAllCountries()" title="נקה את כל המדינות שנבחרו">✕ נקה</button>
    </div>

    <!-- Options cluster: cart behavior + pricing knobs.
           רוקן עגלה  — appends empty_cart=true to checkout links
           כמות       — quantity for the base ("יחיד") checkout link
           $          — custom USD amount (Enter recomputes the copy tab)
           ₪/$        — editable USD→ILS rate; affects ALL eSIM prices
           פישוט      — master simplify toggle across every card
           JSON       — full old-API + manual-site export download    -->
    <div class="tb-options">
      <label class="opt-switch" title="הוסף empty_cart=true לקישור — מרוקן את העגלה לפני ההוספה">
        <input type="checkbox" id="emptyCartToggle" checked onchange="setEmptyCart(this.checked)">
        <span class="sw" aria-hidden="true"></span>
        <span>רוקן עגלה</span>
      </label>
      <label class="opt-qty" title="כמות עבור הקישור 'יחיד'">
        <span>כמות</span>
        <input type="number" id="cartQty" min="1" step="1" value="1"
               onchange="setCartQuantity(this.value)" oninput="setCartQuantity(this.value)">
      </label>
      <label class="opt-qty" title="סכום מותאם אישית בדולר — Enter לחישוב">
        <span>$</span>
        <input id="customAmount" type="number" step="0.01" placeholder="סכום"
               onkeydown="if(event.key==='Enter'){renderAll()}">
      </label>
      <label class="opt-qty" title="שער המרה דולר→שקל — משפיע על כל מחירי ה-eSIM">
        <span>₪/$</span>
        <input type="number" id="usdRate" min="0.1" step="0.01" value="3.3"
               onchange="setUsdRate(this.value)">
      </label>
      <button id="masterSimplifyBtn" class="opt-btn is-on" onclick="toggleAllSimplify()">פישוט</button>
      <button class="json-btn" onclick="downloadAllJSON()" title="הורד הכל כ‑JSON">📥 JSON</button>
    </div>
  </header>

  <!-- Status line under the top bar (export/preload progress messages).
       Collapses to nothing when empty — see .topbar-status:empty CSS. -->
  <div id="exportStatus" class="status topbar-status"></div>

  <!-- ░░ TABS ░░
       Keyboard shortcuts: digits 1–4 (ignored while typing in a field).
       data-tab must match an entry in TAB_IDS in the main script; adding
       a tab means extending TAB_IDS + adding a renderAll branch too. -->
  <nav class="tabs" id="tabsNav">
    <button class="tab-btn" data-tab="basic" onclick="setActiveTab('basic')">תוכניות בסיסי <kbd>1</kbd></button>
    <button class="tab-btn" data-tab="gigaboost" onclick="setActiveTab('gigaboost')">גיגהבוסט <kbd>2</kbd></button>
    <button class="tab-btn" data-tab="copy" onclick="setActiveTab('copy')">העתקות <kbd>3</kbd></button>
    <button class="tab-btn" data-tab="topup" onclick="setActiveTab('topup')">טופאפ <kbd>4</kbd></button>
  </nav>

  <!-- ░░ CONTENT ░░ — renderAll() rebuilds #results on every state
       change (full re-render model; only the ACTIVE tab is built). -->
  <main class="content">
    <div id="results"></div>
  </main>

</div>

<!-- ░░ CART · floating chip + right-edge drawer ░░
     The FAB badge (#cartFabCount) is kept in sync by __updateCartFab()
     from the shell script below. The drawer slides in from the RIGHT
     (physical positioning — [dir] selectors don't match here). -->
<button id="cartFab" class="cart-fab" onclick="toggleCartDrawer()" title="ההזמנה שלך">

<script>
/** Returns the markup for an empty cart drawer. Used by renderAll() when

/** Opens/closes the cart drawer.
 *  @param {boolean} [force] - true = open, false = close; omit to toggle. */
window.toggleCartDrawer = function(force){
  const d = document.getElementById("cartDrawer");
  const open = typeof force === "boolean" ? force : !d.classList.contains("open");
  d.classList.toggle("open", open);
  d.setAttribute("aria-hidden", String(!open));
};

/** Syncs the floating cart FAB badge with the order builder's item count.
 *  Uses a typeof guard because this can run before the main script has
 *  declared orderBuilderItems. */
window.__updateCartFab = function(){
  const el = document.getElementById("cartFabCount");
  const fab = document.getElementById("cartFab");
  if (!el || !fab) return;
  const n = (typeof orderBuilderItems !== "undefined" && orderBuilderItems) ? orderBuilderItems.length : 0;
  el.textContent = String(n);
  fab.classList.toggle("has-items", n > 0);
};
</script>

 *    error            — user-facing error line for the topup panel
 *    result           — the catalog currently shown (kept in sync with
 *                       catalogResult)
 *    auto mode: autoModeReady, simVersion, customerIccid, batchMode,
 *    batchRaw, batchIccids, catalogCache (profile+zone → catalog),
 *    catalogResult, autoPreloadStarted, autoPreloading, autoPreloadDone,
 *    autoPreloadMessage, autoPreloadErrors, autoEnsureRunning */
let topupState = {
  iccid: "",
  loading: false,
  preloading: false,
  preloadDone: 0,
  preloadTotal: 0,
  preloadErrors: 0,
  preloadMessage: "",
  preloadErrorList: [],
  error: "",
  result: null
};

/** The WhatsApp quote template (persisted per browser). Restored from
 *  localStorage right away so the first quote uses the saved template. */
let quoteTemplate = DEFAULT_QUOTE_TEMPLATE;
try {
  const savedTpl = localStorage.getItem(QUOTE_TEMPLATE_KEY);
  if (savedTpl && savedTpl.trim()) quoteTemplate = savedTpl;
} catch (e) {}


/* ═══════════════════════════════════════════════════════════════════════
   § 3. GENERIC HELPERS
   Small utilities with no business knowledge.
   ═══════════════════════════════════════════════════════════════════════ */

/** Rounds to 2 decimal places (0.1 + 0.2 → 0.3, not 0.30000000000000004). */
function round2(n) {
  return Number(Number(n).toFixed(2));
}

/** Promise that resolves after `ms` milliseconds. General-purpose pacing
 *  (currently used to space out concurrent API workers). */
function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

/** Same as sleep(), but DELIBERATELY a separate function: the order
 *  runner's pacing goes through this so the smoke-test harness can stub
 *  it (and only it) to fast-forward multi-item orders. Do not merge the
 *  two or the async runner test breaks. */
function sleepOrder(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

/** Runs `worker(item, index)` for every item at once (no concurrency
 *  limit). Used where the endpoint tolerates a full burst. */
async function mapAllAtOnce(items, worker) {
  return Promise.all(items.map((item, index) => worker(item, index)));
}

/** Runs `worker(item, index)` over `items` with at most `limit` workers
 *  in flight, each worker pausing 120ms between items — polite pacing
 *  for the manual site's AJAX endpoint. Results keep input order. */
async function mapWithConcurrency(items, limit, worker) {
  const results = new Array(items.length);
  let index = 0;

  async function runWorker() {
    while (index < items.length) {
      const current = index++;
      results[current] = await worker(items[current], current);
      await sleep(120);
    }
  }

  await Promise.all(
    Array.from({ length: Math.min(limit, items.length) }, runWorker)
  );

  return results;
}

/** HTML-escapes a value for safe interpolation into template-string
 *  markup and attributes. Part of the mandatory inline-handler pattern:
 *  onclick='fn(${escapeHtml(JSON.stringify(value))})'. */
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/** Triggers a browser download of `object` as pretty-printed JSON. */
function downloadJSON(filename, object) {
  const jsonString = JSON.stringify(object, null, 2);
  const blob = new Blob([jsonString], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/** Shows `text` in the status line under the top bar; empty/falsy text
 *  hides the line (the CSS collapses an empty status element). */
function setExportStatus(text) {
  const el = document.getElementById("exportStatus");
  el.style.display = text ? "block" : "none";
  el.textContent = text || "";
}

/* ---- Clipboard ------------------------------------------------------------
   navigator.clipboard only exists in a secure context (https/localhost).
   This file is normally run from file://, where it is undefined — so
   there is a hidden-textarea + execCommand("copy") fallback. DO NOT
   replace this with clipboard-API-only code. */

/** Legacy copy path for file:// — hidden textarea + execCommand. */
function fallbackCopyText(text) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-9999px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    document.execCommand("copy");
    document.body.removeChild(ta);
    return true;
  } catch (e) { return false; }
}

/** Copies `text` to the clipboard (modern API when available, fallback
 *  otherwise) and confirms with a toast. This is THE copy entry point —
 *  every 📋 button funnels here. */
function copyText(text) {
  text = String(text == null ? "" : text);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      .then(() => showCopyToast())
      .catch(() => showCopyToast(fallbackCopyText(text) ? null : "ההעתקה נכשלה"));
  } else {
    showCopyToast(fallbackCopyText(text) ? null : "ההעתקה נכשלה");
  }
}

/** Timer handle for the copy toast's auto-hide. */
let __copyToastTimer = null;

/** Shows a small bottom-center toast (default: "copied" confirmation).
 *  The toast element is created lazily on first use and reused after. */
function showCopyToast(msg) {
  let t = document.getElementById("copyToast");
  if (!t) {
    t = document.createElement("div");
    t.id = "copyToast";
    t.style.cssText = "position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#1b1f2a;color:#fff;padding:10px 18px;border-radius:999px;font-family:'Assistant',sans-serif;font-weight:700;font-size:13px;z-index:9999;opacity:0;transition:all .25s ease;box-shadow:0 12px 32px rgba(0,0,0,.28);pointer-events:none;";
    document.body.appendChild(t);
  }
  t.textContent = msg || "✓ הועתק ללוח";
  requestAnimationFrame(() => { t.style.opacity = "1"; t.style.transform = "translateX(-50%) translateY(0)"; });
  clearTimeout(__copyToastTimer);
  __copyToastTimer = setTimeout(() => {
    t.style.opacity = "0";
    t.style.transform = "translateX(-50%) translateY(20px)";
  }, 1400);
}

/** Copies the price text (<pre>) of the card containing `btn`.
 *  The <pre> lives at the .block level, NOT inside the button's immediate
 *  parent (.block-actions) — so search the whole card via closest(). If a
 *  new card layout breaks this lookup, copy buttons silently die; the
 *  triage recipe is to verify closest(".block") still finds the <pre>. */
function copySection(btn) {
  const root = btn.closest(".block") || btn.parentElement || document;
  const pre = root.querySelector("pre");
  if (pre) copyText(pre.textContent);
  else showCopyToast("אין מה להעתיק");
}


/* ═══════════════════════════════════════════════════════════════════════
   § 4. PRICING MATH & SIMPLIFY
   The credit→GB arithmetic behind the reference cards, and the "פישוט"
   (simplify) display mode that rounds values / trims odd package sizes
   for customer-facing copy.
   ═══════════════════════════════════════════════════════════════════════ */

/** How many GB `amount` USD of credit buys at `price` USD-per-GB. */
function gb(amount, price) {
  return amount / price;
}

/** Simplifies a GB value for customer-facing display:
 *  values within 0.05 of a whole number snap to it; everything else is
 *  floored to the nearest half. (7.97 → 8, 7.6 → 7.5) */
function applySimplify(value) {
  const nearestInt = Math.round(value);

  if (Math.abs(value - nearestInt) < 0.05) {
    return nearestInt;
  }

  return Math.floor(value * 2) / 2;
}

/** Is simplify ON for this card key? Anything except an explicit false
 *  counts as on — that makes ON the default for never-touched cards. */
function isSimplified(key) {
  return simplifyState[key] !== false;
}

/** Flips one card's simplify state and re-renders. */
function toggleSimplify(key) {
  simplifyState[key] = !isSimplified(key);
  renderAll();
}

/** Markup for the per-card simplify on/off switch. */
function simplifyToggle(key) {
  const on = isSimplified(key);
  const tip = on
    ? "פישוט פעיל — לחץ כדי להציג את כל החבילות / הספרות המלאות"
    : "פישוט כבוי — מוצגות כל החבילות והערכים המלאים";
  return `
    <button class="simplify-btn ${on ? 'is-on' : 'is-off'}"
            onclick="toggleSimplify('${key}')"
            aria-pressed="${on}"
            title="${tip}">
      <span class="sw" aria-hidden="true"></span>פישוט ${on ? '· פעיל' : '· כבוי'}
    </button>
  `;
}

/** Every simplify key that exists right now: the fixed card keys plus
 *  one dynamic 'global_<zone>' key per selected zone. The master toggle
 *  operates on exactly this set. */
function allSimplifyKeys() {
  const keys = ['esimPlans', 'physicalPlans', 'physicalCredit', 'wallet', 'custom', 'topup'];
  [...new Set(selected.map(c => c.zone))].forEach(z => keys.push('global_' + z));
  return keys;
}

/** True if at least one card is currently simplified. */
function anySimplified() {
  return allSimplifyKeys().some(isSimplified);
}

/** Forces every card's simplify state to `on` and re-renders. */
function setAllSimplify(on) {
  allSimplifyKeys().forEach(k => { simplifyState[k] = on; });
  renderAll();
}

/** Master toggle (the top-bar פישוט button): if ANYTHING is still
 *  simplified, turn everything OFF; otherwise turn everything ON. */
function toggleAllSimplify() {
  setAllSimplify(!anySimplified());
}

/** Syncs the top-bar master simplify button's label/colors with state.
 *  Called at the end of every renderAll. */
function updateMasterSimplifyLabel() {
  const btn = document.getElementById('masterSimplifyBtn');
  if (!btn) return;
  const on = anySimplified();
  btn.textContent = on ? 'פישוט: פעיל' : 'פישוט: כבוי';
  btn.title = on ? 'כבה פישוט בכל הכרטיסים' : 'הפעל פישוט בכל הכרטיסים';
  btn.classList.toggle('is-on', on);
  btn.classList.toggle('is-off', !on);
}


/* ═══════════════════════════════════════════════════════════════════════
   § 5. REGIONS & ZONES
   Region grouping for client-facing country lists, and the highest-zone
   selection rules (business rule #4 lives on these helpers).
   ═══════════════════════════════════════════════════════════════════════ */

/** Region name for an ISO code ("אחר" when unmapped). */
function regionOfIso(iso) { return ISO_REGION[iso] || "אחר"; }

/** Groups countries by region → client-ready text block, one line per
 *  region in REGION_ORDER, names Hebrew-sorted within each region. */
function formatCountriesByRegion(countries) {
  const byRegion = {};
  for (const c of countries) (byRegion[regionOfIso(c.iso)] ||= []).push(c.name.he);
  const lines = [];
  for (const region of REGION_ORDER) {
    const names = byRegion[region];
    if (!names || !names.length) continue;
    lines.push(`${region}: ${names.sort((a, b) => a.localeCompare(b, "he")).join(", ")}`);
  }
  return lines.join("\n");
}

/** All countries whose zone OF THE GIVEN SIM TYPE equals `zone`.
 *  simType: "esim" | "physical" | anything else = the general zone. */
function countriesForTypeZone(simType, zone) {
  const field = simType === "esim" ? "esimZone" : simType === "physical" ? "physicalZone" : "zone";
  return data.filter(c => Number(c[field] ?? c.zone) === Number(zone));
}

/** Client-facing copy: the full country list of a zone (for one SIM
 *  type), grouped by region, with a destination count header. */
function copyZoneCountriesForType(simType, zone) {
  const countries = countriesForTypeZone(simType, zone);
  if (!countries.length) { alert("לא נמצאו מדינות באזור הזה"); return; }
  const text = `✈️ ${countries.length} יעדים בחבילה (אזור ${zone}):\n\n${formatCountriesByRegion(countries)}`;
  copyText(text);
}

/** Same, for the general zone (used by the בסיסי card's copy button). */
function copyZoneCountries(zone) {
  copyZoneCountriesForType("general", zone);
}

/* ---- Highest-zone filtering ------------------------------------------------
   When countries from different zones are selected, a plan must cover
   ALL of them, so it is priced at the highest zone among them. We
   therefore only DISPLAY prices for that highest zone. */

/** The highest GENERAL zone among the selection (null when empty). */
function getHighestZone() {
  if (!selected.length) return null;
  return Math.max(...selected.map(c => c.zone));
}

/** The selected countries that belong to the highest general zone —
 *  the ones actually driving displayed prices. */
function getActiveSelected() {
  const highestZone = getHighestZone();
  if (highestZone === null) return [];
  return selected.filter(c => c.zone === highestZone);
}

/** True when the selection spans more than one general zone (drives the
 *  explanatory zone note on the basic/gigaboost tabs). */
function hasMixedZones() {
  return new Set(selected.map(c => c.zone)).size > 1;
}


/* ═══════════════════════════════════════════════════════════════════════
   § 6. SESSION PERSISTENCE
   Everything you'd expect to survive a close/reopen: selected countries,
   active tab, cart lines, toggles, quantities, simplify states, batch
   mode. Written at the end of EVERY renderAll; restored once at boot.
   ═══════════════════════════════════════════════════════════════════════ */

/** Serializes the session to localStorage. No-op while a restore is in
 *  progress (the renders a restore triggers must not overwrite the very
 *  session being read). */
function persistSession() {
  if (sessionRestoring) return;
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      selectedIsos: selected.map(c => c.iso),
      activeTab,
      cartSettings,
      simplifyState,
      orderBuilderItems,
      batchMode: !!(topupState && topupState.batchMode),
      batchRaw: (topupState && topupState.batchRaw) || ""
    }));
  } catch (e) {}
}

/** Restores the saved session (if any). Called from boot AFTER the
 *  country model is built, because selected ISOs are resolved against
 *  `data`. Unknown tabs / ISOs are silently dropped. */
function restoreSession() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (e) {}
  if (!saved) return;
  sessionRestoring = true;
  try {
    if (TAB_IDS.includes(saved.activeTab)) activeTab = saved.activeTab;
    if (saved.cartSettings && typeof saved.cartSettings === "object") {
      cartSettings = { ...cartSettings, ...saved.cartSettings };
      // Reflect restored settings into the static top-bar inputs.
      const cb = document.getElementById("emptyCartToggle");
      if (cb) cb.checked = !!cartSettings.emptyCart;
      const q = document.getElementById("cartQty");
      if (q) q.value = cartSettings.quantity;
    }
    if (saved.simplifyState && typeof saved.simplifyState === "object") {
      simplifyState = saved.simplifyState;
    }
    if (Array.isArray(saved.orderBuilderItems)) {
      orderBuilderItems = saved.orderBuilderItems;
    }
    ensureAutoTopupState();
    topupState.batchMode = !!saved.batchMode;
    topupState.batchRaw = String(saved.batchRaw || "");
    if (topupState.batchRaw) setTopupBatchIccids(topupState.batchRaw);
    if (Array.isArray(saved.selectedIsos) && saved.selectedIsos.length) {
      selected = saved.selectedIsos
        .map(iso => data.find(c => c.iso === iso))
        .filter(Boolean);
      renderSelected();
      // Kick off manual-site fetches for the restored selection.
      selected.forEach(c => ensureGlobalCountry(c));
    }
  } finally {
    sessionRestoring = false;
  }
}


/* ═══════════════════════════════════════════════════════════════════════
   § 7. EDITABLE REFERENCE PRICING
   The $/₪ tiers on the wallet / physical-credit cards can be adjusted at
   runtime via the ✎ editors (e.g. a promo: ₪74 buys $17.5 instead of
   $15). Overrides persist in localStorage and are applied ONTO the
   WALLET/PHYSICAL arrays in place; DEFAULT_WALLET/DEFAULT_PHYSICAL keep
   the shipped values for the reset button.
   ═══════════════════════════════════════════════════════════════════════ */

/** The live tier array for an editor kind ("wallet" | "physical"). */
function refArr(kind) { return kind === "wallet" ? WALLET : PHYSICAL; }

/** Applies persisted tier overrides onto WALLET/PHYSICAL (in place).
 *  Rows that don't parse as finite numbers are dropped; if an override
 *  list ends up empty, the shipped defaults are restored for that kind. */
function loadRefOverrides() {
  try {
    const raw = JSON.parse(localStorage.getItem(REF_STORE_KEY) || "null");
    if (!raw) return;
    for (const kind of ["wallet", "physical"]) {
      if (!Array.isArray(raw[kind])) continue;
      const arr = refArr(kind);
      arr.length = 0;
      raw[kind].forEach(r => {
        const usd = parseFloat(r.usd), ils = parseFloat(r.ils);
        if (Number.isFinite(usd) && Number.isFinite(ils)) arr.push({ usd, ils });
      });
      if (!arr.length) (kind === "wallet" ? DEFAULT_WALLET : DEFAULT_PHYSICAL).forEach(r => arr.push({ ...r }));
    }
  } catch (e) {}
}

/** Persists the CURRENT contents of both tier arrays. */
function saveRefOverrides() {
  try {
    localStorage.setItem(REF_STORE_KEY, JSON.stringify({ wallet: WALLET, physical: PHYSICAL }));
  } catch (e) {}
}

/** Opens/closes the ✎ editor for one card. */
function toggleRefEdit(kind) {
  refEdit[kind] = !refEdit[kind];
  renderAll();
}
