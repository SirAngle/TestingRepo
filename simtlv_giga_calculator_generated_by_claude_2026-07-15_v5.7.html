  topupState.preloadErrorList = [];
  topupState.preloadMessage = `טוען אוטומטית ${jobs.length} קטלוגים חסרים…`;
  topupState.error = "";
  renderAll();

  await mapWithConcurrency(jobs, 3, async job => {
    try {
      const result = await fetchPhysicalCatalogByProbe(job.profile, job.countries, job.key);
      topupState.catalogCache[job.key] = JSON.parse(JSON.stringify(result));
    } catch (err) {
      topupState.preloadErrors++;
      topupState.preloadErrorList.push(`${job.label}: ${String(err.message || err)}`);
    } finally {
      topupState.preloadDone++;
      topupState.preloadMessage = `טוען קטלוגים: ${topupState.preloadDone}/${topupState.preloadTotal}`;
      persistTopupCatalogCache();
      renderAll();
    }
  });

  topupState.preloading = false;
  topupState.preloadMessage = `טעינה אוטומטית ליעד הסתיימה${topupState.preloadErrors ? ` · שגיאות: ${topupState.preloadErrors}` : ""}`;
  topupState.catalogResult = getCurrentTopupCatalog();
  topupState.result = topupState.catalogResult;
  renderAll();
}

/** Scans the V2 catalog for EVERY zone that's missing one (bounded
 *  concurrency). Part of the automatic startup preload. */
async function preloadAllV2Zones(forceRefresh = false) {
  ensureAutoTopupState();
  const reps = getAllZoneRepresentatives();
  const jobs = reps
    .map(rep => ({ ...rep, key: getTopupCatalogKeyForZone("psim_v2", rep.zone) }))
    .filter(job => forceRefresh || !topupState.catalogCache?.[job.key]);

  if (!jobs.length) return { done: reps.length, errors: 0 };

  let done = 0;
  let errors = 0;
  await mapWithConcurrency(jobs, TOPUP_V2_ZONE_PRELOAD_CONCURRENCY, async job => {
    try {
      const result = await fetchPhysicalCatalogByProbe(TOPUP_VERSION_PROFILES.psim_v2, [job.country], job.key);
      topupState.catalogCache[job.key] = JSON.parse(JSON.stringify(result));
    } catch (err) {
      errors++;
      topupState.autoPreloadErrors.push(`V2 אזור ${job.zone}: ${String(err.message || err)}`);
    } finally {
      done++;
      topupState.autoPreloadMessage = `טעינה אוטומטית: V2 לפי אזורים ${done}/${jobs.length}`;
      persistTopupCatalogCache();
      renderAll();
    }
  });
  return { done, errors };
}

/** Scans the single V1 (Germany/Europe) catalog if it's missing. */
async function preloadV1Germany(forceRefresh = false) {
  ensureAutoTopupState();
  const key = "psim_v1|europe:DE";
  if (!forceRefresh && topupState.catalogCache?.[key]) return { done: 1, errors: 0 };
  try {
    const result = await fetchPhysicalCatalogByProbe(TOPUP_VERSION_PROFILES.psim_v1, [getV1GermanyCountry()], key);
    topupState.catalogCache[key] = JSON.parse(JSON.stringify(result));
    persistTopupCatalogCache();
    return { done: 1, errors: 0 };
  } catch (err) {
    topupState.autoPreloadErrors.push(`V1 Germany: ${String(err.message || err)}`);
    return { done: 0, errors: 1 };
  }
}

/** The automatic startup preload (kicked off by boot, once): runs the
 *  manual-site zone preload (V3's source), all V2 zone scans, and the
 *  V1 Germany scan in parallel, then reports readiness per version. */
async function autostartTopupCatalogPreload(forceRefresh = false) {
  ensureAutoTopupState();
  if (!data.length || topupState.autoPreloading) return;
  if (topupState.autoPreloadStarted && !forceRefresh) return;

  topupState.autoPreloadStarted = true;
  topupState.autoPreloading = true;
  topupState.autoPreloadDone = false;
  topupState.autoPreloadErrors = [];
  topupState.autoPreloadMessage = "טוען קטלוג טופאפ…";
  setExportStatus(topupState.autoPreloadMessage);
  renderAll();

  // V3 eSIM: preload the normal manual-site catalog once per zone; V3
  // topup URLs are then built from it (no topup scan of its own).
  const globalPromise = startGlobalPreloadAll(false).catch(err => {
    topupState.autoPreloadErrors.push(`V3/manual: ${String(err.message || err)}`);
  });

  const v2Promise = preloadAllV2Zones(forceRefresh);
  const v1Promise = preloadV1Germany(forceRefresh);

  await Promise.allSettled([globalPromise, v2Promise, v1Promise]);

  topupState.autoPreloading = false;
  topupState.autoPreloadDone = true;
  const zoneTotal = getAllZoneRepresentatives().length;
  const v2Cached = getAllZoneRepresentatives().filter(rep => !!topupState.catalogCache?.[getTopupCatalogKeyForZone("psim_v2", rep.zone)]).length;
  const v1Cached = !!topupState.catalogCache?.["psim_v1|europe:DE"];
  const globalZones = getLoadedZoneCount();
  topupState.autoPreloadMessage = `מוכן: V3 מחירי אתר ${globalZones}/${getTotalZoneCount()} אזורים, V2 ${v2Cached}/${zoneTotal} אזורים, V1 Germany ${v1Cached ? "טעון" : "חסר"}${topupState.autoPreloadErrors.length ? ` · שגיאות: ${topupState.autoPreloadErrors.length}` : ""}`;
  setExportStatus(topupState.autoPreloadMessage);
  persistTopupCatalogCache();
  renderAll();
}

/** Called by renderAll: quietly makes sure the current selection's
 *  catalog is (being) loaded. V3 just needs its zone's manual-site scan;
 *  V1/V2 get a deferred preloadTopupsForSelected (setTimeout breaks the
 *  render → preload → render recursion; autoEnsureRunning stops loops). */
function scheduleAutoEnsureTopupForSelection() {
  ensureAutoTopupState();
  if (!selected.length || topupState.autoEnsureRunning) return;
  const profile = getTopupProfile();
  if (profile.id === "esim_v3") {
    const zone = getSelectedTopupZone();
    if (zone !== null && !firstGlobalCacheForZone(zone)) {
      const rep = getZoneRepresentative(zone);
      if (rep) ensureGlobalCountry(rep);
    }
    return;
  }
  if (!getCurrentTopupCatalog()) {
    topupState.autoEnsureRunning = true;
    setTimeout(() => {
      preloadTopupsForSelected(false).finally(() => { topupState.autoEnsureRunning = false; });
    }, 20);
  }
}

/* ---- Topup checkout links --------------------------------------------------- */

/** Finalizes a topup checkout URL for the CUSTOMER:
 *    * your_iccid ← the customer's ICCID (never the probe's);
 *    * V3: fly_countries/product_zone from the selection, physical-SIM
 *      leftovers stripped;
 *    * V1/V2: country_name_in_region from the selection, and ⚠ V1 gets
 *      fly_countries=REUP here again, belt-and-suspenders with the
 *      rewrite in rewritePhysicalTopupUrlForSelected (V2 fly_countries
 *      was already set to the selected ISOs during that rewrite);
 *    * empty_cart per the toggle; quantity only when > 1.
 *  NOTE deal URLs must be passed qty=1 (business rule #1). */
function buildTopupCheckoutUrl(url, quantityOverride = 1, forceEmptyCart = cartSettings.emptyCart, customerIccidOverride = null) {
  if (!url) return url;
  const qty = parseInt(quantityOverride || 1, 10);
  const customerIccid = normalizeIccid(customerIccidOverride ?? topupState.customerIccid ?? topupState.iccid ?? "");
  const profile = getTopupProfile();

  try {
    const u = new URL(url);
    u.searchParams.set("ref", REFERRAL_CODE);
    if (customerIccid) u.searchParams.set("your_iccid", customerIccid);

    if (profile.id === "esim_v3") {
      const countries = getSelectedTopupCountries();
      const zone = getSelectedTopupZone();
      if (countries.length) u.searchParams.set("fly_countries", countries.map(c => c.iso).sort().join("|"));
      if (zone !== null) u.searchParams.set("product_zone", String(Number(zone)));
      u.searchParams.delete("country_name_in_region");
      u.searchParams.delete("physical_sim_type");
    } else {
      const names = getSelectedTopupCountryNamesForUrl();
      if (names) u.searchParams.set("country_name_in_region", names);
      // ⚠ V1 pSIM topups always use the REUP region code, never a country.
      if (profile.id === "psim_v1") {
        u.searchParams.set("fly_countries", "REUP");
      }
      // (V2 fly_countries is already set to the selected ISOs during URL rewrite.)
    }

    if (forceEmptyCart) u.searchParams.set("empty_cart", "true");
    else u.searchParams.delete("empty_cart");

    if (Number.isFinite(qty) && qty > 1) u.searchParams.set("quantity", String(qty));
    else u.searchParams.delete("quantity");

    return u.toString().replace(/%7C/gi, "|");
  } catch (e) {
    return String(url);
  }
}

/** Gate for customer-facing topup actions: a FULL customer ICCID (18+
 *  digits) must be present. Alerts and returns "" otherwise; on success
 *  also syncs state + storage with the (possibly input-typed) value. */
function requireTopupCustomerIccid() {
  const customerIccid = normalizeIccid(topupState.customerIccid || document.getElementById("topupIccid")?.value || "");
  if (customerIccid.length < 18) {
    alert("הקלד ICCID מלא של הלקוח לפני יצירת קישור או הזמנה.");
    return "";
  }
  topupState.customerIccid = customerIccid;
  topupState.iccid = customerIccid;
  try { localStorage.setItem(TOPUP_CUSTOMER_ICCID_STORAGE_KEY, customerIccid); } catch (e) {}
  return customerIccid;
}

/** 🔗 handler on topup rows: opens the customer link (ICCID required). */
function openTopupCustomerLink(rawUrl, qty = 1) {
  const customerIccid = requireTopupCustomerIccid();
  if (!customerIccid) return;
  window.open(buildTopupCheckoutUrl(rawUrl, qty, cartSettings.emptyCart, customerIccid), "_blank");
}

/** 📋 handler on topup rows: copies the customer link (ICCID required). */
function copyTopupCustomerLink(rawUrl, qty = 1) {
  const customerIccid = requireTopupCustomerIccid();
  if (!customerIccid) return;
  copyText(buildTopupCheckoutUrl(rawUrl, qty, cartSettings.emptyCart, customerIccid));
}

/* ---- Topup rows → order builder ---------------------------------------- */

/** Registers a visible topup row in the (per-render) package registry.
 *  Keys are deterministic: profile + zone/EUROPE + product + size +
 *  validity — so the same plan gets the same key on every render. */
function registerTopupPackage(pkg, result) {
  const profile = getTopupProfile();
  const selectedKey = profile.id === "psim_v1" ? "EUROPE" : String(getSelectedTopupZone() || "zone");
  const key = ["topup", profile.id, selectedKey, pkg.base?.productId || "noid", pkg.dataGB, pkg.validityDays]
    .join("_")
    .replace(/[^a-zA-Z0-9_\-]/g, "_");
  orderPackageRegistry[key] = { simType: "topup", pkg, result };
  return key;
}

/** "קבע" handler for topup rows. In batch mode, ONE click adds a cart
 *  line per pasted ICCID; otherwise the single customer ICCID is used.
 *  ⚠ Business rule #5: cart lines are keyed `${packageKey}::${iccid}`,
 *  so the same package for different cards makes separate lines, while
 *  re-setting the same package+ICCID replaces in place. qty ≤ 0 removes
 *  the lines instead. Lines sort physical → esim → topup, then by ICCID
 *  and size, so multi-card orders read grouped. */
function setTopupOrderQuantity(key) {
  const entry = orderPackageRegistry[key];
  if (!entry) return;

  const batch = topupState.batchMode ? (topupState.batchIccids || []) : null;
  if (topupState.batchMode && (!batch || !batch.length)) {
    alert("הדבק לפחות ICCID אחד תקין (18+ ספרות) בתיבת המרובה.");
    return;
  }
  const iccids = batch && batch.length ? batch : [requireTopupCustomerIccid()].filter(Boolean);
  if (!iccids.length) return;

  const input = document.getElementById(`qty_${key}`);
  const qty = parseInt(input?.value, 10);

  if (!Number.isFinite(qty) || qty <= 0) {
    iccids.forEach(ic => {
      orderBuilderItems = orderBuilderItems.filter(x => x.key !== `${key}::${ic}`);
    });
    renderAll();
    return;
  }

  const { pkg } = entry;
  const variant = chooseOrderVariant(pkg, qty);
  if (!variant.checkoutUrl) {
    alert("אין קישור טופאפ לחבילה הזו");
    return;
  }

  const profile = getTopupProfile();
  iccids.forEach(customerIccid => {
    // Identify the cart line by package + ICCID, so topping up several
    // different cards with the same package adds separate lines.
    const itemKey = `${key}::${customerIccid}`;
    orderBuilderItems = orderBuilderItems.filter(x => x.key !== itemKey);
    const label = `טופאפ ${profile.short} · ${pkg.dataGB}GB / ${pkg.validityDays} ימים · ICCID ${shortIccid(customerIccid)} ×${qty}`;
    orderBuilderItems.push({
      key: itemKey,
      simType: "topup",
      topup: true,
      preserveUrl: true,     // order runner must NOT rewrite this URL as a base-plan URL
      dataGB: pkg.dataGB,
      validityDays: pkg.validityDays,
      qty,
      label,
      checkoutUrl: variant.checkoutUrl,
      productId: variant.productId,
      isBase: variant.isBase,
      isos: [],
      perUnitILS: variant.perUnitILS,
      totalILS: variant.totalILS,
      source: variant.source,
      topupIccid: customerIccid,
      topupProfile: profile.id
    });
  });

  orderBuilderItems.sort((a,b) => {
    const rank = { physical_sim: 1, esim: 2, topup: 3 };
    const ra = rank[a.simType] || 9;
    const rb = rank[b.simType] || 9;
    if (ra !== rb) return ra - rb;
    if ((a.topupIccid || "") !== (b.topupIccid || "")) return String(a.topupIccid || "").localeCompare(String(b.topupIccid || ""));
    return Number(a.dataGB || 0) - Number(b.dataGB || 0);
  });

  renderAll();
}


/* ═══════════════════════════════════════════════════════════════════════
   § 17. QUOTE SYSTEM
   The 💬 button copies a WhatsApp-ready quote rendered from an editable
   template (✎ opens the modal in the shell HTML). Placeholders:
   {country} {esim_plans} {psim_plans} {date}. Template persists per
   browser under QUOTE_TEMPLATE_KEY.
   ═══════════════════════════════════════════════════════════════════════ */

/** Renders the quote text for the current selection, or null when there
 *  is nothing to quote (no selection / no plans). Each SIM type's plan
 *  list is priced at its own highest per-type zone (three-zone model),
 *  lines in the customer copy format (rule #7). */
function buildQuoteText() {
  if (!selected.length) return null;

  const names = selected.map(c => c.name.he).join(", ");

  const esimZone = Math.max(...selected.map(c => c.esimZone ?? c.zone));
  const esimCountry = selected.find(c => (c.esimZone ?? c.zone) === esimZone);
  const esimPlans = esimCountry ? [...esimCountry.plans.esim].sort((a,b)=>a.dataGB-b.dataGB) : [];
  const esimLines = esimPlans.map(p => `${p.dataGB} גיגה – 30 ימים – ₪${Math.round(p.priceUSD * USD_TO_ILS)}`).join("\n");

  const physZone = Math.max(...selected.map(c => c.physicalZone ?? c.zone));
  const physCountry = selected.find(c => (c.physicalZone ?? c.zone) === physZone);
  const physPlans = physCountry ? [...physCountry.plans.physical].sort((a,b)=>a.dataGB-b.dataGB) : [];
  const physLines = physPlans.map(p => `${p.dataGB} גיגה – 30 ימים – ₪${p.priceILS}`).join("\n");

  if (!esimLines && !physLines) return null;

  return quoteTemplate
    .replaceAll("{country}", names)
    .replaceAll("{esim_plans}", esimLines || "—")
    .replaceAll("{psim_plans}", physLines || "—")
    .replaceAll("{date}", new Date().toLocaleDateString("he-IL"));
}

/** 💬 button handler: copies the rendered quote (with guard alerts). */
function copyQuote() {
  if (!selected.length) { alert("בחר מדינה קודם"); return; }
  const text = buildQuoteText();
  if (!text) { alert("אין חבילות זמינות ליעד הזה"); return; }
  copyText(text);
}

/** Opens the template editor modal preloaded with the current template. */
function openQuoteEditor() {
  const modal = document.getElementById("quoteModal");
  const ta = document.getElementById("quoteTemplateArea");
  if (!modal || !ta) return;
  ta.value = quoteTemplate;
  modal.classList.add("open");
}

/** Closes the template editor modal (without saving). */
function closeQuoteEditor() {
  const modal = document.getElementById("quoteModal");
  if (modal) modal.classList.remove("open");
}

/** Saves the edited template (empty text falls back to the default). */
function saveQuoteTemplate() {
  const ta = document.getElementById("quoteTemplateArea");
  if (!ta) return;
  quoteTemplate = ta.value.trim() ? ta.value : DEFAULT_QUOTE_TEMPLATE;
  try { localStorage.setItem(QUOTE_TEMPLATE_KEY, quoteTemplate); } catch (e) {}
  closeQuoteEditor();
  showCopyToast("✓ התבנית נשמרה");
}

/** Resets the template (and the open editor) to the shipped default. */
function resetQuoteTemplate() {
  quoteTemplate = DEFAULT_QUOTE_TEMPLATE;
  const ta = document.getElementById("quoteTemplateArea");
  if (ta) ta.value = quoteTemplate;
  try { localStorage.setItem(QUOTE_TEMPLATE_KEY, quoteTemplate); } catch (e) {}
}


/* ═══════════════════════════════════════════════════════════════════════
   § 18. RENDER FUNCTIONS
   One function per card/panel. All of them return HTML strings that
   renderAll() concatenates into #results. None of them mutate state

   orderPackageRegistry so their qty controls work).

   Reminder: copy buttons embed their full payload in the onclick

/** "קרדיט פיזי" card: for each ₪ tier, how many GB each selected country

function renderPhysical() {
  let text = "";
  const on = isSimplified('physicalCredit');

  PHYSICAL.forEach(p => {
    text += `₪${p.ils}\n`;

    let rows = selected.map(c => {
      let raw = gb(p.usd, c.credit_price_per_gb);
      let val = on ? applySimplify(raw) : raw.toFixed(1);

      return {
        name: c.name.he,
        gb: parseFloat(val)
      };
    });

    rows.sort((a,b)=>b.gb-a.gb);

    rows.forEach(r=>{
      text += `${r.name} = ${r.gb} גיגה\n`;

    text += `\n`;

  return `
    <div class="block">

/** "סכום מותאם" card: how many GB the typed $ amount buys per country.
 *  Renders nothing until the top-bar $ input has a value. */
function renderCustomAmount() {
  const input = document.getElementById("customAmount");

  if (!input.value || !selected.length) return "";

  const usd = parseFloat(input.value);
  if (isNaN(usd)) return "";

  const on = isSimplified('custom');
  let text = `$${usd}\n`;

  let rows = selected.map(c => {
    const raw = usd / c.credit_price_per_gb;
    return {
      name: c.name.he,
      gb: on ? applySimplify(raw) : parseFloat(raw.toFixed(1))
    };
  });

  rows.sort((a,b)=>b.gb-a.gb);

  rows.forEach(r=>{
    text += `${r.name} = ${r.gb} גיגה\n`;
  });

  return `
    <div class="block">
      <div class="block-tools">
        <h3>סכום מותאם ($${usd})</h3>
        <div class="block-actions">
          ${simplifyToggle('custom')}

        </div>
      </div>
      <pre>${text}</pre>
    </div>
  `;
}

/** The purchase controls for one manual-site row: a "יחיד" (base) link
 *  group, the best-deal link group when one exists, and the qty/"קבע"
 *  control feeding the order builder. Base links carry the top-bar
 *  quantity; deal links carry none (business rule #1 — buildCheckoutUrl
 *  is called with isBase=false for them). */
function renderGlobalPurchaseLinks(pkg, isos, simType) {
  const bestDeal = getBestDeal(pkg);
  const key = registerOrderPackage(simType, pkg, isos);
  const qtyValue = getBuilderQtyForKey(key);

  function linkGroup(label, url, isBase, extraClass = "") {
    if (!url) return "";
    const finalUrl = buildCheckoutUrl(url, isBase, isos);
    const safeUrl = escapeHtml(finalUrl);
    const jsUrl = escapeHtml(JSON.stringify(finalUrl));
    const qtyNote = isBase && cartSettings.quantity > 1 ? ` ×${cartSettings.quantity}` : "";
    return `
      <span class="link-group ${extraClass}">
        <span class="link-label">${label}${qtyNote}</span>
        <a class="lk-open" href="${safeUrl}" target="_blank" rel="noopener" title="פתח קישור הזמנה (${label}) בלשונית חדשה">🔗</a>
        <button class="lk-copy" onclick='copyText(${jsUrl})' title="העתק קישור הזמנה (${label}) ללוח">📋</button>
      </span>
    `;
  }

  const dealLabel = bestDeal
    ? `דיל ${bestDeal.perUnitILS}₪/סים`
    : "";

  const numberControl = `
    <span class="number-order-group" title="בחר כמות לחבילה הזו והוסף אותה להזמנה המשולבת">
      <span class="link-label">מספר</span>
      <input id="qty_${key}" type="number" min="0" step="1" value="${escapeHtml(qtyValue)}" placeholder="0"
             onkeydown="if(event.key==='Enter'){setPackageOrderQuantity('${key}')}">
      <button class="lk-set" onclick="setPackageOrderQuantity('${key}')">קבע</button>
    </span>
  `;

  const baseGroup = linkGroup("יחיד", pkg.base?.checkoutUrl, true);
  const dealGroup = bestDeal ? linkGroup(dealLabel, bestDeal.checkoutUrl, false, "best-deal-link") : "";

  return `<div class="global-links purchase-actions">${baseGroup}${dealGroup}${numberControl}</div>`;
}

/** The price rows of one SIM-type column: plan text + old-API compare
 *  badge (+ deal tooltip) + the purchase controls. Rows where the site
 *  beats the old API get the green "is-cheaper" treatment. */
function renderGlobalPlanRows(country, simType, displayPackages, isos) {
  if (!displayPackages.length) {
    return `<div class="global-empty">לא נמצאו חבילות רלוונטיות.</div>`;
  }

  return displayPackages.map(pkg => {
    const oldPrice = getOldComparablePriceILS(country, simType, pkg.dataGB);
    const bestPrice = pkg.bestPerUnitILS || pkg.base?.perUnitILS;
    const cheaper = oldPrice && bestPrice && bestPrice < oldPrice;
    const mark = comparePriceMark(bestPrice, oldPrice);
    const rowClass = cheaper ? "global-line is-cheaper" : "global-line";

    const bestDeal = getBestDeal(pkg);
    const baseLine = `${pkg.dataGB} גיגה · ${pkg.validityDays} ימים · ${pkg.base.totalILS}₪`;
    const dealLabel = bestDeal
      ? ` · ${bestDeal.quantity === 2 ? "זוג" : bestDeal.quantity + " יח׳"} ${bestDeal.totalILS}₪`
      : "";
    const dealTip = bestDeal
      ? `<button class="info-tip" data-tip="${escapeHtml(bestDeal.perUnitILS + ' ש"ח לכרטיס')}">i</button>`
      : "";

    return `
      <div class="${rowClass}">
        <div class="global-line-text">${escapeHtml(baseLine + dealLabel)}${mark}${dealTip}</div>
        ${renderGlobalPurchaseLinks(pkg, isos, simType)}
      </div>
    `;
  }).join("");
}

/** One SIM-type column (pSIM or eSIM) of the בסיסי card: titlebar with
 *  the PER-TYPE zone in the label (three-zone model), a copy button
 *  with the destination-count header, and the plan rows. */

  const destCount = countriesForTypeZone(simType, typeZone).length;
  const listText = formatGlobalPlanListText(displayPackages);
  const copyTextValue = listText
    ? `חבילות ${simType === "esim" ? "סים וירטואלי" : "סים פיזי"} ל-${destCount} יעדים:\n${listText}`
    : "";
  const copyButton = copyTextValue
    ? `<button class="global-copy-btn" onclick='copyText(${JSON.stringify(copyTextValue)})'>📋 העתק</button>`
    : "";

  return `
    <div class="global-sim-column">
      <div class="global-sim-titlebar">
        <div class="global-sim-title">${typeLabel}</div>
        ${copyButton}
      </div>
      <div class="global-lines">
        ${renderGlobalPlanRows(country, simType, displayPackages, isos)}

}

function renderGlobalZoneBlock(zone, countries, cached) {

  const physical = getDisplayGlobalPackages(cached.physical_sim || [], on);

  return `
    <div class="block global-clean-card manual-priority">
      <div class="global-clean-head">
        <div>
          <h3>תוכניות בסיסי <span class="zone-pill">אזור ${zone}</span></h3>
          <div class="global-clean-subtitle">${escapeHtml(countryNames)}</div>
        </div>
        <div class="block-actions">
          ${simplifyToggle(key)}
          <button onclick="copyZoneCountries(${zone})" title="העתק את כל קודי המדינות באזור ${zone} (מופרד בפסיק)">📋 כל מדינות האזור</button>
          <button onclick="refreshGlobalZone(${zone})" title="רענן מחירים מה‑API">🔄 רענן</button>
        </div>
      </div>
      ${renderPriceChangesBanner(cached)}
      <div class="global-clean-grid">
        ${renderGlobalSimColumn(rep, "physical_sim", physical, isos)}
        ${renderGlobalSimColumn(rep, "esim", esim, isos)}

      ${errorHtml}

/** The בסיסי tab's main card. All "active" countries share the highest
 *  zone (business rule #4) and render as ONE card; before the zone's
 *  scan lands this shows a loading / "load now" placeholder instead. */
function renderGlobalPlans() {
  if (!selected.length) return "";

  const zone = active[0].zone;
  const countryNames = active.map(c => c.name.he).join(", ");

  if (!rep) {
    if (loading) {
      return `
        <div class="block global-loading-card">
          <h3>מחירים חדשים — אזור ${zone}</h3>
          <div class="global-clean-subtitle">${escapeHtml(countryNames)}</div>
          <p>טוען API חדש...</p>
        </div>
      `;
    }
    return `
      <div class="block global-loading-card">
        <h3>מחירים חדשים — אזור ${zone}</h3>
        <div class="global-clean-subtitle">${escapeHtml(countryNames)}</div>
        <p>עוד לא נטען.</p>
        <button onclick="loadGlobalForSelected()">טען עכשיו</button>

  return renderGlobalZoneBlock(zone, active, globalCache[rep.iso]);
}

/** The action cluster of one topup row, in the FIXED row grid (see
 *  renderTopupProducts): deal slot | 🔗 | 📋 | qty | קבע.
 *  ⚠ Deal buttons pass qty 1 — a deal URL is a bundle product that
 *  already includes the full quantity (business rule #1). */
function renderTopupPurchaseLinks(pkg, result) {
  const key = registerTopupPackage(pkg, result);
  const curIccid = normalizeIccid(topupState.customerIccid || "");
  const qtyValue = (curIccid ? getBuilderQtyForKey(`${key}::${curIccid}`) : "") || "1";
  const bestDeal = getBestDeal(pkg);

  const baseUrlJson = JSON.stringify(pkg.base?.checkoutUrl || "");
  // Deal URLs are bundle products that already include the full quantity —
  // pass qty 1 so buildTopupCheckoutUrl doesn't multiply the bundle.
  const dealSlot = bestDeal
    ? `<span class="tl-deal-label" title="דיל ${bestDeal.quantity}× — ₪${bestDeal.perUnitILS} לכרטיס">₪${bestDeal.perUnitILS}/יח׳</span>
       <button class="lk-open" onclick='openTopupCustomerLink(${escapeHtml(JSON.stringify(bestDeal.checkoutUrl))}, 1)' title="פתח קישור דיל">🔗</button>
       <button class="lk-copy" onclick='copyTopupCustomerLink(${escapeHtml(JSON.stringify(bestDeal.checkoutUrl))}, 1)' title="העתק קישור דיל">📋</button>`
    : "";

  return `
      <span class="tl-deal">${dealSlot}</span>
      <button class="lk-open" ${pkg.base?.checkoutUrl ? "" : "disabled"} onclick='openTopupCustomerLink(${escapeHtml(baseUrlJson)}, 1)' title="פתח קישור טופאפ עם ICCID הלקוח">🔗</button>
      <button class="lk-copy" ${pkg.base?.checkoutUrl ? "" : "disabled"} onclick='copyTopupCustomerLink(${escapeHtml(baseUrlJson)}, 1)' title="העתק קישור טופאפ עם ICCID הלקוח">📋</button>
      <input class="tl-qty" id="qty_${key}" type="number" min="0" step="1" value="${escapeHtml(qtyValue)}" placeholder="1"
             title="כמות להזמנה המשולבת" onkeydown="if(event.key==='Enter'){setTopupOrderQuantity('${key}')}" />
      <button class="lk-set" onclick="setTopupOrderQuantity('${key}')" title="הוסף להזמנה המשולבת">קבע</button>
  `;
}

/** The topup package list.
 *  ⚠ POSITIONAL STABILITY IS THE FEATURE: every catalog renders the same
 *  fixed canonical GB slots, sorted ascending; a size the current SIM
 *  type doesn't offer renders as a RED dashed row ("לא קיים") instead of
 *  disappearing, and every row shares one fixed grid — so nothing shifts
 *  when switching V1/V2/V3 and the operator navigates by muscle memory.
 *  Do not "clean up" the red rows or make columns content-sized.
 *  EXTENDING: canonical sizes live in CANONICAL_TOPUP_GBS below;
 *  present-but-non-canonical sizes are appended automatically. */
function renderTopupProducts(result) {
  const displayPackages = getDisplayGlobalPackages(result.packages || [], isSimplified("topup"), { maxValidityDays: 30 });
  const copyTextValue = formatGlobalPlanListText(displayPackages);
  const copyButton = copyTextValue
    ? `<button class="global-copy-btn" onclick='copyText(${JSON.stringify(copyTextValue)})'>📋 העתק</button>`
    : "";

  if (!displayPackages.length) {
    return `<div class="topup-products"><div class="global-empty">לא נמצאו חבילות טופאפ מתאימות ל‑ICCID והמדינות שנבחרו.</div></div>`;
  }

  // Fixed canonical slots: every catalog renders the same GB positions.
  const CANONICAL_TOPUP_GBS = [1, 2, 3, 5, 7, 10, 15, 20, 25, 50];
  const simplifiedHidden = isSimplified("topup") ? new Set([1, 7]) : new Set();
  const presentSizes = displayPackages.map(p => Number(p.dataGB));
  const slots = Array.from(new Set([...CANONICAL_TOPUP_GBS, ...presentSizes]))
    .filter(gb => !simplifiedHidden.has(gb))
    .sort((a, b) => a - b);

  // Group packages by GB (bigger validity first within a size).
  const byGb = {};
  [...displayPackages]
    .sort((a, b) => (a.dataGB - b.dataGB) || (b.validityDays - a.validityDays))
    .forEach(pkg => { (byGb[Number(pkg.dataGB)] ||= []).push(pkg); });

  const rows = slots.map(gb => {
    const pkgs = byGb[gb];
    if (!pkgs || !pkgs.length) {
      // Missing size → red placeholder row with identical geometry.
      return `
      <div class="topup-line is-missing" title="החבילה הזו לא קיימת בסוג הסים הנוכחי">
        <span class="topup-line-text">${gb} גיגה – לא קיים</span>
        <span class="tl-deal"></span>
        <span class="tl-missing-pad"></span>
      </div>
    `;
    }
    return pkgs.map(pkg => {
      // Row text is the base triple only — the deal lives in its fixed
      // slot, so every row has identical geometry (muscle memory).
      const line = `${pkg.dataGB} גיגה – ${pkg.validityDays} ימים – ₪${pkg.base.totalILS}`;
      return `
      <div class="topup-line">
        <span class="topup-line-text">${escapeHtml(line)}</span>
        ${renderTopupPurchaseLinks(pkg, result)}
      </div>
    `;
    }).join("");
  }).join("");

  return `
    <div class="topup-products">
      <div class="topup-products-titlebar">
        <div class="topup-products-title">חבילות טופאפ · 30 ימים</div>
        ${copyButton}
      </div>
      <div class="topup-lines-grid">${rows}</div>
    </div>
  `;
}

/** The meta bar above the topup list: all the technical detail (profile,
 *  catalog source, probe, zones, URL parameters) collapses into ONE
 *  hover tooltip; visibly it's just the ICCID status + API-URL copy. */
function renderTopupMeta(result) {
  const info = result.checkoutInfo || {};
  const requested = (result.requestedCountries || []).map(c => c.iso).join("|");
  const countriesLabel = (result.requestedCountries || []).map(c => c.he).join(" | ");
  const searchUrlJson = JSON.stringify(result.requestUrl || "");
  const customerIccid = normalizeIccid(topupState.customerIccid || "");
  const sourceLabel = result.source === "manual_global_esim_prices_no_topup_scan"
    ? "מקור: מחירי eSIM ידניים קיימים, בלי סריקת טופאפ"
    : result.profileId === "psim_v2"
      ? `מקור: סריקת V2 אחת לאזור ${String(result.zone ?? getSelectedTopupZone() ?? "")}`
      : result.profileId === "psim_v1"
        ? "מקור: סריקת V1 גרמניה בלבד"
        : "מקור: קטלוג טופאפ";

  const tip = [
    result.profileLabel || result.kind || getTopupProfile().label,
    sourceLabel,
    result.probeIccid ? `probe: ${shortIccid(result.probeIccid)}` : "",
    countriesLabel ? `מדינות: ${countriesLabel}` : "",
    requested ? `selected: ${requested}` : "",
    (result.zone !== null && result.zone !== undefined) ? `zone: ${result.zone}` : "",
    info.flyCountries ? `fly_countries=${info.flyCountries}` : "",
    info.productZone ? `product_zone=${info.productZone}` : "",
    info.physicalSimType ? info.physicalSimType : "",
  ].filter(Boolean).join("\n");

  return `
    <div class="topup-meta-bar">
      <button class="info-tip" data-tip="${escapeHtml(tip)}">i</button>
      <span class="topup-meta-label ${customerIccid ? 'ok' : ''}">${customerIccid ? `✓ ICCID ${escapeHtml(shortIccid(customerIccid))}` : "הקלד ICCID לקוח להזמנה"}</span>
      ${result.requestUrl ? `<button class="global-copy-btn" onclick='copyText(${escapeHtml(searchUrlJson)})' title="העתק API URL">📋 API URL</button>` : ""}
    </div>
  `;
}

/** The SIM-version <select> (options from TOPUP_VERSION_PROFILES). */
function renderTopupVersionSelector() {
  ensureAutoTopupState();
  const profile = getTopupProfile();
  const options = Object.values(TOPUP_VERSION_PROFILES).map(p =>
    `<option value="${escapeHtml(p.id)}" ${p.id === profile.id ? "selected" : ""}>${escapeHtml(p.label)}</option>`
  ).join("");
  return `
    <div class="topup-select-wrap version-select-wrap">
      <select id="topupVersionSelect" onchange="setTopupVersion(this.value)" title="סוג SIM">${options}</select>
    </div>
  `;
}

/** The whole topup tab: header (version pill + readiness chip +
 *  simplify + refresh), preload progress, the controls row (version
 *  selector / ICCID input OR batch textarea / batch toggle / scan),
 *  a status line, then the meta bar + package list.
 *  NOTE the ICCID input and batch textarea update state via oninput
 *  WITHOUT re-rendering — see the focus-vs-re-render note in § 16. */
function renderTopupScannerPanel() {
  if (!selected.length) return "";

  ensureAutoTopupState();
  const profile = getTopupProfile();
  const result = getCurrentTopupCatalog();
  const countryNames = selected.map(c => c.name.he).join(", ");
  const stats = getTopupPreloadStats();
  const validation = validateTopupSelectionForProfile(profile);

  // Exactly one status line, picked by precedence:
  // loading → preloading → auto-preloading → error → validation → empty.
  const status = topupState.loading
    ? `<div class="topup-status loading"><span class="topup-mini-spinner"></span><span>טוען קטלוג ${escapeHtml(profile.label)}…</span></div>`
    : topupState.preloading
      ? `<div class="topup-status loading"><span class="topup-mini-spinner"></span><span>טוען קטלוגים ${escapeHtml(String(topupState.preloadDone))}/${escapeHtml(String(topupState.preloadTotal))}…</span></div>`
      : topupState.autoPreloading && !result
        ? `<div class="topup-status loading"><span class="topup-mini-spinner"></span><span>טעינה אוטומטית ברקע. אפשר כבר לבחור סוג ולהקליד ICCID.</span></div>`
        : topupState.error
          ? `<div class="topup-status error">${escapeHtml(topupState.error)}</div>`
          : validation
            ? `<div class="topup-status error">${escapeHtml(validation)}</div>`
            : !result
              ? `<div class="topup-status">הקטלוג ייטען אוטומטית — אפשר לבחור סוג ולהקליד ICCID.</div>`
              : "";

  const resultHtml = result ? `
    ${renderTopupMeta(result)}
    <div class="topup-grid">${renderTopupProducts(result)}</div>
  ` : "";

  return `
    <div class="block topup-scanner-card">
      <div class="topup-head">
        <div>
          <h3>טופאפ מהיר <span class="topup-head-countries">— ${escapeHtml(countryNames)}</span> <span class="zone-pill">${escapeHtml(profile.label)}</span>
            <span class="topup-cache-stat ${stats.cached === stats.total ? 'good' : ''}">מוכן ${stats.cached}/${stats.total}</span>
          </h3>
        </div>
        <div class="block-actions">
          ${simplifyToggle("topup")}
          <button class="copy-btn" onclick="preloadTopupsForSelected(true)" title="רענן קטלוג טופאפ">🔄 רענן</button>
        </div>
      </div>

      ${topupState.preloadMessage ? `<div class="topup-preload-progress ${topupState.preloadErrors ? 'error' : ''}">${escapeHtml(topupState.preloadMessage)}${topupState.preloadErrorList?.length ? `<br>${escapeHtml(topupState.preloadErrorList.slice(0, 4).join(" · "))}` : ""}</div>` : ""}

      <div class="topup-controls">
        ${renderTopupVersionSelector()}
        ${topupState.batchMode ? "" : `<input id="topupIccid" class="topup-iccid-input" type="text" inputmode="numeric" autocomplete="off"
               value="${escapeHtml(topupState.customerIccid || '')}"
               placeholder="${escapeHtml(profile.customerLabel)}"
               oninput="setTopupCustomerIccid(this.value)" />`}
        <button class="topup-batch-toggle ${topupState.batchMode ? 'is-on' : ''}" onclick="toggleTopupBatchMode()"
                title="מצב מרובה — הדבק כמה ICCIDים, שורה לכל כרטיס">📚 מרובה${topupState.batchMode && topupState.batchIccids.length ? ` · ${topupState.batchIccids.length}` : ""}</button>
        <button class="topup-scan-btn" onclick="preloadTopupsForSelected(false)" title="הצג תוכניות">🔍</button>
      </div>
      ${topupState.batchMode ? `
      <textarea id="topupIccidBatch" class="topup-batch-area" rows="3"
                placeholder="הדבק ICCID אחד בכל שורה — קבע יוסיף שורת עגלה לכל כרטיס"
                oninput="setTopupBatchIccids(this.value)">${escapeHtml(topupState.batchRaw || "")}</textarea>` : ""}

      ${status}
      ${resultHtml}
    </div>
  `;
}


/* ═══════════════════════════════════════════════════════════════════════
   § 19. renderAll — THE ORCHESTRATOR
   Rebuilds the active tab into #results, syncs the cart drawer + FAB
   badge and the tab highlights, quietly ensures topup catalogs, and
   persists the session. Called after (almost) every state change.
   ═══════════════════════════════════════════════════════════════════════ */

function renderAll() {
  const resultsEl = document.getElementById("results");
  const cartEl = document.getElementById("cart");
  if (!resultsEl) return;

  // Empty selection → the friendly "pick a country" empty state.
  if (!selected.length) {
    resultsEl.innerHTML =
      `<div class="center-empty">
        <span class="ce-emoji">🌍</span>
        <h2>בחר מדינה כדי להתחיל</h2>
        <p>חפש מדינה בסרגל למעלה. המחירים נטענים אוטומטית, וההשוואה תופיע כאן.</p>
      </div>`;
    if (cartEl) cartEl.innerHTML = window.__renderEmptyCart();
    if (window.__updateCartFab) window.__updateCartFab();
    persistSession();
    return;
  }

  // The registry only lives for one render — visible rows re-register
  // themselves below (see the lifetime warning in § 2).
  orderPackageRegistry = {};
  ensureAutoTopupState();

  // Build ONLY the active tab.
  let tabContent = "";
  if (activeTab === "basic") {
    tabContent = renderZoneNote() + renderGlobalPlans();
  } else if (activeTab === "gigaboost") {
    tabContent = renderZoneNote() + renderGigaboostChooser() + renderPhysicalPlans() + renderEsimPlans();
  } else if (activeTab === "copy") {
    tabContent =
      `<div class="ref-strip">` +
      renderCreditPricing() +
      renderPhysical() +
      renderWallet() +
      renderCustomAmount() +
      `</div>`;
  } else if (activeTab === "topup") {
    tabContent = renderTopupScannerPanel();
  }

  resultsEl.innerHTML = `<div class="results-grid">` + tabContent + `</div>`;

  // Keep the tab buttons' active state in sync (e.g. after session restore).
  document.querySelectorAll(".tab-btn").forEach(b =>
    b.classList.toggle("is-active", b.dataset.tab === activeTab)
  );

  // Cart drawer + FAB badge.
  if (cartEl) {
    const cartHtml = renderOrderBuilderPanel();
    cartEl.innerHTML = cartHtml && cartHtml.trim() ? cartHtml : window.__renderEmptyCart();
  }
  if (window.__updateCartFab) window.__updateCartFab();

  updateMasterSimplifyLabel();
  scheduleAutoEnsureTopupForSelection();
  persistSession();
}


/* ═══════════════════════════════════════════════════════════════════════
   § 20. EVENT WIRING
   The two document-level behaviors that aren't inline handlers.
   ═══════════════════════════════════════════════════════════════════════ */

/* ---- Keyboard shortcuts: digits 1–4 switch tabs ----------------------------
   Ignored while typing in any field, and when a modifier is held. */
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const idx = ["1", "2", "3", "4"].indexOf(e.key);
  if (idx !== -1) { e.preventDefault(); setActiveTab(TAB_IDS[idx]); }
});

/* ---- Country search autocomplete -------------------------------------------
   Matches Hebrew name / English name / ISO; results are ranked by a
   small prefix-beats-substring score and capped at 10. Enter picks the
   first suggestion. */

const search = document.getElementById("search");
const suggestions = document.getElementById("suggestions");

if (search && suggestions) {
search.addEventListener("input", () => {
  const val = search.value.toLowerCase().trim();
  suggestions.innerHTML = "";

  if (!val) {
    suggestions.style.display = "none";
    return;
  }

  let matches = data.filter(c =>
    c.name.en.toLowerCase().includes(val) ||
    c.name.he.includes(val) ||
    c.iso.toLowerCase().includes(val)
  );

  matches.sort((a,b) => {
    // Prefix matches outrank substring matches; Hebrew outranks English.
    function score(c) {
      let s = 0;
      if (c.name.he.startsWith(val)) s += 3;
      if (c.name.en.toLowerCase().startsWith(val)) s += 2;
      if (c.iso.toLowerCase().startsWith(val)) s += 2;
      if (c.name.he.includes(val)) s += 1;
      return s;
    }
    return score(b) - score(a);
  });

  matches.slice(0,10).forEach(c => {
    const div = document.createElement("div");
    div.textContent =
      `${c.name.he} (Zone ${c.zone}) ($${c.credit_price_per_gb})`;

    div.onclick = () => addCountry(c);
    suggestions.appendChild(div);
  });

  suggestions.style.display = matches.length ? "block" : "none";
});

search.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    const first = suggestions.firstChild;
    if (first) first.click();
  }
});
}


/* ═══════════════════════════════════════════════════════════════════════
   § 21. BOOT
   Runs once at load. Order-portal URLs short-circuit into the standalone
   runner; otherwise: fetch the three country lists + all 20 zones of
   both package endpoints in parallel, build the country model, validate
   the persisted cache, restore the session, first paint, and kick off
   the automatic topup preload.
   ═══════════════════════════════════════════════════════════════════════ */

// Apply any persisted $/₪ tier overrides onto WALLET/PHYSICAL before the
// first render uses them.
loadRefOverrides();

(async () => {
  const loadingEl = document.getElementById("loading");

  // Order-portal mode: the URL carries an encoded order payload — show
  // only the runner card and skip the whole calculator boot.
  if (new URLSearchParams(window.location.search).has(ORDER_PAYLOAD_PARAM)) {
    renderStandaloneOrderPortal();
    return;
  }
  try {

  /** GET a URL and parse its JSON body. */
  async function fetchJSON(url) {
    const res = await fetch(url);
    return res.json();
  }

  // get-countries: credit price + GENERAL zone. The pSIM and eSIM
  // catalogs have their OWN country lists with their own zones, which
  // can differ per country — so gigaboost plans must use the per-type
  // zone, not the general one (three-zone model).
  const [countriesRes, physListRes, esimListRes] = await Promise.all([
    fetchJSON(`${APP_LINK_API_BASE}/get-countries`),
    fetchJSON(`${APP_LINK_API_BASE}/get-physical-countries`).catch(() => null),
    fetchJSON(`${APP_LINK_API_BASE}/get-payasugo-countries`).catch(() => null),
  ]);
  const esimCountries = countriesRes.data;

  /** ISO → zone map from a per-type country list. Tolerates both the
   *  { data: [...] } wrapper and a bare array, and both iso_code / iso
   *  field spellings — the two endpoints have differed before. */
  function zoneMapFrom(res) {
    const list = Array.isArray(res) ? res : (res && Array.isArray(res.data) ? res.data : []);
    const map = {};
    for (const c of list) {
      const iso = c.iso_code || c.iso;
      const z = parseInt(c.zone, 10);
      if (iso && Number.isFinite(z)) map[iso] = z;
    }
    return map;
  }
  const physicalZoneByIso = zoneMapFrom(physListRes);
  const esimZoneByIso = zoneMapFrom(esimListRes);

  // Fetch every zone's package list for both SIM types, in parallel.
  // Zones run 1–20 today; absent zones just return empty lists.
  const zones = Array.from({ length: 20 }, (_, i) => i + 1);

  const esimPackages = (await Promise.all(
    zones.map(z => fetchJSON(`${APP_LINK_API_BASE}/get-packages?zone=${z}`).catch(()=>[]))
  )).flat();

  const physicalPackages = (await Promise.all(
    zones.map(z => fetchJSON(`${APP_LINK_API_BASE}/get-physical-packages?zone=${z}`).catch(()=>[]))
  )).flat();

  // Index packages by zone. The `id` field is load-bearing: it is the
  // token/id segment of the direct app.simtlv payment link.
  const esimByZone = {};
  const physicalByZone = {};

  for (const p of esimPackages) {
    (esimByZone[p.zone] ||= []).push({
      dataGB: p.data,
      priceUSD: round2(p.price),
      appId: p.id // token segment of the direct app.simtlv payment link
    });
  }

  for (const p of physicalPackages) {
    (physicalByZone[p.zone] ||= []).push({
      dataGB: parseFloat(p.data_amount), // e.g. "10GB" → 10
      priceILS: round2(p.price),
      appId: p.id // numeric segment of the direct app.simtlv payment link
    });
  }

  // Build the country model (shape documented at the `data` declaration).
  data = esimCountries.map(c => {
    const generalZone = c.zone;
    const esimZone = esimZoneByIso[c.iso_code] ?? generalZone;
    const physicalZone = physicalZoneByIso[c.iso_code] ?? generalZone;
    return {
      iso: c.iso_code,
      name: {
        en: c.country_name,
        he: c.hebrew_name || c.country_name
      },
      zone: generalZone,
      esimZone,
      physicalZone,
      credit_price_per_gb: round2(c.price),
      plans: {
        esim: esimByZone[esimZone] || [],
        physical: physicalByZone[physicalZone] || []
      }
    };
  });

  // Country model ready → validate the persisted manual-site cache
  // against it, restore the operator's session, and paint.
  loadPersistedGlobalCache();
  restoreSession();
  if (loadingEl) loadingEl.style.display = "none";
  renderAll();
  setExportStatus(`מטמון API חדש נטען מהדפדפן: ${Object.keys(globalCache).length}/${data.length}. טעינה מלאה משתמשת בנציג אחד לכל אזור כדי לא לבזבז 320 בקשות.`);
  // Kick off the automatic topup preload AFTER this turn of the event
  // loop, so the first paint isn't blocked behind it.
  setTimeout(() => autostartTopupCatalogPreload(false), 0);
  } catch (err) {
    // Boot failed (network/API down) — repurpose the loading overlay as
    // an error card instead of leaving an eternal spinner.
    console.error("Initial data load failed", err);
    if (loadingEl) {
      loadingEl.innerHTML = `טעינת הנתונים נכשלה.<br><small>${err.message}</small>`;
      loadingEl.style.background = "#fff3f3";
      loadingEl.style.color = "#8a0000";
    }
  }
})();
</script>
