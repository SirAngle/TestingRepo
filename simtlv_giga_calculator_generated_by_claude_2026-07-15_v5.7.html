/** Editor input handler: writes one field of one tier row.
 *  Invalid input re-renders (which resets the input to the stored value)
 *  without saving. */
function setRefValue(kind, i, field, val) {
  const arr = refArr(kind);
  const num = parseFloat(val);
  if (!arr[i] || !Number.isFinite(num) || num < 0) { renderAll(); return; }
  arr[i][field] = num;
  saveRefOverrides();
  renderAll();
}

/** Appends an empty tier row to be filled in. */
function addRefRow(kind) {
  refArr(kind).push({ usd: 0, ils: 0 });
  saveRefOverrides();
  renderAll();
}

/** Deletes a tier row — but always keeps at least one. */
function removeRefRow(kind, i) {
  const arr = refArr(kind);
  if (arr.length <= 1) return; // keep at least one tier
  arr.splice(i, 1);
  saveRefOverrides();
  renderAll();
}

/** Resets one kind back to the shipped defaults. */
function resetRefRows(kind) {
  const arr = refArr(kind);
  const defs = kind === "wallet" ? DEFAULT_WALLET : DEFAULT_PHYSICAL;
  arr.length = 0;
  defs.forEach(r => arr.push({ ...r }));
  saveRefOverrides();
  renderAll();
}

/** Markup for the inline tier editor (one row per tier + actions). */
function renderRefEditor(kind) {
  const arr = refArr(kind);
  const rows = arr.map((r, i) => `
    <div class="ref-edit-row">
      <label>$<input type="number" step="0.01" min="0" value="${r.usd}"
             onchange="setRefValue('${kind}', ${i}, 'usd', this.value)"></label>
      <label>₪<input type="number" step="1" min="0" value="${r.ils}"
             onchange="setRefValue('${kind}', ${i}, 'ils', this.value)"></label>
      <button class="ref-edit-del" onclick="removeRefRow('${kind}', ${i})" title="מחק שורה">✕</button>
    </div>
  `).join("");
  return `
    <div class="ref-editor">
      ${rows}
      <div class="ref-edit-actions">
        <button onclick="addRefRow('${kind}')">+ שורה</button>
        <button onclick="resetRefRows('${kind}')" title="חזרה לערכי ברירת המחדל">איפוס</button>
        <button class="ref-edit-done" onclick="toggleRefEdit('${kind}')">סיום</button>
      </div>
    </div>
  `;
}


/* ═══════════════════════════════════════════════════════════════════════
   § 8. TOP-BAR SETTINGS & TABS
   Handlers for the option cluster inputs and the tab bar.
   ═══════════════════════════════════════════════════════════════════════ */

/** Top-bar ₪/$ input handler: sets the USD→ILS rate (rejecting garbage),
 *  persists it, and re-renders — every eSIM price changes with it. */
function setUsdRate(value) {
  const rate = parseFloat(value);
  if (!Number.isFinite(rate) || rate <= 0) return;
  USD_TO_ILS = rate;
  try { localStorage.setItem(USD_RATE_STORAGE_KEY, String(rate)); } catch (e) {}
  renderAll();
}

/** רוקן עגלה toggle handler: whether links carry empty_cart=true. */
function setEmptyCart(on) {
  cartSettings.emptyCart = !!on;
  renderAll();
}

/** כמות input handler: quantity for the base ("יחיד") checkout link.
 *  Anything unusable falls back to 1. */
function setCartQuantity(value) {
  const n = parseInt(value, 10);
  cartSettings.quantity = (Number.isFinite(n) && n > 0) ? n : 1;
  renderAll();
}

/** Switches the active tab (ignores unknown ids), updates the tab bar's
 *  highlight, and renders the newly active tab's content. */
function setActiveTab(tab) {
  if (!TAB_IDS.includes(tab)) return;
  activeTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b =>
    b.classList.toggle("is-active", b.dataset.tab === tab)
  );
  renderAll();
}


/* ═══════════════════════════════════════════════════════════════════════
   § 9. COUNTRY SELECTION
   Adding/removing countries and the selected-chips strip in the top bar.
   ═══════════════════════════════════════════════════════════════════════ */

/** Adds a country to the selection (ignoring duplicates), re-renders,
 *  and starts fetching its manual-site prices. Also clears the search
 *  box + suggestions, ready for the next lookup. */
function addCountry(c) {
  if (!selected.find(x => x.iso === c.iso)) {
    selected.push(c);
    renderSelected();
    renderAll();
    ensureGlobalCountry(c);
  }

  search.value = "";
  suggestions.style.display = "none";
}

/** Removes one country (chip ✕ handler). */
function removeCountry(iso) {
  selected = selected.filter(c => c.iso !== iso);
  renderSelected();
  renderAll();
}

/** Clears the whole selection (the ✕ נקה button). */
function clearAllCountries() {
  if (!selected.length) return;
  selected = [];
  renderSelected();
  renderAll();
}

/** Rebuilds the selected-country chips strip in the top bar and toggles
 *  the clear-all button's visibility. (This is the one piece of chrome
 *  outside #results that renderAll doesn't own.) */
function renderSelected() {
  const el = document.getElementById("selected");
  el.innerHTML = "";

  selected.forEach(c => {
    const chip = document.createElement("div");
    chip.className = "chip";

    chip.innerHTML =
      `${c.name.he} (Zone ${c.zone}) ($${c.credit_price_per_gb})
      <span onclick="removeCountry('${c.iso}')">✕</span>`;

    el.appendChild(chip);
  });

  const clearBtn = document.getElementById("clearCountriesBtn");
  if (clearBtn) clearBtn.style.display = selected.length ? "inline-flex" : "none";
}


/* ═══════════════════════════════════════════════════════════════════════
   § 10. MANUAL-SITE API ("global" / "new prices")
   The manual site (simtlv.co.il) returns rendered product HTML from its
   WooCommerce AJAX endpoint; we parse that HTML into package objects:
     { simType, dataGB, validityDays,
       base:  { quantity:1, totalILS, perUnitILS, productId, checkoutUrl },
       deals: [{ quantity, totalILS, perUnitILS, label, productId,
                 checkoutUrl }, …],       // bundle offers, e.g. a pair
       bestPerUnitILS }                    // cheapest per-unit price seen
   Checkout URLs here are the WooCommerce flavor
   (simtlv.co.il/checkout/?add-to-cart=…) whose grammar uses PIPE
   separators for fly_countries (KH|VN — never commas).
   ═══════════════════════════════════════════════════════════════════════ */

/* ---- Text parsers for the scraped product markup ----------------------- */

/** Extracts validity in days from free text ("30 ימים", "שנה", "5 שנים").
 *  Returns null when no number is found. */
function getValidityDays(daysText) {
  const text = String(daysText || "").replace(/\s+/g, " ").trim();

  if (text.includes("5") && text.includes("שנ")) return 1825; // "5 שנים"
  if (text.includes("שנה") || text.includes("לשנה")) return 365;

  const m = text.match(/\d+/);
  return m ? parseInt(m[0], 10) : null;
}

/** Extracts a shekel amount from free text, tolerating both "55₪" and
 *  "₪55" orders and thousands commas. Takes the LAST match (sale prices
 *  appear after crossed-out originals). Returns 0 when nothing matches. */
function getShekelAmount(text) {
  const clean = String(text || "").replace(/,/g, "").replace(/\s+/g, " ");

  const beforeSymbol = [...clean.matchAll(/(\d+(?:\.\d+)?)\s*₪/g)].map(m => Number(m[1]));
  if (beforeSymbol.length) return beforeSymbol[beforeSymbol.length - 1];

  const afterSymbol = [...clean.matchAll(/₪\s*(\d+(?:\.\d+)?)/g)].map(m => Number(m[1]));
  if (afterSymbol.length) return afterSymbol[afterSymbol.length - 1];

  return 0;
}

/** Works out how many units a bundle ("deal") contains, in order of
 *  trust: an explicit quantity= in the URL → the word זוג (pair) → a
 *  "N יח׳/כרטיסים" phrase → assume 2 (pairs are the common bundle). */
function getQuantityFromBundle(label, href) {
  try {
    const url = new URL(href);
    const q = parseInt((url.searchParams.get("quantity") || "").trim(), 10);
    if (q > 1) return q;
  } catch (e) {}

  const clean = String(label || "").replace(/\s+/g, " ").trim();

  if (clean.includes("זוג")) return 2;

  const units = clean.match(/(\d+)\s*(יח|יח׳|כרטיס|כרטיסים)/);
  if (units) return parseInt(units[1], 10);

  return 2;
}

/** Parses the manual-site AJAX response's rendered HTML into package
 *  objects (shape documented in the section banner). Also used for topup
 *  responses, which pass { maxValidityDays: 30, dedupe: true }. Packages
 *  missing a size, price, or validity are dropped. */
function parseGlobalProducts(apiResponse, simType, options = {}) {
  const html = apiResponse?.data?.products || "";
  const doc = new DOMParser().parseFromString(html, "text/html");
  const maxValidityDays = options.maxValidityDays ?? 30;

  let products = [...doc.querySelectorAll(".esim-global-product-item")].map(item => {
    const text = selector =>
      item.querySelector(selector)?.textContent.trim().replace(/\s+/g, " ") || "";

    const gbText = text(".package-gb");
    const daysText = text(".package-days");
    const priceText = text(".price-wrap");
    const baseLink = item.querySelector("a.buy-now-with-icon");

    const dataGB = parseFloat(gbText.match(/[\d.]+/)?.[0] || 0);
    const validityDays = getValidityDays(daysText);
    const basePriceILS = getShekelAmount(priceText);

    const base = {
      quantity: 1,
      totalILS: basePriceILS,
      perUnitILS: basePriceILS,
      productId: baseLink?.dataset.id || null,
      checkoutUrl: baseLink?.href || null
    };

    // Bundle offers under the base product (e.g. "זוג ב99 ש"ח").
    const deals = [...item.querySelectorAll(".buy-now-bundle-wrap")].map(row => {
      const label = row.querySelector(".bundle-text")?.textContent.trim().replace(/\s+/g, " ") || "";
      const link = row.querySelector("a.buy-now-bundle");
      const checkoutUrl = link?.href || null;
      const quantity = getQuantityFromBundle(label, checkoutUrl);
      const totalILS = getShekelAmount(label);

      return {
        quantity,
        totalILS,
        perUnitILS: quantity ? round2(totalILS / quantity) : 0,
        label,
        productId: link?.dataset.id || null,
        checkoutUrl
      };
    }).filter(d => d.quantity > 1 && d.totalILS > 0);

    const validPrices = [base.perUnitILS, ...deals.map(d => d.perUnitILS)].filter(Boolean);

    return {
      simType,
      dataGB,
      validityDays,
      base,
      deals,
      bestPerUnitILS: validPrices.length ? Math.min(...validPrices) : null
    };
  }).filter(p =>
    p.dataGB > 0 &&
    p.base.totalILS > 0 &&
    p.validityDays !== null &&
    p.validityDays <= maxValidityDays
  );

  if (options.dedupe) products = dedupePackages(products);
  return products;
}

/** Removes duplicate packages (same product id, size, validity, price,
 *  and URL). Topup responses repeat items across sections. */
function dedupePackages(packages) {
  const seen = new Set();
  return (packages || []).filter(pkg => {
    const key = [
      pkg.base?.productId,
      pkg.dataGB,
      pkg.validityDays,
      pkg.base?.totalILS,
      pkg.base?.checkoutUrl
    ].join("|");
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

/** Display filter for global/topup packages:
 *    * always drops packages over maxValidityDays (default 30);
 *    * when simplified, also hides the odd 1GB/7GB sizes, and prefers
 *      to show ONLY 30-day plans when any exist;
 *    * sorts by size, then validity, then price. */
function getDisplayGlobalPackages(packages, simplified = true, options = {}) {
  const maxValidityDays = options.maxValidityDays ?? 30;
  let valid = (packages || []).filter(p => p.validityDays !== null && p.validityDays <= maxValidityDays);

  if (simplified) {
    valid = valid.filter(p => p.dataGB !== 1 && p.dataGB !== 7);
  }

  valid = valid.sort((a,b) => a.dataGB - b.dataGB || a.validityDays - b.validityDays || a.base.totalILS - b.base.totalILS);

  if (simplified) {
    const thirtyDay = valid.filter(p => p.validityDays === 30);
    return thirtyDay.length ? thirtyDay : valid;
  }

  return valid;
}

/** Hebrew display label for a simType key. */
function simTypeHebrew(simType) {
  if (simType === "esim") return "eSIM";
  if (simType === "physical_sim") return "סים פיזי";
  if (simType === "topup") return "טופאפ";
  return String(simType || "חבילה");
}

/* ---- Fetching ------------------------------------------------------------ */

/** Fetches the manual-site catalog for one country + one SIM type. */
async function fetchGlobalPackagesForCountry(iso, simType) {
  const params = new URLSearchParams();

  params.set("action", "esim_global_ajax");
  params.set("task", "search_packages");
  params.set("on_what_dates", GLOBAL_API_DATE_RANGE);
  params.append("fly_countries[]", iso);
  params.set("sim_type", simType);

  const url = MANUAL_SITE_AJAX_URL + "?" + params.toString();
  const res = await fetch(url);

  if (!res.ok) {
    throw new Error(`${simType} ${iso}: HTTP ${res.status}`);
  }

  const json = await res.json();

  return {
    iso,
    simType,
    zone: json?.data?.zone ?? null,
    packages: parseGlobalProducts(json, simType),
    rawSuccess: json?.success === true
  };
}

/** Fetches BOTH SIM types for a country in parallel and merges them into
 *  one result object; per-type failures land in .errors instead of
 *  rejecting the whole scan. */
async function fetchGlobalBothTypesForCountry(country) {
  const result = {
    physical_sim: [],
    esim: [],
    errors: []
  };

  const fetchedResults = await Promise.allSettled(
    GLOBAL_SIM_TYPES.map(simType => fetchGlobalPackagesForCountry(country.iso, simType))
  );

  fetchedResults.forEach((outcome, index) => {
    const simType = GLOBAL_SIM_TYPES[index];

    if (outcome.status === "fulfilled") {
      const fetched = outcome.value;
      result[simType] = fetched.packages;
      if (fetched.zone !== null) result.zone = fetched.zone;
    } else {
      result.errors.push({
        simType,
        message: String(outcome.reason?.message || outcome.reason)
      });
    }
  });

  return result;
}

/** Ensures a country's manual-site scan exists in the cache, fetching it
 *  once if missing. Errors are cached too (as empty catalogs with an
 *  .errors list) so a broken country doesn't refetch on every render.
 *  Every cache write is stamped with assignedZone + cachedAt and diffed
 *  against the previous entry for the price-change banner. */
async function ensureGlobalCountry(country) {
  if (!country || !country.iso) return;
  if (globalCache[country.iso] || globalLoading[country.iso]) return;

  globalLoading[country.iso] = true;
  renderAll();

  try {
    const global = await fetchGlobalBothTypesForCountry(country);
    global.assignedZone = country.zone;
    global.cachedAt = Date.now();
    const prev = globalCache[country.iso] || globalCachePrev[country.iso];
    const changes = computePriceChanges(prev, global);
    if (changes.length) global.priceChanges = changes;
    delete globalCachePrev[country.iso];
    globalCache[country.iso] = global;
    persistGlobalCache();
  } catch (err) {
    globalCache[country.iso] = {
      physical_sim: [],
      esim: [],
      assignedZone: country.zone,
      cachedAt: Date.now(),
      errors: [{ simType: 'all', message: String(err.message || err) }]
    };
    persistGlobalCache();
  } finally {
    globalLoading[country.iso] = false;
    renderAll();
  }
}

/** Kicks off manual-site fetches for every selected country. */
function loadGlobalForSelected() {
  selected.forEach(c => ensureGlobalCountry(c));
}

/** Force-refreshes a zone: clears its selected countries from the cache,
 *  then refetches. (The 🔄 button on the בסיסי card.) */
function refreshGlobalZone(zone) {
  selected.filter(c => c.zone === zone).forEach(c => { delete globalCache[c.iso]; });
  persistGlobalCache();
  loadGlobalForSelected();
}


/* ═══════════════════════════════════════════════════════════════════════
   § 11. MANUAL-SITE CACHE
   Persistence + freshness validation, the once-per-zone preload, and the
   price-change diff banner.

   ⚠ NEVER load persisted price data without the validation in
   loadPersistedGlobalCache — stale-cache bugs (Singapore showing old-
   zone prices) happened twice before that validation existed.
   ═══════════════════════════════════════════════════════════════════════ */

/** Loads the persisted manual-site cache, keeping an entry ONLY if:
 *   (a) its recorded zone still matches the country's current zone
 *       (zones change upstream — e.g. Singapore moved 2 → 3), AND
 *   (b) it is younger than GLOBAL_CACHE_TTL_MS, so in-zone price changes
 *       also self-heal without anyone noticing stale data first.
 *  Same-zone expirations are parked in globalCachePrev as baselines for
 *  the price-change diff when their fresh scan lands. */
function loadPersistedGlobalCache() {
  try {
    const saved = localStorage.getItem(GLOBAL_CACHE_STORAGE_KEY);
    if (!saved) return;
    const parsed = JSON.parse(saved);
    if (!parsed || typeof parsed !== "object") return;

    const now = Date.now();
    const validated = {};
    let dropped = 0;
    for (const [iso, entry] of Object.entries(parsed)) {
      const country = data.find(c => c.iso === iso);
      const entryZone = Number(entry?.assignedZone ?? entry?.zone ?? entry?.global_zone);
      const fresh = Number.isFinite(entry?.cachedAt) && (now - entry.cachedAt) < GLOBAL_CACHE_TTL_MS;
      if (country && fresh && Number.isFinite(entryZone) && Number(country.zone) === entryZone) {
        validated[iso] = entry;
      } else {
        dropped++;
        if (country && Number.isFinite(entryZone) && Number(country.zone) === entryZone) {
          globalCachePrev[iso] = entry;
        }
      }
    }
    globalCache = validated;
    if (dropped) console.info(`globalCache: dropped ${dropped} stale/expired entries`);
  } catch (e) {
    console.warn("Could not load saved global API cache", e);
  }
}

/** Persists the manual-site cache as-is. */
function persistGlobalCache() {
  try {
    localStorage.setItem(GLOBAL_CACHE_STORAGE_KEY, JSON.stringify(globalCache));
  } catch (e) {
    console.warn("Could not save global API cache", e);
  }
}

/* ---- Once-per-zone preload -------------------------------------------------
   Prices are identical across a zone, so instead of scanning all ~320
   countries we scan ONE representative per zone and fan the result out
   to every country of that zone (rewriting per-country URL parameters). */

/** Scans every zone that has no cached country yet (or all zones when
 *  forceRefresh), one representative each, updating the status line as
 *  zones complete. */
async function startGlobalPreloadAll(forceRefresh = false) {
  if (!data.length || globalPreloadRunning) return;

  globalPreloadRunning = true;
  globalPreloadDone = false;

  const zoneRepresentatives = getZoneRepresentatives(forceRefresh);

  if (!zoneRepresentatives.length) {
    globalPreloadRunning = false;
    globalPreloadDone = true;
    setExportStatus(`מחירי API חדש כבר טעונים לפי אזורים: ${getLoadedZoneCount()}/${getTotalZoneCount()} אזורים`);
    renderAll();
    return;
  }

  let completed = 0;
  const totalRequests = zoneRepresentatives.length * GLOBAL_SIM_TYPES.length;
  setExportStatus(`טוען לפי אזורים בלבד: 0/${zoneRepresentatives.length} אזורים | ${totalRequests} בקשות API`);

  await Promise.all(zoneRepresentatives.map(async rep => {
    try {
      const global = await fetchGlobalBothTypesForCountry(rep.country);
      assignGlobalResultToZone(rep.zone, global);
    } catch (err) {
      assignGlobalErrorToZone(rep.zone, err);
    } finally {
      completed++;
      persistGlobalCache();
      setExportStatus(`טוען לפי אזורים בלבד: ${completed}/${zoneRepresentatives.length} אזורים הסתיימו`);
      renderAll();
    }
  }));

  persistGlobalCache();
  globalPreloadRunning = false;
  globalPreloadDone = true;
  setExportStatus(`טעינת API חדש הסתיימה: ${getLoadedZoneCount()}/${getTotalZoneCount()} אזורים, ${Object.keys(globalCache).length}/${data.length} מדינות`);
  renderAll();
}

/** Number of distinct general zones in the country model. */
function getTotalZoneCount() {
  return new Set(data.map(c => c.zone)).size;
}

/** Number of zones that already have at least one cached country. */
function getLoadedZoneCount() {
  const zones = new Set();
  data.forEach(c => {
    if (globalCache[c.iso]) zones.add(c.zone);
  });
  return zones.size;
}

/** One { zone, country } representative per zone that still needs a
 *  scan. The representative is simply the FIRST country of that zone in
 *  `data` — note that this probe country must never leak into customer
 *  URLs (see rewritePhysicalTopupUrlForSelected). */
function getZoneRepresentatives(forceRefresh = false) {
  const byZone = new Map();

  data.forEach(country => {
    if (!byZone.has(country.zone)) byZone.set(country.zone, country);
  });

  return [...byZone.entries()]
    .filter(([zone]) => forceRefresh || !data.some(c => c.zone === zone && globalCache[c.iso]))
    .map(([zone, country]) => ({ zone, country }));
}

/** Deep-clones a zone representative's scan for another country of the
 *  same zone: rewrites all checkout URLs to that country, stamps
 *  source/zone/time, and records price changes vs. the previous entry. */
function cloneGlobalResultForCountry(global, country) {
  const clone = JSON.parse(JSON.stringify(global));

  GLOBAL_SIM_TYPES.forEach(simType => {
    clone[simType] = (clone[simType] || []).map(pkg => rewritePackageLinksForCountry(pkg, country));
  });

  clone.source = "zone_representative";
  clone.assignedIso = country.iso;
  clone.assignedZone = country.zone;
  clone.cachedAt = Date.now();
  const prev = globalCache[country.iso] || globalCachePrev[country.iso];
  const changes = computePriceChanges(prev, clone);
  if (changes.length) clone.priceChanges = changes;
  delete globalCachePrev[country.iso];

  return clone;
}

/** Rewrites one package's base + deal checkout URLs so they belong to
 *  `country` instead of the zone representative they were scanned with:
 *  fly_countries, product_zone, empty_cart, ref, quantity. Falls back to
 *  string surgery when the URL doesn't parse. */
function rewritePackageLinksForCountry(pkg, country) {
  const cloned = JSON.parse(JSON.stringify(pkg));

  function rewrite(url, quantity = 1) {
    if (!url) return url;
    try {
      const u = new URL(url);
      u.searchParams.set("fly_countries", country.iso);
      u.searchParams.set("product_zone", `PG_${country.zone}`);
      u.searchParams.set("empty_cart", "true");
      u.searchParams.set("ref", REFERRAL_CODE);
      u.searchParams.set("quantity", String(quantity || 1));
      return u.toString();
    } catch (e) {
      let out = String(url)
        .replace(/fly_countries=[^&]*/g, `fly_countries=${encodeURIComponent(country.iso)}`)
        .replace(/product_zone=PG_\d+/g, `product_zone=PG_${country.zone}`);

      const joiner = out.includes("?") ? "&" : "?";
      return `${out}${joiner}empty_cart=true&ref=${REFERRAL_CODE}&quantity=${encodeURIComponent(quantity || 1)}`;
    }
  }

  if (cloned.base) cloned.base.checkoutUrl = rewrite(cloned.base.checkoutUrl, cloned.base.quantity || 1);
  if (Array.isArray(cloned.deals)) {
    cloned.deals = cloned.deals.map(d => ({ ...d, checkoutUrl: rewrite(d.checkoutUrl, d.quantity || 1) }));
  }

  return cloned;
}

/** Fans one zone scan out to every country of that zone. */
function assignGlobalResultToZone(zone, global) {
  data.filter(c => c.zone === zone).forEach(country => {
    globalCache[country.iso] = cloneGlobalResultForCountry(global, country);
  });
}

/** Records a zone-wide scan failure as empty catalogs with an error, so
 *  the UI can show what happened instead of retrying forever. */
function assignGlobalErrorToZone(zone, err) {
  data.filter(c => c.zone === zone).forEach(country => {
    globalCache[country.iso] = {
      physical_sim: [],
      esim: [],
      zone,
      cachedAt: Date.now(),
      errors: [{ simType: "all", message: String(err.message || err) }]
    };
  });
}

/* ---- Price-change diff banner ----------------------------------------- */

/** Compares two cached scans and lists per-package price movements
 *  (matched by size + validity, compared on the base total). */
function computePriceChanges(oldEntry, newEntry) {
  if (!oldEntry || !newEntry) return [];
  const changes = [];
  for (const simType of GLOBAL_SIM_TYPES) {
    const oldPkgs = oldEntry[simType] || [];
    for (const np of (newEntry[simType] || [])) {
      const op = oldPkgs.find(p => p.dataGB === np.dataGB && p.validityDays === np.validityDays);
      const from = op?.base?.totalILS, to = np?.base?.totalILS;
      if (Number.isFinite(from) && Number.isFinite(to) && from !== to) {
        changes.push({ simType, dataGB: np.dataGB, validityDays: np.validityDays, from, to });
      }
    }
  }
  return changes;
}

/** Small dismissible strip listing what moved since the previous scan
 *  (first 6 movements + a "+N" overflow marker). */
function renderPriceChangesBanner(result) {
  const changes = result?.priceChanges;
  if (!changes || !changes.length || result?.priceChangesDismissed) return "";
  const label = ch => `${ch.simType === "esim" ? "eSIM" : "פיזי"} ${ch.dataGB}GB ₪${ch.from}→₪${ch.to}`;
  const shown = changes.slice(0, 6).map(label).join(" · ");
  const more = changes.length > 6 ? ` (+${changes.length - 6})` : "";
  return `
    <div class="price-changes-banner">
      <span>📈 שינויי מחיר מאז הסריקה הקודמת: ${escapeHtml(shown + more)}</span>
      <button onclick="dismissPriceChanges('${escapeHtml(result.assignedIso || "")}')" title="הסתר">✕</button>
    </div>`;
}

/** Hides the banner for one country's entry (persisted with the cache,
 *  so it stays dismissed until the next real change). */
function dismissPriceChanges(iso) {
  if (globalCache[iso]) {
    globalCache[iso].priceChangesDismissed = true;
    persistGlobalCache();
  }
  renderAll();
}


/* ═══════════════════════════════════════════════════════════════════════
   § 12. JSON EXPORT
   The 📥 JSON top-bar button: a full dump combining the old app-link API
   catalog with fresh manual-site scans for every country.
   ═══════════════════════════════════════════════════════════════════════ */

/** Fetches a fresh manual-site scan for every country (all at once) and
 *  assembles the export object. Progress goes to the status line. */
async function buildGlobalExport(countriesToExport) {
  const rows = await mapAllAtOnce(countriesToExport, async (country, i) => {
    setExportStatus(`Global API export: ${i + 1}/${countriesToExport.length} - ${country.iso}`);

    const global = await fetchGlobalBothTypesForCountry(country);

    return {
      iso: country.iso,
      name: country.name,
      old_zone: country.zone,
      global_zone: global.zone ?? null,
      credit_price_per_gb: country.credit_price_per_gb,
      plans: {
        old_api: {
          esim: country.plans.esim,
          physical: country.plans.physical
        },
        global_api: {
          physical_sim: global.physical_sim,
          esim: global.esim,
          errors: global.errors
        }
      }
    };
  });

  setExportStatus("");

  return {
    exported_at: new Date().toISOString(),
    global_api_date_range: GLOBAL_API_DATE_RANGE,
    notes: [
      "old_api and global_api are intentionally separate because prices, products, product IDs, and deals can differ.",
      "global_api packages include base price, bundle deals, and bestPerUnitILS when deals exist."
    ],
    wallet_packages: WALLET,
    physical_credit_packages: PHYSICAL,
    countries: rows
  };
}

/** Top-bar 📥 JSON handler: builds the export and downloads it. */
async function downloadAllJSON() {
  if (!data.length) {
    alert("הנתונים עדיין בטעינה");
    return;
  }

  try {
    const exportData = await buildGlobalExport(data);
    downloadJSON(`simtlv-full-old-plus-global-${Date.now()}.json`, exportData);
  } catch (err) {
    setExportStatus("");
    alert("שגיאה ביצוא: " + String(err.message || err));
  }
}


/* ═══════════════════════════════════════════════════════════════════════
   § 13. PAYMENT LINK BUILDERS
   Every URL a customer might see is built here (or in the topup builders
   of §16). ALL of them must carry ?ref=REFERRAL_CODE.

   Two distinct URL families:
     * Direct app links (app.simtlv.co.il) — verified against the live
       API. {ISOs} accepts a comma-joined, URL-encoded list (DE%2CEG):
         eSIM:  {app}/{ISOs}/{gb}gb/esim/{token}?ref=…
         pSIM:  {app}/{ISOs}/{gb}gb/physical/{id}?ref=…
         chooser (customer picks the plan): {app}/{ISOs}?ref=…
       The token/id is the package `id` from the zone that priced the
       card.
     * WooCommerce checkout links (simtlv.co.il/checkout/?add-to-cart=…)
       — fly_countries uses PIPE separators (KH|VN), never commas;
       country_name_in_region carries pipe-joined Hebrew names;
       your_iccid / quantity / empty_cart behave as expected.
   ═══════════════════════════════════════════════════════════════════════ */

/** Builds the direct payment link for one gigaboost plan.
 *  @param {"esim"|"physical"} type
 *  @param {number} gbAmount - plan size in GB
 *  The plan id is looked up in the HIGHEST per-type zone among the
 *  selection (three-zone model); the URL covers ALL selected countries.
 *  Falls back to a legacy constructed URL if the API entry had no id. */
function buildOrderLink(type, gbAmount) {
  if (!selected.length) return "";

  const zoneField = type === "esim" ? "esimZone" : "physicalZone";
  const topZone = Math.max(...selected.map(c => c[zoneField] ?? c.zone));
  const country = selected.find(c => (c[zoneField] ?? c.zone) === topZone) || selected[0];
  const plan = (country.plans[type === "esim" ? "esim" : "physical"] || [])
    .find(p => Number(p.dataGB) === Number(gbAmount));
  const isoSegment = encodeURIComponent(selected.map(c => c.iso).join(","));

  if (plan && plan.appId !== undefined && plan.appId !== null && plan.appId !== "") {
    const kind = type === "esim" ? "esim" : "physical";
    return `${CUSTOMER_APP_BASE}/${isoSegment}/${gbAmount}gb/${kind}/${plan.appId}?ref=${REFERRAL_CODE}`;
  }

  // Fallback: old constructed link if the API entry had no id.
  const base = type === "esim"
    ? `${CUSTOMER_APP_BASE}/esim/package`
    : `${CUSTOMER_APP_BASE}/physicalsim/package`;
  return `${base}?ref=${REFERRAL_CODE}&countries=${isoSegment}&plan=${gbAmount}gb`;
}

/** Generic chooser link — the customer picks the plan themselves; the
 *  URL covers all selected countries. */
function buildGenericAppLink() {
  if (!selected.length) return "";
  const isoSegment = encodeURIComponent(selected.map(c => c.iso).join(","));
  return `${CUSTOMER_APP_BASE}/${isoSegment}?ref=${REFERRAL_CODE}`;
}

/** 🔗 button handler: opens a plan's direct payment link. */
function openOrderLink(type, gbAmount) {
  const url = buildOrderLink(type, gbAmount);
  if (url) window.open(url, "_blank");
}

/** 📋 button handler: copies a plan's direct payment link. */
function copyOrderLink(type, gbAmount) {
  const url = buildOrderLink(type, gbAmount);
  if (url) copyText(url);
}

/** Adapts a WooCommerce checkout URL to the current selection/settings:
 *    * fly_countries ← the given ISOs, SORTED and pipe-joined (KH|VN);
 *    * ref ← REFERRAL_CODE (always);
 *    * empty_cart ← forceEmptyCart (defaults to the cart toggle);
 *    * quantity — ONLY meaningful for base products: an explicit
 *      quantityOverride wins, else base links use the cart's quantity,
 *      and DEAL LINKS GET NONE (business rule #1 — the bundle already
 *      contains the full quantity; qty=2 on a pair would bill 4 SIMs).
 *  Pipes are kept literal (KH|VN, not KH%7CVN) to match the real site.
 *  Falls back to string surgery when the URL doesn't parse. */
function buildCheckoutUrl(url, isBase, isos, quantityOverride = null, forceEmptyCart = cartSettings.emptyCart) {
  if (!url) return url;
  const list = (isos || []).slice().sort();   // stable order, e.g. KH|VN

  const explicitQty = quantityOverride !== null && quantityOverride !== undefined;
  const qty = explicitQty
    ? parseInt(quantityOverride, 10)
    : (isBase ? parseInt(cartSettings.quantity || 1, 10) : null);

  try {
    const u = new URL(url);
    if (list.length) u.searchParams.set("fly_countries", list.join("|"));
    u.searchParams.set("ref", REFERRAL_CODE);

    if (forceEmptyCart) u.searchParams.set("empty_cart", "true");
    else u.searchParams.delete("empty_cart");

    if (Number.isFinite(qty) && qty > 1) u.searchParams.set("quantity", String(qty));
    else if (explicitQty || isBase) u.searchParams.set("quantity", "1");

    // Keep the pipe readable like the real site (KH|VN, not KH%7CVN).
    return u.toString().replace(/%7C/gi, "|");
  } catch (e) {
    let out = String(url);
    if (list.length) {
      out = out.includes("fly_countries=")
        ? out.replace(/fly_countries=[^&]*/g, `fly_countries=${list.join("|")}`)
        : out + (out.includes("?") ? "&" : "?") + `fly_countries=${list.join("|")}`;
    }
    const joiner = out.includes("?") ? "&" : "?";
    if (forceEmptyCart && !out.includes("empty_cart=")) out += `${joiner}empty_cart=true`;
    return out;
  }
}

/** Extracts the interesting query parameters from a checkout URL (used
 *  by the topup meta line to show what a catalog's links carry). */
function getCheckoutUrlInfo(url) {
  const out = { flyCountries: "", productZone: "", physicalSimType: "", countryNameInRegion: "" };
  if (!url) return out;
  try {
    const u = new URL(url);
    out.flyCountries = u.searchParams.get("fly_countries") || "";
    out.productZone = u.searchParams.get("product_zone") || "";
    out.physicalSimType = u.searchParams.get("physical_sim_type") || "";
    out.countryNameInRegion = u.searchParams.get("country_name_in_region") || "";
  } catch (e) {}
  return out;
}

/* ---- Price comparison + display formatting ------------------------------ */

/** The old app-link API's price (in ILS) for the same size/type, used to
 *  badge manual-site rows as cheaper/dearer. eSIM prices arrive in USD
 *  and are converted at the current rate. Null when no comparable plan. */
function getOldComparablePriceILS(country, simType, dataGB) {
  if (!country) return null;

  if (simType === "esim") {
    const match = (country.plans.esim || []).find(p => Number(p.dataGB) === Number(dataGB));
    return match ? round2(Number(match.priceUSD) * USD_TO_ILS) : null;
  }

  if (simType === "physical_sim") {
    const match = (country.plans.physical || []).find(p => Number(p.dataGB) === Number(dataGB));
    return match ? Number(match.priceILS) : null;
  }

  return null;
}

/** Price badge markup comparing manual-site vs old-API price
 *  (green = site cheaper, red = site dearer, gray = same). */
function comparePriceMark(newPrice, oldPrice) {
  if (!oldPrice || !newPrice) return "";

  const diff = round2(newPrice - oldPrice);

  if (diff < 0) {
    return `<span class="price-badge good best">האתר זול ב-${Math.abs(diff)}₪ לכל סים</span>`;
  }

  if (diff > 0) {
    return `<span class="price-badge bad">האתר יקר ב-${diff}₪</span>`;
  }

  return `<span class="price-badge same">זהה</span>`;
}

/** The cheapest deal of a package by per-unit price (ties broken by
 *  smaller quantity). Null when the package has no deals. */
function getBestDeal(pkg) {
  if (!pkg.deals || !pkg.deals.length) return null;
  return [...pkg.deals].sort((a,b) => a.perUnitILS - b.perUnitILS || a.quantity - b.quantity)[0];
}

/** Short human label for a deal ("זוג ב99 ש"ח" / "3 יח׳ ב…"). */
function formatDealShort(deal) {
  if (!deal) return "";
  if (deal.quantity === 2) return `זוג ב${deal.totalILS} ש"ח`;
  return `${deal.quantity} יח׳ ב${deal.totalILS} ש"ח`;
}

/** One copy-format line for a manual-site package.
 *  ⚠ Customer-facing copy format (business rule #7): en-dash separators,
 *  ₪ before the number. Deals append in the same dash style. */
function formatGlobalPlanLine(pkg) {
  const parts = [
    `${pkg.dataGB} גיגה`,
    `${pkg.validityDays} ימים`,
    `₪${pkg.base.totalILS}`
  ];

  const bestDeal = getBestDeal(pkg);
  if (bestDeal) {
    parts.push(`${formatDealShort(bestDeal)} (₪${bestDeal.perUnitILS} לכרטיס)`);
  }

  return parts.join(" – ");
}

/** Copy-format text block for a whole package list (one line each). */
function formatGlobalPlanListText(displayPackages) {
  return (displayPackages || []).map(formatGlobalPlanLine).join("\n");
}


/* ═══════════════════════════════════════════════════════════════════════
   § 14. ORDER BUILDER (the cart)
   Rows on the בסיסי / topup cards can set a quantity ("קבע"), adding a
   line to the generated order. One order can mix physical SIMs, eSIMs,
   and topups. Lines are SELF-CONTAINED (own resolved checkoutUrl) so
   they survive re-renders and tab switches — see orderPackageRegistry's
   lifetime warning in § 2.
   ═══════════════════════════════════════════════════════════════════════ */

/** Registers a visible package row so its qty control can find the
 *  package later. Key = type + product + size + validity (sanitized).
 *  Registry entries live only until the next render. */
function registerOrderPackage(simType, pkg, isos) {
  const key = [simType, pkg.base?.productId || "noid", pkg.dataGB, pkg.validityDays]
    .join("_")
    .replace(/[^a-zA-Z0-9_\-]/g, "_");
  orderPackageRegistry[key] = { simType, pkg, isos: (isos || []).slice().sort() };
  return key;
}

/** The quantity already in the cart for a registry key ("" when none) —
 *  used to prefill the row's qty input after re-renders. */
function getBuilderQtyForKey(key) {
  const item = orderBuilderItems.find(x => x.key === key);
  return item ? item.qty : "";
}

/** Picks how to order `qty` units of a package:
 *    * a deal whose quantity EXACTLY matches → use the bundle URL
 *      (cheapest such deal), flagged isBase:false / source:"deal";
 *    * otherwise → the base URL with a quantity multiplier.
 *  The isBase/source flags drive business rule #1 downstream. */
function chooseOrderVariant(pkg, qty) {
  const exactDeal = (pkg.deals || [])
    .filter(d => d.checkoutUrl && Number(d.quantity) === Number(qty))
    .sort((a,b) => a.perUnitILS - b.perUnitILS)[0];

  if (exactDeal) {
    return {
      isBase: false,
      source: "deal",
      checkoutUrl: exactDeal.checkoutUrl,
      productId: exactDeal.productId,
      perUnitILS: exactDeal.perUnitILS,
      totalILS: exactDeal.totalILS,
      sourceLabel: formatDealShort(exactDeal)
    };
  }

  return {
    isBase: true,
    source: "base",
    checkoutUrl: pkg.base?.checkoutUrl,
    productId: pkg.base?.productId,
    perUnitILS: pkg.base?.perUnitILS,
    totalILS: round2((pkg.base?.perUnitILS || 0) * qty),
    sourceLabel: "מחיר יחיד לפי מספר"
  };
}

/** "קבע" handler for בסיסי rows: reads the row's qty input and replaces
 *  that package's cart line (qty ≤ 0 just removes it). Lines are sorted
 *  physical-first, then by size. */
function setPackageOrderQuantity(key) {
  const entry = orderPackageRegistry[key];
  if (!entry) return;

  const input = document.getElementById(`qty_${key}`);
  const qty = parseInt(input?.value, 10);

  orderBuilderItems = orderBuilderItems.filter(x => x.key !== key);

  if (!Number.isFinite(qty) || qty <= 0) {
    renderAll();
    return;
  }

  const { simType, pkg, isos } = entry;
  const variant = chooseOrderVariant(pkg, qty);

  if (!variant.checkoutUrl) {
    alert("אין קישור הזמנה לחבילה הזו");
    return;
  }

  const label = `${simTypeHebrew(simType)} ${pkg.dataGB}GB ×${qty} · ${variant.perUnitILS}₪ ליח׳ · ${variant.sourceLabel}`;

  orderBuilderItems.push({
    key,
    simType,
    dataGB: pkg.dataGB,
    validityDays: pkg.validityDays,
    qty,
    label,
    checkoutUrl: variant.checkoutUrl,
    productId: variant.productId,
    isBase: variant.isBase,
    isos,
    perUnitILS: variant.perUnitILS,
    totalILS: variant.totalILS,
    source: variant.source
  });

  orderBuilderItems.sort((a,b) => {
    if (a.simType !== b.simType) return a.simType === "physical_sim" ? -1 : 1;
    return a.dataGB - b.dataGB;
  });

  renderAll();
}

/** Removes one cart line (the ✕ on a builder row). */
function removeOrderBuilderItem(key) {
  orderBuilderItems = orderBuilderItems.filter(x => x.key !== key);
  renderAll();
}

/** Empties the cart (the "נקה הכל" button). */
function clearOrderBuilder() {
  orderBuilderItems = [];
  renderAll();
}

/** The FINAL checkout URL for one order item, applying the rules that
 *  keep multi-item orders correct:
 *    * deal lines get NO quantity multiplier (business rule #1 — this is
 *      the most financially dangerous regression in the codebase);
 *    * empty_cart=true goes on the FIRST item only, so item 2+ doesn't
 *      wipe item 1 out of the cart;
 *    * topup lines route through buildTopupCheckoutUrl with their OWN
 *      per-line ICCID (multi-card orders). */
function buildOrderItemUrl(item, index) {
  const isFirst = index === 0;
  // A "deal" checkout URL points at a bundle product (e.g. a pair) that
  // already contains the full quantity — adding quantity=N would order
  // N bundles (4 SIMs billed as 2).
  const isDeal = item.source === "deal" || item.isBase === false;
  const urlQty = isDeal ? 1 : item.qty;
  if (item.preserveUrl || item.topup) {
    return buildTopupCheckoutUrl(item.checkoutUrl, urlQty, isFirst && cartSettings.emptyCart, item.topupIccid || topupState.customerIccid || topupState.iccid || "");
  }
  return buildCheckoutUrl(item.checkoutUrl, item.isBase, item.isos || selected.map(c => c.iso), urlQty, isFirst && cartSettings.emptyCart);
}

/* ---- Shareable generated-order link --------------------------------------
   The whole cart can be encoded into a URL: open it anywhere and the
   page boots straight into the standalone order portal (§15). */

/** Encodes a payload object as URL-safe base64 (UTF-8 safe, no padding). */
function encodeOrderPayload(payload) {
  const json = JSON.stringify(payload);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  return encoded.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
}

/** Reverses encodeOrderPayload (restores padding, then decodes). */
function decodeOrderPayload(value) {
  const padded = String(value || "").replace(/-/g, "+").replace(/_/g, "/") + "===".slice((String(value || "").length + 3) % 4);
  return JSON.parse(decodeURIComponent(escape(atob(padded))));
}

/** The shareable order link for the current cart: this page's own URL
 *  with the encoded payload as its only query parameter. */
function getGeneratedOrderLink() {
  const payload = {
    version: 4,
    emptyCart: cartSettings.emptyCart,
    items: orderBuilderItems.map(item => ({
      label: item.label,
      checkoutUrl: item.checkoutUrl,
      qty: item.qty,
      isBase: item.isBase,
      isos: item.isos,
      totalILS: item.totalILS,
      preserveUrl: !!item.preserveUrl,
      topup: !!item.topup,
      topupIccid: item.topupIccid || "",
      topupProfile: item.topupProfile || ""
    }))
  };
  const url = new URL(window.location.href);
  url.search = "";
  url.hash = "";
  url.searchParams.set(ORDER_PAYLOAD_PARAM, encodeOrderPayload(payload));
  return url.toString();
}

/** Copies the shareable order link (cart drawer button). */
function copyGeneratedOrderLink() {
  if (!orderBuilderItems.length) {
    alert("אין פריטים להזמנה");
    return;
  }
  copyText(getGeneratedOrderLink());
  setExportStatus("קישור הזמנה משולבת הועתק ללוח.");
}


/* ═══════════════════════════════════════════════════════════════════════
   § 15. ORDER RUNNER
   Adds every cart item to the real site's cart, one navigation at a
   time, then lands on checkout.

   ⚠ POPUP DISCIPLINE (business rule #6): browsers allow ONE popup per
   user gesture. The runner opens a single NAMED background window
   synchronously inside the click, then RE-NAVIGATES it per item —
   re-navigating an existing window needs no popup permission, so any
   number of items works with exactly one popup. The previous N-windows
   approach silently dropped middle items on 3+ item orders. Any new
   multi-navigation feature must reuse this pattern.
   ═══════════════════════════════════════════════════════════════════════ */

/** Markup for the runner card (item list + progress dots). Also used by
 *  the standalone portal, where showButton adds the big checkout CTA. */
function orderRunnerMarkup(items, title = "Your Order is Ready", status = "Tap below to add everything to your cart.", showButton = false) {
  const itemRows = items.map(item => `
    <div class="order-runner-item">
      <span class="order-runner-dot"></span>
      <span>${escapeHtml(item.label)}</span>
      <span class="order-runner-qty">Qty: ${escapeHtml(item.qty)}</span>
    </div>
  `).join("");

  const dots = items.map((_, i) => `<span id="orderDot_${i}"></span>`).join("");

  return `
    <div class="order-runner-card">
      <button class="order-runner-close" onclick="closeOrderOverlay()" title="סגור">×</button>
      <div class="order-runner-logo">Sim<span>TLV</span></div>
      <div class="order-runner-sub">Generated Order</div>
      <div class="order-runner-icon" id="orderRunnerIcon">🛒</div>
      <div class="order-runner-title" id="orderRunnerTitle">${escapeHtml(title)}</div>
      <div class="order-runner-status" id="orderRunnerStatus">${escapeHtml(status)}</div>
      <div class="order-runner-items">${itemRows}</div>
      <div class="order-runner-progress" id="orderRunnerProgress">${dots}</div>
      ${showButton ? `<button class="run-order" onclick="startGeneratedOrderItems(window.__standaloneOrderItems || [])">Proceed to Checkout →</button>` : ""}
    </div>
  `;
}

/** Shows the full-screen runner overlay (created lazily, reused after). */
function openOrderOverlay(items) {
  let overlay = document.getElementById("orderOverlay");
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "orderOverlay";
    overlay.className = "order-overlay";
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = orderRunnerMarkup(items, "Preparing your order", "Please keep this page open while each item is added.");
  overlay.classList.add("is-open");
}

/** Hides the runner overlay. */
function closeOrderOverlay() {
  const overlay = document.getElementById("orderOverlay");
  if (overlay) overlay.classList.remove("is-open");
}

/** Updates the progress dots: done / active / pending. */
function setOrderRunnerProgress(activeIndex, itemsLength) {
  for (let i = 0; i < itemsLength; i++) {
    const dot = document.getElementById(`orderDot_${i}`);
    if (!dot) continue;
    dot.className = i < activeIndex ? "done" : (i === activeIndex ? "active" : "");
  }
}

/** Updates the runner card's title / status line / icon. */
function setOrderRunnerText(title, status, icon = "🛒") {
  const titleEl = document.getElementById("orderRunnerTitle");
  const statusEl = document.getElementById("orderRunnerStatus");
  const iconEl = document.getElementById("orderRunnerIcon");
  if (titleEl) titleEl.textContent = title;
  if (statusEl) statusEl.textContent = status;
  if (iconEl) iconEl.textContent = icon;
}

/** Runs a generated order. MUST be called from inside a user gesture
 *  (the popup permission depends on it). Flow:
 *    1. open ONE named background window ("simtlv_bg_runner") — if the
 *       browser blocks it, ABORT with an explanatory alert rather than
 *       place a partial order;
 *    2. navigate it to each item's URL (empty_cart only on the first —
 *       see buildOrderItemUrl), pacing with sleepOrder so the site can
 *       process each add-to-cart;
 *    3. close the helper window and send THIS page to the final item's
 *       URL, which lands on checkout with the full cart. */
async function startGeneratedOrderItems(items) {
  if (!items || !items.length) {
    alert("אין פריטים להזמנה");
    return;
  }

  openOrderOverlay(items);

  const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
    || (navigator.maxTouchPoints > 1);
  // Desktop: shove the helper window off-screen. Mobile: default features
  // (tiny off-screen popups aren't honored there anyway).
  const features = isMobile ? "" : "width=1,height=1,left=-9999,top=-9999";

  let bg = null;
  if (items.length > 1) {
    try { bg = window.open("about:blank", "simtlv_bg_runner", features); } catch (e) { bg = null; }
    if (!bg) {
      closeOrderOverlay();
      alert("הדפדפן חסם את חלון הרקע. אשר חלונות קופצים (Popups) לאתר הזה ונסה שוב.");
      return;
    }
    try { bg.blur(); window.focus(); } catch (e) {}
  }

  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    const url = buildOrderItemUrl(item, i);

    setOrderRunnerProgress(i, items.length);
    setOrderRunnerText(i === 0 ? "Preparing your order" : "Almost there", `Adding ${item.label}…`, "🛒");

    if (i < items.length - 1) {
      // Middle items: re-navigate the SAME background window.
      try { bg.location.href = url; bg.blur(); window.focus(); } catch (e) {}
      await sleepOrder(3600);
    } else {
      // Final item: close the helper and take this page to checkout.
      try { if (bg && !bg.closed) bg.close(); } catch (e) {}
      setOrderRunnerText("Loading checkout", "Final item is being added. Redirecting to checkout…", "✨");
      setOrderRunnerProgress(items.length - 1, items.length);
      await sleepOrder(700);
      window.location.href = url;
    }
  }
}

/** "צור הזמנה אוטומטית" handler: runs the current cart. */
function startGeneratedOrderFromBuilder() {
  startGeneratedOrderItems(orderBuilderItems.slice());
}

/** Boots the page as a STANDALONE ORDER PORTAL (URL carries
 *  ORDER_PAYLOAD_PARAM): decodes the payload, adds body.order-mode
 *  (which hides all normal chrome — extend its CSS display:none list if
 *  you add new chrome), and shows only the runner card with a checkout
 *  button. Invalid payloads get a friendly error card. */
function renderStandaloneOrderPortal() {
  const loadingEl = document.getElementById("loading");
  if (loadingEl) loadingEl.style.display = "none";

  let items = [];
  try {
    const raw = new URLSearchParams(window.location.search).get(ORDER_PAYLOAD_PARAM);
    const payload = decodeOrderPayload(raw);
    cartSettings.emptyCart = payload.emptyCart !== false;
    items = Array.isArray(payload.items) ? payload.items : [];
  } catch (e) {
    items = [];
  }

  window.__standaloneOrderItems = items;
  document.body.classList.add("order-mode");
  const container = document.querySelector(".app");
  if (!container) return;

  if (!items.length) {
    container.innerHTML = `<div class="order-runner-card"><div class="order-runner-title">Link error</div><div class="order-runner-status">Missing or invalid order data.</div></div>`;
    return;
  }

  container.innerHTML = `<div class="standalone-order-card">${orderRunnerMarkup(items, "Your Order is Ready", "Your generated bundle is ready. Tap below to add everything to the cart.", true)}</div>`;
}


/* ═══════════════════════════════════════════════════════════════════════
   § 16. TOP-UP SYSTEM
   Topping up existing customer cards. The workflow:
     1. The operator picks a SIM version (or types an ICCID and lets the
        autodetector pick it — see ICCID_TYPE_PREFIXES in §1).
     2. A catalog for that version is loaded, ONCE, from cache or by
        probing the site with a known sample ICCID:
          * esim_v3 — no scan at all; derived from the manual-site eSIM
            prices already cached per zone (§11);
          * psim_v2 — one scan per price zone via the zone's
            representative country;
          * psim_v1 — one scan via Germany, valid for all of Europe.
     3. The catalog's checkout URLs are "materialized" for the current
        selection: fly_countries / product_zone / country names are
        rewritten, the probe ICCID is swapped for the CUSTOMER's ICCID,
        and the referral code is stamped on.
   Business rules #2–#5 (REUP, probe-ISO scrub, highest-zone-only,
   per-ICCID cart keys) are all enforced in this section — the enforcing
   lines are marked with ⚠ comments.
   ═══════════════════════════════════════════════════════════════════════ */

/* ---- ICCID basics ------------------------------------------------------- */

/** Strips non-digits and caps at 24 digits (ICCIDs are 18–22; the cap
 *  just guards against garbage paste). */
function normalizeIccid(value) {
  return String(value || "").replace(/\D/g, "").slice(0, 24);
}

/** Display-shortened ICCID: "894801…1457". */
function shortIccid(iccid) {
  const value = String(iccid || "");
  return value.length > 8 ? `${value.slice(0, 6)}…${value.slice(-4)}` : value;
}

/* ---- Topup state bootstrap ---------------------------------------------- */

/** Lazily initializes the topup tab's auto-mode fields on topupState
 *  (idempotent — guarded by autoModeReady). Restores the last chosen SIM
 *  version + customer ICCID, and loads the persisted catalog cache
 *  (falling back to the legacy store so upgrades keep their cache). */
function ensureAutoTopupState() {
  if (!topupState.autoModeReady) {
    topupState.autoModeReady = true;
    topupState.simVersion = localStorage.getItem(TOPUP_SELECTED_VERSION_STORAGE_KEY) || topupState.simVersion || "esim_v3";
    topupState.customerIccid = normalizeIccid(localStorage.getItem(TOPUP_CUSTOMER_ICCID_STORAGE_KEY) || topupState.customerIccid || topupState.iccid || "");
    topupState.iccid = topupState.customerIccid;
    topupState.batchMode = topupState.batchMode || false;
    topupState.batchRaw = topupState.batchRaw || "";
    topupState.batchIccids = topupState.batchIccids || [];
    topupState.catalogCache = {};
    topupState.autoPreloadStarted = false;
    topupState.autoPreloading = false;
    topupState.autoPreloadDone = false;
    topupState.autoPreloadMessage = "";
    topupState.autoPreloadErrors = [];
    topupState.autoEnsureRunning = false;

    try {
      const saved = localStorage.getItem(TOPUP_AUTO_CATALOG_STORAGE_KEY) || localStorage.getItem(TOPUP_VERSION_CATALOG_STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === "object") topupState.catalogCache = parsed;
      }
    } catch (e) {
      console.warn("Could not load automatic topup catalog cache", e);
    }
  }
}

/** Persists the topup catalog cache. */
function persistTopupCatalogCache() {
  try {
    localStorage.setItem(TOPUP_AUTO_CATALOG_STORAGE_KEY, JSON.stringify(topupState.catalogCache || {}));
  } catch (e) {
    console.warn("Could not save automatic topup catalog cache", e);
  }
}

/* ---- Version selection + ICCID autodetection ----------------------------- */

/** The active version profile (falls back to esim_v3 on bad state). */
function getTopupProfile() {
  ensureAutoTopupState();
  return TOPUP_VERSION_PROFILES[topupState.simVersion] || TOPUP_VERSION_PROFILES.esim_v3;
}

/** Switches the topup SIM version, refreshes the shown catalog, and
 *  persists the choice. */
function setTopupVersion(version) {
  ensureAutoTopupState();
  topupState.simVersion = TOPUP_VERSION_PROFILES[version] ? version : "esim_v3";
  topupState.catalogResult = getCurrentTopupCatalog();
  topupState.result = topupState.catalogResult;
  topupState.error = "";
  try { localStorage.setItem(TOPUP_SELECTED_VERSION_STORAGE_KEY, topupState.simVersion); } catch (e) {}
  renderAll();
}

/** SIM type for an ICCID via longest-matching-prefix over
 *  ICCID_TYPE_PREFIXES. Returns null when unknown — callers MUST NOT
 *  auto-switch on null. */
function detectSimTypeFromIccid(iccid) {
  const ic = normalizeIccid(iccid);
  if (ic.length < 13) return null; // the tricky families need 13 digits
  let best = null;
  for (const rule of ICCID_TYPE_PREFIXES) {
    if (ic.startsWith(rule.prefix) && (!best || rule.prefix.length > best.prefix.length)) best = rule;
  }
  return best ? best.type : null;
}

/** Auto-switches the version selector to match a typed ICCID.
 *  Fires only on a FULL ICCID (≥18 digits) so the selector doesn't
 *  flicker mid-typing, and announces the switch with a toast. */
function autoDetectAndSwitchSimType(iccid) {
  const ic = normalizeIccid(iccid);
  if (ic.length < 18) return; // wait for a full ICCID — no flicker mid-typing
  const type = detectSimTypeFromIccid(ic);
  if (!type) return;
  ensureAutoTopupState();
  if (topupState.simVersion === type) return;
  setTopupVersion(type);
  showCopyToast(`🔍 זוהה ${TOPUP_VERSION_PROFILES[type].label} — הוחלף אוטומטית`);
}

/** ICCID input handler. ⚠ Deliberately does NOT re-render by default:
 *  renderAll would recreate the input and destroy focus mid-typing (see
 *  the rendering-model note in the header). State + storage + detection
 *  only; pass rerender=true for programmatic updates. */
function setTopupCustomerIccid(value, rerender = false) {
  ensureAutoTopupState();
  const iccid = normalizeIccid(value);
  topupState.customerIccid = iccid;
  topupState.iccid = iccid;
  const input = document.getElementById("topupIccid");
  if (input && input.value !== iccid) input.value = iccid;
  try { localStorage.setItem(TOPUP_CUSTOMER_ICCID_STORAGE_KEY, iccid); } catch (e) {}
  autoDetectAndSwitchSimType(iccid);
  if (rerender) renderAll();
}

/* ---- Batch mode ------------------------------------------------------------
   Paste many ICCIDs, one per line; "קבע" then adds a cart line per card. */

/** Shows/hides the batch textarea. */
function toggleTopupBatchMode() {
  ensureAutoTopupState();
  topupState.batchMode = !topupState.batchMode;
  renderAll();
}

/** Batch textarea handler: parses ICCIDs (18+ digits, split on newlines/
 *  commas/semicolons). ⚠ Like the ICCID input, this must NOT re-render —
 *  the counter on the toggle button is updated via direct DOM instead.
 *  Preserve this pattern for any new live-typed field. */
function setTopupBatchIccids(value) {
  ensureAutoTopupState();
  topupState.batchRaw = String(value || "");
  topupState.batchIccids = topupState.batchRaw
    .split(/[\n,;]+/)
    .map(s => normalizeIccid(s))
    .filter(ic => ic.length >= 18);
  // Live-update the counter on the toggle without a focus-stealing re-render.
  const btn = document.querySelector(".topup-batch-toggle");
  if (btn) btn.textContent = `📚 מרובה${topupState.batchIccids.length ? ` · ${topupState.batchIccids.length}` : ""}`;
  if (topupState.batchIccids.length) autoDetectAndSwitchSimType(topupState.batchIccids[0]);
}

/* ---- Selection helpers (highest-zone rule) ------------------------------- */

/** The raw selection (kept as a function so call sites read uniformly). */
function getTopupCountries() {
  return selected.slice();
}

/** Canonical key for a set of countries: sorted ISOs, pipe-joined. */
function getTopupCountryKey(countries = getTopupCountries()) {
  return countries.map(c => c.iso).sort().join("|");
}

/** Cache key for one ICCID + country set (used on scan results). */
function getTopupCacheKeyFor(iccid, countries = getTopupCountries()) {
  return `${normalizeIccid(iccid)}|${getTopupCountryKey(countries)}`;
}

/** ⚠ Business rule #4: topups operate on the HIGHEST-zone selection
 *  only, mirroring how base plan cards behave with mixed selections.
 *  Without this, a mixed-zone selection (e.g. US zone 1 + JP zone 2)
 *  would put off-zone ISOs into fly_countries while pricing against the
 *  top zone. */
function getSelectedTopupCountries() {
  const zone = getHighestZone();
  if (zone === null) return [];
  return selected.filter(c => c.zone === zone);
}

/** The zone topups price against (the highest general zone). */
function getSelectedTopupZone() {
  return getHighestZone();
}

/** Same filter as getSelectedTopupCountries with explicit Number
 *  coercion — used where zone values may arrive as strings. */
function getSelectedTopupActiveCountries() {
  const zone = getSelectedTopupZone();
  if (zone === null) return [];
  return selected.filter(c => Number(c.zone) === Number(zone));
}

/** Pipe-joined HEBREW names of the active topup countries — the value
 *  the checkout URL's country_name_in_region parameter expects. */
function getSelectedTopupCountryNamesForUrl() {
  return getSelectedTopupCountries()
    .map(c => c.name?.he || c.name?.en || c.iso)
    .filter(Boolean)
    .join("|");
}

/** First country of a zone (used as that zone's scan representative). */
function getZoneRepresentative(zone) {
  const z = Number(zone);
  return data.find(c => Number(c.zone) === z) || null;
}

/** One { zone, country } representative for EVERY zone, zone-sorted
 *  (drives the automatic V2 all-zones preload). */
function getAllZoneRepresentatives() {
  const byZone = new Map();
  data.forEach(country => {
    const z = Number(country.zone);
    if (!byZone.has(z)) byZone.set(z, country);
  });
  return [...byZone.entries()]
    .sort((a,b) => Number(a[0]) - Number(b[0]))
    .map(([zone, country]) => ({ zone: Number(zone), country }));
}

/* ---- Catalog cache keys ---------------------------------------------------
   V3/V2 catalogs are per ZONE (prices are zone-wide); V1 has exactly one
   Europe-wide catalog probed via Germany. */

/** Catalog cache key for the CURRENT selection + a profile. */
function getTopupCatalogKey(countries = getTopupCountries(), simVersion = getTopupProfile().id) {
  const profileId = simVersion || "esim_v3";
  if (profileId === "esim_v3") {
    const zone = getSelectedTopupZone();
    return zone === null ? "esim_v3|none" : `esim_v3|zone:${zone}`;
  }
  if (profileId === "psim_v2") {
    const zone = getSelectedTopupZone();
    return zone === null ? "psim_v2|none" : `psim_v2|zone:${zone}`;
  }
  if (profileId === "psim_v1") return "psim_v1|europe:DE";
  return `${profileId}|${getTopupCountryKey(countries)}`;
}

/** Catalog cache key for an EXPLICIT zone (preload loops). */
function getTopupCatalogKeyForZone(profileId, zone) {
  if (profileId === "psim_v2") return `psim_v2|zone:${Number(zone)}`;
  if (profileId === "esim_v3") return `esim_v3|zone:${Number(zone)}`;
  if (profileId === "psim_v1") return "psim_v1|europe:DE";
  return `${profileId}|zone:${Number(zone)}`;
}

/* ---- V1 Europe restriction ------------------------------------------------ */

/** Is this country allowed for V1 pSIM? (ISO or Hebrew-name match.) */
function isV1CountryAllowed(country) {
  const iso = String(country?.iso || "").toUpperCase();
  const he = String(country?.name?.he || "").trim();
  return TOPUP_V1_EUROPE_ALLOWED_ISOS.has(iso) || TOPUP_V1_EUROPE_ALLOWED_HE.has(he);
}

/** The subset of `countries` V1 does NOT allow. */
function getV1DisallowedCountries(countries = getTopupCountries()) {
  return (countries || []).filter(c => !isV1CountryAllowed(c));
}

/** Validates the selection for a profile. Returns a user-facing error
 *  string, or "" when the selection is fine. */
function validateTopupSelectionForProfile(profile = getTopupProfile(), countries = getTopupCountries()) {
  if (!countries.length) return "בחר מדינה אחת לפחות.";
  if (profile.id === "psim_v1") {
    const bad = getV1DisallowedCountries(countries);
    if (bad.length) {
      const names = bad.map(c => c.name?.he || c.iso).join(", ");
      return `V1 pSIM מוגבל לאירופה בלבד. היעדים הבאים חסומים ל‑V1: ${names}`;
    }
  }
  return "";
}

/** Germany's entry in the country model (with a safe stub fallback in
 *  case the API ever omits it) — V1's probe country. */
function getV1GermanyCountry() {
  return data.find(c => String(c.iso).toUpperCase() === TOPUP_V1_GERMANY_PROBE_ISO) || {
    iso: "DE",
    name: { he: "גרמניה", en: "Germany" },
    zone: 1,
    plans: { esim: [], physical: [] }
  };
}

/* ---- Manual-site cache lookups (for the V3 derived catalog) --------------- */

/** Any cached manual-site scan belonging to `zone` (null when none). */
function firstGlobalCacheForZone(zone) {
  const rep = data.find(c => Number(c.zone) === Number(zone) && globalCache[c.iso]);
  return rep ? globalCache[rep.iso] : null;
}

/** A selected country with a cached scan, else any cached country of
 *  the selection's zone, else null. */
function getGlobalCacheRepresentativeForSelected() {
  const active = getSelectedTopupActiveCountries();
  return active.find(c => globalCache[c.iso]) || data.find(c => Number(c.zone) === Number(getSelectedTopupZone()) && globalCache[c.iso]) || null;
}

/* ---- Scanning (probe fetches) --------------------------------------------- */

/** The manual site's search_topup URL for one ICCID + country set. */
function buildTopupSearchUrl(iccid, countries) {
  const params = new URLSearchParams();
  params.set("action", "esim_global_ajax");
  params.set("task", "search_topup");
  params.set("on_what_dates", GLOBAL_API_DATE_RANGE);
  countries.forEach(c => params.append("fly_countries[]", c.iso));
  params.set("your_iccid", iccid);
  return MANUAL_SITE_AJAX_URL + "?" + params.toString();
}

/** Fetches + parses the topup catalog the site offers this ICCID for
 *  these countries. */
async function fetchTopupPackages(iccid, countries) {
  const url = buildTopupSearchUrl(iccid, countries);
  const res = await fetch(url);

  if (!res.ok) {
    throw new Error(`Topup ${iccid}: HTTP ${res.status}`);
  }

  const json = await res.json();
  return parseTopupResult(json, iccid, countries, url);
}

/** Parses a search_topup response into a catalog object: the packages
 *  (30-day max, deduped, each stamped isTopup + topupIccid) plus
 *  metadata scraped from the response's hidden debug block (SIM type,
 *  region code/name) used to classify the card and label the panel. */
function parseTopupResult(apiResponse, iccid, countries, requestUrl) {
  const products = parseGlobalProducts(apiResponse, "topup", {
    maxValidityDays: 30,
    dedupe: true
  }).map(pkg => ({ ...pkg, isTopup: true, topupIccid: iccid }));

  // The response HTML hides a debug block with SIMType / region details.
  const html = apiResponse?.data?.products || "";
  const doc = new DOMParser().parseFromString(html, "text/html");
  const hiddenText = (doc.querySelector('div[style*="display:none"]')?.textContent || doc.body?.textContent || "")
    .replace(/\r/g, "\n");

  const simTypeMatch = hiddenText.match(/SIMType:\s*([^\n<]*)/i);
  const simTypeText = (simTypeMatch?.[1] || "").trim();

  const regionCodeMatch = hiddenText.match(/\[country_code\]\s*=>\s*([A-Z0-9]+)/i);
  const regionNameMatch = hiddenText.match(/\[region_name\]\s*=>\s*([^\n]+)/i);
  const caseMatch = hiddenText.match(/case_TV:\s*([^\n<]*)/i);

  const searchPhysical = Number(apiResponse?.data?.search_physical || 0);
  const firstUrl = products[0]?.base?.checkoutUrl || "";
  const checkoutInfo = getCheckoutUrlInfo(firstUrl);

  // Human-facing classification of what kind of card this is.
  let kind = "eSIM topup";
  let kindShort = "eSIM";
  if (searchPhysical) {
    if (simTypeText) {
      kind = `סים פיזי · ${simTypeText}`;
      kindShort = simTypeText.includes("V2") ? "pSIM V2" : "pSIM";
    } else {
      kind = "סים פיזי ישן / אזורי";
      kindShort = "pSIM ישן";
    }
  }

  return {
    key: getTopupCacheKeyFor(iccid, countries),
    iccid,
    requestedCountries: countries.map(c => ({ iso: c.iso, he: c.name.he, en: c.name.en, zone: c.zone })),
    requestUrl,
    rawSuccess: apiResponse?.success === true,
    zone: apiResponse?.data?.zone ?? null,
    searchPhysical,
    simTypeText,
    caseText: (caseMatch?.[1] || "").trim(),
    regionCode: regionCodeMatch?.[1] || checkoutInfo.flyCountries || "",
    regionName: (regionNameMatch?.[1] || "").trim(),
    checkoutInfo,
    kind,
    kindShort,
    packages: products
  };
}

/* ---- URL rewriting (probe → customer) -------------------------------------- */

/** Deep clone via JSON (packages are plain data). */
function clonePackage(pkg) {
  return JSON.parse(JSON.stringify(pkg));
}

/** Clones a package and passes its base + deal URLs through `rewriter`. */
function rewritePackageUrls(pkg, rewriter) {
  const cloned = clonePackage(pkg);
  if (cloned.base?.checkoutUrl) cloned.base.checkoutUrl = rewriter(cloned.base.checkoutUrl, cloned.base.quantity || 1);
  if (Array.isArray(cloned.deals)) {
    cloned.deals = cloned.deals.map(d => ({ ...d, checkoutUrl: rewriter(d.checkoutUrl, d.quantity || 1) }));
  }
  return cloned;
}

/** Rewrites a MANUAL-SITE eSIM URL into a V3 topup URL for the current
 *  selection: fly_countries ← sorted selected ISOs, product_zone ← the
 *  selection's zone, physical-SIM leftovers stripped, quantity and
 *  empty_cart cleared (decided later, per order item), ref stamped. */
function rewriteEsimV3TopupUrlFromManual(url, countries = getSelectedTopupCountries(), zone = getSelectedTopupZone(), quantity = 1) {
  if (!url) return url;
  const isos = (countries || []).map(c => c.iso).filter(Boolean).sort();
  try {
    const u = new URL(url);
    if (isos.length) u.searchParams.set("fly_countries", isos.join("|"));
    if (zone !== null && zone !== undefined) u.searchParams.set("product_zone", String(Number(zone)));
    u.searchParams.delete("physical_sim_type");
    u.searchParams.delete("country_name_in_region");
    u.searchParams.delete("quantity");
    u.searchParams.delete("empty_cart");
    u.searchParams.set("ref", REFERRAL_CODE);
    return u.toString().replace(/%7C/gi, "|");
  } catch (e) {
    return String(url);
  }
}

/** Rewrites a PHYSICAL (V1/V2) topup URL for the current selection.
 *  ⚠ Business rules #2 + #3 are enforced here:
 *    * V1 → fly_countries=REUP, always — never a literal country code;
 *    * V2 → fly_countries = the CUSTOMER's selected ISOs (sorted,
 *      pipe-joined). The catalog was scanned via a zone-representative
 *      probe country (alphabetically first — e.g. UZ for a US-zone
 *      scan); that probe ISO once leaked into customer URLs. */
function rewritePhysicalTopupUrlForSelected(url, profileId, countries = getSelectedTopupCountries()) {
  if (!url) return url;
  const countryNames = getSelectedTopupCountryNamesForUrl();
  try {
    const u = new URL(url);
    if (countryNames) u.searchParams.set("country_name_in_region", countryNames);
    if (profileId === "psim_v1") {
      u.searchParams.set("fly_countries", "REUP");
    } else {
      const isos = (countries || []).map(c => c.iso).filter(Boolean);
      if (isos.length) u.searchParams.set("fly_countries", isos.slice().sort().join("|"));
    }
    u.searchParams.delete("quantity");
    u.searchParams.delete("empty_cart");
    u.searchParams.set("ref", REFERRAL_CODE);
    return u.toString().replace(/%7C/gi, "|");
  } catch (e) {
    return String(url);
  }
}

/* ---- Catalog materialization ------------------------------------------------
   A CACHED catalog belongs to whatever selection it was scanned with.
   "Materializing" deep-clones it and rewrites every URL + metadata field
   for the CURRENT selection, profile, and customer ICCID. */

/** Materializes `catalog` for the current selection (see above). */
function materializeTopupCatalogForSelected(catalog, profile = getTopupProfile()) {
  if (!catalog) return null;
  const countries = getSelectedTopupCountries();
  const zone = getSelectedTopupZone();
  const materialized = JSON.parse(JSON.stringify(catalog));
  materialized.requestedCountries = countries.map(c => ({ iso: c.iso, he: c.name.he, en: c.name.en, zone: c.zone }));
  materialized.profileId = profile.id;
  materialized.profileLabel = profile.label;
  materialized.kind = profile.label;
  materialized.kindShort = profile.short;
  materialized.customerIccid = topupState.customerIccid || "";

  if (profile.id === "esim_v3") {
    materialized.zone = zone;
    materialized.packages = (materialized.packages || []).map(pkg =>
      rewritePackageUrls(pkg, rawUrl => rewriteEsimV3TopupUrlFromManual(rawUrl, countries, zone))
    );
  } else {
    materialized.packages = (materialized.packages || []).map(pkg =>
      rewritePackageUrls(pkg, rawUrl => rewritePhysicalTopupUrlForSelected(rawUrl, profile.id, countries))
    );
  }

  materialized.checkoutInfo = getCheckoutUrlInfo(materialized.packages?.[0]?.base?.checkoutUrl || "");
  return materialized;
}

/** Builds the V3 eSIM topup catalog WITHOUT any topup scan, straight
 *  from the manual-site eSIM prices cached for the selection's zone.
 *  Returns null (and quietly kicks off the missing manual-site fetches)
 *  when that zone isn't cached yet. */
function buildEsimV3CatalogFromManualPrices() {
  ensureAutoTopupState();
  const zone = getSelectedTopupZone();
  const countries = getSelectedTopupCountries();
  if (zone === null || !countries.length) return null;

  const rep = getGlobalCacheRepresentativeForSelected();
  const cached = rep ? globalCache[rep.iso] : firstGlobalCacheForZone(zone);
  if (!cached || !Array.isArray(cached.esim) || !cached.esim.length) {
    // Not cached yet — request the zone's data and let a later render
    // pick the catalog up once it lands.
    const zoneRep = getZoneRepresentative(zone);
    if (zoneRep) ensureGlobalCountry(zoneRep);
    countries.forEach(c => ensureGlobalCountry(c));
    return null;
  }

  const packages = (cached.esim || []).map(pkg => rewritePackageUrls(pkg, rawUrl => rewriteEsimV3TopupUrlFromManual(rawUrl, countries, zone)));
  const firstUrl = packages[0]?.base?.checkoutUrl || "";
  return {
    catalogKey: getTopupCatalogKey(countries, "esim_v3"),
    profileId: "esim_v3",
    profileLabel: TOPUP_VERSION_PROFILES.esim_v3.label,
    kind: TOPUP_VERSION_PROFILES.esim_v3.label,
    kindShort: TOPUP_VERSION_PROFILES.esim_v3.short,
    source: "manual_global_esim_prices_no_topup_scan",
    probeIccid: "manual-prices",
    iccid: "",
    customerIccid: topupState.customerIccid || "",
    requestedCountries: countries.map(c => ({ iso: c.iso, he: c.name.he, en: c.name.en, zone: c.zone })),
    zone,
    searchPhysical: 0,
    simTypeText: "eSIM V3",
    regionCode: countries.map(c => c.iso).sort().join("|"),
    regionName: "",
    checkoutInfo: getCheckoutUrlInfo(firstUrl),
    packages
  };
}

/** Scans a physical catalog by trying each of the profile's probe
 *  ICCIDs in turn until one returns a non-empty catalog. Throws with a
 *  per-probe error summary when all fail. */
async function fetchPhysicalCatalogByProbe(profile, countries, catalogKey) {
  const errors = [];
  for (const probeIccid of profile.probeIccids) {
    try {
      const result = await fetchTopupPackages(probeIccid, countries);
      if (result && Array.isArray(result.packages) && result.packages.length) {
        result.catalogKey = catalogKey;
        result.profileId = profile.id;
        result.profileLabel = profile.label;
        result.probeIccid = probeIccid;
        result.iccid = probeIccid;
        result.customerIccid = topupState.customerIccid || "";
        result.kindShort = profile.short;
        result.kind = profile.label;
        return materializeTopupCatalogForSelected(result, profile) || result;
      }
      errors.push(`${shortIccid(probeIccid)}: empty catalog`);
    } catch (err) {
      errors.push(`${shortIccid(probeIccid)}: ${String(err.message || err)}`);
    }
  }
  throw new Error(`לא הצלחתי לטעון קטלוג ${profile.label}. ${errors.join(" · ")}`);
}

/** Fetches (or derives) the catalog for a profile, routing to the right
 *  strategy: V3 = derive from manual prices, V2 = scan the selection's
 *  zone representative, V1 = validate Europe then scan via Germany. */
async function fetchTopupCatalogByProbe(profile, countries) {
  ensureAutoTopupState();

  if (profile.id === "esim_v3") {
    const catalog = buildEsimV3CatalogFromManualPrices();
    if (catalog) return catalog;
    throw new Error("מחירי eSIM V3 עדיין נטענים מהאתר הידני. זה לא סריקת טופאפ; חכה שהטעינה האוטומטית תסתיים או בחר מדינה שוב.");
  }

  if (profile.id === "psim_v2") {
    const zone = getSelectedTopupZone();
    const rep = getZoneRepresentative(zone);
    if (!rep) throw new Error(`לא נמצאה מדינת נציג לאזור ${zone}`);
    return fetchPhysicalCatalogByProbe(profile, [rep], getTopupCatalogKeyForZone("psim_v2", zone));
  }

  if (profile.id === "psim_v1") {
    const validation = validateTopupSelectionForProfile(profile, getSelectedTopupCountries());
    if (validation) throw new Error(validation);
    return fetchPhysicalCatalogByProbe(profile, [getV1GermanyCountry()], "psim_v1|europe:DE");
  }

  return fetchPhysicalCatalogByProbe(profile, countries, getTopupCatalogKey(countries, profile.id));
}

/** The catalog to SHOW right now: V3 derives fresh from manual prices;
 *  V1/V2 come from the cache, materialized for the current selection.
 *  Null when unavailable (not scanned yet / invalid selection). */
function getCurrentTopupCatalog() {
  ensureAutoTopupState();
  const profile = getTopupProfile();
  if (profile.id === "esim_v3") return buildEsimV3CatalogFromManualPrices();

  const validation = validateTopupSelectionForProfile(profile, getSelectedTopupCountries());
  if (validation) return null;

  const key = getTopupCatalogKey(getSelectedTopupCountries(), profile.id);
  const cached = topupState.catalogCache?.[key] || null;
  return cached ? materializeTopupCatalogForSelected(cached, profile) : null;
}

/** Is a profile's catalog ready for the current selection? */
function isCatalogCachedForProfile(profile, countries = getSelectedTopupCountries()) {
  if (!countries.length) return false;
  if (profile.id === "esim_v3") return !!buildEsimV3CatalogFromManualPrices();
  if (profile.id === "psim_v1" && getV1DisallowedCountries(countries).length) return false;
  return !!topupState.catalogCache?.[getTopupCatalogKey(countries, profile.id)];
}

/** Readiness stats for the "מוכן x/y" chip: how many of the applicable
 *  profiles (V1 drops out for non-Europe selections) are cached. */
function getTopupPreloadStats(countries = getTopupCountries()) {
  ensureAutoTopupState();
  const profiles = Object.values(TOPUP_VERSION_PROFILES).filter(profile => {
    if (profile.id !== "psim_v1") return true;
    return !getV1DisallowedCountries(countries).length;
  });
  const total = profiles.length;
  const cached = profiles.filter(profile => isCatalogCachedForProfile(profile, countries)).length;
  return { total, cached, missing: Math.max(0, total - cached) };
}

/* ---- Preloading -------------------------------------------------------------
   Requested workflow (encoded here on purpose):
     1) V3 eSIM: no topup scan — reuse the manual-site prices;
     2) V2 pSIM: scan once per price zone, automatically on startup;
     3) V1 pSIM: scan Germany only, automatically on startup. */

/** Loads whatever catalogs the CURRENT selection is missing (V2 zone +
 *  V1 if applicable), updating panel progress as jobs finish. Also the
 *  🔍 / 🔄 button handler (forceRefresh re-scans existing catalogs). */
async function preloadTopupsForSelected(forceRefresh = false) {
  ensureAutoTopupState();
  const countries = getSelectedTopupCountries();
  if (!countries.length) {
    topupState.error = "בחר מדינה אחת לפחות לפני טעינת קטלוגים.";
    renderAll();
    return;
  }

  // Collect the scan jobs actually needed.
  const jobs = [];
  const zone = getSelectedTopupZone();
  const v2Key = getTopupCatalogKeyForZone("psim_v2", zone);
  if (forceRefresh || !topupState.catalogCache?.[v2Key]) {
    const rep = getZoneRepresentative(zone);
    if (rep) jobs.push({ profile: TOPUP_VERSION_PROFILES.psim_v2, countries: [rep], key: v2Key, label: `V2 zone ${zone}` });
  }

  const v1Key = "psim_v1|europe:DE";
  if (!getV1DisallowedCountries(countries).length && (forceRefresh || !topupState.catalogCache?.[v1Key])) {
    jobs.push({ profile: TOPUP_VERSION_PROFILES.psim_v1, countries: [getV1GermanyCountry()], key: v1Key, label: "V1 Germany/Europe" });
  }

  // V3 eSIM intentionally has no topup scan — derived from manual prices.
  if (!jobs.length) {
    topupState.preloadMessage = "";
    topupState.preloading = false;
    topupState.error = "";
    topupState.catalogResult = getCurrentTopupCatalog();
    topupState.result = topupState.catalogResult;
    renderAll();
    return;
  }

  topupState.preloading = true;
  topupState.preloadDone = 0;
  topupState.preloadTotal = jobs.length;
  topupState.preloadErrors = 0;
