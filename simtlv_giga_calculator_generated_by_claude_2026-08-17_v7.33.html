        <span class="sw" aria-hidden="true"></span>
        <span>רוקן עגלה</span>
      </label>
      <label class="opt-qty" title="כמות עבור הקישור 'יחיד'">
        <span>כמות</span>
        <input type="number" id="cartQty" min="1" step="1" value="1"
               onchange="setCartQuantity(this.value)" oninput="setCartQuantity(this.value)">
      </label>
      <label class="opt-qty" title="סכום מותאם אישית בדולר — Enter לחישוב">
        <span>$</span>
        <input id="customAmount" type="number" step="0.01" placeholder="סכום"
               onkeydown="if(event.key==='Enter'){renderAll()}">
      </label>
      <label class="opt-qty" title="שער המרה דולר→שקל — משפיע על כל מחירי ה-eSIM">
        <span>₪/$</span>
        <input type="number" id="usdRate" min="0.1" step="0.01" value="3.3"
               onchange="setUsdRate(this.value)">
      </label>
      <label class="opt-qty" title="קוד שותף (affiliate) — משובץ בכל הקישורים. לכל עובד קוד משלו; נשמר בדפדפן.">
        <span>ref</span>
        <input type="text" id="refCode" value="R41IMUNU" autocomplete="off" spellcheck="false"
               style="width:96px;direction:ltr;text-align:left;text-transform:none;"
               onchange="setReferralCode(this.value)">
      </label>
      <button id="masterSimplifyBtn" class="opt-btn is-on" onclick="toggleAllSimplify()">פישוט</button>
      <button class="json-btn" onclick="downloadAllJSON()" title="הורד הכל כ‑JSON">📥 JSON</button>
    </div>
  </header>

  <!-- Status line under the top bar (export/preload progress messages).
       Collapses to nothing when empty — see .topbar-status:empty CSS. -->
  <div id="exportStatus" class="status topbar-status"></div>

  <!-- ░░ TABS ░░
       Keyboard shortcuts: digits 1–9 and 0 (ignored while typing in a field).
       data-tab must match an entry in TAB_IDS in the main script; adding
       a tab means extending TAB_IDS + adding a renderAll branch too. -->
  <nav class="tabs" id="tabsNav">
    <button class="tab-btn" data-tab="basic" onclick="setActiveTab('basic')">תוכניות בסיסי <kbd>1</kbd></button>
    <button class="tab-btn" data-tab="gigaboost" onclick="setActiveTab('gigaboost')">גיגהבוסט <kbd>2</kbd></button>
    <button class="tab-btn" data-tab="copy" onclick="setActiveTab('copy')">העתקות <kbd>3</kbd></button>
    <button class="tab-btn" data-tab="topup" onclick="setActiveTab('topup')">טופאפ <kbd>4</kbd></button>
    <button class="tab-btn" data-tab="deals" onclick="setActiveTab('deals')">🔥 קטלוג <kbd>5</kbd></button>
    <button class="tab-btn" data-tab="tmobile" onclick="setActiveTab('tmobile')">📶 T-Mobile <kbd>6</kbd></button>
    <button class="tab-btn" data-tab="mobyx" onclick="setActiveTab('mobyx')">📞 Mobyx <kbd>7</kbd></button>
    <button class="tab-btn" data-tab="immortal" onclick="setActiveTab('immortal')">♾️ נצח <kbd>8</kbd></button>
    <button class="tab-btn" data-tab="shortcuts" onclick="setActiveTab('shortcuts')">⌨️ קיצורים <kbd>9</kbd></button>
    <button class="tab-btn" data-tab="pickup" onclick="setActiveTab('pickup')">📦 נקודות איסוף <kbd>0</kbd></button>
  </nav>

  <!-- ░░ CONTENT ░░ — renderAll() rebuilds #results on every state
       change (full re-render model; only the ACTIVE tab is built). -->
  <main class="content">
    <div id="results"></div>
  </main>

</div>

<!-- ░░ GB QUICK-COPY POPUP ░░ (v6.4)
     In "field" input mode, arming a copy shortcut (e.g. Ctrl+E) shows this
     fixed popup; the operator types the GB size and Enter copies that plan's
     link. Wired in § 20 (input keydown/blur). Hidden by default. -->
<div id="gbShortcutBar" class="gb-shortcut-bar" hidden>
  <span class="gb-shortcut-icon" aria-hidden="true">⌨️</span>
  <span class="gb-shortcut-label" id="gbShortcutLabel">גודל בג׳יגה</span>
  <input id="gbShortcutInput" class="gb-shortcut-input" type="text" inputmode="numeric"
         autocomplete="off" placeholder="למשל 10" aria-label="גודל בג׳יגה להעתקה" />
  <span class="gb-shortcut-hint">Enter=העתק · Shift+Enter=עגלה · שוב=רוקן · Esc</span>
</div>

<!-- v7.9: the basic-row quantity popup (opened by a row's qty pill). Same
     look/flow as the GB popup above; Enter applies the quantity to that
     row's copy link AND copies it. Wired next to the catalog-kit delegated

/** Opens/closes the cart drawer.
 *  @param {boolean} [force] - true = open, false = close; omit to toggle. */
window.toggleCartDrawer = function(force){
  const d = document.getElementById("cartDrawer");
  const open = typeof force === "boolean" ? force : !d.classList.contains("open");
  d.classList.toggle("open", open);
  d.setAttribute("aria-hidden", String(!open));
};

/** Syncs the floating cart FAB badge with the order builder's item count.
 *  Uses a typeof guard because this can run before the main script has
 *  declared orderBuilderItems. */
window.__updateCartFab = function(){
  const el = document.getElementById("cartFabCount");
  const fab = document.getElementById("cartFab");
  if (!el || !fab) return;
  const n = (typeof orderBuilderItems !== "undefined" && orderBuilderItems) ? orderBuilderItems.length : 0;
  el.textContent = String(n);
  fab.classList.toggle("has-items", n > 0);
};
</script>

/* ═══════════════════════════════════════════════════════════════════════
   § 3. GENERIC HELPERS
   Small utilities with no business knowledge.
   ═══════════════════════════════════════════════════════════════════════ */

/** Rounds to 2 decimal places (0.1 + 0.2 → 0.3, not 0.30000000000000004). */
function round2(n) {
  return Number(Number(n).toFixed(2));
}

/** Promise that resolves after `ms` milliseconds. General-purpose pacing
 *  (currently used to space out concurrent API workers). */
function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

/** Same as sleep(), but DELIBERATELY a separate function: the order
 *  runner's pacing goes through this so the smoke-test harness can stub
 *  it (and only it) to fast-forward multi-item orders. Do not merge the
 *  two or the async runner test breaks. */
function sleepOrder(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

/* ---- Order-runner pacing (v7.18: LOAD-DRIVEN) -----------------------------
   v6.11→v7.17 used blind timers because a cross-origin page can't be
   read. But window.length (the page's FRAME COUNT) is one of the few
   cross-origin-READABLE properties, and every simtlv page injects at
   least one iframe at runtime (the FB pixel's hidden 1×1 on every page,
   Crisp chat, Cardcom's payment frame on checkout — verified against the
   live checkout HTML 2026-08-17). So each hop now WAITS FOR THE SIGNAL:
   reset the helper to about:blank (same-origin ⇒ provably blank),
   navigate, then poll until the frame count rises — the page committed
   AND its scripts are running, which means the server finished the add.
   The ceilings below are the TIMER FALLBACK for pages that never show
   the signal (an ad-blocker can eat the FB/Crisp frames); a hop is never
   slower than its ceiling and usually completes in real load time.
   Polls are ITERATION-bounded (not wall-clock) so the harness's stubbed
   sleepOrder fast-forwards the loop deterministically. */
const ORDER_POLL_MS          = 250;   // one detection poll
const ORDER_BLANK_CEILING_MS = 2500;  // max wait for the about:blank reset
const ORDER_HOP_CEILING_MS   = 9000;  // max wait per navigation without a signal
const ORDER_LOAD_SETTLE_MS   = 600;   // small settle after a detected load
const ORDER_FINAL_SETTLE_MS  = 1200;  // before the main window goes to checkout

/** Runs `worker(item, index)` for every item at once (no concurrency
 *  limit). Used where the endpoint tolerates a full burst. */
async function mapAllAtOnce(items, worker) {
  return Promise.all(items.map((item, index) => worker(item, index)));
}

/** Runs `worker(item, index)` over `items` with at most `limit` workers
 *  in flight, each worker pausing 120ms between items — polite pacing
 *  for the manual site's AJAX endpoint. Results keep input order. */
async function mapWithConcurrency(items, limit, worker) {
  const results = new Array(items.length);
  let index = 0;

  async function runWorker() {
    while (index < items.length) {
      const current = index++;
      results[current] = await worker(items[current], current);
      await sleep(120);
    }
  }

  await Promise.all(
    Array.from({ length: Math.min(limit, items.length) }, runWorker)
  );

  return results;
}

/** HTML-escapes a value for safe interpolation into template-string
 *  markup and attributes. Part of the mandatory inline-handler pattern:
 *  onclick='fn(${escapeHtml(JSON.stringify(value))})'. */
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/** Triggers a browser download of `object` as pretty-printed JSON. */
function downloadJSON(filename, object) {
  const jsonString = JSON.stringify(object, null, 2);
  const blob = new Blob([jsonString], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/** Shows `text` in the status line under the top bar; empty/falsy text
 *  hides the line (the CSS collapses an empty status element). */
function setExportStatus(text) {
  const el = document.getElementById("exportStatus");
  el.style.display = text ? "block" : "none";
  el.textContent = text || "";
}

/* ---- Clipboard ------------------------------------------------------------
   navigator.clipboard only exists in a secure context (https/localhost).
   This file is normally run from file://, where it is undefined — so
   there is a hidden-textarea + execCommand("copy") fallback. DO NOT
   replace this with clipboard-API-only code. */

/** Legacy copy path for file:// — hidden textarea + execCommand. */
function fallbackCopyText(text) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-9999px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    // v7.26: execCommand reports refusal via its RETURN VALUE, not a
    // throw — discarding it made copyText toast "✓ הועתק" over a copy
    // that never happened.
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok === true;
  } catch (e) { return false; }
}

/** Copies `text` to the clipboard (modern API when available, fallback
 *  otherwise) and confirms with a toast. This is THE copy entry point —
 *  every 📋 button funnels here. */
function copyText(text) {
  text = String(text == null ? "" : text);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      .then(() => showCopyToast())
      .catch(() => showCopyToast(fallbackCopyText(text) ? null : "ההעתקה נכשלה"));
  } else {
    showCopyToast(fallbackCopyText(text) ? null : "ההעתקה נכשלה");
  }
}

/** Timer handle for the copy toast's auto-hide. */
let __copyToastTimer = null;

/** Shows a small bottom-center toast (default: "copied" confirmation).
 *  The toast element is created lazily on first use and reused after.
 *  `ms` controls the auto-hide delay — error toasts pass a longer one. */
function showCopyToast(msg, ms = 1400) {
  let t = document.getElementById("copyToast");
  if (!t) {
    t = document.createElement("div");
    t.id = "copyToast";
    t.className = "copy-toast"; // v7.27: styled by the stylesheet (F14) — was the only JS-styled component
    document.body.appendChild(t);
  }
  t.textContent = msg || "✓ הועתק ללוח";
  requestAnimationFrame(() => t.classList.add("is-show"));
  clearTimeout(__copyToastTimer);
  __copyToastTimer = setTimeout(() => t.classList.remove("is-show"), ms);
}

/** Copies the price text (<pre>) of the card containing `btn`.
 *  The <pre> lives at the .block level, NOT inside the button's immediate
 *  parent (.block-actions) — so search the whole card via closest(). If a
 *  new card layout breaks this lookup, copy buttons silently die; the
 *  triage recipe is to verify closest(".block") still finds the <pre>. */
function copySection(btn) {
  const root = btn.closest(".block") || btn.parentElement || document;
  const pre = root.querySelector("pre");
  if (pre) copyText(pre.textContent);
  else showCopyToast("אין מה להעתיק");
}


/* ═══════════════════════════════════════════════════════════════════════
   § 4. PRICING MATH & SIMPLIFY
   The credit→GB arithmetic behind the reference cards, and the "פישוט"
   (simplify) display mode that rounds values / trims odd package sizes
   for customer-facing copy.
   ═══════════════════════════════════════════════════════════════════════ */

/** How many GB `amount` USD of credit buys at `price` USD-per-GB. */
function gb(amount, price) {
  return amount / price;
}

/** Simplifies a GB value for customer-facing display:
 *  values within 0.05 of a whole number snap to it; everything else is
 *  floored to the nearest half. (7.97 → 8, 7.6 → 7.5) */
function applySimplify(value) {
  const nearestInt = Math.round(value);

  if (Math.abs(value - nearestInt) < 0.05) {
    return nearestInt;
  }

  return Math.floor(value * 2) / 2;
}

/** Is simplify ON for this card key? Anything except an explicit false
 *  counts as on — that makes ON the default for never-touched cards. */
function isSimplified(key) {
  return simplifyState[key] !== false;
}

/** Flips one card's simplify state and re-renders. */
function toggleSimplify(key) {
  simplifyState[key] = !isSimplified(key);
  renderAll();
}

/** Markup for the per-card simplify on/off switch. */
function simplifyToggle(key) {
  const on = isSimplified(key);
  const tip = on
    ? "פישוט פעיל — לחץ כדי להציג את כל החבילות / הספרות המלאות"
    : "פישוט כבוי — מוצגות כל החבילות והערכים המלאים";
  return `
    <button class="simplify-btn ${on ? 'is-on' : 'is-off'}"
            onclick="toggleSimplify('${key}')"
            aria-pressed="${on}"
            title="${tip}">
      <span class="sw" aria-hidden="true"></span>פישוט ${on ? '· פעיל' : '· כבוי'}
    </button>
  `;
}

/** Every simplify key that exists right now: the fixed card keys plus
 *  one dynamic 'global_<zone>' key per selected zone. The master toggle
 *  operates on exactly this set. */
function allSimplifyKeys() {
  const keys = ['esimPlans', 'physicalPlans', 'physicalCredit', 'wallet', 'custom', 'topup'];
  [...new Set(selected.map(c => c.zone))].forEach(z => keys.push('global_' + z));
  return keys;
}

/** True if at least one card is currently simplified. */
function anySimplified() {
  return allSimplifyKeys().some(isSimplified);
}

/** Forces every card's simplify state to `on` and re-renders. */
function setAllSimplify(on) {
  allSimplifyKeys().forEach(k => { simplifyState[k] = on; });
  renderAll();
}

/** Master toggle (the top-bar פישוט button): if ANYTHING is still
 *  simplified, turn everything OFF; otherwise turn everything ON. */
function toggleAllSimplify() {
  setAllSimplify(!anySimplified());
}

/** Syncs the top-bar master simplify button's label/colors with state.
 *  Called at the end of every renderAll. */
function updateMasterSimplifyLabel() {
  const btn = document.getElementById('masterSimplifyBtn');
  if (!btn) return;
  const on = anySimplified();
  btn.textContent = on ? 'פישוט: פעיל' : 'פישוט: כבוי';
  btn.title = on ? 'כבה פישוט בכל הכרטיסים' : 'הפעל פישוט בכל הכרטיסים';
  btn.classList.toggle('is-on', on);
  btn.classList.toggle('is-off', !on);
}


/* ═══════════════════════════════════════════════════════════════════════
   § 5. REGIONS & ZONES
   Region grouping for client-facing country lists, and the highest-zone
   selection rules (business rule #4 lives on these helpers).
   ═══════════════════════════════════════════════════════════════════════ */

/** Region name for an ISO code ("אחר" when unmapped). */
function regionOfIso(iso) { return ISO_REGION[iso] || "אחר"; }

/** Groups countries by region → client-ready text block, one line per
 *  region in REGION_ORDER, names Hebrew-sorted within each region. */
function formatCountriesByRegion(countries) {
  const byRegion = {};
  for (const c of countries) (byRegion[regionOfIso(c.iso)] ||= []).push(c.name.he);
  const lines = [];
  for (const region of REGION_ORDER) {
    const names = byRegion[region];
    if (!names || !names.length) continue;
    lines.push(`${region}: ${names.sort((a, b) => a.localeCompare(b, "he")).join(", ")}`);
  }
  return lines.join("\n");
}

/** All countries COVERED BY a zone-N package of the given SIM type.
 *  ⚠ ZONES ARE CUMULATIVE: a higher zone includes every lower zone — a
 *  Zone 3 package is valid in all Zone 1, Zone 2 AND Zone 3 countries. So
 *  this returns every country whose per-type zone is `<= zone`, not just
 *  the ones exactly in `zone`. (Verified against live data: Zone 3 alone is
 *  ~9 countries, but a Zone 3 package covers ~70.) This drives the
 *  client-facing country lists and the "ל-N יעדים" destination counts.
 *  simType: "esim" | "physical" | anything else = the general zone. */
function countriesCoveredByZone(simType, zone) {
  const field = simType === "esim" ? "esimZone" : simType === "physical" ? "physicalZone" : "zone";
  return data.filter(c => Number(c[field] ?? c.zone) <= Number(zone));
}

/** Client-facing copy: the full country list of a zone (for one SIM
 *  type), grouped by region, with a destination count header. */
function copyZoneCountriesForType(simType, zone) {
  const countries = countriesCoveredByZone(simType, zone);
  if (!countries.length) { showCopyToast("לא נמצאו מדינות באזור הזה"); return; }
  const text = `✈️ ${countries.length} יעדים בחבילה (אזור ${zone}):\n\n${formatCountriesByRegion(countries)}`;
  copyText(text);
}

/** Same, for the general zone (used by the בסיסי card's copy button). */
function copyZoneCountries(zone) {
  copyZoneCountriesForType("general", zone);
}

/* ---- Highest-zone filtering ------------------------------------------------
   When countries from different zones are selected, a plan must cover
   ALL of them, so it is priced at the highest zone among them. We
   therefore only DISPLAY prices for that highest zone. */

/** The highest GENERAL zone among the selection (null when empty). */
function getHighestZone() {
  if (!selected.length) return null;
  return Math.max(...selected.map(c => c.zone));
}

/** True when the selection spans more than one general zone (drives the
 *  explanatory zone note on the basic/gigaboost tabs). */
function hasMixedZones() {
  return new Set(selected.map(c => c.zone)).size > 1;
}


/* ═══════════════════════════════════════════════════════════════════════
   § 6. SESSION PERSISTENCE
   Everything you'd expect to survive a close/reopen: selected countries,
   active tab, cart lines, toggles, quantities, simplify states, batch
   mode. Written at the end of EVERY renderAll; restored once at boot.
   ═══════════════════════════════════════════════════════════════════════ */

/** Serializes the session to localStorage. No-op while a restore is in
 *  progress (the renders a restore triggers must not overwrite the very
 *  session being read). */
function persistSession() {
  if (sessionRestoring) return;
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      selectedIsos: selected.map(c => c.iso),
      activeTab,
      cartSettings,
      simplifyState,
      orderBuilderItems,
      batchMode: !!(topupState && topupState.batchMode),
      batchRaw: (topupState && topupState.batchRaw) || ""
    }));
  } catch (e) { /* storage unavailable → session simply not persisted */ }
}

/** Restores the saved session (if any). Called from boot AFTER the
 *  country model is built, because selected ISOs are resolved against
 *  `data`. Unknown tabs / ISOs are silently dropped. */
function restoreSession() {
  let saved = null;
  try { saved = JSON.parse(storageGet(SESSION_KEY) || "null"); } catch (e) { saved = null; /* corrupt session JSON → boot fresh */ }
  if (!saved) return;
  sessionRestoring = true;
  try {
    if (TAB_IDS.includes(saved.activeTab)) activeTab = saved.activeTab;
    if (saved.cartSettings && typeof saved.cartSettings === "object") {
      cartSettings = { ...cartSettings, ...saved.cartSettings };
      // Reflect restored settings into the static top-bar inputs.
      const cb = document.getElementById("emptyCartToggle");
      if (cb) cb.checked = !!cartSettings.emptyCart;
      const q = document.getElementById("cartQty");
      if (q) q.value = cartSettings.quantity;
    }
    if (saved.simplifyState && typeof saved.simplifyState === "object") {
      simplifyState = saved.simplifyState;
    }
    if (Array.isArray(saved.orderBuilderItems)) {
      orderBuilderItems = saved.orderBuilderItems;
    }
    ensureAutoTopupState();
    topupState.batchMode = !!saved.batchMode;
    topupState.batchRaw = String(saved.batchRaw || "");
    if (topupState.batchRaw) setTopupBatchIccids(topupState.batchRaw);
    if (Array.isArray(saved.selectedIsos) && saved.selectedIsos.length) {
      selected = saved.selectedIsos
        .map(iso => data.find(c => c.iso === iso))
        .filter(Boolean);
      renderSelected();
      // Kick off manual-site fetches for the restored selection.
      selected.forEach(c => ensureGlobalCountry(c));
    }
  } finally {
    sessionRestoring = false;
  }
}


/* ═══════════════════════════════════════════════════════════════════════
   § 7. EDITABLE REFERENCE PRICING
   The $/₪ tiers on the wallet / physical-credit cards can be adjusted at
   runtime via the ✎ editors (e.g. a promo: ₪74 buys $17.5 instead of
   $15). Overrides persist in localStorage and are applied ONTO the
   WALLET/PHYSICAL arrays in place; DEFAULT_WALLET/DEFAULT_PHYSICAL keep
   the shipped values for the reset button.
   ═══════════════════════════════════════════════════════════════════════ */

/** The live tier array for an editor kind ("wallet" | "physical"). */
function refArr(kind) { return kind === "wallet" ? WALLET : PHYSICAL; }

/** Applies persisted tier overrides onto WALLET/PHYSICAL (in place).
 *  Rows that don't parse as finite numbers are dropped; if an override
 *  list ends up empty, the shipped defaults are restored for that kind. */
function loadRefOverrides() {
  try {
    const raw = JSON.parse(localStorage.getItem(REF_STORE_KEY) || "null");
    if (!raw) return;
    for (const kind of ["wallet", "physical"]) {
      if (!Array.isArray(raw[kind])) continue;
      const arr = refArr(kind);
      arr.length = 0;
      raw[kind].forEach(r => {
        const usd = parseFloat(r.usd), ils = parseFloat(r.ils);
        if (Number.isFinite(usd) && Number.isFinite(ils)) arr.push({ usd, ils });
      });
      if (!arr.length) (kind === "wallet" ? DEFAULT_WALLET : DEFAULT_PHYSICAL).forEach(r => arr.push({ ...r }));
    }
  } catch (e) { /* corrupt overrides JSON → defaults stay in place */ }
}

/** Persists the CURRENT contents of both tier arrays. */
function saveRefOverrides() {
  storageSet(REF_STORE_KEY, JSON.stringify({ wallet: WALLET, physical: PHYSICAL }));
}

/** Opens/closes the ✎ editor for one card. */
function toggleRefEdit(kind) {
  refEdit[kind] = !refEdit[kind];
  renderAll();
}

/** Editor input handler: writes one field of one tier row.
 *  Invalid input re-renders (which resets the input to the stored value)
 *  without saving. */
function setRefValue(kind, i, field, val) {
  const arr = refArr(kind);
  const num = parseFloat(val);
  if (!arr[i] || !Number.isFinite(num) || num < 0) { renderAll(); return; }
  arr[i][field] = num;
  saveRefOverrides();
  renderAll();
}

/** Appends an empty tier row to be filled in. */
function addRefRow(kind) {
  refArr(kind).push({ usd: 0, ils: 0 });
  saveRefOverrides();
  renderAll();
}

/** Deletes a tier row — but always keeps at least one. */
function removeRefRow(kind, i) {
  const arr = refArr(kind);
  if (arr.length <= 1) return; // keep at least one tier
  arr.splice(i, 1);
  saveRefOverrides();
  renderAll();
}

/** Resets one kind back to the shipped defaults. */
function resetRefRows(kind) {
  const arr = refArr(kind);
  const defs = kind === "wallet" ? DEFAULT_WALLET : DEFAULT_PHYSICAL;
  arr.length = 0;
  defs.forEach(r => arr.push({ ...r }));
  saveRefOverrides();
  renderAll();
}

/** Markup for the inline tier editor (one row per tier + actions). */
function renderRefEditor(kind) {
  const arr = refArr(kind);
  const rows = arr.map((r, i) => `
    <div class="ref-edit-row">
      <label>$<input type="number" step="0.01" min="0" value="${r.usd}"
             onchange="setRefValue('${kind}', ${i}, 'usd', this.value)"></label>
      <label>₪<input type="number" step="1" min="0" value="${r.ils}"
             onchange="setRefValue('${kind}', ${i}, 'ils', this.value)"></label>
      <button class="ref-edit-del" onclick="removeRefRow('${kind}', ${i})" title="מחק שורה">✕</button>
    </div>
  `).join("");
  return `
    <div class="ref-editor">
      ${rows}
      <div class="ref-edit-actions">
        <button onclick="addRefRow('${kind}')">+ שורה</button>
        <button onclick="resetRefRows('${kind}')" title="חזרה לערכי ברירת המחדל">איפוס</button>
        <button class="ref-edit-done" onclick="toggleRefEdit('${kind}')">סיום</button>
      </div>
    </div>
  `;
}


/* ═══════════════════════════════════════════════════════════════════════
   § 8. TOP-BAR SETTINGS & TABS
   Handlers for the option cluster inputs and the tab bar.
   ═══════════════════════════════════════════════════════════════════════ */

/** Top-bar ₪/$ input handler: sets the USD→ILS rate (rejecting garbage),
 *  persists it, and re-renders — every eSIM price changes with it. */
function setUsdRate(value) {
  const rate = parseFloat(value);
  if (!Number.isFinite(rate) || rate <= 0) return;
  USD_TO_ILS = rate;
  storageSet(USD_RATE_STORAGE_KEY, String(rate));
  renderAll();
}

/** Top-bar "ref" input handler: sets the affiliate code each worker stamps
 *  on their links, persists it, and re-renders so every link updates. An
 *  empty value is IGNORED — the referral code must never be blank (it has
 *  to appear on every customer-facing URL). */
function setReferralCode(value) {
  const code = String(value || "").trim();
  if (!code) {
    // Restore the input to the current code rather than accept a blank.
    const el = document.getElementById("refCode");
    if (el) el.value = REFERRAL_CODE;
    return;
  }
  // v7.26: four link builders interpolate the code RAW into query strings,
  // so a space or & would silently truncate the affiliate attribution
  // (non-negotiable per the header). Reject loudly, never truncate.
  if (!/^[A-Za-z0-9_-]+$/.test(code)) {
    showCopyToast("קוד שותף לא תקין — מותר אותיות/ספרות/מקף/קו תחתון בלבד", 3500);
    const el = document.getElementById("refCode");
    if (el) el.value = REFERRAL_CODE;
    return;
  }
  REFERRAL_CODE = code;
  storageSet(REFERRAL_CODE_STORAGE_KEY, code);
  renderAll();
}

/** רוקן עגלה toggle handler: whether links carry empty_cart=true. */
function setEmptyCart(on) {
  cartSettings.emptyCart = !!on;
  renderAll();
}

/** כמות input handler: quantity for the base ("יחיד") checkout link.
 *  Anything unusable falls back to 1. */
function setCartQuantity(value) {
  const n = parseInt(value, 10);
  cartSettings.quantity = (Number.isFinite(n) && n > 0) ? n : 1;
  renderAll();
}

/** Switches the active tab (ignores unknown ids), updates the tab bar's
 *  highlight, and renders the newly active tab's content. */
function setActiveTab(tab) {
  if (!TAB_IDS.includes(tab)) return;
  activeTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b =>
    b.classList.toggle("is-active", b.dataset.tab === tab)
  );
  renderAll();
}


/* ═══════════════════════════════════════════════════════════════════════
   § 9. COUNTRY SELECTION
   Adding/removing countries and the selected-chips strip in the top bar.
   ═══════════════════════════════════════════════════════════════════════ */

/** Adds a country to the selection (ignoring duplicates), re-renders,
 *  and starts fetching its manual-site prices. Also clears the search
 *  box + suggestions, ready for the next lookup. */
function addCountry(c) {
  if (!selected.find(x => x.iso === c.iso)) {
    selected.push(c);
    renderSelected();
    renderAll();
    ensureGlobalCountry(c);
  }

  search.value = "";
  suggestions.style.display = "none";
}

/** Removes one country (chip ✕ handler). */
function removeCountry(iso) {
  selected = selected.filter(c => c.iso !== iso);
  renderSelected();
  renderAll();
}

/** Clears the whole selection (the ✕ נקה button). */
function clearAllCountries() {
  if (!selected.length) return;
  selected = [];
  renderSelected();
  renderAll();
}

/** Rebuilds the selected-country chips strip in the top bar and toggles
 *  the clear-all button's visibility. (This is the one piece of chrome
 *  outside #results that renderAll doesn't own.) */
function renderSelected() {
  const el = document.getElementById("selected");
  el.innerHTML = "";

  selected.forEach(c => {
    const chip = document.createElement("div");
    chip.className = "chip";

    chip.innerHTML =
      (c.catalogOnly
        ? `${c.name.he} · 🛒 מהחנות `
        : `${c.name.he} (Zone ${c.zone}) ($${c.credit_price_per_gb}) `) +
      `<span onclick="removeCountry('${c.iso}')">✕</span>`;

    el.appendChild(chip);
  });

  const clearBtn = document.getElementById("clearCountriesBtn");
  if (clearBtn) clearBtn.style.display = selected.length ? "inline-flex" : "none";
}


/* ═══════════════════════════════════════════════════════════════════════
   § 10. MANUAL-SITE API ("global" / "new prices")
   The manual site (simtlv.co.il) returns rendered product HTML from its
   WooCommerce AJAX endpoint; we parse that HTML into package objects:
     { simType, dataGB, validityDays,
       base:  { quantity:1, totalILS, perUnitILS, productId, checkoutUrl },
       deals: [{ quantity, totalILS, perUnitILS, label, productId,
                 checkoutUrl }, …],       // bundle offers, e.g. a pair
       bestPerUnitILS }                    // cheapest per-unit price seen
   Checkout URLs here are the WooCommerce flavor
   (simtlv.co.il/checkout/?add-to-cart=…) whose grammar uses PIPE
   separators for fly_countries (KH|VN — never commas).
   ═══════════════════════════════════════════════════════════════════════ */

/* ---- Text parsers for the scraped product markup ----------------------- */

/** Extracts validity in days from free text ("30 ימים", "שנה", "5 שנים").
 *  Returns null when no number is found. */
function getValidityDays(daysText) {
  const text = String(daysText || "").replace(/\s+/g, " ").trim();

  if (text.includes("5") && text.includes("שנ")) return 1825; // "5 שנים"
  if (text.includes("שנה") || text.includes("לשנה")) return 365;

  const m = text.match(/\d+/);
  return m ? parseInt(m[0], 10) : null;
}

/** Extracts a shekel amount from free text, tolerating both "55₪" and
 *  "₪55" orders and thousands commas. Takes the LAST match (sale prices
 *  appear after crossed-out originals). Returns 0 when nothing matches. */
function getShekelAmount(text) {
  const clean = String(text || "").replace(/,/g, "").replace(/\s+/g, " ");

  const beforeSymbol = [...clean.matchAll(/(\d+(?:\.\d+)?)\s*₪/g)].map(m => Number(m[1]));
  if (beforeSymbol.length) return beforeSymbol[beforeSymbol.length - 1];

  const afterSymbol = [...clean.matchAll(/₪\s*(\d+(?:\.\d+)?)/g)].map(m => Number(m[1]));
  if (afterSymbol.length) return afterSymbol[afterSymbol.length - 1];

  return 0;
}

/** Works out how many units a bundle ("deal") contains, in order of
 *  trust: an explicit quantity= in the URL → the word זוג (pair) → a
 *  "N יח׳/כרטיסים" phrase → assume 2 (pairs are the common bundle). */
function getQuantityFromBundle(label, href) {
  try {
    const url = new URL(href);
    const q = parseInt((url.searchParams.get("quantity") || "").trim(), 10);
    if (q > 1) return q;
  } catch (e) { /* malformed URL → fall through to the label heuristics */ }

  const clean = String(label || "").replace(/\s+/g, " ").trim();

  if (clean.includes("זוג")) return 2;

  const units = clean.match(/(\d+)\s*(יח|יח׳|כרטיס|כרטיסים)/);
  if (units) return parseInt(units[1], 10);

  return 2;
}

/** Rewrites a bundle URL's quantity param to a clean integer (v6.13). The
 *  site emits `quantity= 2` (a literal space), which round-trips to the ugly
 *  `quantity=%202`; normalizing at parse time keeps EVERY generated link
 *  clean — the order runner, the copied deal link, and the share payload. */
function normalizeBundleUrlQuantity(url, quantity) {
  if (!url) return url;
  try {
    const u = new URL(url);
    if (u.searchParams.has("quantity") && Number.isFinite(quantity) && quantity > 1) {
      u.searchParams.set("quantity", String(quantity));
    }
    return u.toString().replace(/%7C/gi, "|");
  } catch (e) {
    return String(url);
  }
}

/** Parses the manual-site AJAX response's rendered HTML into package
 *  objects (shape documented in the section banner). Also used for topup
 *  responses, which pass { maxValidityDays: 30, dedupe: true }. Packages
 *  missing a size, price, or validity are dropped. */
function parseGlobalProducts(apiResponse, simType, options = {}) {
  const html = apiResponse?.data?.products || "";
  const doc = new DOMParser().parseFromString(html, "text/html");
  const maxValidityDays = options.maxValidityDays ?? 30;

  let products = [...doc.querySelectorAll(".esim-global-product-item")].map(item => {
    const text = selector =>
      item.querySelector(selector)?.textContent.trim().replace(/\s+/g, " ") || "";

    const gbText = text(".package-gb");
    const daysText = text(".package-days");
    const priceText = text(".price-wrap");
    // v7.24: the site labels each product's BRAND ("SIMTLV" vs
    // "Tmobile - SIM CARD" / "Tmobile - eSIM") — captured for the filter
    // below.
    const brand = text(".package-top-text");
    const baseLink = item.querySelector("a.buy-now-with-icon");

    const dataGB = parseFloat(gbText.match(/[\d.]+/)?.[0] || 0);
    const validityDays = getValidityDays(daysText);
    const basePriceILS = getShekelAmount(priceText);

    const base = {
      quantity: 1,
      totalILS: basePriceILS,
      perUnitILS: basePriceILS,
      productId: baseLink?.dataset.id || null,
      checkoutUrl: baseLink?.href || null
    };

    // Bundle offers under the base product (e.g. "זוג ב99 ש"ח").
    const deals = [...item.querySelectorAll(".buy-now-bundle-wrap")].map(row => {
      const label = row.querySelector(".bundle-text")?.textContent.trim().replace(/\s+/g, " ") || "";
      const link = row.querySelector("a.buy-now-bundle");
      const rawUrl = link?.href || null;
      const quantity = getQuantityFromBundle(label, rawUrl);
      const totalILS = getShekelAmount(label);

      return {
        quantity,
        totalILS,
        perUnitILS: quantity ? round2(totalILS / quantity) : 0,
        label,
        productId: link?.dataset.id || null,
        // v6.13: clean the site's "quantity= 2" (space) at the source.
        checkoutUrl: normalizeBundleUrlQuantity(rawUrl, quantity)
      };
    }).filter(d => d.quantity > 1 && d.totalILS > 0);

    const validPrices = [base.perUnitILS, ...deals.map(d => d.perUnitILS)].filter(Boolean);

    return {
      simType,
      brand,
      dataGB,
      validityDays,
      base,
      deals,
      bestPerUnitILS: validPrices.length ? Math.min(...validPrices) : null
    };
  }).filter(p =>
    p.dataGB > 0 &&
    p.base.totalILS > 0 &&
    p.validityDays !== null &&
    p.validityDays <= maxValidityDays &&
    // v7.24: T-Mobile-branded products are EXCLUDED from these scans —
    // they live in their own dedicated tab (static catalog). The live US
    // response mixes them into the country catalog, and a T-Mobile
    // 50GB/30d (₪190, ids 168/2440) was beating the REAL basic 50GB/30d
    // (eSIM 68939 ₪239 / pSIM 121294) for the row slot — the operator
    // caught the wrong product+price under basic. Verified against the
    // live search_packages response for US, 2026-08-17.
    !/t-?mobile/i.test(p.brand)
  );

  if (options.dedupe) products = dedupePackages(products);
  return products;
}

/** Removes duplicate packages (same product id, size, validity, price,
 *  and URL). Topup responses repeat items across sections. */
function dedupePackages(packages) {
  const seen = new Set();
  return (packages || []).filter(pkg => {
    const key = [
      pkg.base?.productId,
      pkg.dataGB,
      pkg.validityDays,
      pkg.base?.totalILS,
      pkg.base?.checkoutUrl
    ].join("|");
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

/** Display filter for global/topup packages:
 *    * always drops packages over maxValidityDays (default 30);
 *    * when simplified, also hides the odd 1GB/7GB sizes, and prefers
 *      to show ONLY 30-day plans when any exist;
 *    * sorts by size, then validity, then price. */
function getDisplayGlobalPackages(packages, simplified = true, options = {}) {
  const maxValidityDays = options.maxValidityDays ?? 30;
  let valid = (packages || []).filter(p => p.validityDays !== null && p.validityDays <= maxValidityDays);

  if (simplified) {
    valid = valid.filter(p => p.dataGB !== 1 && p.dataGB !== 7);
  }

  valid = valid.sort((a,b) => a.dataGB - b.dataGB || a.validityDays - b.validityDays || a.base.totalILS - b.base.totalILS);

  if (simplified) {
    const thirtyDay = valid.filter(p => p.validityDays === 30);
    return thirtyDay.length ? thirtyDay : valid;
  }

  return valid;
}

/** Hebrew display label for a simType key. */
function simTypeHebrew(simType) {
  if (simType === "esim") return "eSIM";
  if (simType === "physical_sim") return "סים פיזי";
  if (simType === "topup") return "טופאפ";
  return String(simType || "חבילה");
}

/* ---- Fetching ------------------------------------------------------------ */

/** Fetches the manual-site catalog for one country + one SIM type. */
async function fetchGlobalPackagesForCountry(iso, simType) {
  const params = new URLSearchParams();

  params.set("action", "esim_global_ajax");
  params.set("task", "search_packages");
  params.set("on_what_dates", GLOBAL_API_DATE_RANGE);
  params.append("fly_countries[]", iso);
  params.set("sim_type", simType);

  const url = MANUAL_SITE_AJAX_URL + "?" + params.toString();
  const res = await fetch(url);

  if (!res.ok) {
    throw new Error(`${simType} ${iso}: HTTP ${res.status}`);
  }

  const json = await res.json();

  return {
    iso,
    simType,
    zone: json?.data?.zone ?? null,
    packages: parseGlobalProducts(json, simType),
    rawSuccess: json?.success === true
  };
}

/** Fetches BOTH SIM types for a country in parallel and merges them into
 *  one result object; per-type failures land in .errors instead of
 *  rejecting the whole scan. */
async function fetchGlobalBothTypesForCountry(country) {
  const result = {
    physical_sim: [],
    esim: [],
    errors: []
  };

  const fetchedResults = await Promise.allSettled(
    GLOBAL_SIM_TYPES.map(simType => fetchGlobalPackagesForCountry(country.iso, simType))
  );

  fetchedResults.forEach((outcome, index) => {
    const simType = GLOBAL_SIM_TYPES[index];

    if (outcome.status === "fulfilled") {
      const fetched = outcome.value;
      result[simType] = fetched.packages;
      if (fetched.zone !== null) result.zone = fetched.zone;
    } else {
      result.errors.push({
        simType,
        message: String(outcome.reason?.message || outcome.reason)
      });
    }
  });

  return result;
}

/** Reads the SITE's product_zone out of a checkout URL. eSIM URLs carry a
 *  bare number ("product_zone=3"); physical URLs carry a "PG_" prefix
 *  ("product_zone=PG_3"). Returns { raw, num } where num is the numeric
 *  zone (for "highest zone" comparisons) and raw is the original string. */
function parseProductZone(url) {
  const m = /[?&]product_zone=([^&]+)/.exec(url || "");
  if (!m) return { raw: "", num: null };
  const raw = decodeURIComponent(m[1]);
  const n = parseInt(String(raw).replace(/[^0-9]/g, ""), 10);
  return { raw, num: Number.isFinite(n) ? n : null };
}

/** Directly scans one country's manual-site catalog (BOTH SIM types) and
 *  caches it per ISO. This is the authoritative source: the site's own
 *  answer for that exact country, including the real product_zone. Idempo-
 *  tent (skips if already cached or in flight). A per-type failure is
 *  recorded in .errors with empty packages so a broken country doesn't
 *  refetch every render. */
async function ensureGlobalCountry(country) {
  if (!country || !country.iso) return;
  if (country.catalogOnly) return; // shop-only pseudo-country — nothing to scan
  if (manualLoading[country.iso]) return;
  // v7.26: a GOOD scan blocks re-fetching for its whole TTL, but a FAILED
  // one (entry.errors non-empty) only backs off GLOBAL_ERROR_RETRY_MS —
  // before this, one network blip pinned the country to an empty basic
  // tab for 12 hours with no retry path except the 🔄 button.
  const cur = manualByIso[country.iso];
  if (cur) {
    const failed = cur.errors && cur.errors.length;
    if (!failed) return;
    if (Date.now() - (cur.cachedAt || 0) < GLOBAL_ERROR_RETRY_MS) return;
  }

  manualLoading[country.iso] = true;
  renderAll();

  try {
    // Both SIM types in parallel; a failure in one doesn't sink the other.
    const settled = await Promise.allSettled(
      GLOBAL_SIM_TYPES.map(simType => fetchGlobalPackagesForCountry(country.iso, simType))
    );
    const entry = { cachedAt: Date.now(), errors: [] };
    GLOBAL_SIM_TYPES.forEach((simType, i) => {
      const res = settled[i];
      if (res.status === "fulfilled") {
        const packages = res.value.packages || [];
        const z = parseProductZone(packages[0]?.base?.checkoutUrl);
        entry[simType] = { packages, zone: z.num, zoneRaw: z.raw };
      } else {
        entry[simType] = { packages: [], zone: null, zoneRaw: "" };
        entry.errors.push({ simType, message: String(res.reason?.message || res.reason) });
      }
    });

    const prev = manualByIso[country.iso] || manualPrev[country.iso];
    const changes = computeManualChanges(prev, entry);
    if (changes.length) entry.priceChanges = changes;
    else if (prev && prev.priceChangesDismissed) entry.priceChangesDismissed = true;
    delete manualPrev[country.iso];

    manualByIso[country.iso] = entry;
    persistGlobalCatalog();
  } catch (err) {
    manualByIso[country.iso] = {
      esim: { packages: [], zone: null, zoneRaw: "" },
      physical_sim: { packages: [], zone: null, zoneRaw: "" },
      cachedAt: Date.now(),
      errors: [{ simType: "all", message: String(err.message || err) }]
    };
    persistGlobalCatalog();
  } finally {
    manualLoading[country.iso] = false;
    renderAll();
  }
}

/** Kicks off a direct scan for every selected country (idempotent). */
function loadGlobalForSelected() {
  selected.forEach(c => ensureGlobalCountry(c));
}

/** Force-refreshes the manual-site prices for the current selection (the
 *  🔄 button on the בסיסי card): drops the selected countries' scans and
 *  refetches them directly. */
function refreshGlobalZone() {
  if (!selected.length) return;
  selected.forEach(c => { delete manualByIso[c.iso]; delete manualLoading[c.iso]; });
  persistGlobalCatalog();
  loadGlobalForSelected();
}


/* ═══════════════════════════════════════════════════════════════════════
   § 11. MANUAL-SITE CACHE
   Persistence + freshness validation, on-demand warming, and the
   price-change diff banner.

   ⚠ FRESHNESS: scans are keyed by ISO (per-country direct scans). A country
   re-zoned upstream needs no special handling — its next scan just returns
   the new zone/prices. The TTL (GLOBAL_CACHE_TTL_MS) is the freshness
   guard: expired scans are dropped and their prices become price-change
   baselines.
   ═══════════════════════════════════════════════════════════════════════ */

/** Loads the persisted per-ISO scans, keeping an entry only if it is
 *  younger than GLOBAL_CACHE_TTL_MS. Expired entries are parked in
 *  manualPrev as baselines for the price-change diff when a fresh scan
 *  lands. */
function loadPersistedGlobalCatalog() {
  try {
    const saved = localStorage.getItem(GLOBAL_CATALOG_STORAGE_KEY);
    if (!saved) return;
    const parsed = JSON.parse(saved);
    if (!parsed || typeof parsed !== "object") return;

    const now = Date.now();
    let dropped = 0;
    for (const [iso, entry] of Object.entries(parsed)) {
      if (!entry || (!entry.esim && !entry.physical_sim)) { dropped++; continue; }
      // v7.26 belt-and-braces: persisted FAILURE entries (written by older
      // builds) are treated as stale so pre-fix storage heals on load.
      const errored = entry.errors && entry.errors.length;
      const fresh = !errored && Number.isFinite(entry?.cachedAt) && (now - entry.cachedAt) < GLOBAL_CACHE_TTL_MS;
      if (fresh) manualByIso[iso] = entry;
      else { dropped++; manualPrev[iso] = entry; }
    }
    if (dropped) console.info(`manual scans: dropped ${dropped} stale/expired entries`);
  } catch (e) {
    console.warn("Could not load saved manual scans", e);
  }
}

/** Persists the per-ISO scans — minus FAILED ones (v7.26). A failure
 *  entry surviving a reload used to present as "no packages" for 12h.
 *  Trade-off: a PARTIAL failure (one SIM type ok) drops the good half
 *  too and rescans next boot — acceptable, both types come back in one
 *  idempotent parallel call. In-memory failure entries stay (they carry
 *  the error text the basic tab renders + the retry back-off stamp). */
function persistGlobalCatalog() {
  try {
    const clean = Object.fromEntries(Object.entries(manualByIso)
      .filter(([, e]) => !(e && e.errors && e.errors.length)));
    localStorage.setItem(GLOBAL_CATALOG_STORAGE_KEY, JSON.stringify(clean));
  } catch (e) {
    console.warn("Could not save manual scans", e);
  }
}

/* ---- Warming ---------------------------------------------------------------
   There is NO mass preload. Manual-site prices are scanned per SELECTED
   country on demand, because the site's per-country answer is the only
   reliable source (the zone lists don't match it — see § 2). This is also
   the V3-eSIM warmer, since V3 derives from manual eSIM prices. */

/** Scans (or re-scans, when forceRefresh) the selected countries directly.
 *  Kept under the name startGlobalPreloadAll for its existing callers (the
 *  boot warmer and the topup auto-preload). No-op when nothing is selected. */
async function startGlobalPreloadAll(forceRefresh = false) {
  if (!selected.length) return;
  if (forceRefresh) selected.forEach(c => { delete manualByIso[c.iso]; delete manualLoading[c.iso]; });
  globalPreloadRunning = true;
  await Promise.all(selected.map(c => ensureGlobalCountry(c)));
  globalPreloadRunning = false;
  globalPreloadDone = true;
}

/** Countries currently scanned — for status messages. */
function getLoadedZoneCount() { return Object.keys(manualByIso).length; }

/* ---- Price-change diff banner ----------------------------------------- */

/** Compares two per-ISO scans and lists per-package price movements across
 *  BOTH SIM types (matched by size + validity, compared on the base total). */
function computeManualChanges(oldEntry, newEntry) {
  if (!oldEntry || !newEntry) return [];
  const changes = [];
  for (const simType of GLOBAL_SIM_TYPES) {
    const oldPkgs = oldEntry[simType]?.packages || [];
    for (const np of (newEntry[simType]?.packages || [])) {
      const op = oldPkgs.find(p => p.dataGB === np.dataGB && p.validityDays === np.validityDays);
      const from = op?.base?.totalILS, to = np?.base?.totalILS;
      if (Number.isFinite(from) && Number.isFinite(to) && from !== to) {
        changes.push({ simType, dataGB: np.dataGB, validityDays: np.validityDays, from, to });
      }
    }
  }
  return changes;
}

/** Small dismissible strip listing what moved for one country since its
 *  previous scan (first 6 movements + a "+N" overflow marker). */
function renderPriceChangesBanner(entry, iso) {
  const changes = entry?.priceChanges;
  if (!changes || !changes.length || entry?.priceChangesDismissed) return "";
  const label = ch => `${ch.simType === "esim" ? "eSIM" : "פיזי"} ${ch.dataGB}GB ₪${ch.from}→₪${ch.to}`;
  const shown = changes.slice(0, 6).map(label).join(" · ");
  const more = changes.length > 6 ? ` (+${changes.length - 6})` : "";
  return `
    <div class="price-changes-banner">
      <span>📈 שינויי מחיר מאז הסריקה הקודמת: ${escapeHtml(shown + more)}</span>
      <button onclick="dismissPriceChanges('${escapeHtml(iso)}')" title="הסתר">✕</button>
    </div>`;
}

/** Hides the banner for one country's scan (persisted, so it stays
 *  dismissed until the next real change). */
function dismissPriceChanges(iso) {
  const entry = manualByIso[iso];
  if (entry) {
    entry.priceChangesDismissed = true;
    persistGlobalCatalog();
  }
  renderAll();
}


/* ═══════════════════════════════════════════════════════════════════════
   § 12. JSON EXPORT
   The 📥 JSON top-bar button: a full dump combining the old app-link API
   catalog with fresh manual-site scans for every country.
   ═══════════════════════════════════════════════════════════════════════ */

/** Fetches a fresh manual-site scan for every country (all at once) and
 *  assembles the export object. Progress goes to the status line. */
async function buildGlobalExport(countriesToExport) {
  const rows = await mapAllAtOnce(countriesToExport, async (country, i) => {
    setExportStatus(`Global API export: ${i + 1}/${countriesToExport.length} - ${country.iso}`);

    const global = await fetchGlobalBothTypesForCountry(country);

    return {
      iso: country.iso,
      name: country.name,
      old_zone: country.zone,
      global_zone: global.zone ?? null,
      credit_price_per_gb: country.credit_price_per_gb,
      plans: {
        old_api: {
          esim: country.plans.esim,
          physical: country.plans.physical
        },
        global_api: {
          physical_sim: global.physical_sim,
          esim: global.esim,
          errors: global.errors
        }
      }
    };
  });

  setExportStatus("");

  return {
    exported_at: new Date().toISOString(),
    global_api_date_range: GLOBAL_API_DATE_RANGE,
    notes: [
      "old_api and global_api are intentionally separate because prices, products, product IDs, and deals can differ.",
      "global_api packages include base price, bundle deals, and bestPerUnitILS when deals exist."
    ],
    wallet_packages: WALLET,
    physical_credit_packages: PHYSICAL,
    countries: rows
  };
}

/** Top-bar 📥 JSON handler: builds the export and downloads it. */
async function downloadAllJSON() {
  if (!data.length) {
    showCopyToast("הנתונים עדיין בטעינה");
    return;
  }

  try {
    const exportData = await buildGlobalExport(data);
    downloadJSON(`simtlv-full-old-plus-global-${Date.now()}.json`, exportData);
  } catch (err) {
    setExportStatus("");
    showCopyToast("שגיאה ביצוא: " + String(err.message || err), 3500);
  }
}

/* Slugs are stored decoded (Hebrew, not %d7%9c…) to keep this file small;
   dealUrl re-encodes them. Absolute URLs pass through untouched. */
/* ═══════════════════════════════════════════════════════════════════════
   § CATALOG KIT — shared machinery for the קטלוג / T-Mobile / Mobyx tabs,
   the basic tab's "מהחנות" cards and the three-way compare view.
   ───────────────────────────────────────────────────────────────────────
   Everything renders from one small kit:
     dealUrl / dealCartUrl / dealCartBaseUrl   product & cart links
     dealBuyButtons                            the 🧺 🛒 🔗 📋 cluster
     catalogCard / catalogRow / cell*          card frame & ledger rows
     dealBadge / headCount / headCopyAll       pills & header actions

   Two structural rules, both earned the hard way:
   * A .deal-row is a FIXED-track grid — child count must equal track
     count, or the extra child wraps into an implicit grid row (v6.23).
     Buttons therefore always travel as ONE .deal-actions child.
   * No JS calls inside onclick attributes. JSON.stringify emits \" which
     TERMINATES an HTML attribute (v6.25). Copy/basket buttons carry
     data-* payloads consumed by the delegated listeners below.

   Data provenance & regeneration rules: docs §§38–43. */

/* ── links ─────────────────────────────────────────────────────────────── */
const DEALS_BASE = "https://simtlv.co.il/product/";

/** Product-page URL for a stored slug (decoded Hebrew → re-encoded), with
 *  the live affiliate ref appended. Absolute URLs pass through untouched. */
function dealUrl(slugOrUrl) {
  const s = String(slugOrUrl || "");
  if (!s) return "";
  if (/^https?:/i.test(s)) return s;
  return DEALS_BASE + encodeURI(s) + "/?ref=" + encodeURIComponent(REFERRAL_CODE || "");
}

/** Full add-to-cart URL in the operator's working grammar:
 *  empty_cart (per toggle) + ref + add-to-cart + product params + quantity.
 *  Built by string so a BARE key in `extra` (your_iccid) survives —
 *  URLSearchParams would emit your_iccid=. */
function dealCartUrl(id, extra) {
  const q = Number(cartSettings.quantity);
  return dealCartUrlQty(id, extra, Number.isFinite(q) && q > 0 ? q : 1);
}
/** Same grammar with an EXPLICIT quantity — the per-row quantity field
 *  rewrites its row's 🛒/📋 through this. */
function dealCartUrlQty(id, extra, qty) {
  const n = Number(id);
  if (!Number.isFinite(n) || n <= 0) return "";
  const parts = [];
  if (cartSettings.emptyCart) parts.push("empty_cart=true");
  parts.push("ref=" + encodeURIComponent(REFERRAL_CODE || ""));
  parts.push("add-to-cart=" + n);
  if (extra) parts.push(String(extra));
  const q = Number(qty);
  parts.push("quantity=" + (Number.isFinite(q) && q > 0 ? q : 1));
  return "https://simtlv.co.il/checkout/?" + parts.join("&");
}

/** BASE cart URL for basket lines — no empty_cart / quantity; the order
 *  runner appends those per line (the item.catalog branch of
 *  buildOrderItemUrl). */
function dealCartBaseUrl(id, extra) {
  const n = Number(id);
  if (!Number.isFinite(n) || n <= 0) return "";
  let u = "https://simtlv.co.il/checkout/?ref=" + encodeURIComponent(REFERRAL_CODE || "") + "&add-to-cart=" + n;
  if (extra) u += "&" + String(extra);
  return u;
}

/** One cart link per row, newline-joined — the "העתק הכל" payload. */
function catalogCartLinks(rows, extra) {
  return rows
    .map(r => r.id ? dealCartUrl(r.id, extra) : (r.url || (r.s ? dealUrl(r.s) : "")))
    .filter(Boolean)
    .join("\n");
}

/* ── action buttons + delegated listeners ──────────────────────────────── */
/** 🧺 (left-click +1, right-click −1, bubble = copies in basket) ·
 *  quantity PILL · 📋 copy-the-cart-link. Rendered as ONE .deal-actions
 *  grid child (see the rules above). v7.20: the quantity control is the
 *  same pill+popup as the basic rows (openLinkQtyPopup with a "catalog"
 *  target) — Enter rewrites THIS row's 📋 payload (quantity=N) and
 *  copies it. v7.10: the 🛒 open-in-new-tab anchor is gone from every
 *  tab (operator: "useless") — the 📋 link IS the add-to-cart flow. */
function dealBuyButtons(id, slug, extra, label, price) {
  const n = Number(id);
  const hasCart = Number.isFinite(n) && n > 0;
  const key = "cat::" + n + (extra ? "::" + extra : "");
  const lineQty = hasCart ? ((orderBuilderItems.find(x => x.key === key) || { qty: 0 }).qty) : 0;
  const q0 = Number(cartSettings.quantity) > 0 ? Number(cartSettings.quantity) : 1;
  const cart = dealCartUrl(id, extra);
  const page = dealUrl(slug);
  const copyLink = cart || page;
  return `<span class="deal-actions"${hasCart ? ` data-cart-id="${n}" data-cart-extra="${escapeHtml(String(extra || ""))}"` : ""}>` +
    (cart && label ? `<button class="oa-basket" data-basket-id="${n}" data-basket-label="${escapeHtml(String(label))}" data-basket-price="${price ?? ""}" data-basket-extra="${escapeHtml(String(extra || ""))}" title="לחיצה מוסיפה לסל; לחיצה ימנית מפחיתה">🧺${lineQty ? `<b>${lineQty}</b>` : ""}</button>` : "") +
    (cart ? `<button class="lg-qty-btn" title="כמות בקישור העגלה — לחיצה פותחת חלונית הקלדה (משנה את ה-📋)"><b>${q0}</b></button>` : "") +
    (copyLink ? `<button class="oa-copy" data-copy="${escapeHtml(copyLink)}" title="העתק קישור עגלה">📋</button>` : "") +
    `</span>`;
}

/* Right-click on any 🧺 = remove one copy (basket lines drop at zero). */
document.addEventListener("contextmenu", (e) => {
  const cat = e.target && e.target.closest && e.target.closest(".oa-basket[data-basket-id]");
  if (cat) {
    e.preventDefault();
    const id = Number(cat.getAttribute("data-basket-id"));
    const extra = cat.getAttribute("data-basket-extra") || "";
    const key = "cat::" + id + (extra ? "::" + extra : "");
    if (orderBuilderItems.find(x => x.key === key)) {
      bumpOrderBuilderItemQty(key, -1);
      showCopyToast("הוסר מהסל −1");
    } else {
      // v7.26: the browser menu was suppressed either way — say why
      // nothing happened instead of appearing dead.
      showCopyToast("הפריט לא בסל");
    }
    return;
  }
  const tk = e.target && e.target.closest && e.target.closest(".oa-basket[data-topup-key]");
  if (tk) {
    // v7.27 (I4): topup 🧺 right-click −1, like every other basket.
    e.preventDefault();
    decrementTopupOrder(tk.getAttribute("data-topup-key"));
    return;
  }
  const pkg = e.target && e.target.closest && e.target.closest(".ob-add[data-pkg-key]");
  if (pkg) {
    e.preventDefault();

/* Row quantity (v7.9, extended v7.20): the pill opens a Shift+Q-style
   popup; Enter applies the typed quantity to the row AND copies the
   rebuilt link. Two row kinds share the ONE popup:
     * basic rows ({kind:"basic", key}) — deal-aware: a quantity that
       EXACTLY matches the row's deal swaps in the deal URL (its own
       add-to-cart id = the deal PRICE); otherwise base + quantity=N;
     * catalog rows ({kind:"catalog", id, extra}) — v7.20 replaced their
       inline number inputs with the same pill, so every ledger's
       quantity control looks and behaves identically. */
let linkQtyPopupTarget = null; // the row the popup is editing (see above)

/** v7.26: one clamp for every popup-entered quantity. Bottom stays 1
 *  (""/0/-5/"abc" all did before); the new top of 99 stops a fat-fingered
 *  1111 from silently becoming a quantity=1111 cart link. `capped` lets
 *  the caller say so in its toast. */
function clampLinkQty(rawQty) {
  const n = parseInt(rawQty, 10);
  return { qty: Math.min(99, Math.max(1, n || 1)), capped: n > 99 };
}

/** Applies qty to every visible catalog row of (id, extra): rewrites the
 *  📋 payload via dealCartUrlQty and the pill's number. Returns the URL. */
function applyCatalogRowQty(id, extra, rawQty) {
  const { qty, capped } = clampLinkQty(rawQty);
  const url = dealCartUrlQty(id, extra, qty);
  document.querySelectorAll(`.deal-actions[data-cart-id="${id}"]`).forEach(span => {
    if ((span.getAttribute("data-cart-extra") || "") !== extra) return;
    const cp = span.querySelector(".oa-copy");
    if (cp) cp.setAttribute("data-copy", url);
    const pill = span.querySelector(".lg-qty-btn b");
    if (pill) pill.textContent = String(qty);
  });
  return { url, qty, capped };
}

function applyLinkGroupQty(grp, rawQty) {
  const { qty, capped } = clampLinkQty(rawQty);
  const isos = (grp.getAttribute("data-lg-isos") || "").split("|").filter(Boolean);
  const dealUrl = grp.getAttribute("data-lg-deal-url");
  const dealQty = parseInt(grp.getAttribute("data-lg-deal-qty"), 10);
  const url = (dealUrl && qty === dealQty)
    ? buildCheckoutUrl(dealUrl, false, isos)
    : buildCheckoutUrl(grp.getAttribute("data-lg-url"), true, isos, qty);
  const cp = grp.querySelector(".oa-copy");
  if (cp) cp.setAttribute("data-copy", url);
  const pill = grp.querySelector(".lg-qty-btn b");
  if (pill) pill.textContent = String(qty);
  return { url, isDeal: !!(dealUrl && qty === dealQty), qty, capped };
}

/** v7.26: the deferred blur-close's timer handle. Opening a popup for a
 *  SECOND row blurs the first popup's input, and the stale 120ms close
 *  used to hide the popup you just opened (Enter then no-oped silently).
 *  open/close both cancel any pending close. */
let qtyPopupBlurTimer = null;

function openLinkQtyPopup(target) {
  clearTimeout(qtyPopupBlurTimer);
  linkQtyPopupTarget = target;
  const bar = document.getElementById("qtyShortcutBar");
  const input = document.getElementById("qtyShortcutInput");
  if (!bar || !input) return;
  bar.hidden = false;
  input.value = "";
  // focus after the show so the browser actually moves the caret in.
  setTimeout(() => { try { input.focus(); input.select(); } catch (err) { /* input detached by a re-render */ } }, 0);
}

function closeLinkQtyPopup() {
  clearTimeout(qtyPopupBlurTimer);
  linkQtyPopupTarget = null;
  const bar = document.getElementById("qtyShortcutBar");
  if (bar) bar.hidden = true;
}

document.addEventListener("click", (e) => {
  const btn = e.target && e.target.closest && e.target.closest(".lg-qty-btn");
  if (!btn) return;
  const grp = btn.closest(".link-group[data-lg-url]");
  const span = btn.closest(".deal-actions[data-cart-id]");
  const tact = btn.closest(".tl-actions[data-tl-key]"); // v7.27: topup rows
  if (!grp && !span && !tact) return;
  e.preventDefault();
  openLinkQtyPopup(grp
    ? { kind: "basic", key: grp.getAttribute("data-lg-key") }
    : span
    ? { kind: "catalog", id: span.getAttribute("data-cart-id"), extra: span.getAttribute("data-cart-extra") || "" }
    : { kind: "topup", key: tact.getAttribute("data-tl-key") });
});

const qtyShortcutInput = document.getElementById("qtyShortcutInput");
if (qtyShortcutInput) {
  qtyShortcutInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault(); e.stopPropagation();
      const target = linkQtyPopupTarget;
      const raw = qtyShortcutInput.value;
      closeLinkQtyPopup();
      if (!target) return;
      if (target.kind === "catalog") {
        const r = applyCatalogRowQty(target.id, target.extra, raw);
        copyText(r.url);
        showCopyToast((r.capped ? "הוגבל ל־99 — " : "") + `הועתק קישור ×${r.qty}`);
        return;
      }
      if (target.kind === "topup") {
        // v7.27 (I1): the topup pill edits the COPY link exactly like the
        // basic pill — deal-swap at the deal quantity, ICCID-gated.
        const tspan = target.key
          ? document.querySelector(`.tl-actions[data-tl-key="${target.key}"]`)
          : null;
        if (!tspan) { showCopyToast("השורה כבר לא מוצגת — פתח את החלונית שוב"); return; }
        const { qty, capped } = clampLinkQty(raw);
        const tDealUrl = tspan.getAttribute("data-tl-deal-url");
        const tDealQty = parseInt(tspan.getAttribute("data-tl-deal-qty"), 10);
        const tIsDeal = !!(tDealUrl && qty === tDealQty);
        const customerIccid = requireTopupCustomerIccid();
        if (!customerIccid) return;
        const tPill = tspan.querySelector(".lg-qty-btn b");
        if (tPill) tPill.textContent = String(qty);
        copyText(buildTopupCheckoutUrl(tIsDeal ? tDealUrl : tspan.getAttribute("data-tl-url"), qty, cartSettings.emptyCart, customerIccid));
        showCopyToast((capped ? "הוגבל ל־99 — " : "") + (tIsDeal ? `הועתק קישור דיל ×${qty} 🎁` : `הועתק קישור ×${qty}`));
        return;
      }
      // Registry keys are sanitized to [A-Za-z0-9_-] (registerOrderPackage),
      // so they are safe inside an attribute selector as-is.
      const grp = target.key
        ? document.querySelector(`.link-group[data-lg-key="${target.key}"]`)
        : null;
      if (!grp) {
        // The row was re-rendered away (tab switch mid-popup) — say so
        // instead of silently doing nothing (v7.26).
        showCopyToast("השורה כבר לא מוצגת — פתח את החלונית שוב");
        return;
      }
      const r = applyLinkGroupQty(grp, raw);
      copyText(r.url);
      showCopyToast((r.capped ? "הוגבל ל־99 — " : "") +
        (r.isDeal ? `הועתק קישור דיל ×${r.qty} 🎁` : `הועתק קישור ×${r.qty}`));
    } else if (e.key === "Escape") {
      e.preventDefault(); e.stopPropagation();
      closeLinkQtyPopup();
    } else {
      // Let digits type normally, but don't let them bubble to the doc handler.
      e.stopPropagation();
    }
  });
  // Clicking away cancels (deferred so an Enter that moves focus still applies).
  qtyShortcutInput.addEventListener("blur", () => {
    clearTimeout(qtyPopupBlurTimer);
    qtyPopupBlurTimer = setTimeout(closeLinkQtyPopup, 120);
  });
}

/** Adds a catalog product to the shared order basket (same basket as the
 *  basic-tab packages). Re-adding the same key increments its quantity. */
function addCatalogItemToBasket(label, id, price, extra) {
  const n = Number(id);
  if (!Number.isFinite(n) || n <= 0) return;
  const key = "cat::" + n + (extra ? "::" + extra : "");
  const existing = orderBuilderItems.find(x => x.key === key);
  const qty = existing ? existing.qty + 1 : 1;
  orderBuilderItems = orderBuilderItems.filter(x => x.key !== key);
  const unit = Number.isFinite(Number(price)) ? Number(price) : 0;
  orderBuilderItems.push({
    key,
    simType: "catalog",
    catalog: true,
    qty,
    label: `${label} ×${qty}` + (unit ? ` · ${unit}₪ ליח׳` : ""),
    checkoutUrl: dealCartBaseUrl(n, extra),
    productId: n,
    isBase: false,
    isos: [],
    perUnitILS: unit,
    totalILS: round2(unit * qty),
    source: "catalog"
  });
  sortOrderBuilderItems();
  renderAll();
  showCopyToast("נוסף לסל 🧺");
}

/* ── ICCID check-digit validation (ITU E.118 / Luhn) ────────────────────── */
/** true = check digit valid, false = invalid, null = no verdict (too short/
 *  long to judge). Warning-only: some carriers print ICCIDs without the
 *  check digit, so this must never block a topup. */
function iccidLuhnOk(iccid) {
  const d = String(iccid || "").replace(/\D/g, "");
  if (d.length < 18 || d.length > 20) return null;
  let sum = 0;
  for (let i = 0; i < d.length; i++) {
    let n = d.charCodeAt(d.length - 1 - i) - 48;
    if (i % 2 === 1) { n *= 2; if (n > 9) n -= 9; }
    sum += n;
  }
  return sum % 10 === 0;
}
function iccidLuhnBadgeHtml(iccid) {
  const ok = iccidLuhnOk(iccid);
  if (ok === null) return "";
  return ok
    ? `<span class="iccid-luhn is-ok" title="ספרת הביקורת (Luhn) תקינה">✓</span>`
    : `<span class="iccid-luhn is-bad" title="ספרת ביקורת שגויה — בדוק הקלדה (ייתכן גם שהכרטיס מודפס ללא ספרת ביקורת)">⚠ בדוק ICCID</span>`;
}
/** Live update without a re-render (the ICCID field deliberately avoids
 *  focus-stealing re-renders — see the renderAll notes). */
function updateIccidLuhnBadge(iccid) {
  const el = document.getElementById("iccidLuhn");
  if (el) el.innerHTML = iccidLuhnBadgeHtml(iccid);
}

/* ── settings backup / restore ──────────────────────────────────────────── */
/** Every storage key the app owns. Backup/restore touches ONLY these
 *  (least privilege — unknown keys in an imported file are ignored). */
const SETTINGS_BACKUP_KEYS = [
  REFERRAL_CODE_STORAGE_KEY,
  GLOBAL_CATALOG_STORAGE_KEY, SESSION_KEY, REF_STORE_KEY,
  USD_RATE_STORAGE_KEY, QUOTE_TEMPLATE_KEY, PICKUP_MSG_TEMPLATE_KEY,
  TOPUP_AUTO_CATALOG_STORAGE_KEY, TOPUP_VERSION_CATALOG_STORAGE_KEY,
  TOPUP_SELECTED_VERSION_STORAGE_KEY, TOPUP_CUSTOMER_ICCID_STORAGE_KEY,
  SHORTCUT_CONFIG_KEY,
];
function buildSettingsBackup() {
  const values = {};
  SETTINGS_BACKUP_KEYS.forEach(k => {
    const v = storageGet(k);
    if (v !== null) values[k] = v;
  });
  return JSON.stringify({
    app: "simtlv-giga-calculator",
    backupVersion: 1,
    exportedAt: new Date().toISOString(),
    values
  }, null, 2);
}
/** Applies a backup JSON string. Returns the number of keys restored;
 *  throws on anything that is not a backup of this app. */
function applySettingsBackup(json) {
  const parsed = JSON.parse(json);
  if (!parsed || parsed.app !== "simtlv-giga-calculator" || typeof parsed.values !== "object") {
    throw new Error("הקובץ אינו גיבוי של מחשבון גיגה");
  }
  let n = 0;
  let attempted = 0;
  SETTINGS_BACKUP_KEYS.forEach(k => {
    if (typeof parsed.values[k] === "string") {
      attempted++;
      // v7.26: storageSet returns false when storage is blocked (private
      // mode etc.) — count only REAL writes so the success message can't
      // report a restore that never happened.
      if (storageSet(k, parsed.values[k])) n++;
    }
  });
  if (!n && attempted) throw new Error("האחסון חסום — אף הגדרה לא נשמרה");
  return n;
}
function downloadSettingsBackup() {
  const stamp = new Date().toISOString().slice(0, 10);
  const a = document.createElement("a");
  const href = URL.createObjectURL(new Blob([buildSettingsBackup()], { type: "application/json" }));
  a.href = href;
  a.download = `simtlv_giga_settings_backup_claude_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // v7.26: release the blob like the app's other download paths do
  // (deferred — revoking synchronously can cancel the save in some
  // browsers).
  setTimeout(() => { try { URL.revokeObjectURL(href); } catch (e) { /* already gone */ } }, 5000);
  showCopyToast("קובץ הגיבוי ירד 📥");
}
function importSettingsBackupFile(input) {
  const file = input.files && input.files[0];
  input.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const n = applySettingsBackup(String(reader.result || ""));
      alert(`שוחזרו ${n} הגדרות. הדף ייטען מחדש.`);
      location.reload();
    } catch (e) {
      showCopyToast("שחזור נכשל: " + e.message, 3500);
    }
  };
  reader.onerror = () => showCopyToast("קריאת הקובץ נכשלה", 3500);
  reader.readAsText(file);
}
/** The 🗂 card on the קיצורים tab: export/import every saved setting —
 *  shortcuts, quote template, ref code, price caches, session. */
function renderSettingsBackupCard() {

}
