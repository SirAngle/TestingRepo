/* ---- טופאפ tab renderers ----------------------------------------------------- */

/** The action cluster of one topup row (v7.27 — the basic-row idiom):
 *  deal slot | ONE .tl-actions span carrying qty pill + 📋 + 🧺.
 *  The pill opens the shared qty popup ({kind:"topup"}) and edits the
 *  COPY link only; the 🧺 increments the cart line (right-click −1).
 *  Deal buttons pass the deal's own quantity (a pair = the same product at
 *  quantity=2, v6.12) so the site adds all the SIMs the deal represents. */
function renderTopupPurchaseLinks(pkg, result) {
  const key = registerTopupPackage(pkg, result);
  const bubbleIccid = topupState.batchMode
    ? (topupState.batchIccids || [])[0] || ""
    : normalizeIccid(topupState.customerIccid || "");
  const lineQty = bubbleIccid.length >= 18
    ? (parseInt(getBuilderQtyForKey(`${key}::${bubbleIccid}`), 10) || 0) : 0;
  const bestDeal = getBestDeal(pkg);

  const baseUrlJson = JSON.stringify(pkg.base?.checkoutUrl || "");
  // v6.12: a deal (e.g. a pair) is the SAME product added quantity=N, not a
  // pre-bundled pack — so pass the deal's own quantity, or the site adds one.
  const dealQty = Number(bestDeal?.quantity) > 1 ? Number(bestDeal.quantity) : 1;
  const dealSlot = bestDeal
    ? `<span class="tl-deal-label" title="דיל ${bestDeal.quantity}× — ₪${bestDeal.perUnitILS} לכרטיס">₪${bestDeal.perUnitILS}/יח׳</span>
       <button class="lk-copy" onclick='copyTopupCustomerLink(${escapeHtml(JSON.stringify(bestDeal.checkoutUrl))}, ${dealQty})' title="העתק קישור דיל">📋</button>`
    : "";

  return `
      <span class="tl-deal">${dealSlot}</span>
      <span class="tl-actions" data-tl-key="${key}" data-tl-url="${escapeHtml(pkg.base?.checkoutUrl || "")}"${bestDeal ? ` data-tl-deal-url="${escapeHtml(bestDeal.checkoutUrl)}" data-tl-deal-qty="${dealQty}"` : ""}>
        <button class="lg-qty-btn" title="כמות בקישור ההעתקה — לחיצה פותחת חלונית הקלדה (משנה את ה-📋)"><b>1</b></button>
        <button class="lk-copy" ${pkg.base?.checkoutUrl ? "" : "disabled"} onclick='copyTopupCustomerLink(${escapeHtml(baseUrlJson)}, 1)' title="העתק קישור טופאפ עם ICCID הלקוח">📋</button>
        <button class="oa-basket" data-topup-key="${key}" onclick="incrementTopupOrder('${key}')" title="לחיצה מוסיפה לסל; לחיצה ימנית מפחיתה">🧺${lineQty ? `<b>${lineQty}</b>` : ""}</button>
      </span>
  `;
}

/** The topup package list.
 *  ⚠ POSITIONAL STABILITY IS THE FEATURE: every catalog renders the same
 *  fixed canonical GB slots, sorted ascending; a size the current SIM
 *  type doesn't offer renders as a RED dashed row ("לא קיים") instead of
 *  disappearing, and every row shares one fixed grid — so nothing shifts
 *  when switching V1/V2/V3 and the operator navigates by muscle memory.
 *  Do not "clean up" the red rows or make columns content-sized.
 *  EXTENDING: canonical sizes live in CANONICAL_TOPUP_GBS below;
 *  present-but-non-canonical sizes are appended automatically. */
/** The topup price list as customer-ready copy text: a header line plus one
 *  line per (simplified) package, in the standard copy format. Empty string
 *  when there are no packages. Shared by the products titlebar copy button
 *  and the panel-header "📋 מחירון" button. */
function topupPriceListText(result) {
  const displayPackages = getDisplayGlobalPackages(result?.packages || [], isSimplified("topup"), { maxValidityDays: 30 });
  const lines = formatGlobalPlanListText(displayPackages);
  return lines ? `מחירון טופאפ · 30 ימים:\n${lines}` : "";
}

function renderTopupProducts(result) {
  const displayPackages = getDisplayGlobalPackages(result.packages || [], isSimplified("topup"), { maxValidityDays: 30 });
  const copyTextValue = topupPriceListText(result);

  if (!displayPackages.length) {
    return `<div class="giga-cards topup-cards"><div class="block"><div class="global-empty">לא נמצאו חבילות טופאפ מתאימות ל‑ICCID והמדינות שנבחרו.</div></div></div>`;
  }

  // Fixed canonical slots: every catalog renders the same GB positions.
  const simplifiedHidden = isSimplified("topup") ? new Set([1, 7]) : new Set();
  const presentSizes = displayPackages.map(p => Number(p.dataGB));
  const slots = Array.from(new Set([...CANONICAL_PLAN_GBS, ...presentSizes]))
    .filter(gb => !simplifiedHidden.has(gb))
    .sort((a, b) => a - b);

  // Group packages by GB (bigger validity first within a size).
  const byGb = {};
  [...displayPackages]
    .sort((a, b) => (a.dataGB - b.dataGB) || (b.validityDays - a.validityDays))
    .forEach(pkg => { (byGb[Number(pkg.dataGB)] ||= []).push(pkg); });

  const slotRow = gb => {
    const pkgs = byGb[gb];
    if (!pkgs || !pkgs.length) {
      // Missing size → red placeholder row (its own 2-track template —
      // .topup-line.is-missing — so the text spans the ledger columns).
      return `
      <div class="topup-line is-missing" title="החבילה הזו לא קיימת בסוג הסים הנוכחי">
        <span class="topup-line-text">${gb} גיגה – לא קיים</span>
        <span class="tl-missing-pad"></span>
      </div>
    `;
    }
    return pkgs.map(pkg => {
      // v7.8: gigaboost-style ledger cells (size | days | price | deal
      // slot | actions) instead of one text sentence (v7.9: days in their
      // OWN column). ⚠ FIXED-track grid: every real row emits exactly
      // these cells + the ONE purchase-controls span (5 children, v7.27).
      return `
      <div class="topup-line">
        <span class="tl-size">${pkg.dataGB}GB</span>
        <span class="tl-days">${pkg.validityDays} ימים</span>
        <span class="tl-price">₪${pkg.base.totalILS}</span>
        ${renderTopupPurchaseLinks(pkg, result)}
      </div>
    `;
    }).join("");
  };

  // v7.27 (F1): the ledger renders as TWO gigaboost-style cards holding
  // contiguous ascending halves of the canonical slot list — the same
  // two-up idiom as every other tab. Positional stability holds: the slot
  // list itself is fixed, so V1/V2/V3 switches never move a size between
  // cards. (The old layout interleaved odd/even slots into two columns of
  // one grid — a visual order no other tab had.)
  const half = Math.ceil(slots.length / 2);
  // Both cards carry IDENTICAL actions (simplify + העתק הכל) — the v7.23
  // rule: a card pair keeps byte-equal header structure at every width,
  // or the row mirror skews.
  const mkCard = (slotList) => {
    const range = `${slotList[0]}–${slotList[slotList.length - 1]} GB`;
    return `
    <div class="block">
      <div class="block-tools">
        <div><h3>חבילות טופאפ · 30 ימים <span class="zone-pill">${range}</span></h3></div>
        <div class="block-actions">
          ${simplifyToggle("topup")}
          ${copyTextValue ? `<button class="copy-btn" onclick='copyText(${escapeHtml(JSON.stringify(copyTextValue))})' title="העתק את מחירון הטופאפ — כל הגדלים">📋 העתק הכל</button>` : ""}
        </div>
      </div>
      ${renderCopyLegend(['esim', 'physical'], { topup: true, cart: true })}
      <div class="topup-lines">${slotList.map(slotRow).join("")}</div>
    </div>`;
  };
  return `<div class="giga-cards topup-cards">${mkCard(slots.slice(0, half))}${slots.length > half ? mkCard(slots.slice(half)) : ""}</div>`;
}

/** The meta bar above the topup list: all the technical detail (profile,
 *  catalog source, probe, zones, URL parameters) collapses into ONE
 *  hover tooltip; visibly it's just the ICCID status + API-URL copy. */
function renderTopupMeta(result) {
  const info = result.checkoutInfo || {};
  const requested = (result.requestedCountries || []).map(c => c.iso).join("|");
  const countriesLabel = (result.requestedCountries || []).map(c => c.he).join(" | ");
  const searchUrlJson = JSON.stringify(result.requestUrl || "");
  const sourceLabel = result.source === "manual_global_esim_prices_no_topup_scan"
    ? "מקור: מחירי eSIM ידניים קיימים, בלי סריקת טופאפ"
    : result.profileId === "psim_v2"
      ? `מקור: סריקת V2 אחת לאזור ${String(result.zone ?? getSelectedTopupZone() ?? "")}`
      : result.profileId === "psim_v1"
        ? "מקור: סריקת V1 גרמניה בלבד"
        : "מקור: קטלוג טופאפ";

  const tip = [
    result.profileLabel || result.kind || getTopupProfile().label,
    sourceLabel,
    result.probeIccid ? `probe: ${shortIccid(result.probeIccid)}` : "",
    countriesLabel ? `מדינות: ${countriesLabel}` : "",
    requested ? `selected: ${requested}` : "",
    (result.zone !== null && result.zone !== undefined) ? `zone: ${result.zone}` : "",
    info.flyCountries ? `fly_countries=${info.flyCountries}` : "",
    info.productZone ? `product_zone=${info.productZone}` : "",
    info.physicalSimType ? info.physicalSimType : "",
  ].filter(Boolean).join("\n");

/* ═══════════════════════════════════════════════════════════════════════
   § 18b. PICKUP POINTS (נקודות איסוף, v7.28)
   Address → the shipping CRM's closest parcel-pickup points, rendered as
   a copy-ready ledger. The API is the one the site's own checkout uses
   (PICKUP_POINTS_API_URL); CORS is open so it works from file://.
   Failure shapes handled: HTTP 400 {"message":"City and street are
   required"} (client-side guard fires first), HTTP 200 with
   IsSuccessful:false + empty Points for an unknown address, and network
   throws. Zeros-only phones ("000000000", "040000000" = area code +
   zeros) mean "no phone" — never shown/copied (pickupRealPhone).
   v7.33: the city/street fields autocomplete from the data.gov.il
   national registry (see the autocomplete block below).
   ═══════════════════════════════════════════════════════════════════════ */

/** oninput handler for the three address fields. NO re-render — the § 16
 *  focus rule (a re-render would recreate the input mid-keystroke). */
function setPickupField(field, value) {
  pickupState[field] = String(value);
}

/** Raw lookup. Mirrors fetchGlobalPackagesForCountry's honesty: throws on
 *  !res.ok with a Hebrew userMessage; returns the parsed JSON on 200. */
async function fetchPickupPoints(city, street, houseNumber) {
  const body = { city, street };
  if (houseNumber) body.houseNumber = houseNumber;
  const res = await fetch(PICKUP_POINTS_API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    let msg = "";
    try { msg = (await res.json()).message || ""; } catch (e) { /* non-JSON error body */ }
    const err = new Error(`pickup lookup: HTTP ${res.status} ${msg}`);
    err.userMessage = /required/i.test(msg)
      ? "השרת דורש עיר ורחוב — בדוק את השדות"
      : (msg || `שגיאת שרת (${res.status})`);
    throw err;
  }
  return res.json();
}

/** 🔍 / Enter handler: validate → fetch → render. Every settle write is
 *  gated on the seq token so only the latest search applies. */
async function searchPickupPoints() {
  const city = pickupState.city.trim();
  const street = pickupState.street.trim();
  const house = pickupState.houseNumber.trim();
  if (!city || !street) {
    showCopyToast("הקלד עיר ורחוב כדי לחפש נקודות איסוף");
    return;
  }
  const mySeq = ++pickupState.seq;
  pickupState.loading = true;
  pickupState.error = "";
  renderAll();
  try {
    const json = await fetchPickupPoints(city, street, house);
    if (mySeq !== pickupState.seq) return; // a newer search took over
    if (json.IsSuccessful !== true || !Array.isArray(json.Points) || !json.Points.length) {
      pickupState.error = "לא נמצאו נקודות איסוף לכתובת הזו — בדוק עיר ורחוב";
      pickupState.result = null;
    } else {
      pickupState.result = {
        points: json.Points,
        homeDelivery: json.HomeDelivery === 1,
        city, street, houseNumber: house
      };
    }
  } catch (err) {
    if (mySeq !== pickupState.seq) return;
    console.error("pickup lookup failed", err);
    pickupState.error = err.userMessage || "שגיאת רשת — נסה שוב";
    pickupState.result = null;
  } finally {
    if (mySeq === pickupState.seq) {
      pickupState.loading = false;
      renderAll();
    }
  }
}

/* ── city/street autocomplete (v7.33) ───────────────────────────────────
   Suggestions come from the data.gov.il CKAN registry (datastore_search;
   CORS is open, works from file://): cities are ONE ~30KB fetch (1,310
   rows) cached for a week in localStorage; streets are fetched per city
   and cached in memory. Registry values carry TRAILING SPACES
   ("תל אביב - יפו ") and the street filter needs that RAW value
   verbatim — so raw strings are kept internally and trimmed only for
   display/state. The registry's full-text q matches ANY column (a
   district hit dredges up unrelated cities), so filtering is done
   client-side with prefix ranking instead. This is a convenience layer:
   any failure warns once on the console and simply shows no suggestions
   — typing by hand and 🔍 keep working exactly as before. */
const GOV_DATA_API_URL = "https://data.gov.il/api/3/action/datastore_search";
const GOV_CITIES_RESOURCE = "5c78e9fa-c2e2-4771-93ff-7f400a12f7ba";  // field שם_ישוב
const GOV_STREETS_RESOURCE = "9ad3862c-8391-4b2f-84a4-2d4c68625f4b"; // field שם_רחוב
const GOV_CITIES_CACHE_KEY = "simtlv_gov_cities_cache_v1"; // a cache, NOT a setting — deliberately outside SETTINGS_BACKUP_KEYS
const GOV_CITIES_CACHE_TTL_MS = 7 * 24 * 60 * 60 * 1000;

let govCities = null;              // raw registry strings, trailing spaces kept
let govCitiesPromise = null;       // in-flight guard so parallel keystrokes share one fetch
let govCitiesFailed = false;       // session cooldown — degrade silently, never retry-loop
const govStreetsCache = new Map(); // raw city value → raw street strings
const govStreetsFailed = new Set();

/** GET one registry resource's single-field records → raw string array. */
async function fetchGovRecords(resourceId, field, filters) {
  const params = new URLSearchParams({ resource_id: resourceId, fields: field, limit: "32000" });
  if (filters) params.set("filters", JSON.stringify(filters));
  const res = await fetch(`${GOV_DATA_API_URL}?${params}`);
  if (!res.ok) throw new Error(`gov datastore: HTTP ${res.status}`);
  const json = await res.json();
  if (json.success !== true || !Array.isArray(json.result?.records)) {
    throw new Error("gov datastore: unexpected response shape");
  }
  return json.result.records.map(r => String(r[field] ?? "")).filter(Boolean);
}

/** The one-shot cities list, fetched lazily on the first city keystroke.
 *  localStorage cache with a 7-day TTL; corrupt/expired → refetch. */
function ensureGovCities() {
  if (govCities || govCitiesFailed) return Promise.resolve(govCities || []);
  if (govCitiesPromise) return govCitiesPromise;
  try {
    const cached = JSON.parse(localStorage.getItem(GOV_CITIES_CACHE_KEY));
    if (cached && Array.isArray(cached.cities) && cached.cities.length &&
        Date.now() - (cached.ts || 0) < GOV_CITIES_CACHE_TTL_MS) {
      govCities = cached.cities.map(String);
      return Promise.resolve(govCities);
    }
  } catch (e) { /* corrupt cache — refetch below */ }
  govCitiesPromise = fetchGovRecords(GOV_CITIES_RESOURCE, "שם_ישוב")
    .then(list => {
      govCities = list;
      try { localStorage.setItem(GOV_CITIES_CACHE_KEY, JSON.stringify({ ts: Date.now(), cities: list })); } catch (e) { /* quota — the in-memory copy still serves */ }
      return list;
    })
    .catch(err => {
      govCitiesFailed = true;
      console.warn("gov cities list unavailable — city autocomplete off", err);
      return [];
    })
    .finally(() => { govCitiesPromise = null; });
  return govCitiesPromise;
}

/** Streets for the TYPED city. Resolution to the raw registry value is
 *  stateless (trim-equality against the cities list), so a hand-typed or
 *  hand-edited city works the same as a picked one. [] when unknown. */
async function govStreetsForTypedCity(typedCity) {
  const cities = await ensureGovCities();
  const wanted = String(typedCity).trim();
  if (!wanted) return [];
  const raw = cities.find(c => c.trim() === wanted);
  if (!raw || govStreetsFailed.has(raw)) return [];
  if (govStreetsCache.has(raw)) return govStreetsCache.get(raw);
  try {
    const list = await fetchGovRecords(GOV_STREETS_RESOURCE, "שם_רחוב", { "שם_ישוב": raw });
    govStreetsCache.set(raw, list);
    return list;
  } catch (err) {
    govStreetsFailed.add(raw);
    console.warn("gov streets list unavailable for", wanted, err);
    return [];
  }
}

/** Prefix-beats-substring ranking over raw registry strings (the country
 *  search's scoring, § 20), trimmed + deduped, min 2 chars, capped at 8.
 *  One extra tier the country search doesn't need: a WHOLE-WORD prefix
 *  ("תל" → "תל אביב - יפו") outranks a word-internal one ("תלמי בילו") —
 *  with real registry data the תלמי-* moshavim otherwise bury תל אביב.
 *  Stable sort keeps registry order within a rank. */
function govAcMatches(list, query) {
  const q = String(query).trim();
  if (q.length < 2 || !Array.isArray(list)) return [];
  const seen = new Set();
  const out = [];
  for (const rawVal of list) {
    const name = String(rawVal).trim();
    if (!name || seen.has(name)) continue;
    const s = name === q ? 4
      : name.startsWith(q) ? (name[q.length] === " " ? 3 : 2)
      : name.includes(q) ? 1 : 0;
    if (s) { seen.add(name); out.push({ name, s }); }
  }
  out.sort((a, b) => b.s - a.s);
  return out.slice(0, 8).map(m => m.name);
}

const __pickupAcIds = { city: "pickupCitySug", street: "pickupStreetSug" };
const __pickupAcSeq = { city: 0, street: 0 };
let __pickupAcTimer = null;

/** oninput for city/street: state write (as before) + a debounced rebuild
 *  of ONLY this field's dropdown — the § 16 focus rule, no re-render. */
function pickupAcInput(field, input) {
  setPickupField(field, input.value);
  clearTimeout(__pickupAcTimer);
  __pickupAcTimer = setTimeout(() => { refreshPickupAc(field); }, 180);
}

/** Rebuilds one dropdown from the CURRENT state (re-read after the await —
 *  a slow fetch must not paint suggestions for an old keystroke; same seq
 *  idiom as searchPickupPoints). Rows via createElement — registry strings
 *  never travel through innerHTML. */
async function refreshPickupAc(field) {
  const mySeq = ++__pickupAcSeq[field];
  const list = field === "city"
    ? await ensureGovCities()
    : await govStreetsForTypedCity(pickupState.city);
  if (mySeq !== __pickupAcSeq[field]) return;
  const sug = document.getElementById(__pickupAcIds[field]);
  if (!sug) return; // the tab re-rendered away mid-debounce
  const matches = govAcMatches(list, pickupState[field]);
  sug.innerHTML = "";
  matches.forEach(name => {
    const div = document.createElement("div");
    div.textContent = name;
    div.onclick = () => pickupAcPick(field, name);
    sug.appendChild(div);
  });
  sug.style.display = matches.length ? "block" : "none";
}

function hidePickupAc(field) {
  const sug = document.getElementById(__pickupAcIds[field]);
  if (sug) { sug.innerHTML = ""; sug.style.display = "none"; }
}

/** Click / Enter selection: fill the field (trimmed value), hide the
 *  dropdown, move focus onward (city → street → house). No renderAll —
 *  the inputs re-read value= from state on the next render anyway. */
function pickupAcPick(field, name) {
  pickupState[field] = name;
  const inputs = document.querySelectorAll(".pickup-controls .pickup-input");
  const idx = field === "city" ? 0 : 1; // DOM order: city, street, house
  if (inputs[idx]) inputs[idx].value = name;
  hidePickupAc(field);
  const next = inputs[idx + 1];
  if (next) { try { next.focus(); } catch (e) { /* detached */ } }
  if (field === "city") govStreetsForTypedCity(name); // warm the street cache (never rejects)
}

/** Enter/Escape for the two autocomplete fields. Enter picks the TOP
 *  suggestion when the dropdown offers something NEW; when it only echoes
 *  what's already typed (or is closed) Enter falls through to the search,
 *  so a fully-typed address still fires on one Enter. Escape closes just
 *  the dropdown (stopPropagation keeps document-level Escape out of it). */
function pickupAcKeydown(field, event) {
  const sug = document.getElementById(__pickupAcIds[field]);
  const open = !!(sug && sug.style.display === "block" && sug.firstChild);
  if (event.key === "Escape" && open) {
    event.stopPropagation();
    hidePickupAc(field);
    return;
  }
  if (event.key !== "Enter") return;
  event.preventDefault();
  const top = open ? sug.firstChild.textContent : "";
  if (top && top !== pickupState[field].trim()) {
    pickupAcPick(field, top);
  } else {
    hidePickupAc(field);
    searchPickupPoints();
  }
}

/** v7.29: the CRM has TWO no-phone placeholders — all zeros AND an area
 *  code followed by zeros ("040000000", operator-reported live). A phone
 *  counts as real only when it carries at least two non-zero digits
 *  (every real Israeli number does). Returns "" for fakes. */
function pickupRealPhone(raw) {
  const digits = String(raw || "").replace(/\D/g, "");
  return digits.replace(/0/g, "").length >= 2 ? String(raw) : "";
}

/** One customer-facing line for a point (en-dash style, business rule #7).
 *  The Waze link sits LAST so bidi reordering can't scramble the text. */
/** v7.30: the SHORT form — name, address, distance, nothing else. The
 *  delivery-options message uses this (operator: hours/phone/Waze were
 *  "extra unnecessary text" there); the per-row 📋 and the points sheet
 *  keep the full line below. */
function pickupPointShortLine(pt) {
  const km = Math.round(Number(pt.Distance) * 10) / 10;
  return `${pt.PointName ? String(pt.PointName).trim() : ""} — ${pt.StreetName} ${pt.HouseNumber}, ${pt.CityName} (${km} ק"מ)`;
}

function pickupPointCopyLine(pt) {
  const phone = pickupRealPhone(pt.Phone);
  const hours = String(pt.Description || "").trim();
  const parts = [pickupPointShortLine(pt)];
  if (hours) parts.push(hours);
  if (phone) parts.push(`טלפון: ${phone}`);
  parts.push(`https://waze.com/ul?ll=${pt.Latitude},${pt.Longitude}&navigate=yes`);
  return parts.join(" – ");
}

/** The העתק הכל payload: a header naming the address + numbered lines. */
function pickupSheetText(result) {
  const addr = `${result.street}${result.houseNumber ? " " + result.houseNumber : ""}, ${result.city}`;
  const lines = result.points.map((pt, i) => `${i + 1}. ${pickupPointCopyLine(pt)}`);
  return `נקודות איסוף קרובות ל־${addr}:\n` + lines.join("\n");
}

/** v7.29: the FULL delivery-options message — the operator's editable
 *  template (✎ on the strip) with {points} replaced by numbered customer
 *  lines. The numbering CONTINUES from the highest "N." found in the
 *  template ABOVE the placeholder, so editing the self-pickup list
 *  renumbers the points automatically. A template whose {points} was
 *  deleted gets the lines appended — never silently dropped. */
function buildPickupDeliveryMessage(result) {
  const tpl = pickupMsgTemplate;
  const idx = tpl.indexOf("{points}");
  const before = idx >= 0 ? tpl.slice(0, idx) : tpl;
  let start = 1;
  for (const m of before.match(/^\s*(\d+)\./gm) || []) {
    start = Math.max(start, parseInt(m, 10) + 1);
  }
  const lines = result.points.map((pt, i) => `${start + i}. ${pickupPointShortLine(pt)}`).join("\n");
  return idx >= 0
    ? tpl.slice(0, idx) + lines + tpl.slice(idx + "{points}".length)
    : tpl + "\n\n" + lines;
}

/** The results card: catalogCard chrome + one 5-track row per point. */
function renderPickupResultsCard(result) {
  const addrLabel = `${result.street}${result.houseNumber ? " " + result.houseNumber : ""}, ${result.city}`;
  const rows = result.points.map(pt => {
    const km = Math.round(Number(pt.Distance) * 10) / 10;
    const phone = pickupRealPhone(pt.Phone);
    const addr = `${pt.StreetName} ${pt.HouseNumber}, ${pt.CityName}`;
    const hours = String(pt.Description || "").trim();
    // 5 children == 5 tracks (.pickup-row), ALWAYS — empty phone included.
    return `
      <div class="deal-row pickup-row" title="${escapeHtml(hours)}">
        <span class="deal-name">${escapeHtml(String(pt.PointName || "").trim())}</span>
        <span class="pickup-addr">${escapeHtml(addr)}${hours ? ` · ${escapeHtml(hours)}` : ""}</span>
        <span class="deal-count">${km} ק״מ</span>
        <span class="pickup-phone">${phone ? escapeHtml(phone) : ""}</span>
        <span class="deal-actions"><button class="oa-copy" data-copy="${escapeHtml(pickupPointCopyLine(pt))}" title="העתק את הנקודה ללקוח (כולל קישור Waze)">📋</button></span>
      </div>`;
  }).join("");
  return catalogCard(
    `נקודות איסוף — ${escapeHtml(addrLabel)}`,
    // v7.29: the delivery-options MESSAGE is the headline action — the
    // full editable template (איסוף עצמי + הנקודות שנמצאו + משלוח עד
    // הבית) in one paste. העתק הכל keeps copying just the points sheet.
    `<button class="copy-btn oa-copy" data-copy="${escapeHtml(buildPickupDeliveryMessage(result))}" title="העתק את הודעת המשלוחים המלאה — איסוף עצמי + הנקודות שנמצאו + משלוח עד הבית">📋 הודעת משלוחים</button>`
      + headCount(result.points.length, "נקודות")

/* ═══════════════════════════════════════════════════════════════════════
   § 19. renderAll — THE ORCHESTRATOR
   Rebuilds the active tab into #results, syncs the cart drawer + FAB
   badge and the tab highlights, quietly ensures topup catalogs, and
   persists the session. Called after (almost) every state change.
   ═══════════════════════════════════════════════════════════════════════ */

function renderAll() {
  const resultsEl = document.getElementById("results");
  const cartEl = document.getElementById("cart");
  if (!resultsEl) return;

  // The registry only lives for one render — visible rows re-register
  // themselves below (see the lifetime warning in § 2). v7.26: cleared
  // BEFORE the empty-selection branch too — it used to sit after the
  // early return, so clearAllCountries left stale keys resolvable.
  orderPackageRegistry = {};

  // Empty selection → the friendly "pick a country" empty state. Exception:
  // the קיצורים and מבצעים tabs are reference material, viewable with nothing
  // selected (v6.21: the deals catalog is static, not tied to a selection;
  // v7.28: נקודות איסוף is address-based and needs no country either).
  if (!selected.length) {
    resultsEl.innerHTML = (activeTab === "shortcuts")
      ? `<div class="results-grid">${renderShortcutsPanel() + renderSettingsBackupCard()}</div>`
      : (activeTab === "deals")
      ? `<div class="deals-tab">${renderSpecialDeals()}</div>`
      : (activeTab === "tmobile")
      ? `<div class="deals-tab">${renderTmobileTab()}</div>`
      : (activeTab === "mobyx")
      ? `<div class="deals-tab">${renderMobyxTab()}</div>`
      : (activeTab === "immortal")
      ? `<div class="deals-tab">${renderImmortalTab()}</div>`
      : (activeTab === "pickup")
      ? `<div class="results-grid">${renderPickupPanel()}</div>`
      : `<div class="center-empty">
          <span class="ce-emoji">🌍</span>
          <h2>בחר מדינה כדי להתחיל</h2>
          <p>חפש מדינה בסרגל למעלה. המחירים נטענים אוטומטית, וההשוואה תופיע כאן.</p>
        </div>`;
    // The basket no longer requires a selection (catalog/T-Mobile/Mobyx
    // items exist without one), so the cart renders its real contents here
    // too — the empty-cart placeholder only when there are no items.
    if (cartEl) {
      const cartHtml = renderOrderBuilderPanel();
      cartEl.innerHTML = cartHtml && cartHtml.trim() ? cartHtml : window.__renderEmptyCart();
    }
    if (window.__updateCartFab) window.__updateCartFab();
    persistSession();
    return;
  }

  ensureAutoTopupState();

  // Build ONLY the active tab.
  let tabContent = "";
  if (activeTab === "basic") {
    tabContent = renderZoneNote() + renderGlobalPlans();
  } else if (activeTab === "gigaboost") {
    // v6.14: the self-serve product-page link now lives INSIDE each card.
    // v6.17: the zone note sits ABOVE a centered 2-card grid (not inside it),
    // so it never knocks the cards off-centre.
    // v6.27: a selection of ONLY catalog countries has no gigaboost plans at
    // all — say so instead of rendering two empty cards.
    if (selected.every(c => c.catalogOnly)) {
      tabContent = `<div class="block no-giga-card">
          <h3>אין חבילות גיגהבוסט ליעד הזה</h3>
          <p>היעד קיים רק בקטלוג החנות — החבילות שלו זמינות בטאב <b>תוכניות בסיסי</b> ובטאב <b>🔥 קטלוג</b>.</p>
        </div>`;
    } else {
      tabContent = renderZoneNote() + `<div class="giga-cards">${renderPhysicalPlans()}${renderEsimPlans()}</div>`;
    }
  } else if (activeTab === "copy") {
    tabContent =
      renderCheaperCountries() +
      `<div class="giga-cards copy-cards">` +
      renderCreditPricing() +
      renderPhysical() +
      renderWallet() +
      renderCustomAmount() +
      renderCellularProviders() +
      `</div>`;
  } else if (activeTab === "topup") {
    tabContent = renderTopupScannerPanel();
  } else if (activeTab === "deals") {
    tabContent = renderSpecialDeals();
  } else if (activeTab === "tmobile") {
    tabContent = renderTmobileTab();
  } else if (activeTab === "mobyx") {
    tabContent = renderMobyxTab();
  } else if (activeTab === "immortal") {
    tabContent = renderImmortalTab();
  } else if (activeTab === "shortcuts") {
    tabContent = renderShortcutsPanel() + renderSettingsBackupCard();
  } else if (activeTab === "pickup") {
    tabContent = renderPickupPanel();
  }

  // v6.16/v6.17: the gigaboost tab is a centered fixed-width column (.giga-tab)
  // instead of the default auto-fit grid, so its two cards stay centered even
  // when the mixed-zone note is present. v6.21: the deals catalog gets its own
  // centered column too (.deals-tab).
  const wrapClass = activeTab === "gigaboost" ? "giga-tab"
    : (activeTab === "deals" || activeTab === "tmobile" || activeTab === "mobyx" || activeTab === "immortal") ? "deals-tab"
    : "results-grid";
  resultsEl.innerHTML = `<div class="${wrapClass}">` + tabContent + `</div>`;

  // Keep the tab buttons' active state in sync (e.g. after session restore).
  document.querySelectorAll(".tab-btn").forEach(b =>
    b.classList.toggle("is-active", b.dataset.tab === activeTab)
  );

  // Cart drawer + FAB badge.
  if (cartEl) {
    const cartHtml = renderOrderBuilderPanel();
    cartEl.innerHTML = cartHtml && cartHtml.trim() ? cartHtml : window.__renderEmptyCart();
  }
  if (window.__updateCartFab) window.__updateCartFab();

  updateMasterSimplifyLabel();
  scheduleAutoEnsureTopupForSelection();
  persistSession();
}


/* ═══════════════════════════════════════════════════════════════════════
   § 20. EVENT WIRING
   The two document-level behaviors that aren't inline handlers.
   ═══════════════════════════════════════════════════════════════════════ */

/* ---- Keyboard shortcuts ----------------------------------------------------
   The full list, the CONFIG panel, and the LIVE plan map are all shown on the
   קיצורים tab; renderShortcutsPanel() and this handler are the two halves, so
   keep them in sync. Summary:
     1–9, 0           switch tabs (mapped over TAB_IDS in order; 0 = the 10th)
     /                focus the search box
     ?                open the קיצורים tab
     <mod>+<eSIM key> then 1–9   copy the Nth eSIM plan of the ACTIVE tab
     <mod>+<phys key> then 1–9   copy the Nth physical plan of the ACTIVE tab
     Esc              cancel an armed copy shortcut
   The copy chord is a two-step "leader" (arm a SIM type, then press a digit).
   It's fully user-configurable (modifier, leader keys, numpad-only) via the
   config panel — this handler reads shortcutConfig live. The processing order
   below is deliberate: capture-mode first, then armed-digit, then leader-arm,
   then the plain single-key shortcuts. */
document.addEventListener("keydown", (e) => {
  // (0) CONFIG CAPTURE: the panel is waiting to record a new leader key.
  //     The next real key becomes the binding; Esc cancels; lone modifiers
  //     are ignored so the operator can't bind "Control" by itself.
  if (capturingBinding) {
    if (["Control", "Shift", "Alt", "Meta"].includes(e.key)) return;
    e.preventDefault();
    if (e.key === "Escape") { capturingBinding = null; renderAll(); return; }
    const token = normalizeShortcutKey(e);
    if (token) {
      if (capturingBinding === "esim") shortcutConfig.esimKey = token;
      else if (capturingBinding === "physical") shortcutConfig.physicalKey = token;
      else if (capturingBinding === "search") shortcutConfig.searchKey = token;
      capturingBinding = null;
      persistShortcutConfig();
      renderAll();
    }
    return;
  }

  // (1) ARMED: a SIM type is waiting for its digit (digit input mode). Works
  //     ANYWHERE so "arm, then type a number" never gets eaten by a focused
  //     field. A plain digit COPIES the Nth plan; Shift+digit ADDS it to the
  //     cart (v6.5). Holding the modifier down keeps the arm alive.
  if (shortcutArmed) {
    if (["Control", "Shift", "Alt", "Meta"].includes(e.key)) return;
    if (e.key === "Escape") { disarmShortcut(); return; }
    const digit = shortcutDigit(e);
    if (digit !== null) {
      e.preventDefault();
      const type = shortcutArmed;
      const toCart = e.shiftKey;
      disarmShortcut();
      if (toCart) shortcutAddToCartByIndex(type, digit);
      else shortcutCopyPlan(type, digit);
      return;
    }
    // Any other key cancels the arm, then falls through to normal handling
    // (so e.g. a fresh leader chord re-arms instead of being swallowed).
    disarmShortcut();
  }

  // (1.5) SEARCH shortcut (v6.5): <searchModifier>+<searchKey> (default
  //       Shift+W) focuses the country search; a rapid SECOND press clears it.
  //       Fires when NOT in a field, OR when the search box itself is focused
  //       (so the double-press-to-clear works and the key isn't typed into
  //       search). Other inputs are left alone so you can still type the key.
  if (modifierMatches(e, shortcutConfig.searchModifier) && eventMatchesLeader(e, shortcutConfig.searchKey)) {
    const st = e.target;
    const inFieldS = st && (st.tagName === "INPUT" || st.tagName === "TEXTAREA" || st.tagName === "SELECT" || st.isContentEditable);
    const isSearchBox = st && st.id === "search";
    if (!inFieldS || isSearchBox) {
      e.preventDefault();
      handleSearchShortcut();
      return;
    }
  }

  // (2) LEADER CHORD: modifier + the eSIM/physical leader key ARMS a SIM type.
  //     Ctrl/Alt/Meta chords are safe to fire even inside inputs (you don't
  //     type them); Shift is part of normal typing, so a Shift leader only
  //     arms when focus is NOT in a text field.
  if (shortcutModifierMatches(e)) {
    const tgt = e.target;
    const typingNow = tgt && (tgt.tagName === "INPUT" || tgt.tagName === "TEXTAREA" || tgt.tagName === "SELECT" || tgt.isContentEditable);
    const safeInInput = shortcutConfig.modifier !== "shift";
    // v7.5: the SEARCH BAR never swallows a leader chord — Shift+Q/Shift+E
    // arm the copy menu even mid-search (same bypass the search shortcut
    // uses). Other inputs still win with a Shift modifier, so Shift+letter
    // stays typable in the ICCID/quantity fields.
    const inSearchBox = tgt && tgt.id === "search";
    if (!typingNow || safeInInput || inSearchBox) {
      if (eventMatchesLeader(e, shortcutConfig.esimKey)) { e.preventDefault(); armShortcut("esim"); return; }
      if (eventMatchesLeader(e, shortcutConfig.physicalKey)) { e.preventDefault(); armShortcut("physical"); return; }
    }
  }

  // (3) PLAIN single-key shortcuts — ignored while typing / with any modifier.
  const t = e.target;
  const typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
  if (typing) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  if (e.key === "/") {
    e.preventDefault();
    const s = document.getElementById("search");
    if (s) { s.focus(); s.select(); }
    return;
  }
  if (e.key === "?") { e.preventDefault(); setActiveTab("shortcuts"); return; }

  // v7.28: digit 0 = the 10th tab (נקודות איסוף); the digits are exhausted.
  const idx = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"].indexOf(e.key);
  if (idx !== -1) { e.preventDefault(); setActiveTab(TAB_IDS[idx]); }
});

/* ---- Country search autocomplete -------------------------------------------
   Matches Hebrew name / English name / ISO; results are ranked by a
   small prefix-beats-substring score and capped at 10. Enter picks the
   first suggestion. */

/** Countries matching a search string, ranked best-first. Matching is on the
 *  Hebrew name, the English name, OR the ISO code (so "DE" → Germany, "GR" →
 *  Greece — note ISO codes are the 2-letter country codes, not name initials).
 *  Ranking: an EXACT ISO code wins outright (v6.6 — typing a code always
 *  surfaces that one country first), then prefix beats substring, Hebrew beats
 *  English. Shared by the dropdown and the Enter handler, so Enter always picks
 *  the true top match regardless of the dropdown's DOM state. */
/** true when a and b differ by at most one edit (insert/delete/substitute). */
function editDistanceAtMost1(a, b) {
  if (a === b) return true;
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  let i = 0, j = 0, edits = 0;
  while (i < la && j < lb) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++edits > 1) return false;
    if (la > lb) i++;            // deletion in b
    else if (lb > la) j++;       // insertion in b
    else { i++; j++; }           // substitution
  }
  return edits + (la - i) + (lb - j) <= 1;
}

function searchMatches(rawVal) {
  const val = String(rawVal || "").toLowerCase().trim();
  if (!val) return [];
  const pool = data.concat(CATALOG_PSEUDO || []);
  let matches = pool.filter(c =>
    c.name.en.toLowerCase().includes(val) ||
    c.name.he.includes(val) ||
    // synthetic pseudo isos (#C13…) are internal keys, never search hits —
    // without this guard, typing any digit dredged them all up
    (!c.catalogOnly && c.iso.toLowerCase().includes(val))
  );
  // v7.1: zero exact matches + a real query → tolerate ONE typo (insert /
  // delete / substitute) against the name or its prefix. Never affects
  // queries that match normally.
  if (!matches.length && val.length >= 3) {
    matches = pool.filter(c =>
      editDistanceAtMost1(c.name.he.slice(0, val.length + 1), val) ||
      editDistanceAtMost1(c.name.he, val) ||
      editDistanceAtMost1(c.name.en.toLowerCase().slice(0, val.length + 1), val) ||
      editDistanceAtMost1(c.name.en.toLowerCase(), val)
    );
  }
  const score = c => {
    let s = 0;
    if (c.iso.toLowerCase() === val) s += 100;          // exact ISO code → straight to the top
    if (c.name.he.startsWith(val)) s += 3;
    if (c.name.en.toLowerCase().startsWith(val)) s += 2;
    if (c.iso.toLowerCase().startsWith(val)) s += 2;
    if (c.name.he.includes(val)) s += 1;
    return s;
  };
  return matches.sort((a, b) => score(b) - score(a));
}

const search = document.getElementById("search");
const suggestions = document.getElementById("suggestions");

if (search && suggestions) {
search.addEventListener("input", () => {
  suggestions.innerHTML = "";
  const matches = searchMatches(search.value);
  if (!matches.length) { suggestions.style.display = "none"; return; }

  matches.slice(0, 10).forEach(c => {
    const div = document.createElement("div");
    // Show the ISO code so operators learn/confirm the code they can search by.
    div.textContent = c.catalogOnly
      ? `${c.name.he} · 🛒 מהחנות`
      : `${c.name.he} · ${c.iso} (Zone ${c.zone}) ($${c.credit_price_per_gb})`;
    div.onclick = () => addCountry(c);
    suggestions.appendChild(div);
  });

  suggestions.style.display = "block";
});

// Enter selects the top match for whatever is typed (works even if the
// dropdown isn't currently showing).
search.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    const top = searchMatches(search.value)[0];
    if (top) addCountry(top);
  }
});
}

/* ---- GB quick-copy popup wiring (v6.4, extended v6.5) ----------------------
   In "field" input mode, arming opens #gbShortcutBar (openGbShortcutField).
   Keys inside the popup:
     Enter            → COPY the typed size's link (then close)
     Shift+Enter      → ADD the typed size to the cart (+1), keep popup open,
                        clear the field (so you can add more, or double it)
     Shift+Enter on   → CLEAR the cart — this is the "Shift+Enter+Enter"
       an EMPTY field    gesture (add, then a second Shift+Enter on the now
                        empty field), guarded to a short window after an add
     Escape           → close
   stopPropagation keeps these keys from reaching the document handler. */
const gbShortcutInput = document.getElementById("gbShortcutInput");
if (gbShortcutInput) {
  gbShortcutInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.shiftKey) {
      // ADD to cart, or (empty field, just after an add) CLEAR the cart.
      e.preventDefault(); e.stopPropagation();
      const type = gbFieldType;
      const raw = gbShortcutInput.value.trim();
      if (raw) {
        if (shortcutAddToCartByGb(type, raw)) {
          gbShortcutInput.value = "";          // ready for the next size / a clear
          lastCartAddTime = Date.now();
          try { gbShortcutInput.focus(); } catch (err) {}
        }
      } else if (Date.now() - lastCartAddTime < CART_CLEAR_DOUBLE_MS) {
        shortcutClearCart();                    // the second Enter of Shift+Enter+Enter
        lastCartAddTime = 0;
        closeGbShortcutField();
      } else {
        showCopyToast("הקלד גודל בג׳יגה כדי להוסיף לעגלה");
      }
    } else if (e.key === "Enter") {
      // COPY the typed size's link.
      e.preventDefault(); e.stopPropagation();
      const type = gbFieldType;
      const gb = gbShortcutInput.value;
      closeGbShortcutField();
      shortcutCopyPlanByGb(type, gb);
    } else if (e.key === "Escape") {
      e.preventDefault(); e.stopPropagation();
      closeGbShortcutField();
    } else {
      // Let digits type normally, but don't let them bubble to the doc handler.
      e.stopPropagation();
    }
  });
  // Clicking away cancels (deferred so an Enter that moves focus still copies).
  gbShortcutInput.addEventListener("blur", () => { setTimeout(closeGbShortcutField, 120); });
}

/* ═══════════════════════════════════════════════════════════════════════
   Copy-plan keyboard shortcuts (v6.3) — the configurable leader-chord system
   ─────────────────────────────────────────────────────────────────────────
   Everything the § 20 keydown handler and the קיצורים config panel call:
     · persistence  (loadShortcutConfig / persistShortcutConfig)
     · matching      (shortcutModifierMatches / normalizeShortcutKey /
                      eventMatchesLeader / shortcutDigit)
     · arm state     (armShortcut / disarmShortcut)
     · plan sources  (shortcutGigaboostPlans / shortcutBasicPlans /
                      shortcutTopupPlans → shortcutPlansForActiveTab)
     · the action    (shortcutCopyPlan)
     · config panel  (setShortcutModifier / setShortcutNumpadOnly /
                      beginCaptureShortcutKey / resetShortcutConfig /
                      shortcutComboLabel / leaderKeyLabel)
   ═══════════════════════════════════════════════════════════════════════ */

/* ---- Config persistence --------------------------------------------------- */

/** Restores the persisted shortcut config, merged OVER the defaults so a
 *  partial or older blob still yields a complete object. Called once at boot. */
function loadShortcutConfig() {
  try {
    const raw = JSON.parse(localStorage.getItem(SHORTCUT_CONFIG_KEY) || "null");
    if (raw && typeof raw === "object") {
      shortcutConfig = { ...DEFAULT_SHORTCUT_CONFIG, ...raw };
    }
  } catch (e) { /* corrupt blob → keep defaults */ }
}

/** Writes the current shortcut config to localStorage (best-effort). */
function persistShortcutConfig() {
  storageSet(SHORTCUT_CONFIG_KEY, JSON.stringify(shortcutConfig));
}

/* ---- Event matching ------------------------------------------------------- */

/** Does the event's modifier state match a named modifier ("ctrl" | "shift" |
 *  "alt" | "meta")? We require that modifier down and the others up, so e.g.
 *  Ctrl+Shift+E never fires a plain Ctrl chord. Ctrl and Meta are
 *  interchangeable for "ctrl" (Windows Ctrl ≈ Mac ⌘). Shared by the copy
 *  leader chord and the v6.5 search shortcut. */
function modifierMatches(e, modName) {
  switch (modName) {
    case "ctrl": return (e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey;
    case "meta": return e.metaKey && !e.shiftKey && !e.altKey;
    case "shift": return e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey;
    case "alt": return e.altKey && !e.ctrlKey && !e.shiftKey && !e.metaKey;
    default: return false;
  }
}

/** Does the event match the CONFIGURED copy-leader modifier? */
function shortcutModifierMatches(e) {
  return modifierMatches(e, shortcutConfig.modifier);
}

/** Normalizes a keydown event to a stable, case-insensitive token for
 *  matching (and storing) leader keys. Single printable chars fold to
 *  lowercase — so Shift+E and e both read "e"; named keys (Enter, ArrowUp…)
 *  pass through unchanged; Space reads " ". */
function normalizeShortcutKey(e) {
  const k = e.key;
  if (typeof k !== "string") return "";
  if (k === " ") return " ";
  if (k.length === 1) return k.toLowerCase();
  return k;
}

/** Does this event match a configured leader/search key (stored normalized)? */
function eventMatchesLeader(e, leaderKey) {
  return !!leaderKey && normalizeShortcutKey(e) === leaderKey;
}

/** The 1–9 digit this event represents for a copy/cart shortcut, or null. When
 *  numpadOnly is on, ONLY the numeric keypad (by physical e.code) counts;
 *  otherwise the number row or the keypad both work. Modifier state is ignored,
 *  and the number row is read by e.code too — so Shift+2 (whose e.key is "@")
 *  still resolves to 2, letting Shift+digit mean "add to cart". */
function shortcutDigit(e) {
  const npm = /^Numpad([1-9])$/.exec(e.code || "");
  if (npm) return Number(npm[1]);
  if (shortcutConfig.numpadOnly) return null;
  if (/^[1-9]$/.test(e.key)) return Number(e.key);
  const drm = /^Digit([1-9])$/.exec(e.code || "");
  if (drm) return Number(drm[1]);
  return null;
}

/* ---- Arm / disarm --------------------------------------------------------- */

/** Arms a SIM type. In "field" mode this opens the GB popup; in "digit" mode
 *  it shows a hint toast and starts the auto-disarm timer (a second arm just
 *  resets the timer). */
function armShortcut(simType) {
  if (shortcutConfig.inputMode === "field") {
    openGbShortcutField(simType);
    return;
  }
  shortcutArmed = simType;
  if (shortcutArmTimer) clearTimeout(shortcutArmTimer);
  shortcutArmTimer = setTimeout(disarmShortcut, SHORTCUT_ARM_TIMEOUT_MS);
  const label = simType === "esim" ? "eSIM" : "סים פיזי";
  showCopyToast(`⌨️ ${label} — הקש 1–9 להעתקת תוכנית`);
}

/** Clears any armed SIM type and its timer. */
function disarmShortcut() {
  shortcutArmed = null;
  if (shortcutArmTimer) { clearTimeout(shortcutArmTimer); shortcutArmTimer = null; }
}

/* ---- Context-aware plan sources -------------------------------------------
   Each returns an array of {gb, label, url, ...} copy targets in the SAME
   order the matching tab renders — so the digit N maps to the plan shown at
   position N, and the GB lookup (v6.4) finds the plan of that exact size.
   Pass {all:true} to IGNORE the "פישוט" filter — used by the GB lookup so an
   explicitly-typed size (e.g. 25) is copyable even when it's hidden from the
   simplified view. */

/** גיגהבוסט: the eSIM/physical quick-order plans (highest per-type zone,
 *  sorted by GB) as copy targets. Uses the direct payment link — the same URL
 *  the row's 📋 button copies. */
function shortcutGigaboostPlans(simType, opts = {}) {
  if (!selected.length) return [];
  const zoneField = simType === "esim" ? "esimZone" : "physicalZone";
  const planKey = simType === "esim" ? "esim" : "physical";
  const simplifyKey = simType === "esim" ? "esimPlans" : "physicalPlans";
  const topZone = Math.max(...selected.map(c => c[zoneField] ?? c.zone));
  const country = selected.find(c => (c[zoneField] ?? c.zone) === topZone) || selected[0];
  if (!country) return [];
  let plans = [...(country.plans[planKey] || [])].sort((a, b) => a.dataGB - b.dataGB);
  if (!opts.all && isSimplified(simplifyKey)) plans = plans.filter(p => p.dataGB !== 1 && p.dataGB !== 7);
  return plans.map(p => {
    const priceILS = simType === "esim" ? Math.round(p.priceUSD * USD_TO_ILS) : p.priceILS;
    return {
      gb: Number(p.dataGB),
      label: `${simType === "esim" ? "eSIM" : "פיזי"} ${p.dataGB}GB — ₪${priceILS}`,
      url: buildOrderLink(simType, p.dataGB),
    };
  });
}

/** בסיסי: the operative scanned country's site packages for a SIM type as
 *  copy targets. Uses the site checkout URL (the same link the row's base 📋
 *  button copies), zone-consistent per v5.9. */
function shortcutBasicPlans(simType, opts = {}) {
  const scanType = simType === "esim" ? "esim" : "physical_sim";
  const country = operativeManualCountry(scanType);
  const scan = country && manualScanFor(country, scanType);
  if (!scan) return [];
  const isos = selected.map(c => c.iso);
  const simplifyOn = opts.all ? false : isSimplified('global_' + getHighestZone());
  const displayPackages = getDisplayGlobalPackages(scan.packages || [], simplifyOn);
  return displayPackages.map(pkg => ({
    gb: Number(pkg.dataGB),
    label: `${simType === "esim" ? "eSIM" : "פיזי"} ${pkg.dataGB}GB — ₪${pkg.base.totalILS}`,
    url: buildCheckoutUrl(pkg.base?.checkoutUrl, true, isos),
    // v6.5 — everything the cart-add needs (basic packages feed the order builder).
    raw: { kind: "basic", pkg, isos, scanType },
  }));
}

/** טופאפ: the current selection/version topup packages as copy targets.
 *  Type-AGNOSTIC — the topup SIM type is chosen by the version selector, so
 *  the eSIM and physical leaders copy the same list. Needs a full customer
 *  ICCID (flagged via needsIccid, handled by the copy functions). */
function shortcutTopupPlans(simType, opts = {}) {
  const result = getCurrentTopupCatalog();
  if (!result) return [];
  const simplifyOn = opts.all ? false : isSimplified("topup");
  const displayPackages = getDisplayGlobalPackages(result.packages || [], simplifyOn, { maxValidityDays: 30 })
    .slice()
    .sort((a, b) => (a.dataGB - b.dataGB) || (b.validityDays - a.validityDays));
  const customerIccid = normalizeIccid(topupState.customerIccid || "");
  const hasIccid = customerIccid.length >= 18;
  return displayPackages.map(pkg => ({
    gb: Number(pkg.dataGB),
    label: `טופאפ ${pkg.dataGB}GB — ₪${pkg.base.totalILS}`,
    url: hasIccid ? buildTopupCheckoutUrl(pkg.base?.checkoutUrl, 1, cartSettings.emptyCart, customerIccid) : "",
    needsIccid: !hasIccid,
    // v6.5 — cart-add for topup goes through the topup order-builder path.
    raw: { kind: "topup", pkg, result },
  }));
}

/** The copy-shortcut plan list for the CURRENTLY active tab + SIM type, or
 *  null when the active tab has no copy shortcuts. Numbering/GB matches what
 *  that tab renders. */
function shortcutPlansForActiveTab(simType, opts = {}) {
  if (activeTab === "gigaboost") return shortcutGigaboostPlans(simType, opts);
  if (activeTab === "basic") return shortcutBasicPlans(simType, opts);
  if (activeTab === "topup") return shortcutTopupPlans(simType, opts);
  return null;
}

/* ---- The action ----------------------------------------------------------- */

/** Shared tail for both copy paths: validates the resolved plan and copies it,
 *  toasting every failure. `desc` describes what was looked up (for the
 *  not-found message). Returns true on a successful copy. */
function shortcutFinishCopy(plans, plan, desc) {
  if (plans === null) { showCopyToast("קיצורי העתקה פעילים בלשוניות גיגהבוסט · בסיסי · טופאפ"); return false; }
  if (!selected.length) { showCopyToast("בחר מדינה קודם"); return false; }
  if (!plans.length) { showCopyToast("אין תוכניות זמינות בלשונית הזו"); return false; }
  if (!plan) { showCopyToast(`אין תוכנית ${desc} בלשונית הזו`); return false; }
  if (plan.needsIccid) { showCopyToast("הקלד ICCID לקוח בלשונית טופאפ קודם"); return false; }
  if (!plan.url) { showCopyToast("אין קישור לתוכנית הזו"); return false; }
  copyText(plan.url);
  showCopyToast(`✓ הועתק — ${plan.label}`);
  return true;
}

/** DIGIT mode: copies the Nth (1-based) SHOWN plan of the active tab. */
function shortcutCopyPlan(simType, n) {
  const plans = shortcutPlansForActiveTab(simType);
  const plan = plans ? plans[n - 1] : null;
  return shortcutFinishCopy(plans, plan, `במיקום ${n}`);
}

/** FIELD mode (v6.4): copies the plan of an EXACT GB size, regardless of the
 *  "פישוט" filter — so 2 / 25 / 50 and every other real size work. */
function shortcutCopyPlanByGb(simType, gbRaw) {
  const gb = Number(String(gbRaw == null ? "" : gbRaw).trim());
  if (!Number.isFinite(gb) || gb <= 0) { showCopyToast("הקלד גודל בג׳יגה (למשל 10)"); return false; }
  const plans = shortcutPlansForActiveTab(simType, { all: true });
  const plan = plans ? plans.find(p => Number(p.gb) === gb) : null;
  return shortcutFinishCopy(plans, plan, `של ${gb}GB`);
}

/* ---- CART shortcuts (v6.5) -------------------------------------------------
   The same arm/select flow can ADD a plan to the cart (order builder) instead
   of copying its link: Shift+Enter in the GB popup (or Shift+digit in digit
   mode). Only בסיסי and טופאפ plans feed the cart — גיגהבוסט rows are direct
   app-links with no order-builder integration, so cart-add there just says so.
   Each add bumps that plan's cart line by +1 (repeat to increase quantity). */

/** Adds one unit of a resolved plan-source item to the cart. Dispatches on the
 *  item's `raw.kind` (basic / topup); items without `raw` (gigaboost) can't
 *  go in the cart. Returns true on success. */
function shortcutAddPlanToCart(item) {
  if (!item) { showCopyToast("אין תוכנית להוסיף"); return false; }
  if (!item.raw) { showCopyToast("גיגהבוסט = קישור ישיר, אין עגלה. הוסף מלשונית בסיסי/טופאפ."); return false; }
  if (item.raw.kind === "basic") return addBasicRawToCart(item.raw);
  if (item.raw.kind === "topup") return addTopupRawToCart(item.raw);
  return false;
}

/** בסיסי: register the package and bump its cart line by one unit. */
function addBasicRawToCart(raw) {
  const key = registerOrderPackage(raw.scanType, raw.pkg, raw.isos);
  const existing = parseInt(getBuilderQtyForKey(key), 10) || 0;
  const ok = applyPackageOrderQuantity(key, existing + 1);
  if (ok) showCopyToast(`🛒 נוסף לעגלה — ${simTypeHebrew(raw.scanType)} ${raw.pkg.dataGB}GB (×${existing + 1})`);
  return ok;
}

/** טופאפ: needs a customer ICCID (unless batch mode); bump its line by one. */
function addTopupRawToCart(raw) {
  const key = registerTopupPackage(raw.pkg, raw.result);
  if (topupState.batchMode) {
    const ok = applyTopupOrderQuantity(key, 1);   // one unit per pasted card
    if (ok) showCopyToast(`🛒 נוסף לעגלה — טופאפ ${raw.pkg.dataGB}GB לכל כרטיס`);
    return ok;
  }
  const iccid = normalizeIccid(topupState.customerIccid || "");
  if (iccid.length < 18) { showCopyToast("הקלד ICCID לקוח בלשונית טופאפ קודם"); return false; }
  const existing = parseInt(getBuilderQtyForKey(`${key}::${iccid}`), 10) || 0;
  const ok = applyTopupOrderQuantity(key, existing + 1);
  if (ok) showCopyToast(`🛒 נוסף לעגלה — טופאפ ${raw.pkg.dataGB}GB (×${existing + 1})`);
  return ok;
}

/** FIELD mode: adds the plan of an EXACT GB size to the cart. */
function shortcutAddToCartByGb(simType, gbRaw) {
  const gb = Number(String(gbRaw == null ? "" : gbRaw).trim());
  if (!Number.isFinite(gb) || gb <= 0) { showCopyToast("הקלד גודל בג׳יגה (למשל 10)"); return false; }
  if (activeTab === "gigaboost") { showCopyToast("גיגהבוסט = קישור ישיר, אין עגלה. הוסף מלשונית בסיסי/טופאפ."); return false; }
  const plans = shortcutPlansForActiveTab(simType, { all: true });
  if (plans === null) { showCopyToast("הוספה לעגלה פעילה בלשוניות בסיסי · טופאפ"); return false; }
  if (!selected.length) { showCopyToast("בחר מדינה קודם"); return false; }
  const item = plans.find(p => Number(p.gb) === gb);
  if (!item) { showCopyToast(`אין תוכנית של ${gb}GB בלשונית הזו`); return false; }
  return shortcutAddPlanToCart(item);
}

/** DIGIT mode: adds the Nth shown plan of the active tab to the cart. */
function shortcutAddToCartByIndex(simType, n) {
  if (activeTab === "gigaboost") { showCopyToast("גיגהבוסט = קישור ישיר, אין עגלה. הוסף מלשונית בסיסי/טופאפ."); return false; }
  const plans = shortcutPlansForActiveTab(simType);
  if (plans === null) { showCopyToast("הוספה לעגלה פעילה בלשוניות בסיסי · טופאפ"); return false; }
  if (!selected.length) { showCopyToast("בחר מדינה קודם"); return false; }
  return shortcutAddPlanToCart(plans[n - 1]);
}

/** Empties the order builder (the "Shift+Enter+Enter" gesture). */
function shortcutClearCart() {
  if (!orderBuilderItems.length) { showCopyToast("העגלה כבר ריקה"); return false; }
  clearOrderBuilder();
  showCopyToast("🗑️ העגלה רוקנה");
  return true;
}

/** Search shortcut: focuses the country-search box; a SECOND press within
 *  SEARCH_CLEAR_DOUBLE_MS (while it's already focused) RESETS the whole
 *  selection (v6.6 — Shift+W+W clears all selected countries immediately, no
 *  confirm). Also clears the search box on the reset. Returns the action taken
 *  ("focus" | "reset") for testability. */
function handleSearchShortcut() {
  const s = document.getElementById("search");
  if (!s) return "";
  const now = Date.now();
  const focused = document.activeElement === s;
  if (focused && (now - lastSearchShortcutTime) < SEARCH_CLEAR_DOUBLE_MS) {
    lastSearchShortcutTime = 0;
    s.value = "";
    const sug = document.getElementById("suggestions");
    if (sug) { sug.innerHTML = ""; sug.style.display = "none"; }
    const had = selected.length;
    clearAllCountries();                 // reset ALL selected countries
    try { s.focus(); } catch (err) {}
    showCopyToast(had ? "🗑️ כל המדינות אופסו" : "אין מדינות לאיפוס");
    return "reset";
  }
  try { s.focus(); s.select(); } catch (err) {}
  lastSearchShortcutTime = now;
  return "focus";
}

/* ---- FIELD-mode "type the GB" popup (v6.4) --------------------------------
   In "field" input mode, arming opens a small fixed popup with a numeric
   input; the operator types the GB and Enter copies. gbFieldType remembers
   which SIM type it's for. The input's own listeners (wired in § 20) drive
   Enter/Escape; the document handler is not involved once the field is open. */

/** Opens the GB popup for a SIM type and focuses its input. */
function openGbShortcutField(simType) {
  gbFieldType = simType;
  const bar = document.getElementById("gbShortcutBar");
  const input = document.getElementById("gbShortcutInput");
  const label = document.getElementById("gbShortcutLabel");
  if (!bar || !input) return;
  if (label) label.textContent = simType === "esim" ? "eSIM · גודל בג׳יגה" : "סים פיזי · גודל בג׳יגה";
  bar.hidden = false;
  input.value = "";
  // focus after the show so the browser actually moves the caret in.
  setTimeout(() => { try { input.focus(); input.select(); } catch (e) { /* input detached by a re-render */ } }, 0);
}

/** Hides the GB popup and clears its state. */
function closeGbShortcutField() {
  gbFieldType = null;
  const bar = document.getElementById("gbShortcutBar");
  if (bar) bar.hidden = true;
}

/* ---- Config-panel mutators + labels --------------------------------------- */

/** Sets the leader modifier from the config panel <select>. */
function setShortcutModifier(value) {
  if (!MODIFIER_LABELS[value]) return;
  shortcutConfig.modifier = value;
  persistShortcutConfig();
  renderAll();
}

/** Toggles the numpad-only restriction from the config panel checkbox. */
function setShortcutNumpadOnly(on) {
  shortcutConfig.numpadOnly = !!on;
  persistShortcutConfig();
  renderAll();
}

/** Sets the input mode ("field" | "digit") from the config panel. Closes any
 *  open GB popup so a mode switch never leaves a stale field showing. */
function setShortcutInputMode(value) {
  if (!INPUT_MODE_LABELS[value]) return;
  shortcutConfig.inputMode = value;
  closeGbShortcutField();
  disarmShortcut();
  persistShortcutConfig();
  renderAll();
}

/** The compact per-row shortcut badge shown next to a plan (v6.4). In field
 *  mode it reads "<combo> → <gb>" (arm, then type the GB); in digit mode it
 *  reads "<combo> → <index>" (arm, then press that digit) and is omitted past
 *  position 9 (single digit can't reach it). Returns "" when there's nothing
 *  useful to show. */
function renderPlanShortcutHint(simType, gb, index) {
  const leaderKey = simType === "esim" ? shortcutConfig.esimKey : shortcutConfig.physicalKey;
  const combo = shortcutComboLabel(leaderKey);
  const typeHe = simType === "esim" ? "eSIM" : "סים פיזי";
  let token, tip;
  if (shortcutConfig.inputMode === "field") {
    token = String(gb);
    tip = `העתקה מהירה (${typeHe}): ${combo} ואז הקלד ${gb} ו‑Enter`;
  } else {
    if (!(index >= 1 && index <= 9)) return "";
    token = String(index);
    tip = `העתקה מהירה (${typeHe}): ${combo} ואז ${index}`;
  }
  return `<span class="plan-kbd" title="${escapeHtml(tip)}">⌨ ${escapeHtml(combo)}→${escapeHtml(token)}</span>`;
}

/** Begins capturing a new key for binding "esim" | "physical" | "search". The
 *  next keypress (see the § 20 handler, step 0) records it. */
function beginCaptureShortcutKey(which) {
  capturingBinding = (which === "esim" || which === "physical" || which === "search") ? which : null;
  renderAll();
}

/** Sets the search-shortcut modifier from the config panel <select>. */
function setSearchModifier(value) {
  if (!MODIFIER_LABELS[value]) return;
  shortcutConfig.searchModifier = value;
  persistShortcutConfig();
  renderAll();
}

/** Restores factory-default shortcut config. */
function resetShortcutConfig() {
  shortcutConfig = { ...DEFAULT_SHORTCUT_CONFIG };
  capturingBinding = null;
  persistShortcutConfig();
  renderAll();
}

/** Display label for a single leader key ("E", "Space", "Enter", "?"). */
function leaderKeyLabel(leaderKey) {
  if (leaderKey === " ") return "Space";
  if (!leaderKey) return "?";
  return leaderKey.length === 1 ? leaderKey.toUpperCase() : leaderKey;
}

/** "Ctrl + E" style label for a leader chord. */
function shortcutComboLabel(leaderKey) {
  const mod = MODIFIER_LABELS[shortcutConfig.modifier] || shortcutConfig.modifier;
  return `${mod} + ${leaderKeyLabel(leaderKey)}`;
}

/** How the second step reads for the current input mode (used in legends). */
function shortcutInteractionHint() {
  return shortcutConfig.inputMode === "field"
    ? "ואז הקלד את הגודל (GB) ו‑Enter"
    : "ואז הקש מספר (1–9)";
}

/** A one-line "how to quick-copy" legend for a card. `simTypes` is the SIM
 *  types the card offers (["esim"], ["physical"], or both); opts.topup adds
 *  the "type follows the version selector" note; opts.cart adds the v6.5
 *  "Shift+Enter = add to cart" hint (basic / topup only). Returns "" if
 *  there's nothing selected (no plans to copy anyway). */
function renderCopyLegend(simTypes, opts = {}) {
  if (!selected.length) return "";
  const combos = simTypes.map(t => {
    const leader = t === "esim" ? shortcutConfig.esimKey : shortcutConfig.physicalKey;
    return `<span class="plan-kbd">${escapeHtml(shortcutComboLabel(leader))}</span>`;
  }).join(" · ");
  const tail = opts.topup ? " · הסוג נקבע לפי בורר הגרסה" : "";
  const cart = opts.cart
    ? ` <span class="copy-legend-cart">🛒 ${escapeHtml(shortcutConfig.inputMode === "field" ? "Shift+Enter מוסיף לעגלה" : "Shift+ספרה מוסיף לעגלה")}</span>`
    : "";
  return `<div class="copy-legend">⌨ העתקה מהירה: ${combos} ${escapeHtml(shortcutInteractionHint())}${tail}${cart}</div>`;
}


/* ═══════════════════════════════════════════════════════════════════════
   § 21. BOOT
   Runs once at load. Order-portal URLs short-circuit into the standalone
   runner; otherwise: fetch the three country lists + all 20 zones of
   both package endpoints in parallel, build the country model, validate
   the persisted cache, restore the session, first paint, and kick off
   the automatic topup preload.
   ═══════════════════════════════════════════════════════════════════════ */

// Apply any persisted $/₪ tier overrides onto WALLET/PHYSICAL before the
// first render uses them.
loadRefOverrides();

// Restore the operator's keyboard-shortcut preferences before the first
// render (the קיצורים panel reads shortcutConfig).
loadShortcutConfig();

(async () => {
  const loadingEl = document.getElementById("loading");

  // Order-portal mode: the URL carries an encoded order payload — show
  // only the runner card and skip the whole calculator boot.
  if (new URLSearchParams(window.location.search).has(ORDER_PAYLOAD_PARAM)) {
    renderStandaloneOrderPortal();
    return;
  }
  try {

  /** GET a URL and parse its JSON body. */
  async function fetchJSON(url) {
    const res = await fetch(url);
    return res.json();
  }

  // get-countries: credit price + GENERAL zone. The pSIM and eSIM
  // catalogs have their OWN country lists with their own zones, which
  // can differ per country — so gigaboost plans must use the per-type
  // zone, not the general one (three-zone model).
  const [countriesRes, physListRes, esimListRes] = await Promise.all([
    fetchJSON(`${APP_LINK_API_BASE}/get-countries`),
    fetchJSON(`${APP_LINK_API_BASE}/get-physical-countries`).catch(() => null),
    fetchJSON(`${APP_LINK_API_BASE}/get-payasugo-countries`).catch(() => null),
  ]);
  const esimCountries = countriesRes.data;

  /** ISO → zone map from a per-type country list. Tolerates both the
   *  { data: [...] } wrapper and a bare array, and both iso_code / iso
   *  field spellings — the two endpoints have differed before. */
  function zoneMapFrom(res) {
    const list = Array.isArray(res) ? res : (res && Array.isArray(res.data) ? res.data : []);
    const map = {};
    for (const c of list) {
      const iso = c.iso_code || c.iso;
      const z = parseInt(c.zone, 10);
      if (iso && Number.isFinite(z)) map[iso] = z;
    }
    return map;
  }
  const physicalZoneByIso = zoneMapFrom(physListRes);
  const esimZoneByIso = zoneMapFrom(esimListRes);

  // Fetch every zone's package list for both SIM types, in parallel.
  // Zones run 1–20 today; absent zones just return empty lists.
  const zones = Array.from({ length: 20 }, (_, i) => i + 1);

  const esimPackages = (await Promise.all(
    zones.map(z => fetchJSON(`${APP_LINK_API_BASE}/get-packages?zone=${z}`).catch(()=>[]))
  )).flat();

  const physicalPackages = (await Promise.all(
    zones.map(z => fetchJSON(`${APP_LINK_API_BASE}/get-physical-packages?zone=${z}`).catch(()=>[]))
  )).flat();

  // Index packages by zone. The `id` field is load-bearing: it is the
  // token/id segment of the direct app.simtlv payment link.
  const esimByZone = {};
  const physicalByZone = {};

  for (const p of esimPackages) {
    (esimByZone[p.zone] ||= []).push({
      dataGB: p.data,
      priceUSD: round2(p.price),
      appId: p.id // token segment of the direct app.simtlv payment link
    });
  }

  for (const p of physicalPackages) {
    (physicalByZone[p.zone] ||= []).push({
      dataGB: parseFloat(p.data_amount), // e.g. "10GB" → 10
      priceILS: round2(p.price),
      appId: p.id // numeric segment of the direct app.simtlv payment link
    });
  }

  /** v7.31: the get-countries `network` field — a JSON-encoded array of
   *  {network_name, is4G, is5G} per country (verified live: all 168
   *  countries carry it; get-physical-countries has the SAME field,
   *  byte-identical for every country on 2026-08-21 — so ONE list per
   *  country; split per SIM type only if they ever diverge). Returns []
   *  on anything unparseable — the card then says so honestly. */
  function parseCountryNetworks(raw) {
    try {
      const arr = JSON.parse(raw || "[]");
      return Array.isArray(arr) ? arr.filter(n => n && n.network_name) : [];
    } catch (e) {
      return [];
    }
  }
  window.parseCountryNetworks = parseCountryNetworks; // probed by the harness

  // Build the country model (shape documented at the `data` declaration).
  data = esimCountries.map(c => {
    const generalZone = c.zone;
    const esimZone = esimZoneByIso[c.iso_code] ?? generalZone;
    const physicalZone = physicalZoneByIso[c.iso_code] ?? generalZone;
    return {
      iso: c.iso_code,
      name: {
        en: c.country_name,
        he: c.hebrew_name || c.country_name
      },
      zone: generalZone,
      esimZone,
      physicalZone,
      credit_price_per_gb: round2(c.price),
      networks: parseCountryNetworks(c.network),
      plans: {
        esim: esimByZone[esimZone] || [],
        physical: physicalByZone[physicalZone] || []
      }
    };
  });

  // v6.27: add the shop-catalog-only destinations to the searchable list.
  injectCatalogOnlyCountries();

  // Country model ready → load the persisted per-type-zone catalog,
  // restore the operator's session, and paint.
  loadPersistedGlobalCatalog();
  restoreSession();
  // v7.16: the setup script reopens the calculator with ?incognito_ready=1
  // (AFTER restoreSession so the armed flag persists over the saved state).
  applyIncognitoReadyParam(window.location.search);
  if (loadingEl) loadingEl.style.display = "none";
  renderAll();
  setExportStatus(`מחירי האתר נסרקים ישירות לכל מדינה שנבחרת (מקור אמין יחיד — אזור המחיר האמיתי של האתר). ${getLoadedZoneCount()} מדינות במטמון.`);
  // Kick off the automatic topup preload AFTER this turn of the event
  // loop, so the first paint isn't blocked behind it.
  setTimeout(() => autostartTopupCatalogPreload(false), 0);
  } catch (err) {
    // Boot failed (network/API down) — repurpose the loading overlay as
    // an error card instead of leaving an eternal spinner.
    console.error("Initial data load failed", err);
    if (loadingEl) {
      loadingEl.innerHTML = `טעינת הנתונים נכשלה.<br><small>${err.message}</small>`;
      loadingEl.style.background = "#fff3f3";
      loadingEl.style.color = "#8a0000";
    }
  }
})();
</script>

</body>
</html>
