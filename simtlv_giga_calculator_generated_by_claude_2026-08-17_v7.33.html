<!-- ═══════════════════════════════════════════════════════════════════════
  מחשבון גיגה (SimTLV Giga Calculator)
  Generated by Claude · 2026-08-17 · v7.33

  WHAT THIS FILE IS
  ─────────────────
  An internal sales/ops terminal for SimTLV resellers, delivered as ONE
  self-contained HTML file (deliberate — the file is distributed by hand
  to staff and runs from disk via file:// or any static host). There is
  no build step, no bundler, no framework, and no dependency beyond two
  Google Fonts. All persistent state lives in the browser's localStorage.

  Do NOT split this file into modules unless the distribution model
  changes. See the companion maintenance guide:
  simtlv_giga_calculator_docs_generated_by_claude_*_v*.md

  FILE MAP (four zones, in order)
  ───────────────────────────────
    1. <style>      — the full stylesheet. LAYERED: base reset → design
                      tokens → components → "v4 density layer" at the end
                      that intentionally overrides earlier rules.
                      Ordering matters; do not reorder blocks casually.
    2. Shell HTML   — the static skeleton: top bar, tab bar, #results
                      (all dynamic content renders here), cart FAB +
                      drawer, quote-template modal.
    3. Shell script — 3 tiny helpers that must exist before first paint.
    4. Main script  — constants, state, data loading, business logic,
                      link builders, renderers. Classic global-scope
                      script (no modules). See its table of contents.

  NON-NEGOTIABLES (each has bitten before — see the maintenance guide)
  ────────────────────────────────────────────────────────────────────
    * UI is Hebrew, RTL throughout. RTL comes from CSS `direction`, so
      [dir="rtl"] attribute selectors DO NOT match in this document.
    * The referral code (REFERRAL_CODE constant in the main script) must
      appear on every customer-facing URL this tool produces.
    * Deal/bundle checkout URLs never get a quantity multiplier.
    * Exactly ONE window.open per user gesture (see the order runner).
  ═══════════════════════════════════════════════════════════════════════ -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מחשבון גיגה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=Suez+One&display=swap" rel="stylesheet">

<style>
/* =========================================================================
   מחשבון גיגה · STYLESHEET
   Refined, professional light theme. Indigo primary with emerald/rose
   accents kept distinct from the price badges.

   ⚠ LAYERING RULE — READ BEFORE EDITING ⚠
   ----------------------------------------
   This sheet is written in layers, and equal-specificity rules resolve by
   ORDER. The final "v4 density layer" (search for that banner near the
   bottom) intentionally overrides earlier component rules. When you need
   to override something, add the rule to the END of the density layer and
   DELETE the rule it supersedes — do not stack a third layer on top.

   Historical incidents this rule exists to prevent:
     * a generic `input:focus{background:#fff}` late in the sheet made
       top-bar inputs white-on-white the moment they were focused;
     * `.tb-options .opt-btn.is-on` lost its background to a later,
       equally specific `.opt-btn.is-on`;
     * the suggestions dropdown inherited the dark top bar's near-white
       text onto its own white background.
   Rule of thumb: anything rendered inside the dark top bar needs an
   explicit `color` AND explicit `:focus` colors.

   TABLE OF CONTENTS (in source order)
   -----------------------------------
     1. Design tokens (:root custom properties) + base reset
     2. Ops-terminal shell: ink top bar, brand chip, search, chips,
        options cluster, status line, scrollable content area
     3. Cart: floating FAB + right-edge slide-in drawer, empty states
     4. Loading overlay + spinner
     5. Panels, buttons, inputs, suggestions dropdown, selected chips
     6. Results grid + generic .block card + <pre> price text
     7. "Global" (manual-site) cards: columns, price rows, badges
     8. Quick-order rows (eSIM / physical ledgers), link groups
     9. Zone note, card headers, simplify switch, options bar
    10. Manual-site savings emphasis, number-order group
    11. Generated order builder + integrated order runner + order-mode
        (standalone portal: body.order-mode hides all normal chrome —
        any NEW chrome must be appended to its display:none list)
    12. Top-up scanner card: controls, status, inventory, patterns,
        quick chips, fixed-geometry package rows (muscle memory!)
    13. Reusable hover tooltip (.info-tip)
    14. Responsive breakpoints + reduced-motion
    15. ===== v4 density layer ===== (deliberate overrides; keep last)

   RTL REMINDERS
   -------------
     * Direction is set via CSS `direction:rtl` on <body>, NOT via a dir
       attribute — so [dir] selectors never match here.
     * Drawers/tooltips that must open toward the reading direction are
       anchored with physical right/left, not inset-inline-*.
     * The cart drawer hides at translateX(105%) — off the RIGHT edge.
   ========================================================================= */

:root{
  --bg:#e9ecf2;
  --surface:#ffffff;
  --surface-2:#f5f6fa;
  --line:#e6e9f0;
  --line-strong:#d7dbe6;
  --text:#1b1f2a;
  --muted:#6b7280;

  --primary:#3b3fd8;
  --primary-700:#2c2fb0;
  --primary-100:#dfe1fb;
  --primary-50:#eef0ff;

  --accent:#0ea371;
  --accent-700:#0a7d57;

  --good-bg:#e7f7ee; --good:#0c7a44; --good-bd:#b8e6cb;
  --bad-bg:#fdecef;  --bad:#b01030;  --bad-bd:#f6c2cd;
  --same-bg:#eef1f6; --same:#4b5566; --same-bd:#d3d9e4;

  /* v7.27: the ONE ledger row scheme (gigaboost reference values). Every
     zebra/hover in every ledger family reads these — never hardcode the
     rgba() literals again. The hover blue is deliberately NOT --primary:
     the reference hue was chosen for legibility over the zebra. */
  --row-zebra:rgba(16,19,25,.035);
  --row-hover:rgba(47,107,255,.07);

  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 2px 8px -4px rgba(16,24,40,.10);
  --shadow-lg:0 2px 6px rgba(16,24,40,.06), 0 10px 24px -12px rgba(16,24,40,.20);
  --radius:14px;
}

*{ box-sizing:border-box; }

html{ -webkit-text-size-adjust:100%; }

body{
  font-family:'Assistant', system-ui, Arial, sans-serif;
  color:var(--text);
  font-size:13px;
  line-height:1.45;
  direction:rtl;
  margin:0;
  padding:0;
  height:100vh;
  overflow:hidden;
  background:var(--bg);
}

/* ===== Ops-terminal shell: ink topbar + full-width content ===== */
:root{
  --ink:#101319;
  --ink-2:#1a1f2a;
  --ink-line:rgba(255,255,255,.12);
  --chip-gold:linear-gradient(135deg,#e8c66a 0%,#c9a24a 45%,#f0d78a 100%);
}
.app{
  display:flex; flex-direction:column;
  height:100vh; width:100vw;
  position:relative; z-index:1;
}
.topbar{
  flex:0 0 auto;
  display:flex; align-items:center; gap:14px;
  height:48px; padding:0 14px;
  background:var(--ink);
  color:#e8ecf4;
  border-bottom:1px solid var(--ink-line);
}
.brand{ display:flex; align-items:center; gap:9px; flex:0 0 auto; }
.brand-name{ font-family:'Suez One',serif; font-size:16px; color:#fff; letter-spacing:.01em; }

/* Signature: SIM-chip glyph (gold contact pad) */
.sim-chip{
  width:26px; height:20px; flex:none; position:relative;
  background:var(--chip-gold);
  border-radius:5px 5px 5px 9px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25), 0 1px 2px rgba(0,0,0,.4);
}
.sim-chip::before{
  content:""; position:absolute; inset:4px 5px;
  border:1px solid rgba(80,55,10,.55); border-radius:3px;
  background:
    linear-gradient(rgba(80,55,10,.55), rgba(80,55,10,.55)) 50% 0/1px 100% no-repeat,
    linear-gradient(rgba(80,55,10,.55), rgba(80,55,10,.55)) 0 50%/100% 1px no-repeat;
}
.sim-chip.small{ width:20px; height:15px; border-radius:4px 4px 4px 7px; }
.sim-chip.small::before{ inset:3px 4px; }

/* Topbar: search */
.tb-search{ flex:0 0 240px; }
.tb-search .search-wrap{ position:relative; }
.tb-search input{
  width:100%; box-sizing:border-box;
  background:var(--ink-2); color:#e8ecf4;
  border:1px solid var(--ink-line); border-radius:9px;
  padding:7px 30px 7px 10px; font-size:12.5px; font-family:inherit;
}
.tb-search input::placeholder{ color:#8a93a6; }
.tb-search input:focus{ outline:none; border-color:var(--primary); }
.tb-search .search-icon{
  position:absolute; inset-inline-start:auto; inset-inline-end:9px; top:50%;
  transform:translateY(-50%); width:14px; height:14px; color:#8a93a6; pointer-events:none;
}
.tb-search .suggestions{ top:calc(100% + 6px); }

/* Topbar: selected chips strip (scrolls horizontally, never wraps the bar) */
.tb-chips{
  flex:1 1 auto; min-width:0;
  display:flex; align-items:center; gap:8px;
}
.tb-chips .chips{
  margin:0; flex:1 1 auto; min-width:0;
  display:flex; flex-wrap:nowrap; gap:6px;
  overflow-x:auto; overflow-y:hidden; padding:2px 0;
  scrollbar-width:thin;
}
.tb-chips .chips::-webkit-scrollbar{ height:5px; }
.tb-chips .chips::-webkit-scrollbar-thumb{ background:var(--ink-line); border-radius:99px; }
.tb-chips .chip{ flex:0 0 auto; }

/* Topbar: options cluster */
.tb-options{ flex:0 0 auto; display:flex; align-items:center; gap:8px; }
.tb-options .opt-switch{ color:#c6cdda; border-color:var(--ink-line); background:var(--ink-2); }
.tb-options .opt-qty{ color:#c6cdda; border-color:var(--ink-line); background:var(--ink-2); }
.tb-options .opt-qty input{ background:var(--ink); color:#e8ecf4; border-color:var(--ink-line); }
.tb-options .opt-btn{
  background:var(--ink-2); color:#c6cdda; border:1px solid var(--ink-line);
}
.tb-options .opt-btn.is-on{ color:#fff; border-color:var(--primary); }
.json-btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 11px; border-radius:9px; cursor:pointer;
  background:var(--ink-2); color:#e8ecf4; border:1px solid var(--ink-line);
  font-family:'Assistant'; font-weight:700; font-size:12px; transition:all .15s;
}
.json-btn:hover{ border-color:var(--chip-gold); background:#232a38; }

/* Status line under topbar — collapses when empty */
.topbar-status{ margin:0; padding:0 14px; font-size:11.5px; }
.topbar-status:empty{ display:none; }
.topbar-status:not(:empty){ padding-top:6px; }

/* Content */
.content{
  flex:1 1 auto; min-height:0;
  overflow-y:auto; overflow-x:hidden;
  padding:12px 14px 70px;
}
.content::-webkit-scrollbar{ width:9px; }
.content::-webkit-scrollbar-thumb{
  background:var(--line-strong); border-radius:999px; border:2px solid transparent; background-clip:padding-box;
}

/* ===== Cart: floating chip badge + drawer ===== */
.cart-fab{
  position:fixed; bottom:18px; inset-inline-start:18px; z-index:800;
  display:flex; align-items:center; gap:8px;
  padding:10px 14px; border-radius:999px; cursor:pointer;
  background:var(--ink); color:#fff; border:1px solid var(--ink-line);
  font-family:'Assistant'; font-weight:800; font-size:14px;
  box-shadow:0 6px 20px rgba(16,19,25,.35);
  transition:transform .15s, box-shadow .15s;
}
.cart-fab:hover{ transform:translateY(-2px); box-shadow:0 10px 26px rgba(16,19,25,.42); }
.cart-fab-count{
  min-width:20px; height:20px; padding:0 6px; border-radius:999px;
  display:grid; place-items:center; font-size:12px;
  background:var(--ink-2); color:#8a93a6;
}
.cart-fab.has-items .cart-fab-count{ background:var(--accent); color:#fff; }
/* v6.28: the cart is a centered POPUP (was a right-edge slide-in drawer).
   The aside itself is the dimmed backdrop — clicking it closes the modal. */
.cart-drawer{
  position:fixed; inset:0; z-index:790; display:none;
  align-items:center; justify-content:center;
  background:rgba(16,19,25,.55);
}
.cart-drawer.open{ display:flex; }
.cart-drawer-card{
  width:600px; max-width:94vw; max-height:88vh;
  background:#fff; border-radius:14px;
  box-shadow:0 24px 60px rgba(16,19,25,.35);
  display:flex; flex-direction:column; overflow:hidden;
}
.cart-drawer-head{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:12px 14px; background:var(--ink); color:#fff;
  font-family:'Suez One',serif; font-size:15px;
}
.cart-drawer-close{
  background:transparent; border:0; color:#c6cdda; font-size:15px; cursor:pointer;
  padding:4px 8px; border-radius:7px;
}
.cart-drawer-close:hover{ background:var(--ink-2); color:#fff; }
.cart-drawer-card > #cart{ flex:1 1 auto; overflow-y:auto; padding:12px 14px; }

/* Empty states */
.cart-empty{
  text-align:center; color:var(--muted); font-size:12.5px; line-height:1.7;
  padding:34px 16px; border:1.5px dashed var(--line-strong); border-radius:var(--radius);
  background:rgba(245,246,250,.6);
}
.cart-empty .ce-emoji{ font-size:26px; display:block; margin-bottom:7px; opacity:.7; }
.center-empty{
  height:100%; min-height:60vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; color:var(--muted); gap:10px;
}
.center-empty .ce-emoji{ font-size:46px; opacity:.6; }
.center-empty h2{ font-family:'Suez One',serif; font-size:22px; color:var(--text); margin:0; }
.center-empty p{ margin:0; font-size:13px; max-width:340px; }

/* ---------- Loading overlay ---------- */
#loading{
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background:rgba(233,236,242,.82);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  font-size:16px;
}
.loading-inner{
  display:flex; align-items:center; gap:12px;
  background:#fff; border:1px solid var(--line);
  box-shadow:var(--shadow); padding:16px 22px; border-radius:14px;
  font-weight:600; color:var(--text);
}
.spinner{
  width:22px; height:22px; border-radius:50%;
  border:3px solid var(--primary-100); border-top-color:var(--primary);
  animation:spin .8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------- Header ---------- */
.brand{ display:flex; align-items:center; gap:14px; }
/* ---------- Buttons ---------- */
button{
  font-family:inherit; font-weight:600;
  color:var(--text);
  background:#fff;
  border:1px solid var(--line-strong);
  border-radius:9px;
  padding:6px 11px;
  font-size:12.5px; line-height:1.2;
  cursor:pointer;
  transition:background .15s, color .15s, border-color .15s, box-shadow .15s, transform .12s;
}
button:hover{
  background:var(--surface-2);
  border-color:var(--primary);
  color:var(--primary);
  transform:translateY(-1px);
  box-shadow:var(--shadow-sm);
}
button:active{ transform:translateY(0); }
button:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }

/* ---------- Fields & inputs ---------- */
input{
  width:100%;
  background:var(--surface); color:var(--text);
  border:1px solid var(--line-strong);
  border-radius:11px;
  padding:11px 13px;
  font-size:14px; font-family:inherit;
  margin:0;
  transition:border-color .15s, box-shadow .15s, background .15s;
}
input::placeholder{ color:#9aa1ad; }
input:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 4px var(--primary-50);
  background:#fff;
}

.search-wrap{ position:relative; }
.search-icon{
  position:absolute; inset-inline-start:13px; top:50%;
  transform:translateY(-50%);
  width:18px; height:18px; color:#9aa1ad; pointer-events:none;
}
#search{ padding-inline-start:40px; }

#selected:not(:empty) + .hint{ display:none; }

/* ---------- Suggestions dropdown ---------- */
.suggestions{
  position:absolute; inset-inline:0; top:calc(100% + 6px); z-index:60;
  background:#fff;
  color:var(--text); /* explicit: inside the dark topbar it would inherit near-white */
  border:1px solid var(--line-strong);
  border-radius:12px;
  box-shadow:var(--shadow-lg);
  max-height:280px; overflow:auto;
  display:none; padding:5px;
}
.suggestions div{
  padding:9px 11px; border-radius:8px; cursor:pointer;
  font-size:13.5px; transition:background .12s, color .12s;
}
.suggestions div:hover{ background:var(--primary-50); color:var(--primary-700); }
.suggestions::-webkit-scrollbar{ width:10px; }
.suggestions::-webkit-scrollbar-thumb{
  background:#c7cdd9; border-radius:999px; border:2px solid #fff;
}

/* ---------- Selected chips ---------- */
.chips{ display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
.clear-countries-btn{
  display:none; align-items:center; gap:4px;
  font-family:'Assistant'; font-size:10.5px; font-weight:700;
  padding:3px 9px; border-radius:999px; cursor:pointer;
  background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad-bd);
  text-transform:none; letter-spacing:0; line-height:1.4;
}
.clear-countries-btn:hover{ background:#fbd9e1; }
.chip{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--primary-50); color:var(--primary-700);
  border:1px solid var(--primary-100);
  padding-block:6px; padding-inline-start:12px; padding-inline-end:6px;
  border-radius:999px;
  font-size:13px; font-weight:600;
}
.chip span{
  margin:0; cursor:pointer;
  width:18px; height:18px; flex:none;
  display:grid; place-items:center;
  border-radius:50%;
  background:rgba(59,63,216,.12); color:var(--primary-700);
  font-size:11px; line-height:1;
  transition:background .15s, color .15s, transform .2s;
}
.chip span:hover{ background:var(--bad); color:#fff; transform:rotate(90deg); }

/* ---------- Status banner ---------- */
.status{
  display:none; margin-top:12px;
  background:var(--primary-50);
  border:1px solid var(--primary-100);
  color:#33406b;
  border-radius:10px;
  padding:10px 12px;
  font-size:12.5px; line-height:1.45;
  white-space:pre-wrap;
  direction:ltr; text-align:left;
  font-variant-numeric:tabular-nums;
}

/* ---------- Results ---------- */
.results-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
  gap:10px;
  /* v7.13: the SAME centered 944px column the gigaboost tab uses — on wide
     monitors the basic/topup content no longer dwarfs the gigaboost cards;
     each of the two sim columns lands at one gigaboost-card width. */
  max-width:944px;
  margin-inline:auto;
  margin-top:0;
  align-content:start;
  align-items:start;
}
/* v6.17: the גיגהבוסט tab is a CENTERED fixed-width column — the mixed-zone
   note and the two cards share the exact same width and centre, so the note
   appearing never shifts the cards off-centre (the v6.16 bug: a note spanning
   the card grid stopped auto-fit from collapsing the empty tracks). The two
   cards are an even 2-up grid; they stack on narrow screens. */
.giga-tab{
  display:flex;
  flex-direction:column;
  gap:10px;
  max-width:944px;            /* 2×462 + 10px gap + a hair */
  margin-inline:auto;         /* perfectly centred regardless of the note */
}
.giga-cards{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:10px;
  align-items:start;
}
@media (max-width:720px){
  .giga-cards{ grid-template-columns:minmax(0,1fr); }
}

/* ── מבצעים (special deals) tab, v6.21 ─────────────────────────────────────
   A centered column holding an intro block above an auto-fit grid of
   per-country deal cards. Each card lists qualifying sizes: size+days on one
   side, the discounted price with a strikethrough standard, a saving badge,
   and open/copy buttons — a compact ledger mirroring the gigaboost rows. */
.deals-tab{
  display:flex;
  flex-direction:column;
  gap:12px;
  /* v7.13: the same 944px centered column as .giga-tab/.results-grid —
     two 430px-min tracks land at exactly the gigaboost card width.
     (v7.12 briefly uncapped this; on wide monitors the cards ballooned.) */
  max-width:944px;
  margin-inline:auto;
  width:100%;
}
.deals-intro{ text-align:center; }
.deals-intro h2{ margin:0 0 4px; font-size:20px; }
.deals-intro p{ margin:0; color:var(--muted); font-size:12.5px; line-height:1.55; }
.deals-note{ font-size:11.5px; opacity:.85; }
.deals-cards{
  display:grid;
  /* v7.27: fixed 2-up like .giga-cards — auto-fill let a SINGLE card
     balloon to the full 944px column (F5). */
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:10px;
  align-items:start;
}
.deal-card{ padding:11px 12px; }
.deal-head{
  /* v6.22: NEVER wrap. A long name (בוסניה והרצגובינה, דובאי (איחוד…)) used to
     push the actions onto a second line, making that card's rows start lower
     than its neighbours'. Fixed height + ellipsis keeps every head identical. */
  display:flex; align-items:center; justify-content:space-between;
  gap:8px; flex-wrap:nowrap; margin-bottom:6px; height:28px;
}
.deal-head h3{
  margin:0; font-size:14px; line-height:1.2;  /* v7.27: one card-h3 size (F7) */
  flex:1 1 auto; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.deal-head .block-actions{ flex:0 0 auto; flex-wrap:nowrap; }
/* pill family — one base, color/placement per class */
.deal-count, .deal-save, .deal-over, .deal-odd, .deal-topup, .deal-new, .deal-same{
  font-size:11px; font-weight:800; border-radius:999px;
  padding:2px 7px; white-space:nowrap; justify-self:end;
}
/* v7.27: the header count pill is NEUTRAL (--same) — it used to wear the
   red "over" palette (.deal-best), making "N חבילות" look like a warning. */
.deal-count{ display:inline-block; padding:2px 9px; justify-self:auto;
  color:var(--same); background:var(--same-bg); border:1px solid var(--same-bd); }
.deal-over{ color:var(--bad); background:var(--bad-bg); border:1px solid var(--bad-bd); }
.deal-save{ color:var(--good); background:var(--good-bg); border:1px solid var(--good-bd); }
.deal-odd{ color:#4a1fb8; background:#ece7fd; border:1px solid #c7b6f7; }
.deal-topup{ color:#8a5a00; background:#fef3d0; border:1px solid #f5d78e; }
.deal-new{ color:var(--primary-700); background:var(--primary-50); border:1px solid var(--primary-100); }
.deal-same{ color:var(--muted); background:transparent; border:1px solid var(--line); }
/* v6.22: one FIXED track per row (same trick as .global-lines in v6.20 — a
   min-height on the grid ITEM does not hold, sizing the row TRACK does), so
   row N of every card sits at exactly the same height as row N of the others. */
.deal-rows{ display:grid; grid-auto-rows:30px; gap:2px; } /* v7.12: gigaboost height */
/* v6.24: FOUR children — size | price | badge | actions. The buttons are one
   flex span (.deal-actions), so adding/removing a button can never again push
   a child into an implicit grid row. */
.deal-row{
  display:grid;
  grid-template-columns:1fr auto auto auto;
  align-items:center; gap:8px;
  padding:3px 8px; border-radius:7px; /* v7.27: reference row geometry */
}
.deal-actions{ display:flex; align-items:center; gap:3px; justify-self:end; }
/* the qty field costs row width — compact the row-level action buttons so the
   size cell never clips at the 3-across card width */
.deal-row:nth-child(even){ background:var(--row-zebra); }
.deal-row:hover{ background:var(--row-hover); }
/* v7.19: one ink scheme for every ledger — the gigaboost card's (operator:
   "same color scheme as gigaboost, as it looks nicer"): bold dark size,
   muted days, ACCENT-green price. The basic/topup ledgers already used it
   (gl-/tl- cells copied .order-price in v7.8); this brings the deal-card
   family (catalog / T-Mobile / Mobyx / נצח / shop cards) in line. */
.deal-size{
  font-weight:800; font-size:12px; color:var(--text); /* v7.21: gigaboost size */
  display:flex; align-items:baseline; gap:6px;
  white-space:nowrap; overflow:hidden;
}
.deal-size small{ font-weight:500; font-size:11px; color:var(--muted); white-space:nowrap; }
.deal-price{
  font-weight:800; font-size:12.5px; color:var(--accent-700); /* v7.21: gigaboost size */
  display:flex; align-items:baseline; gap:6px; justify-self:end;
  white-space:nowrap;
}
.deal-price del{ font-weight:500; font-size:11px; color:var(--muted); }
.deal-row .oa-copy{
  padding:3px 9px; font-size:11.5px; height:24px; line-height:1;
  flex:none; justify-self:end;
}

/* v6.22: section chips, filter toolbar, and the extra row states
   (pricier-than-standard, odd size, topup vs new product). */
.deals-chips{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
.deals-chip{
  display:inline-flex; align-items:center; gap:6px;
  font:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
  padding:5px 12px; border-radius:999px;
  background:var(--surface); color:var(--muted);
  border:1px solid var(--line); transition:background .15s, color .15s, border-color .15s;
}
.deals-chip span{ font-size:11px; font-weight:800; opacity:.75; }
.deals-chip:hover{ border-color:var(--primary); color:var(--primary-700); }
.deals-chip.is-active{ background:var(--primary); color:#fff; border-color:transparent; }
.deals-chip.is-active span{ opacity:.9; }
.deals-toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; }
.deals-search{
  font:inherit; font-size:12.5px; padding:6px 12px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface); color:inherit;
  min-width:220px; flex:0 1 300px;
}
.deals-search:focus{ outline:none; border-color:var(--primary); }
.deals-only{ display:flex; gap:4px; flex-wrap:wrap; }
.deals-onlybtn{
  font:inherit; font-size:11.5px; font-weight:700; cursor:pointer;
  padding:4px 10px; border-radius:999px; background:transparent;
  color:var(--muted); border:1px solid var(--line);
}
.deals-onlybtn:hover{ border-color:var(--primary); color:var(--primary-700); }
.deals-onlybtn.is-active{ background:var(--primary-50); color:var(--primary-700); border-color:var(--primary); }
.deals-count{ text-align:center; font-size:11.5px; font-weight:700; color:var(--muted); }
/* v6.24: paged sections — "show more" footer */
.deals-more{ display:flex; justify-content:center; padding:4px 0 2px; }
.deals-morebtn{
  font:inherit; font-size:12px; font-weight:700; cursor:pointer;
  padding:6px 18px; border-radius:999px;
  background:var(--surface); color:var(--primary-700);
  border:1px solid var(--primary-100);
}
.deals-morebtn:hover{ background:var(--primary-50); border-color:var(--primary); }
.deals-none{ text-align:center; font-size:12.5px; color:var(--muted); padding:18px 0; }
/* (v7.25: the v7.1 recents chip bar was removed — operator request.) */
.iccid-luhn{ font-size:11px; font-weight:800; white-space:nowrap; align-self:center; }
.iccid-luhn.is-ok{ color:var(--good); }
.iccid-luhn.is-bad{
  color:var(--bad); background:var(--bad-bg); border:1px solid var(--bad-bd);
  border-radius:999px; padding:2px 8px;
}
.basic-shop-cards{
  grid-column:1 / -1;
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr)); /* v7.27: fixed 2-up (F5) */
  gap:10px;
  align-items:start;
}
/* v7.11: a shop card that doesn't beat בסיסי/גיגהבוסט renders collapsed —
   a slim single-line card (title + note + הצג) that stays out of the way. */
.basic-shop-card.is-collapsed{ padding:7px 11px; opacity:.72; }
.basic-shop-card.is-collapsed:hover{ opacity:1; }
.basic-shop-card.is-collapsed .deal-head{ margin:0; padding:0; border:0; }
.shop-closed-note{ font-size:11px; font-weight:600; color:var(--muted); white-space:nowrap; }
.cmp-type{
  font-size:10.5px; font-weight:800; color:var(--primary-700);
  background:var(--primary-50); border:1px solid var(--primary-100);
  border-radius:999px; padding:1px 7px; vertical-align:middle;
}
.ob-start{ background:#4a1fb8; }
/* v7.14: the 🕶️ true-incognito setup line in the cart footer */
.ob-incognito{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  margin-top:6px; padding-top:6px; border-top:1px dashed var(--line);
}
.ob-incog-toggle{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11.5px; font-weight:700; color:var(--muted); cursor:pointer;
  white-space:nowrap;
}
.ob-incog-dl{ white-space:nowrap; }
.ob-incog-btns{ display:inline-flex; gap:6px; }
.ob-incog-toggle input{ accent-color:#4a1fb8; }
.ob-incog-dl{ font-size:11px; padding:3px 9px; }
.settings-backup-card{ grid-column:1 / -1; margin-top:10px; } /* v7.27: was landing in a ~308px side track */
.settings-backup-note{ margin:4px 0 0; font-size:12px; color:var(--muted); line-height:1.55; }

/* v6.23 COMPARE mode — normal site vs gigaboost vs shop, per size.
   Five fixed tracks so every row (and the header) lines up exactly. */
.cmp-cards{ display:flex; flex-direction:column; gap:10px; }
.cmp-card{ padding:11px 12px; }
.cmp-head, .cmp-row{
  display:grid;
  grid-template-columns:minmax(96px,1.1fr) repeat(3, minmax(92px,1fr)) minmax(96px,auto);
  align-items:center; gap:8px;
  padding:0 8px;
}
.cmp-head{
  height:26px; font-size:11px; font-weight:800; color:var(--muted);
  border-bottom:1px solid var(--line); margin-bottom:3px;
}
.cmp-head .cmp-cell{ justify-self:center; }
.cmp-rows{ display:grid; grid-auto-rows:30px; gap:2px; } /* v7.27: reference 30px rows */
.cmp-row:nth-child(even){ background:var(--row-zebra); border-radius:8px; }
.cmp-row:hover{ background:var(--row-hover); }
.cmp-size{ font-weight:800; font-size:12px; color:var(--text); display:flex; align-items:baseline; gap:6px; white-space:nowrap; }
.cmp-size small{ font-weight:500; font-size:10.5px; color:var(--muted); }
.cmp-cell{
  justify-self:center; white-space:nowrap;
  font-weight:800; font-size:12.5px; color:var(--accent-700); /* v7.27: price-ink schema */
  display:flex; align-items:baseline; gap:5px;
  padding:2px 8px; border-radius:999px; border:1px solid transparent;
}
.cmp-cell small{ font-weight:600; font-size:10px; color:var(--muted); }
.cmp-cell.is-none{ color:var(--muted); font-weight:500; }
/* the cheapest of the three — what to offer the client */
.cmp-cell.is-best{
  color:var(--good); background:var(--good-bg); border-color:var(--good-bd); font-weight:800;
}
.cmp-cell.is-best small{ color:var(--good); }
.cmp-actions{ display:flex; align-items:center; gap:4px; justify-self:end; }
.cmp-note{ font-size:11px; font-weight:600; color:var(--muted); }
@media (max-width:720px){
  .cmp-head, .cmp-row{ grid-template-columns:minmax(70px,1fr) repeat(3, minmax(58px,1fr)) auto; gap:4px; }
  .cmp-cell{ padding:2px 4px; font-size:11.5px; }
}

/* v6.27: the T-Mobile mirrored pair — two cards, SAME slot list, so they are
   always identical in size & shape; a missing slot is a red "לא קיים" row. */
.tm-pair{
  display:grid;
  /* v7.27: fixed 2-up like .giga-cards (F5); stacking is back in the
     720px media query below. */
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:10px;
  align-items:start;
}
.deal-row.is-missing{ grid-template-columns:1fr; }
.deal-missing{ color:var(--bad); font-weight:800; font-size:12px; }
/* v6.27: 🧺 add-to-basket (joins the same order as basic-tab packages) */
.oa-basket{
  display:inline-flex; align-items:center; justify-content:center;
  /* v7.27: font:inherit FIRST — it used to sit last and silently reset
     the font-size declared in this very block (per-row overrides were
     masking that; they're gone now). */
  font:inherit;
  padding:2px 8px; font-size:11.5px; height:24px; line-height:1;
  border-radius:7px; cursor:pointer; flex:none; justify-self:end;
  background:#b45309; color:#fff; border:1px solid transparent;
}
.oa-basket:hover{ filter:brightness(.92); }
.oa-basket b{
  margin-inline-start:4px; min-width:15px; height:15px; padding:0 3px;
  display:inline-grid; place-items:center; border-radius:999px;
  background:#fff; color:#b45309; font-size:10px; line-height:1;
}
.no-giga-card{ text-align:center; padding:26px 16px; }
.no-giga-card p{ color:var(--muted); font-size:12.5px; margin:6px 0 0; }

/* wide (flat-list) rows: a long product name instead of a GB/price ledger.
   Ellipsis rather than wrap, so these rows keep one uniform track too. */
.deal-card--wide{ grid-column:1 / -1; }
.deal-row--wide{ grid-template-columns:1fr auto auto; }  /* name | price | actions */
.deal-name{
  font-size:12px; font-weight:800; line-height:1.4;  /* v7.27: size-cell ink schema */
  min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

@media (max-width:720px){
  .deals-cards{ grid-template-columns:minmax(0,1fr); }
  .tm-pair{ grid-template-columns:minmax(0,1fr); }
  .deals-search{ flex:1 1 100%; }
}

.block{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:11px 12px;
  transition:box-shadow .2s, transform .2s, border-color .2s;
}
.block:hover{ box-shadow:var(--shadow-lg); }
.block h3{
  font-family:'Assistant'; font-weight:800;
  font-size:14px; margin:0 0 6px;
}
.block > button{ margin-bottom:8px; }
.block > button + button{ margin-inline-start:6px; }

pre{
  font-family:'Assistant', system-ui, sans-serif;
  margin:6px 0 0;
  padding:8px 10px;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:9px;
  font-size:12px; line-height:1.5;
  color:#2a2f3a;
  white-space:pre-wrap;
  font-variant-numeric:tabular-nums;
}

/* ---------- Global (new API) cards ---------- */
/* v6.19: the בסיסי card spans the FULL results grid again. v6.18 capped it at
   1280px + centred, but the two dense purchase columns then wrapped ("squish");
   full width gives every row room for one line. (The "לא קיים" rows stay.) */
/* v7.22: the basic tab is TWO INDIVIDUAL CARDS in the gigaboost 2-up grid
   (.giga-cards.basic-cards below), each a plain .block like the two
   הזמנה מהירה cards — the old one-big-card + inner-column chrome is gone.
   A slim strip above them holds the shared bits (title, selection,
   zone-codes copy, refresh). */
.basic-strip{
  grid-column:1 / -1;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  flex-wrap:wrap; padding:2px 2px 0;
}
.basic-strip-title{ display:flex; align-items:baseline; gap:10px; min-width:0; }
.basic-strip-title h3{ margin:0; font-size:15px; }
.global-clean-subtitle{
  color:var(--muted); font-size:12px;
  max-width:62ch; line-height:1.45;
}
.giga-cards.basic-cards{ grid-column:1 / -1; }
/* v7.23: both basic cards keep an IDENTICAL two-line header (title line,
   then toolbar line — the gigaboost card structure) at EVERY width. With
   a one-line flex header, the longer סים פיזי title wrapped at ~1200px
   while the eSIM one did not, and the row mirror skewed. */
.basic-cards .block-tools{
  flex-direction:column; align-items:flex-start; gap:6px;
}
.basic-cards .block-tools .block-actions{ flex-wrap:wrap; }
.global-sim-column{ min-width:0; }

/* v6.20: EVERY plan row is exactly one fixed track (grid-auto-rows), so a
   "לא קיים" row is the same height as a real plan row. Both columns share the
   same slot list (one row per slot), so row N lines up across the two columns. */
.global-lines{ display:grid; gap:0; grid-auto-rows:30px; } /* v7.12: gigaboost height */
/* v7.8: the basic rows are a gigaboost-style ledger — FIXED tracks so the
   size / days / price / ±% columns line up across rows (per-row grids only
   align when track widths are fixed; the flexible kbd cell absorbs the
   slack). v7.9: days in their own column.
   Tracks: size | days | price | ±% | kbd-hint (filler) | actions. */
.global-line{
  display:grid; grid-template-columns:42px 46px 48px 52px minmax(0,1fr) auto;
  align-items:center; gap:6px;
  padding:8px 6px; margin-inline:-6px;
  border-bottom:1px solid var(--line);
  border-radius:8px;
  font-size:13px; line-height:1.3;
  transition:background .12s;
}
.global-line:last-child{ border-bottom:0; }
.global-line-text{ min-width:0; overflow-wrap:normal; word-break:keep-all; font-weight:500; display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
.gl-size{
  font-weight:800; font-size:12px; color:var(--text); /* v7.21: gigaboost size */
  font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden;
}
.gl-days{
  font-weight:500; font-size:11px; color:var(--muted);
  white-space:nowrap; overflow:hidden;
}
.gl-price{
  direction:ltr; font-weight:800; font-size:12.5px;
  color:var(--accent-700); white-space:nowrap; text-align:end;
}
.gl-mark{ display:flex; justify-content:center; overflow:hidden; }
/* the ±% pill must FIT its fixed 58px track — compact padding beats clipping */
.gl-mark .deal-save, .gl-mark .deal-over, .gl-mark .deal-same{
  font-size:10.5px; padding:2px 5px; justify-self:auto;
}
.gl-kbd{ display:flex; justify-content:flex-start; min-width:0; overflow:hidden;
  container-type:inline-size; }
/* v7.13: in the 944px column the hint pill must fit a ~80px cell — slim
   pill; if a future row squeezes the cell below usefulness, hide the pill
   cleanly instead of clipping it mid-glyph (the card's top bar still
   teaches the combo). */
.gl-kbd .plan-kbd{ font-size:10.5px; padding:1px 6px; } /* v7.21: gigaboost pill (capsule removal freed the space) */
@container (max-width:64px){ .gl-kbd .plan-kbd{ display:none; } }
/* v6.18/v7.22: a missing plan size — red bold TEXT on the NORMAL zebra
   (the gigaboost/T-Mobile treatment; the pink row background broke the
   one-color-schema rule). 2 children span via their own template. */
.global-line.is-missing{
  grid-template-columns:minmax(0,1fr) auto;
}
.global-line.is-missing .global-line-text{ color:var(--bad); font-weight:800; }
.global-missing-pad{ justify-self:end; }

.global-links{ display:flex; gap:6px; white-space:nowrap; }
.global-links a{
  display:inline-flex; align-items:center;
  border:1px solid var(--line-strong); background:#fff; color:var(--text);
  text-decoration:none; border-radius:999px;
  padding:4px 11px; font-size:12px; font-weight:600;
  transition:background .15s, color .15s, border-color .15s, box-shadow .15s, transform .12s;
}
.global-links a:hover{
  background:var(--primary); color:#fff; border-color:var(--primary);
  transform:translateY(-1px); box-shadow:var(--shadow-sm);
}

.global-empty,
.global-error-text{ color:var(--muted); font-size:12.5px; padding:6px 0; }
.global-error-text{ color:var(--bad); }

.global-loading-card{ grid-column:1 / -1; }
.global-loading-card h3{ margin:0 0 6px; } /* v7.27: weight 400 — Suez One like every card h3 */
.global-loading-card p{ color:var(--muted); margin:0 0 8px; }

/* ---------- Quick-order rows (eSIM / physical) ---------- */
.order-row{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  margin-bottom:7px;
}
.order-gb{
  min-width:40px; font-weight:800; font-size:12px;  /* v7.27: merged the dead-overridden base */
  color:var(--text); font-variant-numeric:tabular-nums;
}
.oa-copy, .lk-copy{
  font-size:12px; padding:5px 10px; border-radius:8px; line-height:1.2;
}
.oa-copy{ background:#fff; color:var(--primary-700); border-color:var(--primary-100); }
.oa-copy:hover{ background:var(--primary-50); color:var(--primary-700); border-color:var(--primary); }

/* ---------- Global checkout link groups ---------- */
.link-group{
  display:inline-flex; align-items:center; gap:4px;
  background:#fff; border:1px solid var(--line-strong);
  border-radius:999px; padding:2px 4px 2px 8px;
}
.link-group + .link-group{ margin-inline-start:6px; }
/* v7.9: the row's quantity PILL — clicking opens the qty popup (like the
   Shift+Q GB popup). Shows the quantity the copy link currently carries. */
.lg-qty-btn{
  min-width:24px; height:24px; padding:2px 6px;
  border:1px solid var(--line-strong); border-radius:999px;
  background:var(--surface-2); color:var(--text);
  font-size:11.5px; font-weight:800; line-height:1;
  font-variant-numeric:tabular-nums; cursor:pointer;
}
.lg-qty-btn:hover{ border-color:var(--primary); background:var(--primary-50); color:var(--primary-700); }
.lg-qty-btn b{ font-weight:800; }
.lk-copy{
  padding:3px 8px; border-radius:8px; font-size:12px; /* v7.27: one 📋 silhouette (was a 999px pill) */
}
/* v7.20: same white face as .oa-copy — one 📋 look on every ledger */
.lk-copy{ background:#fff; color:var(--primary-700); border-color:var(--line-strong); }
.lk-copy:hover{ background:var(--primary-50); color:var(--primary-700); border-color:var(--primary); }

/* ---------- Zone filter note ---------- */
.zone-note{
  grid-column:1 / -1;
  display:flex; align-items:flex-start; gap:12px;
  background:linear-gradient(180deg, #fffaf0, #fff6e6);
  border:1px solid #f3dca8;
}
.zone-note-badge{
  flex:none; align-self:center;
  background:#a9610b; color:#fff;
  font-weight:800; font-size:12px;
  padding:5px 11px; border-radius:999px;
  white-space:nowrap;
}
.zone-note-text{ font-size:13px; line-height:1.5; color:#5b4310; }
.zone-note-text b{ font-weight:800; color:#3f2f08; }

/* ---------- Card header (title + actions) ---------- */
.block-tools{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; flex-wrap:wrap; margin-bottom:10px;
}
.block-tools h3{ margin:0; }
.block-actions{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.copy-btn{ font-size:12px; padding:6px 10px; }

/* v7.27 (I12): an ARMED destructive button — first click arms (red),
   a second click within 2.5s executes. */
button.is-armed, button.is-armed:hover{
  background:var(--bad); color:#fff; border-color:transparent;
}

/* v7.27: the copy toast (F14) — geometry identical to the old JS blob;
   bg is the --text ink it always was, shadow from the token scale. */
.copy-toast{
  position:fixed; bottom:22px; left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--text); color:#fff;
  padding:10px 18px; border-radius:999px;
  font-family:'Assistant',sans-serif; font-weight:700; font-size:13px;
  z-index:9999; opacity:0; transition:all .25s ease;
  box-shadow:var(--shadow-lg);
  pointer-events:none;
}
.copy-toast.is-show{ opacity:1; transform:translateX(-50%) translateY(0); }
.zone-pill{
  display:inline-block; margin-inline-start:6px;
  background:var(--primary-50); color:var(--primary-700);
  border:1px solid var(--primary-100);
  border-radius:999px; padding:1px 9px;
  font-size:12px; font-weight:700; vertical-align:middle;
}

/* ---------- Simplify on/off switch ---------- */
.simplify-btn{
  display:inline-flex; align-items:center; gap:8px;
  font-weight:700; font-size:12px; padding:5px 11px;
  border-radius:999px;
}
.simplify-btn .sw{
  width:26px; height:15px; border-radius:999px; flex:none;
  position:relative; background:#c7ccd6; transition:background .18s;
}
.simplify-btn .sw::after{
  content:""; position:absolute; top:2px; inset-inline-end:2px;
  width:11px; height:11px; border-radius:50%;
  background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25);
  transition:inset-inline-end .18s;
}
.simplify-btn.is-on{
  background:var(--good-bg); color:var(--accent-700); border-color:var(--good-bd);
}
.simplify-btn.is-on .sw{ background:var(--accent); }
.simplify-btn.is-on .sw::after{ inset-inline-end:13px; }
.simplify-btn.is-off{ background:#fff; color:var(--muted); border-color:var(--line-strong); }
.simplify-btn.is-on:hover{ background:#daf3e5; color:var(--accent-700); border-color:var(--accent); transform:translateY(-1px); }
.simplify-btn.is-off:hover{ background:var(--surface-2); color:var(--text); border-color:var(--primary); transform:translateY(-1px); }

.opt-btn{ font-size:12.5px; font-weight:700; padding:8px 13px; border-radius:10px; }
.opt-btn.is-on{ background:var(--good-bg); color:var(--accent-700); border-color:var(--good-bd); }
.opt-btn.is-on:hover{ background:#daf3e5; border-color:var(--accent); color:var(--accent-700); transform:translateY(-1px); }
.opt-btn.is-off{ background:var(--surface-2); color:var(--muted); }
.opt-btn.is-off:hover{ background:#fff; border-color:var(--primary); color:var(--text); transform:translateY(-1px); }

/* checkbox-driven switch */
.opt-switch{
  display:inline-flex; align-items:center; gap:8px; cursor:pointer;
  font-size:12.5px; font-weight:600; color:var(--text);
  background:#fff; border:1px solid var(--line-strong);
  border-radius:10px; padding:7px 12px; user-select:none;
}
.opt-switch input{ position:absolute; opacity:0; width:0; height:0; }
.opt-switch .sw{
  width:30px; height:17px; border-radius:999px; flex:none; position:relative;
  background:#c7ccd6; transition:background .18s;
}
.opt-switch .sw::after{
  content:""; position:absolute; top:2px; inset-inline-end:2px;
  width:13px; height:13px; border-radius:50%; background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.25); transition:inset-inline-end .18s;
}
.opt-switch input:checked + .sw{ background:var(--primary); }
.opt-switch input:checked + .sw::after{ inset-inline-end:15px; }
.opt-switch input:focus-visible + .sw{ outline:2px solid var(--primary); outline-offset:2px; }

.opt-qty{
  display:inline-flex; align-items:center; gap:8px;
  font-size:12.5px; font-weight:600; color:var(--text);
  background:#fff; border:1px solid var(--line-strong);
  border-radius:10px; padding:5px 12px;
}
.opt-qty input{
  width:64px; padding:5px 8px; border-radius:8px;
  border:1px solid var(--line-strong); font-size:13px;
  font-variant-numeric:tabular-nums; text-align:center;
}



/* ---------- Manual website savings emphasis ---------- */
/* v7.22: .is-cheaper rows are NEUTRAL — the green ‎-N% badge already
   carries the signal (operator: one gigaboost color schema everywhere). */
.purchase-actions{
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
}
/* ---------- Generated order builder ---------- */
.order-builder-card{
  grid-column:auto;
  border-color:#c9cef8;
  box-shadow:none;
  padding:0;
  background:transparent;
  border:0;
}
.order-builder-card:hover{ box-shadow:none; }
.order-builder-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--line);
  padding-bottom:12px;
  margin-bottom:12px;
}
.order-builder-head h3{ margin:0; font-size:16px; font-weight:800; }
.order-builder-lines{ display:grid; gap:8px; }
.order-builder-line{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto auto;
  gap:8px;
  align-items:center;
  padding:9px 10px;
  border:1px solid var(--line);
  background:var(--surface-2);
  border-radius:11px;
}
.order-builder-label{ font-weight:700; font-size:13px; min-width:0; overflow-wrap:anywhere; }
.order-builder-main{ min-width:0; }
/* full ICCID under a topup line — LTR monospace, one click selects it all */
.order-builder-iccid{
  font-family:ui-monospace, "Courier New", monospace; font-size:11px;
  color:var(--muted); direction:ltr; text-align:left;
  user-select:all; overflow-wrap:anywhere; margin-top:2px;
}
.order-builder-qty{ display:flex; align-items:center; gap:4px; }
.ob-qty-btn{
  width:22px; height:22px; display:grid; place-items:center;
  border-radius:7px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--text);
  font-size:13px; font-weight:800; line-height:1; cursor:pointer; padding:0;
}
.ob-qty-btn:hover{ border-color:var(--primary); color:var(--primary-700); background:var(--primary-50); }
.ob-qty-n{ min-width:18px; text-align:center; font-weight:800; font-size:12.5px; }
.order-builder-price{ direction:ltr; font-weight:800; font-size:13px; color:var(--accent-700); white-space:nowrap; }
.order-builder-remove{ padding:4px 9px; border-radius:999px; color:var(--bad); }
.order-builder-footer{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:10px;
  margin-top:14px;
  padding-top:14px;
  border-top:1px dashed var(--line-strong);
}
.order-builder-total{ font-weight:800; color:var(--text); font-size:15px; text-align:center; }
.order-builder-actions{ display:flex; flex-direction:column; gap:8px; }
.order-builder-actions button{ width:100%; justify-content:center; }
.order-builder-actions .run-order{ background:var(--accent); color:#fff; border-color:transparent; font-size:14px; padding:12px; }
.order-builder-actions .run-order:hover{ background:var(--accent-700); color:#fff; border-color:transparent; }

/* ---------- Integrated order runner ---------- */
.order-overlay{
  position:fixed;
  inset:0;
  z-index:10000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(10,15,26,.68);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
}
.order-overlay.is-open{ display:flex; }
.order-runner-card{
  width:min(440px, 100%);
  direction:ltr;
  text-align:center;
  background:#111827;
  color:#e8f0f8;
  border:1px solid rgba(26,157,224,.18);
  border-radius:20px;
  padding:32px 30px;
  box-shadow:0 24px 70px -32px rgba(0,0,0,.75);
  position:relative;
  overflow:hidden;
}
.order-runner-card::before{
  content:""; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, #1a9de0, transparent);
}
.order-runner-logo{ font-size:24px; font-weight:800; color:#fff; letter-spacing:-.3px; }
.order-runner-logo span{ color:#1a9de0; }
.order-runner-sub{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#7a95b0; margin:2px 0 26px; }
.order-runner-icon{
  width:62px; height:62px; margin:0 auto 16px;
  display:grid; place-items:center;
  border-radius:50%;
  background:rgba(26,157,224,.10);
  border:1px solid rgba(26,157,224,.30);
  font-size:27px;
}
.order-runner-title{ font-size:21px; font-weight:800; color:#fff; margin-bottom:6px; }
.order-runner-status{ color:#7a95b0; font-size:13px; line-height:1.5; min-height:38px; }
.order-runner-items{
  margin:20px 0 0;
  text-align:left;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;
  padding:12px;
  max-height:180px;
  overflow:auto;
}
.order-runner-item{
  display:flex; gap:9px; align-items:center;
  padding:5px 0;
  color:#e8f0f8;
  font-size:12.5px;
}
.order-runner-item + .order-runner-item{ border-top:1px solid rgba(255,255,255,.055); }
.order-runner-dot{ width:6px; height:6px; border-radius:50%; background:#1a9de0; flex:none; }
.order-runner-qty{ margin-left:auto; color:#7a95b0; font-size:11px; }
.order-runner-progress{ display:flex; justify-content:center; gap:7px; margin-top:18px; }
.order-runner-progress span{ width:8px; height:8px; border-radius:50%; background:rgba(26,157,224,.22); }
.order-runner-progress span.done{ background:#22d3a0; }
.order-runner-progress span.active{ background:#1a9de0; transform:scale(1.35); }
.order-runner-close{
  position:absolute;
  top:10px;
  right:10px;
  width:30px; height:30px;
  border-radius:50%;
  background:rgba(255,255,255,.06);
  color:#e8f0f8;
  border:1px solid rgba(255,255,255,.08);
}
body.order-mode{
  padding:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0a0f1a;
}
body.order-mode::before{ display:none; }
body.order-mode .app{ display:block; max-width:460px; width:100%; height:auto; padding:20px; }
body.order-mode .cart-fab,
body.order-mode .cart-drawer,
body.order-mode .topbar,
body.order-mode .tabs,
body.order-mode .topbar-status{ display:none; }
.standalone-order-card{ width:100%; }
.standalone-order-card .order-runner-card{ width:100%; }
.standalone-order-card .run-order{ margin-top:20px; width:100%; padding:14px 20px; border-radius:12px; font-weight:800; background:#1a9de0; color:#fff; border:0; }
.standalone-order-card .run-order:hover{ background:#0d7ab8; color:#fff; }



/* ---------- Top-up tab (v7.27: strip + two .giga-cards, like basic) ---- */
.topup-controls{
  grid-column:1 / -1;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
}
.topup-controls .version-select-wrap{ flex:0 0 auto; }
.topup-controls .version-select-wrap select{ width:auto; min-width:118px; padding:9px 12px; }
.topup-iccid-input{
  /* v7.27: width:auto beats the base input{width:100%} — in the wrapping
     controls row a 100%-wide input grabs a whole line for itself. */
  width:auto;
  flex:1 1 220px; min-width:0;
  direction:ltr; text-align:left; font-variant-numeric:tabular-nums;
  background:#fff; border:1px solid var(--line-strong); border-radius:11px;
  padding:9px 12px; font-size:13px; color:var(--text);
}
.topup-scan-btn{
  flex:0 0 auto;
  background:var(--primary);
  color:#fff;
  border-color:transparent;
  padding:9px 14px;
  border-radius:11px;
  font-size:15px;
}
.topup-scan-btn:hover{ background:var(--primary-700); color:#fff; border-color:transparent; }
.topup-status{
  grid-column:1 / -1;
  padding:10px 12px;
  border-radius:11px;
  background:var(--primary-50);
  border:1px solid var(--primary-100);
  color:#33406b;
  font-size:12.5px;
  line-height:1.45;
  margin-bottom:12px;
}
.topup-status.error{
  background:var(--bad-bg);
  border-color:var(--bad-bd);
  color:var(--bad);
}
.topup-status.loading{
  display:flex;
  align-items:center;
  gap:10px;
}
.topup-mini-spinner{
  width:17px;
  height:17px;
  border-radius:50%;
  border:2px solid var(--primary-100);
  border-top-color:var(--primary);
  animation:spin .8s linear infinite;
  flex:none;
}
.topup-meta-label{ font-size:12.5px; font-weight:700; color:var(--muted); }
.topup-meta-label.ok{ color:var(--accent-700); }
.topup-line-text{ min-width:0; overflow-wrap:anywhere; font-weight:500; }


/* ---------- Cellular-networks card (העתקות tab, v7.31) ---------- */
.net-country{ padding:4px 0; border-bottom:1px dashed var(--line); }
.net-country:last-child{ border-bottom:0; }
.net-country-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; }
.net-line{ color:var(--muted); font-size:12px; line-height:1.5; padding-inline-start:6px; }
.net-gen{
  font-size:10.5px; font-weight:800; color:var(--accent-700);
  background:var(--good-bg); border:1px solid var(--good-bd);
  border-radius:999px; padding:0 6px; margin-inline-start:4px;
}

/* ---------- Pickup-points tab (v7.28) ---------- */
/* Hebrew address fields — must undo the reused ICCID input's ltr. */
.pickup-input{ direction:rtl; text-align:right; flex:1 1 150px; }
.pickup-input--house{ flex:0 1 110px; }
/* v7.33: city/street sit inside a positioned wrapper so the gov-registry
   autocomplete dropdown (the shared .suggestions block) anchors to the
   field itself. The wrapper takes over the input's flex sizing; inside
   it the input just fills the wrapper. */
.pickup-ac-wrap{ position:relative; flex:1 1 150px; min-width:0; }
.pickup-ac-wrap .pickup-input{ width:100%; }
/* name | address+hours | distance | phone | actions — 5 tracks, 5 children ALWAYS */
.pickup-row{ grid-template-columns:minmax(0,220px) minmax(0,1fr) auto auto auto; }
.pickup-addr{ min-width:0; color:var(--muted); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pickup-phone{ color:var(--muted); font-size:11.5px; font-variant-numeric:tabular-nums; direction:ltr; }

.topup-select-wrap label{
  display:block;
  font-size:12.5px;
  font-weight:700;
  color:var(--muted);
  margin-bottom:6px;
}
.topup-select-wrap select{
  width:100%;
  background:#fff;
  border:1px solid var(--line-strong);
  border-radius:11px;
  padding:10px 12px;
  font-size:14px;
  font-family:inherit;
  color:var(--text);
}
.topup-cache-stat{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:#fff;
  border:1px solid var(--line-strong);
  color:var(--muted);
  border-radius:999px;
  padding:5px 10px;
  font-size:12px;
  font-weight:700;
}
.topup-cache-stat.good{ color:var(--accent-700); background:var(--good-bg); border-color:var(--good-bd); }
.topup-preload-progress{
  grid-column:1 / -1;
  margin-top:8px;
  padding:9px 11px;
  background:var(--primary-50);
  border:1px solid var(--primary-100);
  border-radius:10px;
  color:#33406b;
  font-size:12.5px;
  line-height:1.45;
}
.topup-preload-progress.error{
  background:var(--bad-bg);
  border-color:var(--bad-bd);
  color:var(--bad);
}

@media (max-width:760px){
  .topup-line{ grid-template-columns:1fr; }
  .topup-lines{ grid-auto-rows:auto; }
}

/* ---------- Quick-order: compact inline-price chips ---------- */
/* Gigaboost plans: a ledger — one fixed grid row per plan. Nothing wraps,
   nothing squishes: GB | price | (flex space) | link | copy. */
.plan-orders.grid{ display:flex; flex-direction:column; gap:2px; }
.plan-orders.grid .order-row{
  display:grid;
  /* v6.17: FIXED column widths so every row lines up and the badge pills are
     identical. GB(44) · days(54, v7.10) · price(70) · flexible badge-cell(1fr)
     · 📋. Fixing GB+days+price makes the 1fr badge cell a constant width on
     every row, so a fixed-width badge pill sits in the same place and at the
     same size on all rows. (v6.14 lesson kept: price is NOT the 1fr filler — a
     shrinking nowrap price overflowed into GB. The badge column is the filler.) */
  grid-template-columns:44px 54px 70px minmax(0,1fr) auto;
  align-items:center;
  gap:8px;
  margin-bottom:0;
  background:transparent;
  border:0;
  border-radius:7px;
  padding:3px 8px;
  min-width:0;
  flex:none;
}
.plan-orders.grid .order-row:nth-child(even){ background:var(--row-zebra); }
.plan-orders.grid .order-row:hover{ background:var(--row-hover); }
.order-price{
  direction:ltr; font-weight:800; font-size:12.5px;
  color:var(--accent-700); white-space:nowrap;
  margin-inline-end:0; text-align:end;   /* prices align on their end edge */
}
/* v6.17: every badge pill is the SAME width and sits in the SAME place, so a
   longer combo like "Shift + Q→50" no longer makes a wider blue chip than
   "Shift + Q→1". Fixed width + centered text; sits at the start of the (now
   constant-width) badge cell; clips only if a very long custom combo is set. */
.order-days{
  font-weight:500; font-size:11px; color:var(--muted);
  white-space:nowrap; overflow:hidden;
}
/* v7.10: the badge pill sits inside an .order-kbd wrapper cell (so the row's
   child count stays fixed even when the hint is empty). */
.plan-orders.grid .order-kbd{
  display:flex; justify-content:flex-start; min-width:0; overflow:hidden;
}
.plan-orders.grid .plan-kbd{
  width:112px; min-width:112px;
  justify-content:center;
  overflow:hidden;
}
.plan-orders.grid .oa-copy{ padding:3px 9px; font-size:11.5px; height:24px; line-height:1; flex:none; justify-self:end; }

/* v6.14: the self-serve "buy your own plans" link, inside each gigaboost card */
.card-buy-link{
  display:flex; align-items:center; flex-wrap:wrap; gap:6px 8px;
  margin:2px 0 8px; padding:6px 8px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
}
.card-buy-link .chooser-type{ font-size:11.5px; font-weight:700; color:var(--muted); margin-inline-end:auto; }
.card-buy-link .oa-copy{ font-size:11px; padding:3px 9px; }

/* ---------- Reusable hover tooltip ---------- */
.info-tip{
  display:inline-flex; align-items:center; justify-content:center;
  width:22px; height:22px; border-radius:50%; cursor:help; flex:none;
  background:var(--surface-2); border:1px solid var(--line-strong);
  color:var(--muted); font-size:12px; font-weight:800; position:relative;
}
.info-tip:hover{ background:#fff; color:var(--primary-700); border-color:var(--primary); }
.info-tip:hover::after{
  content:attr(data-tip);
  position:absolute; top:calc(100% + 8px); right:0;
  z-index:300; width:max-content; max-width:300px;
  background:#1b1f2a; color:#fff; font-weight:500; font-size:12px; line-height:1.55;
  padding:9px 12px; border-radius:10px; white-space:pre-line; text-align:right;
  box-shadow:var(--shadow-lg); pointer-events:none;
}

/* ---------- Topup rows: horizontal grid (was one-per-row) ---------- */
/* Topup packages: fixed geometry for muscle memory (v7.27: TWO
   .giga-cards holding contiguous halves of the canonical slot list —
   the same two-up idiom as every other tab). Every row is the same
   gigaboost-style ledger: size | days | price | deal-slot(filler) | one
   .tl-actions span (qty pill + 📋 + 🧺) — 5 children, 5 tracks. */
.giga-cards.topup-cards{ grid-column:1 / -1; }
/* v7.23 rule: identical two-line headers on a card pair at every width. */
.topup-cards .block-tools{ flex-direction:column; align-items:flex-start; gap:6px; }
.topup-lines{ display:grid; grid-auto-rows:30px; gap:2px; }
.topup-line{
  display:grid;
  grid-template-columns:48px 54px 56px minmax(0,1fr) auto;
  align-items:center;
  gap:6px;
  border:0; border-radius:7px; background:transparent;
  margin-inline:0; padding:3px 8px; font-size:13px;  /* v7.12: gigaboost scale */
  min-height:30px;
}
.tl-actions{ display:inline-flex; align-items:center; gap:4px; justify-self:end; }
.tl-size{
  font-weight:800; font-size:12px; color:var(--text); /* v7.21: gigaboost size */
  font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden;
}
.tl-days{
  font-weight:500; font-size:11px; color:var(--muted);
  white-space:nowrap; overflow:hidden;
}
.tl-price{
  direction:ltr; font-weight:800; font-size:12.5px; /* v7.21: gigaboost size */
  color:var(--accent-700); white-space:nowrap; text-align:end;
}
.topup-lines .topup-line:nth-child(even){ background:var(--row-zebra); }
.topup-line:hover{ background:var(--row-hover); }
.topup-line-text{
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  font-weight:700; min-width:0;
}
.tl-deal{
  display:inline-flex; align-items:center; justify-content:flex-end; gap:3px;
  min-width:0; overflow:hidden;
}
.tl-deal-label{
  font-size:10.5px; font-weight:800; color:var(--accent-700);
  background:var(--good-bg); border:1px solid var(--good-bd);
  border-radius:999px; padding:1px 7px; white-space:nowrap;
}
.topup-line .lk-copy{ height:24px; min-width:26px; padding:2px 6px; font-size:11.5px; line-height:1; }
.topup-line .lk-copy:disabled{ opacity:.25; cursor:default; }
.topup-line .oa-basket, .topup-line .lg-qty-btn{ height:24px; font-size:11.5px; line-height:1; }
/* Missing plan slots: same height, unmistakably red — 2 children span the
   ledger columns via their own template (v7.8). */
.topup-line.is-missing{
  grid-template-columns:minmax(0,1fr) auto; /* v7.22: red text, normal zebra */
}
.topup-line.is-missing .topup-line-text{ color:var(--bad); font-weight:800; }
.tl-missing-pad{ justify-self:end; }


/* ---------- Responsive ---------- */
@media (max-width:850px){
  .giga-cards.basic-cards{ grid-template-columns:minmax(0,1fr); }
  .basic-shop-cards{ grid-template-columns:minmax(0,1fr); }
  /* v6.20: single column below here — no cross-column alignment to keep, so let
     rows size to content again (avoids clipping when a row's content stacks). */
  .global-lines{ grid-auto-rows:auto; }
}
@media (max-width:600px){
  body{ padding:16px 12px 48px; }
    .global-line{ grid-template-columns:1fr; gap:6px; }
  .global-links{ justify-content:flex-start; }
    .plan-orders{ min-width:0; width:100%; }
}

@media (prefers-reduced-motion:reduce){
  *{ animation:none !important; transition:none !important; }
}
/* ===== v4 density layer ===== */

.chooser-type{ font-size:12px; font-weight:800; color:var(--primary-700); min-width:52px; }

/* Tabs */
.tabs{
  flex:0 0 auto;
  display:flex; align-items:center; gap:6px;
  padding:7px 14px 0;
  background:var(--bg);
  border-bottom:1px solid var(--line-strong);
}
.tab-btn{
  display:inline-flex; align-items:center; gap:7px;
  padding:7px 16px 8px;
  border:1px solid transparent; border-bottom:0;
  border-radius:10px 10px 0 0;
  background:transparent; color:var(--muted);
  font-family:'Assistant'; font-size:13px; font-weight:700; cursor:pointer;
  margin-bottom:-1px;
  transition:color .12s, background .12s;
}
.tab-btn:hover{ color:var(--text); background:rgba(16,19,25,.04); }
.tab-btn.is-active{
  background:var(--surface); color:var(--text);
  border-color:var(--line-strong);
  border-bottom:1px solid var(--surface);
}
.tab-btn kbd{
  font-family:inherit; font-size:10px; font-weight:800;
  background:rgba(16,19,25,.08); color:var(--muted);
  border-radius:5px; padding:1px 5px; line-height:1.4;
}
.tab-btn.is-active kbd{ background:var(--primary); color:#fff; }

/* בסיסי rows: compact the pill controls that made rows chonky */
.global-line-text{ font-size:12.5px; gap:5px; }
/* v7.21: the basic rows controls are BARE like gigaboost — no capsule */
.global-line .link-group{ padding:0; gap:4px; border:0; background:transparent; }
.global-line .purchase-actions{ gap:4px; }
.global-line .lk-copy,
.global-line .oa-basket{ height:24px; min-width:0; padding:2px 8px; font-size:11.5px; line-height:1; }
.global-lines{ gap:2px; } /* v7.20: same row gap as every ledger */

/* The generic input:focus rule flips backgrounds to white — inside the dark
   topbar that made typed text (near-white) invisible. Keep them dark. */
.tb-search input:focus{
  background:var(--ink-2); color:#e8ecf4;
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(47,107,255,.28);
}
.tb-options .opt-qty input:focus{
  background:var(--ink); color:#e8ecf4;
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(47,107,255,.28);
}

/* Batch ICCID mode */
.topup-batch-toggle{
  flex:0 0 auto; padding:9px 12px; border-radius:11px; cursor:pointer;
  background:#fff; border:1px solid var(--line-strong); color:var(--text);
  font-size:12px; font-weight:700; font-family:inherit; white-space:nowrap;
}
.topup-batch-toggle.is-on{ background:var(--primary); color:#fff; border-color:var(--primary); }
.topup-batch-area{
  grid-column:1 / -1;
  width:100%; box-sizing:border-box;
  direction:ltr; text-align:left; font-variant-numeric:tabular-nums;
  background:#fff; border:1px solid var(--line-strong); border-radius:11px;
  padding:9px 12px; font-size:13px; font-family:inherit; resize:vertical; min-height:64px;
}
.topup-batch-area:focus{ outline:none; border-color:var(--primary); }

/* Quote template editor modal */
.quote-modal{
  position:fixed; inset:0; z-index:900; display:none;
  align-items:center; justify-content:center;
  background:rgba(16,19,25,.55);
}
.quote-modal.open{ display:flex; }
.quote-modal-card{
  width:520px; max-width:92vw; background:#fff; border-radius:14px;
  box-shadow:0 24px 60px rgba(16,19,25,.35); overflow:hidden;
  display:flex; flex-direction:column;
}
.quote-modal-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 14px; background:var(--ink); color:#fff;
  font-family:'Suez One',serif; font-size:15px;
}
.quote-modal-legend{
  padding:9px 14px; font-size:12px; color:var(--muted);
  border-bottom:1px solid var(--line);
}
.quote-modal-legend code{
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:6px; padding:1px 6px; font-size:11.5px; direction:ltr; display:inline-block;
}
#quoteTemplateArea{
  border:0; outline:none; resize:vertical; min-height:170px;
  padding:12px 14px; font-family:inherit; font-size:13.5px; line-height:1.6;
}
.quote-modal-actions{
  display:flex; gap:8px; justify-content:flex-end;
  padding:10px 14px; border-top:1px solid var(--line); background:var(--surface-2);
}
.quote-modal-actions button{
  padding:7px 16px; border-radius:9px; cursor:pointer; font-family:inherit;
  font-size:13px; font-weight:700; border:1px solid var(--line-strong); background:#fff; color:var(--text);
}
.quote-modal-actions .quote-save{ background:var(--accent); color:#fff; border-color:transparent; }

/* Price-change banner */
.price-changes-banner{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:#fff7e0; border:1px solid #f0dfa8; color:#7a5c10;
  border-radius:10px; padding:7px 11px; margin-bottom:10px;
  font-size:12.5px; font-weight:700;
}
.price-changes-banner button{
  background:transparent; border:0; color:#7a5c10; cursor:pointer;
  font-size:13px; padding:2px 6px; border-radius:6px;
}
.price-changes-banner button:hover{ background:rgba(122,92,16,.12); }

/* Topbar פישוט button: explicit colors for both states.
   (Base .opt-btn.is-on set a light mint background that combined with the
   topbar's white text → unreadable white-on-light.) */
.tb-options .opt-btn.is-on{ background:var(--primary); color:#fff; border-color:var(--primary); }
.tb-options .opt-btn.is-on:hover{ background:var(--primary-700); color:#fff; border-color:var(--primary-700); transform:none; }
.tb-options .opt-btn.is-off{ background:var(--ink-2); color:#c6cdda; border-color:var(--ink-line); }
.tb-options .opt-btn.is-off:hover{ background:#232a38; color:#fff; border-color:var(--ink-line); transform:none; }

/* Reference pricing editor */
.ref-editor{
  display:flex; flex-direction:column; gap:6px;
  background:var(--surface-2); border:1px dashed var(--line-strong);
  border-radius:9px; padding:8px 9px; margin-bottom:7px;
}
.ref-edit-row{ display:flex; align-items:center; gap:8px; }
.ref-edit-row label{
  display:inline-flex; align-items:center; gap:4px;
  font-size:12px; font-weight:800; color:var(--muted);
}
.ref-edit-row input{
  width:74px; padding:5px 7px; border-radius:8px;
  border:1px solid var(--line-strong); background:#fff;
  font-size:12.5px; font-family:inherit; direction:ltr; text-align:left;
  font-variant-numeric:tabular-nums;
}
.ref-edit-row input:focus{ outline:none; border-color:var(--primary); }
.ref-edit-del{
  margin-inline-start:auto; padding:3px 8px; border-radius:999px;
  background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad-bd);
  cursor:pointer; font-size:11px;
}
.ref-edit-actions{ display:flex; gap:6px; padding-top:2px; }
.ref-edit-actions button{
  font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:8px;
  border:1px solid var(--line-strong); background:#fff; color:var(--text); cursor:pointer;
}
.ref-edit-actions .ref-edit-done{ background:var(--accent); color:#fff; border-color:transparent; margin-inline-start:auto; }

/* Topbar chips: compact pills */
.tb-chips .chip{
  padding-block:3px; padding-inline-start:9px; padding-inline-end:4px;
  font-size:11.5px; gap:6px;
}
.tb-chips .chip span{ width:15px; height:15px; font-size:10px; }
/* Clear-all-countries button now sits in the top bar next to search — keep
   it from shrinking, and give it a touch of breathing room. */
.topbar > .clear-countries-btn{ flex:0 0 auto; margin-inline-start:-6px; }

/* v7.27: the copy tab's reference cards are ordinary .giga-cards now
   (2×2) — the old .ref-strip 4-up band was a third card scale (F3). */
.copy-cards{ grid-column:1 / -1; }

/* Dense table-style price rows: zebra instead of per-row borders */
.global-line{
  border:0 !important;
  border-radius:7px;
  padding:2px 6px;
  min-height:26px;
}
.global-lines .global-line:nth-child(even){ background:var(--row-zebra); } /* v7.20: same zebra as every ledger */
.global-line:hover{ background:var(--row-hover); }

/* Cards: tighter chrome, Suez One section identity */
.block{ padding:9px 11px; border-radius:12px; }
.block h3{ font-family:'Suez One',serif; font-weight:400; letter-spacing:.01em; }
.results-grid{ gap:8px; }

/* Gigaboost ledger + topup ledger sizing lives in the component section above. */

/* Cart drawer internals inherit the old rail styles */
.cart-drawer .order-builder-card{ padding:0; background:transparent; border:0; box-shadow:none; }

/* Keyboard focus visibility on dark topbar */
.topbar :focus-visible{ outline:2px solid var(--primary); outline-offset:1px; }

@media (prefers-reduced-motion: reduce){
  .cart-drawer{ transition:none; }
  .cart-fab{ transition:none; }
}

/* Narrow screens: options collapse under the bar */
@media (max-width:1100px){
  .topbar{ flex-wrap:wrap; height:auto; padding:8px 12px; row-gap:8px; }
  .tb-search{ flex:1 1 200px; }
  .tb-chips{ order:4; flex-basis:100%; }
}

/* ---------- Shortcuts (קיצורים) tab ---------- */
.shortcuts-card{ grid-column:1 / -1; } /* v7.27: full 944 column like every tab (F2) */
.sc-list{ display:grid; gap:4px; margin-top:4px; }
.sc-row{ display:flex; align-items:center; gap:12px; padding:7px 4px; border-bottom:1px solid var(--line); }
.sc-row:last-child{ border-bottom:0; }
.sc-key{
  flex:0 0 auto; min-width:120px; text-align:center;
  font-family:'Assistant',sans-serif; font-weight:800; font-size:12px;
  background:var(--surface-2); color:var(--primary-700);
  border:1px solid var(--line-strong); border-bottom-width:2px;
  border-radius:8px; padding:4px 10px; direction:ltr;
}
.sc-desc{ font-size:13px; color:var(--text); }
.sc-subhead{ margin:14px 0 6px; font-size:13px; font-weight:800; color:var(--muted); }
.sc-maplist{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:6px; }
.sc-map{ display:flex; align-items:center; gap:8px; font-size:12.5px; }
.sc-map .sc-key{ min-width:96px; }
.sc-map-head{ margin:10px 0 5px; font-size:12px; font-weight:800; color:var(--primary-700); direction:ltr; text-align:right; }
.sc-note{ margin-top:12px; font-size:12px; color:var(--muted); line-height:1.5; }

/* ---- קיצורים tab: the v6.3 configuration panel ------------------------------
   A framed sub-card that lets each operator pick their own modifier, eSIM /
   physical leader keys, and numpad-only restriction. Rows are label + control;
   the capture buttons flip to a highlighted "press a key" state while armed. */
.sc-config{
  margin-top:16px; padding:14px; border:1px solid var(--line-strong);
  border-radius:12px; background:var(--surface-2);
}
.sc-config .sc-subhead{ margin-top:0; }
.sc-config-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:6px 0; }
.sc-config-label{ flex:0 0 150px; font-size:13px; font-weight:700; color:var(--text); }
.sc-config-select{
  flex:0 0 auto; padding:7px 10px; border:1px solid var(--line-strong);
  border-radius:8px; background:var(--surface); color:var(--text); font-size:13px;
}
.sc-capture-btn{
  flex:0 0 auto; min-width:78px; padding:7px 12px; direction:ltr;
  border:1px solid var(--line-strong); border-bottom-width:2px; border-radius:8px;
  background:var(--surface); color:var(--primary-700); font-weight:800; font-size:13px;
  cursor:pointer;
}
.sc-capture-btn.is-capturing{
  background:var(--primary-700); color:#fff; border-color:var(--primary-700);
  animation:sc-pulse 1s ease-in-out infinite;
}
@keyframes sc-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }
.sc-combo-preview{ font-size:12px; color:var(--muted); direction:ltr; }
.sc-checkbox-label{ flex:1 1 auto; display:flex; align-items:center; gap:8px; font-weight:600; cursor:pointer; }
.sc-checkbox-label input{ width:16px; height:16px; }
.sc-reset-btn{
  flex:0 0 auto; padding:7px 14px; border:1px solid var(--line-strong);
  border-radius:8px; background:var(--surface); color:var(--text); font-size:13px; cursor:pointer;
}
.sc-reset-btn:hover{ background:var(--surface-3, var(--line)); }
.sc-radio-group{ display:flex; gap:14px; flex-wrap:wrap; }
.sc-radio-label{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; cursor:pointer; }
.sc-radio-label input{ width:15px; height:15px; }

/* ---- v6.4: GB quick-copy popup + per-row shortcut badges ------------------- */
/* The "type the GB" popup shown while a field-mode shortcut is armed. Fixed to
   the top-center so it's visible no matter which tab/scroll position. */
.gb-shortcut-bar{
  position:fixed; top:14px; left:50%; transform:translateX(-50%);
  z-index:9000; display:flex; align-items:center; gap:10px;
  background:var(--primary-700); color:#fff;
  border-radius:12px; padding:9px 14px;
  box-shadow:0 10px 30px rgba(16,19,25,.28);
  direction:rtl;
}
.gb-shortcut-bar[hidden]{ display:none; }
.gb-shortcut-icon{ font-size:16px; }
.gb-shortcut-label{ font-size:13px; font-weight:800; white-space:nowrap; }
.gb-shortcut-input{
  width:88px; height:30px; border:0; border-radius:8px; padding:2px 10px;
  font-size:15px; font-weight:800; text-align:center; direction:ltr;
  font-variant-numeric:tabular-nums; background:#fff; color:var(--text);
}
.gb-shortcut-input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
.gb-shortcut-hint{ font-size:11px; opacity:.85; white-space:nowrap; direction:rtl; }

/* The compact per-row badge that shows which keys copy that plan. Subtle so it
   never competes with the price/buttons, but always visible. */
.plan-kbd{
  display:inline-flex; align-items:center; gap:2px;
  font-size:10.5px; font-weight:700; direction:ltr; white-space:nowrap;
  color:var(--primary-700); background:var(--primary-50, var(--surface-2));
  border:1px solid var(--primary-100, var(--line)); border-radius:7px;
  padding:1px 6px; line-height:1.5;
}
/* A one-line legend at the top of each copy-shortcut-bearing card. */
.copy-legend{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin:2px 0 8px; font-size:11.5px; color:var(--muted);
}
.copy-legend .plan-kbd{ font-size:10.5px; }
.copy-legend-cart{ margin-inline-start:6px; font-weight:700; color:var(--accent-700); }
.sc-radio-label input[type="radio"]{ width:15px; height:15px; }

/* v6.8: WooCommerce order-creation section in the cart drawer. */

/* v6.7: "cheaper countries" card on the העתקות tab (full width above the strip). */
.cheaper-card{ grid-column:1 / -1; }
.cheaper-sub{ font-size:12px; color:var(--muted); line-height:1.5; margin:2px 0 6px; }
.cheaper-list{
  font-size:12px; line-height:1.6; white-space:pre-wrap; word-break:break-word;
  max-height:340px; overflow:auto;
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:8px; padding:9px 11px; margin:0;
}
</style>
</head>

<body>

<!-- ═════════════════════════════════════════════════════════════════════
  SHELL HTML — the static skeleton.
  Everything dynamic is rendered by the main script into #results (the
  active tab's content) and #cart (the drawer's contents). The elements
  below are the only ones that exist before the first render.
  ═════════════════════════════════════════════════════════════════════ -->

<!-- Full-screen loading overlay, shown until the initial API fetches in
     the boot sequence finish (or fail — failures repurpose this element
     as the error card). -->
<div id="loading">
  <div class="loading-inner">
    <span class="spinner"></span>
    <span>טוען נתונים…</span>
  </div>
</div>

<div class="app">

  <!-- ░░ TOP BAR · brand / country search / selected chips / options ░░
       48px ink-dark bar. Every input inside it carries explicit dark
       colors INCLUDING :focus states (see the CSS layering banner). -->
  <header class="topbar">
    <div class="brand">
      <span class="sim-chip" aria-hidden="true"></span>
      <span class="brand-name">מחשבון גיגה</span>
    </div>

    <!-- Country search with a suggestions dropdown. The input listener
         lives in the main script (EVENT WIRING section); Enter picks the
         first suggestion. -->
    <!-- Search + the clear-all-countries button, side by side. The clear
         button (renderSelected toggles it visible when ≥1 country is
         selected) lives HERE next to the search rather than by the chips. -->
    <div class="tb-search">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="search" placeholder="חפש מדינה / ISO" autocomplete="off">
        <div class="suggestions" id="suggestions"></div>
      </div>
    </div>
    <button id="clearCountriesBtn" class="clear-countries-btn" onclick="clearAllCountries()" title="נקה את כל המדינות שנבחרו">✕ נקה</button>

    <!-- Selected-country chips strip: scrolls horizontally, never wraps. -->
    <div class="tb-chips">
      <div class="chips" id="selected"></div>
    </div>

    <!-- Options cluster: cart behavior + pricing knobs.
           רוקן עגלה  — appends empty_cart=true to checkout links
           כמות       — quantity for the base ("יחיד") checkout link
           $          — custom USD amount (Enter recomputes the copy tab)
           ₪/$        — editable USD→ILS rate; affects ALL eSIM prices
           פישוט      — master simplify toggle across every card
           JSON       — full old-API + manual-site export download    -->
    <div class="tb-options">
      <label class="opt-switch" title="הוסף empty_cart=true לקישור — מרוקן את העגלה לפני ההוספה">
        <input type="checkbox" id="emptyCartToggle" checked onchange="setEmptyCart(this.checked)">
