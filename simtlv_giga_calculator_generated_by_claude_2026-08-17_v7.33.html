function validateTopupSelectionForProfile(profile = getTopupProfile(), countries = getTopupCountries()) {
  if (!countries.length) return "בחר מדינה אחת לפחות.";
  if (profile.id === "psim_v1") {
    const bad = getV1DisallowedCountries(countries);
    if (bad.length) {
      const names = bad.map(c => c.name?.he || c.iso).join(", ");
      return `V1 pSIM מוגבל לאירופה בלבד. היעדים הבאים חסומים ל‑V1: ${names}`;
    }
  }
  return "";
}

/** Germany's entry in the country model (with a safe stub fallback in
 *  case the API ever omits it) — V1's probe country. */
function getV1GermanyCountry() {
  return data.find(c => String(c.iso).toUpperCase() === TOPUP_V1_GERMANY_PROBE_ISO) || {
    iso: "DE",
    name: { he: "גרמניה", en: "Germany" },
    zone: 1,
    plans: { esim: [], physical: [] }
  };
}

/* ---- Manual-site scan lookups (shared by the basic tab and V3 topup) ------- */

/** A country's DIRECT scan for one SIM type (or null if not yet scanned /
 *  empty). The scan carries the site's real `zone` (product_zone). */
function manualScanFor(country, simType) {
  const s = country && manualByIso[country.iso];
  return s && s[simType] && s[simType].packages.length ? s[simType] : null;
}

/** The selection's operative country for a SIM type: the SELECTED,
 *  already-scanned country with the HIGHEST real product_zone (the site's
 *  own zone, not any list). Its scan drives that column's prices/links (and,
 *  for eSIM, the V3 topup catalog). Null until a scan has landed. */
function operativeManualCountry(simType) {
  const scanned = selected.filter(c => manualScanFor(c, simType));
  if (!scanned.length) return null;
  return scanned.slice().sort((a, b) =>
    ((manualScanFor(b, simType).zone) || 0) - ((manualScanFor(a, simType).zone) || 0))[0];
}

/** v7.26: like operativeManualCountry, but when NO selected country has a
 *  usable scan it falls back to one whose scan FAILED for this SIM type —
 *  so the basic column can render its error branch instead of the
 *  misleading "אין חבילות" (a 503 used to be indistinguishable from a
 *  genuinely empty destination). Render-only; pricing/topup lookups keep
 *  using operativeManualCountry. */
function operativeOrErroredCountry(simType) {
  return operativeManualCountry(simType) || selected.find(c => {
    const e = manualByIso[c.iso];
    return e && e.errors && e.errors.some(er => er.simType === simType || er.simType === "all");
  }) || null;
}

/** The selection's operative eSIM zone (the site's real product_zone of the
 *  operative eSIM country), or null when no eSIM scan has landed yet. */
function getSelectedEsimZone() {
  const c = operativeManualCountry("esim");
  return c ? manualScanFor(c, "esim").zone : null;
}

/* ---- Scanning (probe fetches) --------------------------------------------- */

/** The manual site's search_topup URL for one ICCID + country set. */
function buildTopupSearchUrl(iccid, countries) {
  const params = new URLSearchParams();
  params.set("action", "esim_global_ajax");
  params.set("task", "search_topup");
  params.set("on_what_dates", GLOBAL_API_DATE_RANGE);
  countries.forEach(c => params.append("fly_countries[]", c.iso));
  params.set("your_iccid", iccid);
  return MANUAL_SITE_AJAX_URL + "?" + params.toString();
}

/** Fetches + parses the topup catalog the site offers this ICCID for
 *  these countries. */
async function fetchTopupPackages(iccid, countries) {
  const url = buildTopupSearchUrl(iccid, countries);
  const res = await fetch(url);

  if (!res.ok) {
    throw new Error(`Topup ${iccid}: HTTP ${res.status}`);
  }

  const json = await res.json();
  return parseTopupResult(json, iccid, countries, url);
}

/** Parses a search_topup response into a catalog object: the packages
 *  (30-day max, deduped, each stamped isTopup + topupIccid) plus
 *  metadata scraped from the response's hidden debug block (SIM type,
 *  region code/name) used to classify the card and label the panel. */
function parseTopupResult(apiResponse, iccid, countries, requestUrl) {
  const products = parseGlobalProducts(apiResponse, "topup", {
    maxValidityDays: 30,
    dedupe: true
  }).map(pkg => ({ ...pkg, isTopup: true, topupIccid: iccid }));

  // The response HTML hides a debug block with SIMType / region details.
  const html = apiResponse?.data?.products || "";
  const doc = new DOMParser().parseFromString(html, "text/html");
  const hiddenText = (doc.querySelector('div[style*="display:none"]')?.textContent || doc.body?.textContent || "")
    .replace(/\r/g, "\n");

  const simTypeMatch = hiddenText.match(/SIMType:\s*([^\n<]*)/i);
  const simTypeText = (simTypeMatch?.[1] || "").trim();

  const regionCodeMatch = hiddenText.match(/\[country_code\]\s*=>\s*([A-Z0-9]+)/i);
  const regionNameMatch = hiddenText.match(/\[region_name\]\s*=>\s*([^\n]+)/i);
  const caseMatch = hiddenText.match(/case_TV:\s*([^\n<]*)/i);

  const searchPhysical = Number(apiResponse?.data?.search_physical || 0);
  const firstUrl = products[0]?.base?.checkoutUrl || "";
  const checkoutInfo = getCheckoutUrlInfo(firstUrl);

  // Human-facing classification of what kind of card this is.
  let kind = "eSIM topup";
  let kindShort = "eSIM";
  if (searchPhysical) {
    if (simTypeText) {
      kind = `סים פיזי · ${simTypeText}`;
      kindShort = simTypeText.includes("V2") ? "pSIM V2" : "pSIM";
    } else {
      kind = "סים פיזי ישן / אזורי";
      kindShort = "pSIM ישן";
    }
  }

  return {
    key: getTopupCacheKeyFor(iccid, countries),
    iccid,
    requestedCountries: countries.map(c => ({ iso: c.iso, he: c.name.he, en: c.name.en, zone: c.zone })),
    requestUrl,
    rawSuccess: apiResponse?.success === true,
    zone: apiResponse?.data?.zone ?? null,
    searchPhysical,
    simTypeText,
    caseText: (caseMatch?.[1] || "").trim(),
    regionCode: regionCodeMatch?.[1] || checkoutInfo.flyCountries || "",
    regionName: (regionNameMatch?.[1] || "").trim(),
    checkoutInfo,
    kind,
    kindShort,
    packages: products
  };
}

/* ---- URL rewriting (probe → customer) -------------------------------------- */

/** Deep clone via JSON (packages are plain data). */
function clonePackage(pkg) {
  return JSON.parse(JSON.stringify(pkg));
}

/** Clones a package and passes its base + deal URLs through `rewriter`. */
function rewritePackageUrls(pkg, rewriter) {
  const cloned = clonePackage(pkg);
  if (cloned.base?.checkoutUrl) cloned.base.checkoutUrl = rewriter(cloned.base.checkoutUrl, cloned.base.quantity || 1);
  if (Array.isArray(cloned.deals)) {
    cloned.deals = cloned.deals.map(d => ({ ...d, checkoutUrl: rewriter(d.checkoutUrl, d.quantity || 1) }));
  }
  return cloned;
}

/** Rewrites a MANUAL-SITE eSIM URL into a V3 topup URL for the current
 *  selection: fly_countries ← sorted selected ISOs, product_zone ← the
 *  selection's zone, physical-SIM leftovers stripped, quantity and
 *  empty_cart cleared (decided later, per order item), ref stamped. */
function rewriteEsimV3TopupUrlFromManual(url, countries = getSelectedTopupCountries(), zone = getSelectedTopupZone(), quantity = 1) {
  if (!url) return url;
  const isos = (countries || []).map(c => c.iso).filter(Boolean).sort();
  try {
    const u = new URL(url);
    if (isos.length) u.searchParams.set("fly_countries", isos.join("|"));
    if (zone !== null && zone !== undefined) u.searchParams.set("product_zone", String(Number(zone)));
    u.searchParams.delete("physical_sim_type");
    u.searchParams.delete("country_name_in_region");
    u.searchParams.delete("quantity");
    u.searchParams.delete("empty_cart");
    u.searchParams.set("ref", REFERRAL_CODE);
    return u.toString().replace(/%7C/gi, "|");
  } catch (e) {
    return String(url);
  }
}

/** Rewrites a PHYSICAL (V1/V2) topup URL for the current selection.
 *  ⚠ Business rules #2 + #3 are enforced here:
 *    * V1 → fly_countries=REUP, always — never a literal country code;
 *    * V2 → fly_countries = the CUSTOMER's selected ISOs (sorted,
 *      pipe-joined). The catalog was scanned via a zone-representative
 *      probe country (alphabetically first — e.g. UZ for a US-zone
 *      scan); that probe ISO once leaked into customer URLs. */
function rewritePhysicalTopupUrlForSelected(url, profileId, countries = getSelectedTopupCountries()) {
  if (!url) return url;
  const countryNames = getSelectedTopupCountryNamesForUrl();
  try {
    const u = new URL(url);
    if (countryNames) u.searchParams.set("country_name_in_region", countryNames);
    if (profileId === "psim_v1") {
      u.searchParams.set("fly_countries", "REUP");
    } else {
      const isos = (countries || []).map(c => c.iso).filter(Boolean);
      if (isos.length) u.searchParams.set("fly_countries", isos.slice().sort().join("|"));
    }
    u.searchParams.delete("quantity");
    u.searchParams.delete("empty_cart");
    u.searchParams.set("ref", REFERRAL_CODE);
    return u.toString().replace(/%7C/gi, "|");
  } catch (e) {
    return String(url);
  }
}

/* ---- Catalog materialization ------------------------------------------------
   A CACHED catalog belongs to whatever selection it was scanned with.
   "Materializing" deep-clones it and rewrites every URL + metadata field
   for the CURRENT selection, profile, and customer ICCID. */

/** Materializes `catalog` for the current selection (see above). */
function materializeTopupCatalogForSelected(catalog, profile = getTopupProfile()) {
  if (!catalog) return null;
  const countries = getSelectedTopupCountries();
  const zone = getSelectedTopupZone();
  const materialized = JSON.parse(JSON.stringify(catalog));
  materialized.requestedCountries = countries.map(c => ({ iso: c.iso, he: c.name.he, en: c.name.en, zone: c.zone }));
  materialized.profileId = profile.id;
  materialized.profileLabel = profile.label;
  materialized.kind = profile.label;
  materialized.kindShort = profile.short;
  materialized.customerIccid = topupState.customerIccid || "";

  if (isEsimTopupProfileId(profile.id)) {
    materialized.zone = zone;
    materialized.packages = (materialized.packages || []).map(pkg =>
      rewritePackageUrls(pkg, rawUrl => rewriteEsimV3TopupUrlFromManual(rawUrl, countries, zone))
    );
  } else {
    materialized.packages = (materialized.packages || []).map(pkg =>
      rewritePackageUrls(pkg, rawUrl => rewritePhysicalTopupUrlForSelected(rawUrl, profile.id, countries))
    );
  }

  materialized.checkoutInfo = getCheckoutUrlInfo(materialized.packages?.[0]?.base?.checkoutUrl || "");
  return materialized;
}

/** Scans a physical catalog by trying each of the profile's probe
 *  ICCIDs in turn until one returns a non-empty catalog. Throws with a
 *  per-probe error summary when all fail. */
async function fetchPhysicalCatalogByProbe(profile, countries, catalogKey) {
  const errors = [];
  for (const probeIccid of profile.probeIccids) {
    try {
      const result = await fetchTopupPackages(probeIccid, countries);
      if (result && Array.isArray(result.packages) && result.packages.length) {
        result.catalogKey = catalogKey;
        result.profileId = profile.id;
        result.profileLabel = profile.label;
        result.probeIccid = probeIccid;
        result.iccid = probeIccid;
        result.customerIccid = topupState.customerIccid || "";
        result.kindShort = profile.short;
        result.kind = profile.label;
        return materializeTopupCatalogForSelected(result, profile) || result;
      }
      errors.push(`${shortIccid(probeIccid)}: empty catalog`);
    } catch (err) {
      errors.push(`${shortIccid(probeIccid)}: ${String(err.message || err)}`);
    }
  }
  throw new Error(`לא הצלחתי לטעון קטלוג ${profile.label}. ${errors.join(" · ")}`);
}

/** The catalog to SHOW right now: ALL profiles (incl. v6.10 V3) come from
 *  the cached search_topup scan, materialized for the current selection.
 *  Null when unavailable (not scanned yet / invalid selection). If V3 isn't
 *  cached yet it quietly kicks off the scan. */
function getCurrentTopupCatalog() {
  ensureAutoTopupState();
  const profile = getTopupProfile();

  const validation = validateTopupSelectionForProfile(profile, getSelectedTopupCountries());
  if (validation) return null;

  const key = getTopupCatalogKey(getSelectedTopupCountries(), profile.id);
  const cached = topupState.catalogCache?.[key] || null;
  return cached ? materializeTopupCatalogForSelected(cached, profile) : null;
}

/** Is a profile's catalog ready for the current selection? */
function isCatalogCachedForProfile(profile, countries = getSelectedTopupCountries()) {
  if (!countries.length) return false;
  if (profile.id === "psim_v1" && getV1DisallowedCountries(countries).length) return false;
  return !!topupState.catalogCache?.[getTopupCatalogKey(countries, profile.id)];
}

/** Readiness stats for the "מוכן x/y" chip: how many of the applicable
 *  profiles (V1 drops out for non-Europe selections) are cached. */
function getTopupPreloadStats(countries = getTopupCountries()) {
  ensureAutoTopupState();
  const profiles = Object.values(TOPUP_VERSION_PROFILES).filter(profile => {
    if (profile.id !== "psim_v1") return true;
    return !getV1DisallowedCountries(countries).length;
  });
  const total = profiles.length;
  const cached = profiles.filter(profile => isCatalogCachedForProfile(profile, countries)).length;
  return { total, cached, missing: Math.max(0, total - cached) };
}

/* ---- Preloading -------------------------------------------------------------
   Workflow:
     1) V3 eSIM: scan search_topup for the SELECTED countries (v6.10 — so the
        checkout links use the real TOPUP products, not the eSIM new-purchase
        catalog; the old manual-price derivation shipped new-eSIM SKUs);
     2) V2 pSIM: scan once per price zone, automatically on startup;
     3) V1 pSIM: scan Germany only, automatically on startup. */

/** Loads whatever catalogs the CURRENT selection is missing (V2 zone +
 *  V1 if applicable), updating panel progress as jobs finish. Also the
 *  🔍 / 🔄 button handler (forceRefresh re-scans existing catalogs). */
async function preloadTopupsForSelected(forceRefresh = false) {
  ensureAutoTopupState();
  const countries = getSelectedTopupCountries();
  if (!countries.length) {
    topupState.error = "בחר מדינה אחת לפחות לפני טעינת קטלוגים.";
    renderAll();
    return;
  }

  // Collect the scan jobs actually needed.
  const jobs = [];
  const zone = getSelectedTopupZone();
  const v2Key = getTopupCatalogKeyForZone("psim_v2", zone);
  if (forceRefresh || !topupState.catalogCache?.[v2Key]) {
    const rep = getZoneRepresentative(zone);
    if (rep) jobs.push({ profile: TOPUP_VERSION_PROFILES.psim_v2, countries: [rep], key: v2Key, label: `V2 zone ${zone}` });
  }

  const v1Key = "psim_v1|europe:DE";
  if (!getV1DisallowedCountries(countries).length && (forceRefresh || !topupState.catalogCache?.[v1Key])) {
    jobs.push({ profile: TOPUP_VERSION_PROFILES.psim_v1, countries: [getV1GermanyCountry()], key: v1Key, label: "V1 Germany/Europe" });
  }

  // v6.10: V3 eSIM now scans search_topup for the SELECTED countries, so its
  // checkout links use the real TOPUP products (not the eSIM new-purchase ones).
  const v3Key = getTopupCatalogKey(countries, "esim_v3");
  if (countries.length && (forceRefresh || !topupState.catalogCache?.[v3Key])) {
    jobs.push({ profile: TOPUP_VERSION_PROFILES.esim_v3, countries: countries, key: v3Key, label: "V3 eSIM" });
  }
  if (!jobs.length) {
    topupState.preloadMessage = "";
    topupState.preloading = false;
    topupState.error = "";
    topupState.catalogResult = getCurrentTopupCatalog();
    topupState.result = topupState.catalogResult;
    renderAll();
    return;
  }

  topupState.preloading = true;
  topupState.preloadDone = 0;
  topupState.preloadTotal = jobs.length;
  topupState.preloadErrors = 0;
  topupState.preloadErrorList = [];
  topupState.preloadMessage = `טוען אוטומטית ${jobs.length} קטלוגים חסרים…`;
  topupState.error = "";
  renderAll();

  await mapWithConcurrency(jobs, 3, async job => {
    try {
      const result = await fetchPhysicalCatalogByProbe(job.profile, job.countries, job.key);
      topupState.catalogCache[job.key] = JSON.parse(JSON.stringify(result));
    } catch (err) {
      topupState.preloadErrors++;
      topupState.preloadErrorList.push(`${job.label}: ${String(err.message || err)}`);
    } finally {
      topupState.preloadDone++;
      topupState.preloadMessage = `טוען קטלוגים: ${topupState.preloadDone}/${topupState.preloadTotal}`;
      persistTopupCatalogCache();
      renderAll();
    }
  });

  topupState.preloading = false;
  topupState.preloadMessage = `טעינה אוטומטית ליעד הסתיימה${topupState.preloadErrors ? ` · שגיאות: ${topupState.preloadErrors}` : ""}`;
  topupState.catalogResult = getCurrentTopupCatalog();
  topupState.result = topupState.catalogResult;
  renderAll();
}

/** Scans the V2 catalog for EVERY zone that's missing one (bounded
 *  concurrency). Part of the automatic startup preload. */
async function preloadAllV2Zones(forceRefresh = false) {
  ensureAutoTopupState();
  const reps = getAllZoneRepresentatives();
  const jobs = reps
    .map(rep => ({ ...rep, key: getTopupCatalogKeyForZone("psim_v2", rep.zone) }))
    .filter(job => forceRefresh || !topupState.catalogCache?.[job.key]);

  if (!jobs.length) return { done: reps.length, errors: 0 };

  let done = 0;
  let errors = 0;
  await mapWithConcurrency(jobs, TOPUP_V2_ZONE_PRELOAD_CONCURRENCY, async job => {
    try {
      const result = await fetchPhysicalCatalogByProbe(TOPUP_VERSION_PROFILES.psim_v2, [job.country], job.key);
      topupState.catalogCache[job.key] = JSON.parse(JSON.stringify(result));
    } catch (err) {
      errors++;
      topupState.autoPreloadErrors.push(`V2 אזור ${job.zone}: ${String(err.message || err)}`);
    } finally {
      done++;
      topupState.autoPreloadMessage = `טעינה אוטומטית: V2 לפי אזורים ${done}/${jobs.length}`;
      persistTopupCatalogCache();
      renderAll();
    }
  });
  return { done, errors };
}

/** Scans the single V1 (Germany/Europe) catalog if it's missing. */
async function preloadV1Germany(forceRefresh = false) {
  ensureAutoTopupState();
  const key = "psim_v1|europe:DE";
  if (!forceRefresh && topupState.catalogCache?.[key]) return { done: 1, errors: 0 };
  try {
    const result = await fetchPhysicalCatalogByProbe(TOPUP_VERSION_PROFILES.psim_v1, [getV1GermanyCountry()], key);
    topupState.catalogCache[key] = JSON.parse(JSON.stringify(result));
    persistTopupCatalogCache();
    return { done: 1, errors: 0 };
  } catch (err) {
    topupState.autoPreloadErrors.push(`V1 Germany: ${String(err.message || err)}`);
    return { done: 0, errors: 1 };
  }
}

/** The automatic startup preload (kicked off by boot, once): runs the
 *  manual-site zone preload (V3's source), all V2 zone scans, and the
 *  V1 Germany scan in parallel, then reports readiness per version. */
async function autostartTopupCatalogPreload(forceRefresh = false) {
  ensureAutoTopupState();
  if (!data.length || topupState.autoPreloading) return;
  if (topupState.autoPreloadStarted && !forceRefresh) return;

  topupState.autoPreloadStarted = true;
  topupState.autoPreloading = true;
  topupState.autoPreloadDone = false;
  topupState.autoPreloadErrors = [];
  topupState.autoPreloadMessage = "טוען קטלוג טופאפ…";
  setExportStatus(topupState.autoPreloadMessage);
  renderAll();

  // V3 eSIM derives from the manual-site eSIM prices, which are now scanned
  // per SELECTED country on demand (no mass preload). Warm whatever is
  // already selected (nothing at boot; harmless).
  const globalPromise = startGlobalPreloadAll(false).catch(err => {
    topupState.autoPreloadErrors.push(`V3/manual: ${String(err.message || err)}`);
  });

  const v2Promise = preloadAllV2Zones(forceRefresh);
  const v1Promise = preloadV1Germany(forceRefresh);

  await Promise.allSettled([globalPromise, v2Promise, v1Promise]);

  topupState.autoPreloading = false;
  topupState.autoPreloadDone = true;
  const zoneTotal = getAllZoneRepresentatives().length;
  const v2Cached = getAllZoneRepresentatives().filter(rep => !!topupState.catalogCache?.[getTopupCatalogKeyForZone("psim_v2", rep.zone)]).length;
  const v1Cached = !!topupState.catalogCache?.["psim_v1|europe:DE"];
  topupState.autoPreloadMessage = `מוכן: V3 מחירי אתר לפי מדינה (לפי בחירה), V2 ${v2Cached}/${zoneTotal} אזורים, V1 Germany ${v1Cached ? "טעון" : "חסר"}${topupState.autoPreloadErrors.length ? ` · שגיאות: ${topupState.autoPreloadErrors.length}` : ""}`;
  setExportStatus(topupState.autoPreloadMessage);
  persistTopupCatalogCache();
  renderAll();
}

/** Called by renderAll: quietly makes sure the current selection's
 *  catalog is (being) loaded. V3 just needs its zone's manual-site scan;
 *  V1/V2 get a deferred preloadTopupsForSelected (setTimeout breaks the
 *  render → preload → render recursion; autoEnsureRunning stops loops). */
function scheduleAutoEnsureTopupForSelection() {
  // v6.27: shop-only pseudo-countries have no real ISO — nothing to probe.
  if (selected.length && selected.every(c => c.catalogOnly)) return;
  ensureAutoTopupState();
  if (!selected.length || topupState.autoEnsureRunning) return;
  // v6.10: V3 now scans search_topup like V1/V2, so it goes through the same
  // "not cached yet → preload" path (no more manual-price derivation).
  if (!getCurrentTopupCatalog()) {
    topupState.autoEnsureRunning = true;
    setTimeout(() => {
      preloadTopupsForSelected(false).finally(() => { topupState.autoEnsureRunning = false; });
    }, 20);
  }
}

/* ---- Topup checkout links --------------------------------------------------- */

/** Finalizes a topup checkout URL for the CUSTOMER:
 *    * your_iccid ← the customer's ICCID (never the probe's);
 *    * V3: fly_countries/product_zone from the selection, physical-SIM
 *      leftovers stripped;
 *    * V1/V2: country_name_in_region from the selection, and ⚠ V1 gets
 *      fly_countries=REUP here again, belt-and-suspenders with the
 *      rewrite in rewritePhysicalTopupUrlForSelected (V2 fly_countries
 *      was already set to the selected ISOs during that rewrite);
 *    * empty_cart per the toggle; quantity only when > 1.
 *  The caller passes the item's own quantity (v6.12); topups are normally
 *  1 per card, so quantity is usually omitted. */
function buildTopupCheckoutUrl(url, quantityOverride = 1, forceEmptyCart = cartSettings.emptyCart, customerIccidOverride = null) {
  if (!url) return url;
  const qty = parseInt(quantityOverride || 1, 10);
  const customerIccid = normalizeIccid(customerIccidOverride ?? topupState.customerIccid ?? topupState.iccid ?? "");
  const profile = getTopupProfile();

  try {
    const u = new URL(url);
    u.searchParams.set("ref", REFERRAL_CODE);
    if (customerIccid) u.searchParams.set("your_iccid", customerIccid);

    if (isEsimTopupProfileId(profile.id)) {
      // V3/V4 are eSIM → price at the eSIM zone, not the general zone.
      const countries = getSelectedTopupCountries();
      const esimZone = getSelectedEsimZone();
      if (countries.length) u.searchParams.set("fly_countries", countries.map(c => c.iso).sort().join("|"));
      if (esimZone !== null) u.searchParams.set("product_zone", String(Number(esimZone)));
      u.searchParams.delete("country_name_in_region");
      u.searchParams.delete("physical_sim_type");
    } else {
      const names = getSelectedTopupCountryNamesForUrl();
      if (names) u.searchParams.set("country_name_in_region", names);
      // ⚠ V1 pSIM topups always use the REUP region code, never a country.
      if (profile.id === "psim_v1") {
        u.searchParams.set("fly_countries", "REUP");
      }
      // (V2 fly_countries is already set to the selected ISOs during URL rewrite.)
    }

    if (forceEmptyCart) u.searchParams.set("empty_cart", "true");
    else u.searchParams.delete("empty_cart");

    if (Number.isFinite(qty) && qty > 1) u.searchParams.set("quantity", String(qty));
    else u.searchParams.delete("quantity");

    return u.toString().replace(/%7C/gi, "|");
  } catch (e) {
    return String(url);
  }
}

/** Gate for customer-facing topup actions: a FULL customer ICCID (18+
 *  digits) must be present. Alerts and returns "" otherwise; on success
 *  also syncs state + storage with the (possibly input-typed) value. */
function requireTopupCustomerIccid() {
  const customerIccid = normalizeIccid(topupState.customerIccid || document.getElementById("topupIccid")?.value || "");
  if (customerIccid.length < 18) {
    showCopyToast("הקלד ICCID מלא של הלקוח לפני יצירת קישור או הזמנה.", 3500);
    return "";
  }
  topupState.customerIccid = customerIccid;
  topupState.iccid = customerIccid;
  storageSet(TOPUP_CUSTOMER_ICCID_STORAGE_KEY, customerIccid);
  return customerIccid;
}

/** 📋 handler on topup rows: copies the customer link (ICCID required). */
function copyTopupCustomerLink(rawUrl, qty = 1) {
  const customerIccid = requireTopupCustomerIccid();
  if (!customerIccid) return;
  copyText(buildTopupCheckoutUrl(rawUrl, qty, cartSettings.emptyCart, customerIccid));
}

/* ---- Topup landing-page link -----------------------------------------------
   A share link that drops the customer onto the manual site's "global"
   page, TOPUP tab, pre-filled with the selected countries and their ICCID —
   so they (or a worker) can pick a topup package there. Distinct from the
   per-package checkout links above: this is a search/landing pre-fill.
   Grammar (order matches the site's own links):
     {TOPUP_LANDING_URL}?ref=<code>&empty_cart=true
        &s_country[]=AL&s_country[]=BG&…       (one per SELECTED country — all of them, v7.26)
        &your_iccid=<iccid>                    (only when a full ICCID is set)
        &s_tab=tab_topup
   Honors the affiliate code (REFERRAL_CODE) and the רוקן עגלה toggle. */

/** Builds the topup landing link for the current selection + customer ICCID.
 *  v7.26: carries ALL selected countries (minus shop-only pseudo-countries)
 *  — NOT the highest-zone subset. Business rule #4's zone filter is for
 *  PRICED checkout links; this is a search pre-fill, and the landing page
 *  shows each country its own packages (a Germany+Mongolia selection used
 *  to emit s_country[]=MN only, dropping Germany — operator-reported).
 *  Returns "" (with an alert) when nothing is selected. The ICCID is
 *  optional here — a worker can send the link before the customer's card
 *  is known, and the customer fills it in on the page. */
function buildTopupLandingLink() {
  const countries = selected.filter(c => !c.catalogOnly);
  if (!countries.length) { showCopyToast("בחר מדינה קודם"); return ""; }

  const parts = [`ref=${encodeURIComponent(REFERRAL_CODE)}`];
  if (cartSettings.emptyCart) parts.push("empty_cart=true");
  // Keep the s_country[] key literal (not %5B%5D-encoded) to match the site.
  countries.forEach(c => parts.push(`s_country[]=${encodeURIComponent(c.iso)}`));
  const iccid = normalizeIccid(topupState.customerIccid || "");
  if (iccid.length >= 18) parts.push(`your_iccid=${iccid}`);
  parts.push("s_tab=tab_topup");

  return `${TOPUP_LANDING_URL}?${parts.join("&")}`;
}

/** 📋 handler: copies the topup landing link (the "send to a worker" action). */
function copyTopupLandingLink() {
  const url = buildTopupLandingLink();
  if (url) copyText(url);
}

/** 🔗 handler: opens the topup landing link in a new tab. */
function openTopupLandingLink() {
  const url = buildTopupLandingLink();
  if (url) window.open(url, "_blank");
}

/* ---- Topup rows → order builder ---------------------------------------- */

/** Registers a visible topup row in the (per-render) package registry.
 *  Keys are deterministic: profile + zone/EUROPE + product + size +
 *  validity — so the same plan gets the same key on every render. */
function registerTopupPackage(pkg, result) {
  const profile = getTopupProfile();
  const selectedKey = profile.id === "psim_v1" ? "EUROPE" : String(getSelectedTopupZone() || "zone");
  const key = ["topup", profile.id, selectedKey, pkg.base?.productId || "noid", pkg.dataGB, pkg.validityDays]
    .join("_")
    .replace(/[^a-zA-Z0-9_\-]/g, "_");
  orderPackageRegistry[key] = { simType: "topup", pkg, result };
  return key;
}

/** Topup cart-line setter. In batch mode, ONE call adds a cart
 *  line per pasted ICCID; otherwise the single customer ICCID is used.
 *  ⚠ Business rule #5: cart lines are keyed `${packageKey}::${iccid}`,
 *  so the same package for different cards makes separate lines, while
 *  re-setting the same package+ICCID replaces in place. qty ≤ 0 removes
 *  the lines instead. Lines sort physical → esim → topup, then by ICCID
 *  and size, so multi-card orders read grouped. */
/** v7.27 (I2): the topup 🧺 INCREMENTS like every other basket — it used
 *  to SET the line from a per-row number input (removed with the input;
 *  a second click was a no-op and an emptied input silently deleted the
 *  line). Batch mode moves every pasted card's line in lockstep. */
function incrementTopupOrder(key) {
  if (topupState.batchMode) {
    const first = (topupState.batchIccids || [])[0];
    const existing = first ? (parseInt(getBuilderQtyForKey(`${key}::${first}`), 10) || 0) : 0;
    const ok = applyTopupOrderQuantity(key, existing + 1);
    if (ok) showCopyToast(`נוסף לסל 🧺 (×${existing + 1} לכל כרטיס)`);
    return;
  }
  const iccid = normalizeIccid(topupState.customerIccid || "");
  const existing = iccid.length >= 18 ? (parseInt(getBuilderQtyForKey(`${key}::${iccid}`), 10) || 0) : 0;
  if (applyTopupOrderQuantity(key, existing + 1)) showCopyToast("נוסף לסל 🧺");
}

/** Right-click −1 on the topup 🧺 (matches the catalog basket, I4). */
function decrementTopupOrder(key) {
  const first = topupState.batchMode
    ? (topupState.batchIccids || [])[0]
    : normalizeIccid(topupState.customerIccid || "");
  const existing = first && first.length >= 18 ? (parseInt(getBuilderQtyForKey(`${key}::${first}`), 10) || 0) : 0;
  if (!existing) { showCopyToast("הפריט לא בסל"); return; }
  // qty 0 hits the removal branch (which toasts "הוסר מהסל" itself).
  applyTopupOrderQuantity(key, existing - 1);
  if (existing - 1 > 0) showCopyToast("הוסר מהסל −1");
}

/** Sets a topup cart line to an EXPLICIT quantity. Used by the 🧺
 *  increment/decrement pair above and the v6.5 cart shortcut. Same batch /
 *  per-ICCID keying throughout. Returns true when a line was added. */
function applyTopupOrderQuantity(key, qty) {
  const entry = orderPackageRegistry[key];
  if (!entry) return false;

  const batch = topupState.batchMode ? (topupState.batchIccids || []) : null;
  if (topupState.batchMode && (!batch || !batch.length)) {
    showCopyToast("הדבק לפחות ICCID אחד תקין (18+ ספרות) בתיבת המרובה.", 3500);
    return false;
  }
  const iccids = batch && batch.length ? batch : [requireTopupCustomerIccid()].filter(Boolean);
  if (!iccids.length) return false;

  if (!Number.isFinite(qty) || qty <= 0) {
    const before = orderBuilderItems.length;
    iccids.forEach(ic => {
      orderBuilderItems = orderBuilderItems.filter(x => x.key !== `${key}::${ic}`);
    });
    // v7.26: a removal is never silent (the ≤0 path is also reachable
    // from an operator typo).
    if (orderBuilderItems.length < before) showCopyToast("הוסר מהסל");
    renderAll();
    return false;
  }

  const { pkg } = entry;
  const variant = chooseOrderVariant(pkg, qty);
  if (!variant.checkoutUrl) {
    showCopyToast("אין קישור טופאפ לחבילה הזו");
    return false;
  }

  const profile = getTopupProfile();
  iccids.forEach(customerIccid => {
    // Identify the cart line by package + ICCID, so topping up several
    // different cards with the same package adds separate lines.
    const itemKey = `${key}::${customerIccid}`;
    orderBuilderItems = orderBuilderItems.filter(x => x.key !== itemKey);
    const label = `טופאפ ${profile.short} · ${pkg.dataGB}GB / ${pkg.validityDays} ימים · ICCID ${shortIccid(customerIccid)} ×${qty}`;
    orderBuilderItems.push({
      key: itemKey,
      simType: "topup",
      topup: true,
      preserveUrl: true,     // order runner must NOT rewrite this URL as a base-plan URL
      dataGB: pkg.dataGB,
      validityDays: pkg.validityDays,
      qty,
      label,
      checkoutUrl: variant.checkoutUrl,
      productId: variant.productId,
      isBase: variant.isBase,
      isos: [],
      perUnitILS: variant.perUnitILS,
      totalILS: variant.totalILS,
      source: variant.source,
      topupIccid: customerIccid,
      topupProfile: profile.id,
      pricing: snapshotPkgPricing(pkg)
    });
  });

  sortOrderBuilderItems();

  renderAll();
  return true;
}


/* ═══════════════════════════════════════════════════════════════════════
   § 17. QUOTE SYSTEM
   The 💬 button copies a WhatsApp-ready quote rendered from an editable
   template (✎ opens the modal in the shell HTML). Placeholders:
   {country} {esim_plans} {psim_plans} {date}. Template persists per
   browser under QUOTE_TEMPLATE_KEY.
   ═══════════════════════════════════════════════════════════════════════ */

/** Renders the quote text for the current selection, or null when there
 *  is nothing to quote (no selection / no plans). Each SIM type's plan
 *  list is priced at its own highest per-type zone (three-zone model),
 *  lines in the customer copy format (rule #7). */
function buildQuoteText() {
  if (!selected.length) return null;

  const names = selected.map(c => c.name.he).join(", ");

  const esimZone = Math.max(...selected.map(c => c.esimZone ?? c.zone));
  const esimCountry = selected.find(c => (c.esimZone ?? c.zone) === esimZone);
  const esimPlans = esimCountry ? [...esimCountry.plans.esim].sort((a,b)=>a.dataGB-b.dataGB) : [];
  const esimLines = esimPlans.map(p => `${p.dataGB} גיגה – 30 ימים – ₪${Math.round(p.priceUSD * USD_TO_ILS)}`).join("\n");

  const physZone = Math.max(...selected.map(c => c.physicalZone ?? c.zone));
  const physCountry = selected.find(c => (c.physicalZone ?? c.zone) === physZone);
  const physPlans = physCountry ? [...physCountry.plans.physical].sort((a,b)=>a.dataGB-b.dataGB) : [];
  const physLines = physPlans.map(p => `${p.dataGB} גיגה – 30 ימים – ₪${p.priceILS}`).join("\n");

  if (!esimLines && !physLines) return null;

  return quoteTemplate
    .replaceAll("{country}", names)
    .replaceAll("{esim_plans}", esimLines || "—")
    .replaceAll("{psim_plans}", physLines || "—")
    .replaceAll("{date}", new Date().toLocaleDateString("he-IL"));
}

/** 💬 button handler: copies the rendered quote (with guard alerts). */
function copyQuote() {
  if (!selected.length) { showCopyToast("בחר מדינה קודם"); return; }
  const text = buildQuoteText();
  if (!text) { showCopyToast("אין חבילות זמינות ליעד הזה"); return; }
  copyText(text);
}

/** v7.29: the ONE template modal serves two templates (quote + pickup
 *  delivery message); this picks which one save/reset act on. */
let quoteEditorTarget = "quote";

/** Opens the template editor modal preloaded with the current template. */
function openQuoteEditor() {
  const modal = document.getElementById("quoteModal");
  const ta = document.getElementById("quoteTemplateArea");
  if (!modal || !ta) return;
  quoteEditorTarget = "quote";
  const title = document.getElementById("quoteModalTitle");
  const legend = document.getElementById("quoteModalLegend");
  if (title) title.textContent = "✎ תבנית הצעת מחיר";
  if (legend) legend.innerHTML = `משתני תבנית: <code>{country}</code> <code>{esim_plans}</code> <code>{psim_plans}</code> <code>{date}</code>`;
  ta.value = quoteTemplate;
  modal.classList.add("open");
}

/** v7.29: edits the pickup delivery-options message (✎ on the נקודות
 *  איסוף strip). Same modal, different target. */
function openPickupMsgEditor() {
  const modal = document.getElementById("quoteModal");
  const ta = document.getElementById("quoteTemplateArea");
  if (!modal || !ta) return;
  quoteEditorTarget = "pickupMsg";
  const title = document.getElementById("quoteModalTitle");
  const legend = document.getElementById("quoteModalLegend");
  if (title) title.textContent = "✎ תבנית הודעת משלוחים";
  if (legend) legend.innerHTML = `<code>{points}</code> = נקודות האיסוף שנמצאו בחיפוש; המספור שלהן ממשיך אוטומטית אחרי המספר האחרון שבתבנית`;
  ta.value = pickupMsgTemplate;
  modal.classList.add("open");
}

/** Closes the template editor modal (without saving). */
function closeQuoteEditor() {
  const modal = document.getElementById("quoteModal");
  if (modal) modal.classList.remove("open");
}

/** Saves the edited template (empty text falls back to the default).
 *  v7.29: dispatches on quoteEditorTarget. */
function saveQuoteTemplate() {
  const ta = document.getElementById("quoteTemplateArea");
  if (!ta) return;
  if (quoteEditorTarget === "pickupMsg") {
    pickupMsgTemplate = ta.value.trim() ? ta.value : DEFAULT_PICKUP_MSG_TEMPLATE;
    storageSet(PICKUP_MSG_TEMPLATE_KEY, pickupMsgTemplate);
    closeQuoteEditor();
    showCopyToast("✓ התבנית נשמרה");
    renderAll(); // an open results card refreshes its message payload
    return;
  }
  quoteTemplate = ta.value.trim() ? ta.value : DEFAULT_QUOTE_TEMPLATE;
  storageSet(QUOTE_TEMPLATE_KEY, quoteTemplate);
  closeQuoteEditor();
  showCopyToast("✓ התבנית נשמרה");
}

/** Resets the open editor's template to its shipped default (v7.29:
 *  dispatches on quoteEditorTarget). */
function resetQuoteTemplate() {
  const ta = document.getElementById("quoteTemplateArea");
  if (quoteEditorTarget === "pickupMsg") {
    pickupMsgTemplate = DEFAULT_PICKUP_MSG_TEMPLATE;
    if (ta) ta.value = pickupMsgTemplate;
    storageSet(PICKUP_MSG_TEMPLATE_KEY, pickupMsgTemplate);
    return;
  }
  quoteTemplate = DEFAULT_QUOTE_TEMPLATE;
  if (ta) ta.value = quoteTemplate;
  storageSet(QUOTE_TEMPLATE_KEY, quoteTemplate);
}


/* ═══════════════════════════════════════════════════════════════════════
   § 18. RENDER FUNCTIONS
   One function per card/panel. All of them return HTML strings that
   renderAll() concatenates into #results. None of them mutate state
   (with one deliberate exception: rows register themselves in
   orderPackageRegistry so their qty controls work).

   Reminder: copy buttons embed their full payload in the onclick
   attribute (the copyText(JSON.stringify(...)) pattern). Harmless at
   runtime, but string-matching tests must scope assertions to the rows
   section, and very large copy payloads inflate the DOM.
   ═══════════════════════════════════════════════════════════════════════ */

/* ---- העתקות tab: credit reference cards ---------------------------------- */

/** One credit-conversion card ("קרדיט פיזי" / "ארנק קרדיט"): for each ₪
 *  denomination in the reference table, how many GB each selected country
 *  gets. The two cards were verbatim twins over different tables. */
function renderCreditCard(kind) {
  const cfg = kind === "physical"
    ? { table: PHYSICAL, title: "קרדיט פיזי", simplifyKey: "physicalCredit" }
    : { table: WALLET, title: "ארנק קרדיט", simplifyKey: "wallet" };
  const on = isSimplified(cfg.simplifyKey);

  let text = "";
  cfg.table.forEach(step => {
    text += `₪${step.ils}\n`;
    const rows = selected.map(c => {
      const raw = gb(step.usd, c.credit_price_per_gb);
      return { name: c.name.he, gb: parseFloat(on ? applySimplify(raw) : raw.toFixed(1)) };
    });
    rows.sort((a, b) => b.gb - a.gb);
    rows.forEach(r => { text += `${r.name} = ${r.gb} גיגה\n`; });
    text += `\n`;
  });

  return `
    <div class="block">
      <div class="block-tools">
        <h3>${cfg.title}</h3>
        <div class="block-actions">
          ${simplifyToggle(cfg.simplifyKey)}
          <button class="copy-btn ${refEdit[kind] ? 'is-on' : ''}" onclick="toggleRefEdit('${kind}')" title="ערוך את מדרגות ה-$/₪">✎</button>
          <button class="copy-btn" onclick="copySection(this)" title="העתק">📋 העתק</button>
        </div>
      </div>
      ${refEdit[kind] ? renderRefEditor(kind) : ""}
      <pre>${text}</pre>
    </div>
  `;
}
function renderPhysical() { return renderCreditCard("physical"); }
function renderWallet() { return renderCreditCard("wallet"); }

/** "מחיר לגיגה (קרדיט)" card: each selected country's USD price per GB,
 *  cheapest first. */
function renderCreditPricing() {
  let text = "מחיר לפי גיגה (קרדיט)\n";

  let rows = selected.map(c => ({
    name:c.name.he,
    price:c.credit_price_per_gb
  }));

  rows.sort((a,b)=>a.price-b.price);

  rows.forEach(r=>{
    text += `${r.name} = $${r.price}\n`;
  });

  return `
    <div class="block">
      <div class="block-tools">
        <h3>מחיר לגיגה (קרדיט)</h3>
        <div class="block-actions">
          <button class="copy-btn" onclick="copySection(this)" title="העתק">📋 העתק</button>
        </div>
      </div>
      <pre>${text}</pre>
    </div>
  `;
}

/* ---- העתקות tab: "cheaper countries" list (v6.7) --------------------------
   Given the selection, list EVERY country whose credit price-per-GB is the
   same as, or cheaper than, the selection's most-expensive country — grouped
   by region (the client-ready format). The threshold is the MAX per-GB price
   among the selected countries, so "everywhere at least as cheap as my
   priciest pick". */

/** The region-grouped text of all countries at/below the selection's price
 *  threshold (the copy payload — pure region list, no header). "" when the
 *  selection has no usable price. */
function cheaperCountriesText() {
  if (!selected.length) return "";
  const threshold = Math.max(...selected.map(c => Number(c.credit_price_per_gb) || 0));
  if (!(threshold > 0)) return "";
  // catalogOnly pseudo-countries carry a null price — Number(null) is 0, which
  // would sneak them all in below any threshold. They are not comparable.
  const cheaper = data.filter(c => !c.catalogOnly && Number(c.credit_price_per_gb) > 0 && Number(c.credit_price_per_gb) <= threshold);
  return formatCountriesByRegion(cheaper);
}

/** The "cheaper countries" card for the העתקות tab: a region-grouped list of
 *  every destination at or below the selection's price-per-GB, with a copy
 *  button. The card header carries the context (reference country + price +
 *  count); the COPIED text is the bare region list, ready to send to a
 *  customer. Renders nothing without a usable selection. */
function renderCheaperCountries() {
  if (!selected.length) return "";
  const threshold = Math.max(...selected.map(c => Number(c.credit_price_per_gb) || 0));
  if (!(threshold > 0)) return "";
  // catalogOnly pseudo-countries carry a null price — Number(null) is 0, which
  // would sneak them all in below any threshold. They are not comparable.
  const cheaper = data.filter(c => !c.catalogOnly && Number(c.credit_price_per_gb) > 0 && Number(c.credit_price_per_gb) <= threshold);
  const refCountry = selected.find(c => Number(c.credit_price_per_gb) === threshold) || selected[0];
  const per5USD = round2(threshold * 5);
  const text = cheaperCountriesText();

  return `
    <div class="block cheaper-card">
      <div class="block-tools">
        <h3>🌍 מדינות באותו מחיר או זול יותר <span class="zone-pill">${cheaper.length} יעדים</span></h3>
        <div class="block-actions">
          <button class="copy-btn" onclick='copyText(${escapeHtml(JSON.stringify(text))})' title="העתק את רשימת המדינות (מסודר לפי אזור)">📋 העתק רשימה</button>
        </div>
      </div>
      <div class="cheaper-sub">ביחס ל‑<b>${escapeHtml(refCountry.name.he)}</b> — עד $${threshold} לגיגה (כ‑$${per5USD} ל‑5GB). כל המדינות שמחירן לגיגה שווה או זול יותר, מסודרות לפי אזור.</div>
      <pre class="cheaper-list">${escapeHtml(text)}</pre>
    </div>
  `;
}

/** "סכום מותאם" card: how many GB the typed $ amount buys per country.
 *  Renders nothing until the top-bar $ input has a value. */
function renderCustomAmount() {
  const input = document.getElementById("customAmount");

  if (!input.value || !selected.length) return "";

  const usd = parseFloat(input.value);
  if (isNaN(usd)) return "";

  const on = isSimplified('custom');
  let text = `$${usd}\n`;

  let rows = selected.map(c => {
    const raw = usd / c.credit_price_per_gb;
    return {
      name: c.name.he,
      gb: on ? applySimplify(raw) : parseFloat(raw.toFixed(1))
    };
  });

  rows.sort((a,b)=>b.gb-a.gb);

  rows.forEach(r=>{
    text += `${r.name} = ${r.gb} גיגה\n`;
  });

  return `
    <div class="block">
      <div class="block-tools">
        <h3>סכום מותאם ($${usd})</h3>
        <div class="block-actions">
          ${simplifyToggle('custom')}
          <button class="copy-btn" onclick="copySection(this)" title="העתק">📋 העתק</button>
        </div>
      </div>
      <pre>${text}</pre>
    </div>
  `;
}

/* ---- v7.31: cellular networks per destination ---------------------------
   The get-countries response carries each country's local networks
   ({network_name, is4G, is5G}); boot parses them onto c.networks. This
   card lists them for the SELECTED destinations with customer-format
   copies — the answer to "אילו רשתות הסים תופס ב-X?". */

/** Badge text for one network: "4G/5G", "4G", "5G", or "" (neither). */
function networkGenBadge(n) {
  return [n.is4G ? "4G" : "", n.is5G ? "5G" : ""].filter(Boolean).join("/");
}

/** One customer-facing BLOCK (v7.32 — operator: a list is less annoying):
 *    רשתות סלולר בצרפת:
 *    Bouygues France (4G/5G)
 *    Orange France (4G/5G)               */
function countryNetworksLine(c) {
  const parts = (c.networks || []).map(n => {
    const g = networkGenBadge(n);
    return g ? `${n.network_name} (${g})` : n.network_name;
  });
  return parts.length ? `רשתות סלולר ב${c.name.he}:\n${parts.join("\n")}` : "";
}

/** The העתק הכל payload: one block per selected country that has data,
 *  blank line between countries. */
function allNetworksText() {
  return selected.map(countryNetworksLine).filter(Boolean).join("\n\n");
}

/** The רשתות סלולר card on the העתקות tab. Countries without network
 *  data (shop-only pseudo-countries) say so — never skipped silently. */
function renderCellularProviders() {
  if (!selected.length) return "";
  const sections = selected.map(c => {
    const nets = c.networks || [];
    if (!nets.length) {
      return `
      <div class="net-country">
        <div class="net-country-head"><b>${escapeHtml(c.name.he)}</b></div>
        <div class="net-line">אין נתוני רשתות ליעד הזה</div>
      </div>`;
    }
    const lines = nets.map(n => {
      const g = networkGenBadge(n);
      return `<div class="net-line">${escapeHtml(n.network_name)}${g ? ` <span class="net-gen">${g}</span>` : ""}</div>`;
    }).join("");
    return `
      <div class="net-country">
        <div class="net-country-head"><b>${escapeHtml(c.name.he)}</b>
          <button class="lk-copy oa-copy" data-copy="${escapeHtml(countryNetworksLine(c))}" title="העתק את רשימת הרשתות ללקוח">📋</button>
        </div>
        ${lines}
      </div>`;
  }).join("");
  const all = allNetworksText();
  return `
    <div class="block">
      <div class="block-tools">
        <h3>📡 רשתות סלולר</h3>
        <div class="block-actions">
          ${all ? `<button class="copy-btn oa-copy" data-copy="${escapeHtml(all)}" title="העתק את רשתות כל היעדים שנבחרו — שורה לכל יעד">📋 העתק הכל</button>` : ""}
        </div>
      </div>
      ${sections}
    </div>
  `;
}

/* ---- גיגהבוסט tab: quick-order cards -------------------------------------- */

/** The copy-list header (v6.14). Instead of a bare "ל-44 יעדים", it NAMES the
 *  selected countries — "חבילות סים פיזי לגרמניה, אוסטריה, צ'כיה, ועוד 41
 *  יעדים:" — so the customer sees the destinations that matter to them, then a
 *  count of the rest of the zone. Falls back to the bare count when nothing is
 *  selected. `destCount` is the zone's total destination count. */
function planListTitle(simTypeHe, destCount) {
  const names = selected.map(c => c.name.he).filter(Boolean);
  if (!names.length) return `חבילות ${simTypeHe} ל-${destCount} יעדים:`;
  const MAX_NAMED = 4;
  const shown = names.slice(0, MAX_NAMED);
  const rest = Math.max(0, destCount - shown.length);
  const tail = rest > 0 ? `, ועוד ${rest} יעדים` : "";
  return `חבילות ${simTypeHe} ל${shown.join(", ")}${tail}:`;
}

/** The self-serve "buy your own plans" link, rendered INSIDE a gigaboost card
 *  (v6.14 — moved in from the old shared strip). One product-page link for the
 *  card's SIM type, covering all selected countries; the customer picks a size
 *  on the site. */
function renderCardBuyLink(type) {
  if (!selected.length) return "";
  const url = buildProductPageLink(type);
  if (!url) return "";
  const names = selected.map(c => c.name.he).join(", ");
  return `
    <div class="card-buy-link">
      <span class="chooser-type">🔗 קישור לרכישה עצמית${names ? " — " + escapeHtml(names) : ""}</span>
      <button class="oa-copy" onclick='copyText(${escapeHtml(JSON.stringify(url))})' title="העתק קישור לדף המוצר">📋 העתק</button>
    </div>`;
}

/** One gigaboost quick-order card, parameterized by SIM type. The two cards
 *  (eSIM / physical) were verbatim twins for 20+ versions; everything that
 *  differs sits in the small `cfg` table. Priced at the selection's highest
 *  per-type zone (three-zone model); simplify hides the odd 1/7GB sizes.
 *  ⚠ The 📋 העתק הכל text format ("X גיגה – 30 ימים – ₪Y" under a
 *  destination-count title) is customer-facing — do not restyle it. */
function renderGigaboostCard(type) {
  if (!selected.length) return "";
  const cfg = type === "esim"
    ? { zoneOf: c => c.esimZone ?? c.zone, plansOf: c => c.plans.esim,
        copyILS: p => Math.round(p.priceUSD * USD_TO_ILS),
        showILS: p => (p.priceUSD * USD_TO_ILS).toFixed(0),
        he: "סים וירטואלי", h3: "eSIM", simplifyKey: "esimPlans" }
    : { zoneOf: c => c.physicalZone ?? c.zone, plansOf: c => c.plans.physical,
        copyILS: p => p.priceILS,
        showILS: p => String(p.priceILS),
        he: "סים פיזי", h3: "סים פיזי", simplifyKey: "physicalPlans" };

  const highestZone = Math.max(...selected.map(cfg.zoneOf));
  const country = selected.find(c => cfg.zoneOf(c) === highestZone);
  if (!country) return "";

  let plans = [...cfg.plansOf(country)].sort((a, b) => a.dataGB - b.dataGB);
  if (isSimplified(cfg.simplifyKey)) {
    plans = plans.filter(p => p.dataGB !== 1 && p.dataGB !== 7);
  }

  const destCount = countriesCoveredByZone(type, highestZone).length;
  let copyTextValue = `${planListTitle(cfg.he, destCount)}\n`;
  plans.forEach(p => { copyTextValue += `${p.dataGB} גיגה – 30 ימים – ₪${cfg.copyILS(p)}\n`; });

  // v7.10: a "30 ימים" column (operator request — make the validity clear).
  // Gigaboost plans are all 30-day plans (the copy text says so too).
  // ⚠ FIXED-track row: the kbd wrapper span always renders, even when the
  // hint is "" (digit mode past position 9), so children match tracks.
  const buttons = plans.map((p, i) => `
    <div class="order-row">
      <span class="order-gb">${p.dataGB}GB</span>
      <span class="order-days">30 ימים</span>
      <span class="order-price">₪${cfg.showILS(p)}</span>
      <span class="order-kbd">${renderPlanShortcutHint(type, p.dataGB, i + 1)}</span>
      <button class="oa-copy" onclick="copyOrderLink('${type}', ${p.dataGB})" title="העתק קישור הזמנה ללוח">📋</button>
    </div>
  `).join("");

  return `
    <div class="block">
      <div class="block-tools">
        <h3>הזמנה מהירה — ${cfg.h3} - גיגהבוסט <span class="zone-pill">אזור ${highestZone}</span></h3>
        <div class="block-actions">
          ${simplifyToggle(cfg.simplifyKey)}
          <button class="copy-btn" onclick="copyZoneCountriesForType('${type}', ${highestZone})" title="העתק את כל המדינות באזור, מסודרות לפי יבשת — לשליחה ללקוח">📋 מדינות</button>
          <button class="copy-btn" onclick="copyQuote()" title="העתק הצעת מחיר מלאה (eSIM + פיזי) מוכנה לוואטסאפ">💬 הצעה</button>
          <button class="copy-btn" onclick="openQuoteEditor()" title="ערוך את תבנית ההצעה">✎</button>
          <button class="copy-btn" onclick='copyText(${escapeHtml(JSON.stringify(copyTextValue))})' title="העתק את כל רשימת המחירים">📋 העתק הכל</button>
        </div>
      </div>
      ${renderCardBuyLink(type)}
      ${renderCopyLegend([type])}
      <div class="plan-orders grid">${buttons}</div>
    </div>
  `;
}
function renderEsimPlans() { return renderGigaboostCard("esim"); }
function renderPhysicalPlans() { return renderGigaboostCard("physical"); }

/** The amber mixed-zones note: explains that purchase cards price at the
 *  highest zone while credit tables still show every selected country.

function renderZoneNote() {
  if (!hasMixedZones()) return "";

  const highestZone = getHighestZone();
  const zonesList = [...new Set(selected.map(c => c.zone))].sort((a,b)=>a-b).join(", ");

  return `

      <span class="zone-note-badge">אזור ${highestZone}</span>
      <span class="zone-note-text">
        בחרת מדינות מאזורים שונים (${zonesList}). חבילות הרכישה (eSIM / פיזי / מחירים חדשים) מתומחרות לפי <b>אזור ${highestZone}</b> — האזור הגבוה שמכסה את כל היעדים, וקישורי ההזמנה כוללים את כל המדינות שנבחרו.
        טבלאות הקרדיט למטה ממשיכות להציג את <b>כל</b> המדינות שבחרת.

/* ---- קיצורים tab: keyboard-shortcut reference ------------------------------ */

/** The קיצורים (shortcuts) tab. Three parts:
 *    1. a static reference of every keyboard shortcut (the copy rows reflect
 *       the LIVE config, so they always read like the operator's own keys);
 *    2. the CONFIGURATION panel — input mode (type-GB vs quick-digit),
 *       modifier, eSIM/physical leader keys, numpad-only — all persisted;
 *    3. a LIVE plan map (gigaboost eSIM + physical for the current selection),
 *       showing what each shortcut copies.
 *  Keep this in sync with the § 20 keydown handler. */
function renderShortcutsPanel() {
  const esimCombo = shortcutComboLabel(shortcutConfig.esimKey);
  const physCombo = shortcutComboLabel(shortcutConfig.physicalKey);
  const searchMod = MODIFIER_LABELS[shortcutConfig.searchModifier] || shortcutConfig.searchModifier;
  const searchCombo = `${searchMod} + ${leaderKeyLabel(shortcutConfig.searchKey)}`;
  const fieldMode = shortcutConfig.inputMode === "field";
  // What the operator does AFTER the combo, phrased for the current mode.
  const stepHint = fieldMode ? "גודל (GB)" : (shortcutConfig.numpadOnly ? "1–9 (לוח נומרי)" : "1–9");

  // --- 1. Static reference (copy/cart/search rows mirror the live config) ---
  const copyDesc = fieldMode
    ? "העתקת קישור תוכנית לפי גודל שתקליד — של הלשונית הפעילה"
    : "העתקת קישור התוכנית ה‑N של הלשונית הפעילה";
  // Cart rows differ by input mode (field = Shift+Enter in the popup; digit =
  // Shift+digit). Cart-add works on בסיסי / טופאפ only (גיגהבוסט = direct link).
  const cartRows = fieldMode
    ? [
        ["Shift+Enter", "בשדה הגודל: הוספת התוכנית לעגלה (Enter רגיל מעתיק)"],
        ["Shift+Enter ×2", "בשדה ריק מיד אחרי הוספה: ריקון העגלה"],
      ]
    : [
        [`Shift + ${stepHint}`, "אחרי הפעלה: הוספת התוכנית לעגלה (במקום העתקה)"],
      ];
  const shortcuts = [
    [TAB_IDS.length <= 9 ? "1 – " + TAB_IDS.length : "1–9 ו־0", "מעבר בין הלשוניות: " + TAB_IDS.map(id => TAB_LABELS[id]).join(" · ")],
    [searchCombo, "מיקוד תיבת החיפוש למעלה"],
    [`${searchCombo} ×2`, "לחיצה כפולה: איפוס כל המדינות שנבחרו (מיידי)"],
    ["/", "מיקוד בתיבת החיפוש"],
    ["Enter", "בתיבת החיפוש — בחירת המדינה הראשונה בתוצאות"],
    ["?", "פתיחת לשונית הקיצורים (המסך הזה)"],
    [`${esimCombo} → ${stepHint}`, `eSIM: ${copyDesc}`],
    [`${physCombo} → ${stepHint}`, `סים פיזי: ${copyDesc}`],
    ...cartRows,
    ["Esc", fieldMode ? "סגירת שדה ההקלדה" : "ביטול קיצור העתקה שהופעל (לפני הקשת מספר)"],
  ];
  const rows = shortcuts
    .map(([k, d]) => `<div class="sc-row"><kbd class="sc-key">${escapeHtml(k)}</kbd><span class="sc-desc">${escapeHtml(d)}</span></div>`)
    .join("");

  // --- 2. Configuration panel ---------------------------------------------
  const modifierOptions = Object.entries(MODIFIER_LABELS)
    .map(([v, l]) => `<option value="${escapeHtml(v)}" ${shortcutConfig.modifier === v ? "selected" : ""}>${escapeHtml(l)}</option>`)
    .join("");
  const esimCapLabel = capturingBinding === "esim" ? "הקש מקש…" : leaderKeyLabel(shortcutConfig.esimKey);
  const physCapLabel = capturingBinding === "physical" ? "הקש מקש…" : leaderKeyLabel(shortcutConfig.physicalKey);
  const searchCapLabel = capturingBinding === "search" ? "הקש מקש…" : leaderKeyLabel(shortcutConfig.searchKey);
  const searchModifierOptions = Object.entries(MODIFIER_LABELS)
    .map(([v, l]) => `<option value="${escapeHtml(v)}" ${shortcutConfig.searchModifier === v ? "selected" : ""}>${escapeHtml(l)}</option>`)
    .join("");
  const inputModeRadios = Object.entries(INPUT_MODE_LABELS)
    .map(([v, l]) => `<label class="sc-radio-label"><input type="radio" name="scInputMode" value="${escapeHtml(v)}" ${shortcutConfig.inputMode === v ? "checked" : ""} onchange="setShortcutInputMode('${escapeHtml(v)}')">${escapeHtml(l)}</label>`)
    .join("");

  // The numpad-only option only affects the quick-digit mode; hide it in field mode.
  const numpadRow = fieldMode ? "" : `
      <div class="sc-config-row">
        <label class="sc-checkbox-label">
          <input type="checkbox" ${shortcutConfig.numpadOnly ? "checked" : ""} onchange="setShortcutNumpadOnly(this.checked)">
          הגבל את הספרה ללוח הנומרי בלבד (Numpad 1–9)
        </label>
      </div>`;

  const config = `
    <div class="sc-config">
      <h4 class="sc-subhead">⚙️ הגדרת הקיצורים</h4>
      <p class="sc-note">בחר איך לבחור תוכנית אחרי ההפעלה, את מקש ההפעלה (מודיפייר), ואת מקשי ה‑eSIM והסים הפיזי. השינויים נשמרים אוטומטית בדפדפן הזה. אחרי לחיצה על "הקש מקש…" — הקש מקש כלשהו כדי לקבוע אותו (Esc לביטול).</p>
      <div class="sc-config-row">
        <span class="sc-config-label">בחירת תוכנית</span>
        <span class="sc-radio-group">${inputModeRadios}</span>
      </div>
      <div class="sc-config-row">
        <span class="sc-config-label">מקש הפעלה</span>
        <select class="sc-config-select" onchange="setShortcutModifier(this.value)">${modifierOptions}</select>
      </div>
      <div class="sc-config-row">
        <span class="sc-config-label">מקש eSIM</span>
        <button class="sc-capture-btn ${capturingBinding === 'esim' ? 'is-capturing' : ''}" onclick="beginCaptureShortcutKey('esim')">${escapeHtml(esimCapLabel)}</button>
        <span class="sc-combo-preview">${escapeHtml(esimCombo)} → ${escapeHtml(stepHint)}</span>
      </div>
      <div class="sc-config-row">
        <span class="sc-config-label">מקש סים פיזי</span>
        <button class="sc-capture-btn ${capturingBinding === 'physical' ? 'is-capturing' : ''}" onclick="beginCaptureShortcutKey('physical')">${escapeHtml(physCapLabel)}</button>
        <span class="sc-combo-preview">${escapeHtml(physCombo)} → ${escapeHtml(stepHint)}</span>
      </div>
      ${numpadRow}
      <div class="sc-config-row">
        <span class="sc-config-label">חיפוש מדינה</span>
        <select class="sc-config-select" onchange="setSearchModifier(this.value)">${searchModifierOptions}</select>
        <button class="sc-capture-btn ${capturingBinding === 'search' ? 'is-capturing' : ''}" onclick="beginCaptureShortcutKey('search')">${escapeHtml(searchCapLabel)}</button>
        <span class="sc-combo-preview">${escapeHtml(searchCombo)} · לחיצה כפולה מאפסת מדינות</span>
      </div>
      <div class="sc-config-row">
        <button class="sc-reset-btn" onclick="resetShortcutConfig()">↺ אפס לברירת מחדל</button>
      </div>
    </div>
  `;

  // --- 3. Live plan map (gigaboost, as the representative example) ---------
  // In field mode show EVERY size (you can type any); in digit mode show the
  // first 9 shown plans (a single digit can't reach past 9).
  const buildMap = (simType, combo) => {
    const plans = fieldMode
      ? shortcutGigaboostPlans(simType, { all: true })
      : shortcutGigaboostPlans(simType).slice(0, 9);
    if (!selected.length) return `<div class="global-empty">בחר מדינה כדי לראות את המיפוי.</div>`;
    if (!plans.length) return `<div class="global-empty">אין תוכניות ${simType === "esim" ? "eSIM" : "פיזי"} ליעד הנבחר.</div>`;
    return plans
      .map((p, i) => {
        const token = fieldMode ? p.gb : (i + 1);
        return `<div class="sc-map"><kbd class="sc-key">${escapeHtml(combo)} → ${escapeHtml(String(token))}</kbd><span>${escapeHtml(p.label)}</span></div>`;
      })
      .join("");
  };

  const methodNote = fieldMode
    ? `שיטת ההפעלה: הקש ${escapeHtml(esimCombo)} (או ${escapeHtml(physCombo)}), ייפתח שדה קטן — הקלד את הגודל בג׳יגה (למשל 25) ולחץ Enter. כך אפשר להעתיק כל גודל, כולל 2GB / 25GB / 50GB. Esc סוגר.`
    : `שיטת ההפעלה: הקש ${escapeHtml(esimCombo)} (או ${escapeHtml(physCombo)}) ואז מספר ${escapeHtml(stepHint)}. אפשר גם להחזיק את מקש ההפעלה לחוץ ולהקיש את שני המקשים ברצף. Esc מבטל.`;

  return `
    <div class="block shortcuts-card">
      <div class="block-tools"><h3>⌨️ קיצורי מקלדת</h3></div>
      <div class="sc-list">${rows}</div>
      ${config}
      <h4 class="sc-subhead">מיפוי חי — דוגמה מלשונית גיגהבוסט</h4>
      <h5 class="sc-map-head">eSIM — ${escapeHtml(esimCombo)}</h5>
      <div class="sc-maplist">${buildMap("esim", esimCombo)}</div>
      <h5 class="sc-map-head">סים פיזי — ${escapeHtml(physCombo)}</h5>
      <div class="sc-maplist">${buildMap("physical", physCombo)}</div>
      <p class="sc-note">
        ${methodNote}
        הקיצור מעתיק מהלשונית הפעילה — גיגהבוסט מעתיק תוכנית גיגהבוסט, בסיסי מעתיק בסיסי, וטופאפ מעתיק טופאפ (בטופאפ סוג הסים נקבע לפי בורר הגרסה, לכן שני המקשים מעתיקים את אותה התוכנית).
      </p>
      <p class="sc-note">
        🛒 <b>עגלה:</b> ${fieldMode ? "בשדה הגודל — <b>Shift+Enter</b> מוסיף את התוכנית לעגלה (כל לחיצה +1). מיד אחרי הוספה, <b>Shift+Enter</b> נוסף בשדה ריק מרוקן את העגלה." : "אחרי הפעלה — <b>Shift+ספרה</b> מוסיף את התוכנית לעגלה (במקום להעתיק)."}
        הוספה לעגלה עובדת בלשוניות <b>בסיסי</b> ו‑<b>טופאפ</b> בלבד (גיגהבוסט הוא קישור ישיר, ללא עגלה). בטופאפ נדרש ICCID לקוח.
        🔎 <b>חיפוש:</b> <b>${escapeHtml(searchCombo)}</b> ממקד את תיבת החיפוש (אפשר לחפש גם לפי קוד ISO — DE=גרמניה, GR=יוון); לחיצה כפולה מאפסת את כל המדינות שנבחרו.
      </p>
    </div>
  `;
}

/* ---- תוכניות בסיסי tab: manual-site comparison cards ----------------------- */

/** The purchase controls for one manual-site row: a "יחיד" (base) link
 *  group, the best-deal link group when one exists, and the qty/🧺
 *  control feeding the order builder. Base links carry the top-bar
 *  quantity; deal links are left untouched (buildCheckoutUrl with
 *  isBase=false adds no quantity), so they keep the quantity=N the deal
 *  URL already carries — a pair is the same product at quantity=2. */
function renderGlobalPurchaseLinks(pkg, isos, simType) {
  const bestDeal = getBestDeal(pkg);
  const key = registerOrderPackage(simType, pkg, isos);

  // v7.9: the deal chip is GONE (operator request) — one group per row.
  // The qty pill opens a Shift+Q-style popup (openLinkQtyPopup); when the
  // typed quantity EXACTLY matches the deal's, the copied link swaps to
  // the deal URL, so typing 2 still gets the pair PRICE (the deal is a
  // different add-to-cart id — a plain quantity=2 would charge 2× base).
  // Deal url/qty ride on the group as data-* for that swap.
  const baseUrl = pkg.base?.checkoutUrl;
  const initialQty = Number(cartSettings.quantity) > 0 ? Number(cartSettings.quantity) : 1;
  const dealAttrs = bestDeal
    ? ` data-lg-deal-url="${escapeHtml(bestDeal.checkoutUrl)}" data-lg-deal-qty="${Number(bestDeal.quantity) || 2}"`
    : "";
  const baseGroup = baseUrl ? `
      <span class="link-group" data-lg-key="${escapeHtml(key)}" data-lg-url="${escapeHtml(baseUrl)}" data-lg-isos="${escapeHtml(isos.join("|"))}"${dealAttrs}>
        <button class="lg-qty-btn" title="כמות סימים בקישור — לחיצה פותחת חלונית הקלדה${bestDeal ? ` · הקלדת ${bestDeal.quantity} נותנת את מחיר הדיל (₪${bestDeal.perUnitILS} לסים)` : ""}"><b>${initialQty}</b></button>
        <button class="lk-copy oa-copy" data-copy="${escapeHtml(buildCheckoutUrl(baseUrl, true, isos))}" title="העתק קישור הזמנה ללוח">📋</button>
      </span>
    ` : "";

  // v7.3: no quantity field — every 🧺 click adds one more copy (the count
  // bubble shows how many are in the basket; the cart popup adjusts/removes).
  const lineQty = (orderBuilderItems.find(x => x.key === key) || { qty: 0 }).qty;
  const basketBtn = `
    <button class="oa-basket ob-add" data-pkg-key="${escapeHtml(key)}" onclick="incrementPackageOrder('${key}')" title="לחיצה מוסיפה עותק לסל; לחיצה ימנית מפחיתה">🧺${lineQty ? `<b>${lineQty}</b>` : ""}</button>`;

  return `<div class="global-links purchase-actions">${baseGroup}${basketBtn}</div>`;
}

/** The price rows of one SIM-type column: plan text + old-API compare
 *  badge (+ deal tooltip) + the purchase controls. Rows where the site
 *  beats the old API get the green "is-cheaper" treatment. */
function renderGlobalPlanRows(country, simType, displayPackages, isos, simplifyOn = false, slotsOverride = null) {
  // The basic tab's copy shortcut targets eSIM / physical (map the scan's
  // "physical_sim" to the shortcut's "physical"). Index → digit-mode position.
  const hintType = simType === "esim" ? "esim" : "physical";

  // v6.18: render fixed CANONICAL slots (missing sizes → red "לא קיים" row).
  // v6.20: the SLOT LIST is shared by BOTH columns (slotsOverride), so the two
  // SIM-type columns render the exact same GB rows in the same order — that,
  // plus one row per slot and a uniform row height, keeps them aligned.
  let slots = slotsOverride;
  if (!slots) {
    const simplifiedHidden = simplifyOn ? new Set([1, 7]) : new Set();
    const presentSizes = displayPackages.map(p => Number(p.dataGB));
    slots = Array.from(new Set([...CANONICAL_PLAN_GBS, ...presentSizes]))
      .filter(gb => !simplifiedHidden.has(gb))
      .sort((a, b) => a - b);
  }

  const byGb = {};
  [...displayPackages]
    .sort((a, b) => (a.dataGB - b.dataGB) || (b.validityDays - a.validityDays))
    .forEach(pkg => { (byGb[Number(pkg.dataGB)] ||= []).push(pkg); });

  let presentIdx = 0; // 1-based position among PRESENT plans (digit-mode badge)
  return slots.map(gb => {
    const pkg = byGb[gb] && byGb[gb][0]; // ONE row per slot → columns stay aligned
    if (!pkg) {
      // Missing size → red "does not exist" row (same geometry as a real row).
      return `
      <div class="global-line is-missing" title="החבילה הזו לא קיימת ליעד/סוג הזה">
        <span class="global-line-text">${gb} גיגה – לא קיים</span>
        <span class="global-missing-pad"></span>
      </div>`;
    }
    presentIdx++;
    const oldPrice = getOldComparablePriceILS(country, simType, pkg.dataGB);
    const bestPrice = pkg.bestPerUnitILS || pkg.base?.perUnitILS;
    const cheaper = oldPrice && bestPrice && bestPrice < oldPrice;
    const mark = comparePriceMark(bestPrice, oldPrice);
    const rowClass = cheaper ? "global-line is-cheaper" : "global-line";

    // v7.8: gigaboost-style ledger cells instead of one text sentence
    // (v7.9: the days moved out of the size cell into their OWN column).
    // ⚠ .global-line is a FIXED-track grid — every real row emits exactly
    // these 6 children (empty spans included), or children wrap (§ 2 rule).
    return `
      <div class="${rowClass}">
        <span class="gl-size">${pkg.dataGB}GB</span>
        <span class="gl-days">${pkg.validityDays} ימים</span>
        <span class="gl-price">₪${pkg.base.totalILS}</span>
        <span class="gl-mark">${mark}</span>
        <span class="gl-kbd">${renderPlanShortcutHint(hintType, pkg.dataGB, presentIdx)}</span>
        ${renderGlobalPurchaseLinks(pkg, isos, simType)}
      </div>`;
  }).join("");
}

/** One SIM-type CARD (pSIM or eSIM) of the בסיסי tab — v7.22: its own
 *  gigaboost-shaped card (h3 + zone pill, per-card toolbar with the
 *  simplify toggle / 📋 מדינות / 📋 העתק הכל, its own copy legend),
 *  exactly like the two הזמנה מהירה cards. The operator: "Separate the
 *  pSim & eSim into INDIVIDUAL CARDS… follow the same color schema of
 *  gigaboost."
 *  ⚠ v5.9: everything here comes from the operative country's OWN direct
 *  scan — the site's real answer. The zone LABEL is the site's product_zone
 *  (scan.zone), the SAME source as the prices/links below it, so the title
 *  and the prices can never disagree. `country` is the operative (highest
 *  real-zone) selected country for this SIM type; it also drives the
 *  old-API comparison badges. Shows its own loading / error / empty state
 *  so one lagging SIM type doesn't blank the whole tab. */
function renderGlobalSimColumn(simType, country, isos, loading, simplifyOn, sharedSlots = null, simplifyKey = "") {
  const scan = manualScanFor(country, simType);
  const typeZone = scan && scan.zone != null ? scan.zone : "—";
  const shortType = simType === "esim" ? "esim" : "physical";
  const typeHe = simType === "esim" ? "eSIM" : "סים פיזי";

  let body;
  let copyButton = "";
  let countriesButton = "";
  if (!scan) {
    // Distinguish "still fetching" from "scanned but this SIM type errored".
    const entry = country && manualByIso[country.iso];
    const err = entry && entry.errors && entry.errors.find(e => e.simType === simType || e.simType === "all");
    body = loading
      ? `<div class="global-empty">טוען מחירים…</div>`
      : err
        ? `<div class="global-error-text">שגיאת API: ${escapeHtml(err.message)} — לחץ 🔄 רענן לניסיון חוזר</div>`
        : `<div class="global-empty">אין חבילות ${typeHe} ליעד הזה.</div>`;
  } else {
    const destCount = countriesCoveredByZone(shortType, typeZone).length;
    const displayPackages = getDisplayGlobalPackages(scan.packages || [], simplifyOn);
    const listText = formatGlobalPlanListText(displayPackages);
    const copyTextValue = listText
      ? `חבילות ${simType === "esim" ? "סים וירטואלי" : "סים פיזי"} ל-${destCount} יעדים:\n${listText}`
      : "";
    copyButton = copyTextValue
      ? `<button class="copy-btn" onclick='copyText(${escapeHtml(JSON.stringify(copyTextValue))})' title="העתק את כל רשימת המחירים">📋 העתק הכל</button>`
      : "";
    countriesButton = Number.isFinite(Number(typeZone))
      ? `<button class="copy-btn" onclick="copyZoneCountriesForType('${shortType}', ${Number(typeZone)})" title="העתק את כל המדינות באזור, מסודרות לפי יבשת — לשליחה ללקוח">📋 מדינות</button>`
      : "";
    body = `<div class="global-lines">${renderGlobalPlanRows(country, simType, displayPackages, isos, simplifyOn, sharedSlots)}</div>`;
  }

  return `
    <div class="block global-sim-column">
      <div class="block-tools">
        <h3>בסיסי — ${typeHe} <span class="zone-pill">אזור ${typeZone}</span></h3>
        <div class="block-actions">
          ${simplifyKey ? simplifyToggle(simplifyKey) : ""}
          ${countriesButton}
          ${copyButton}
        </div>
      </div>
      ${renderCopyLegend([shortType], { cart: true })}
      ${body}
    </div>
  `;
}

/** The combined בסיסי card. The two columns are INDEPENDENT and each is
 *  driven by its own operative country's direct scan (they can differ — the
 *  Singapore case, where eSIM and physical resolve to different real zones).
 *  The header pill shows the general zone for continuity with the
 *  zone-countries copy button. */
function renderGlobalZoneBlock(ctx) {
  const { headerZone, isos, countryNames, esimCountry, physCountry, loading } = ctx;
  const key = 'global_' + headerZone;
  const on = isSimplified(key);

  // One price-change banner per DISTINCT operative country (its entry
  // carries movements across both SIM types).
  const bannerCountries = [];
  [physCountry, esimCountry].forEach(c => {
    if (c && !bannerCountries.some(x => x.iso === c.iso)) bannerCountries.push(c);
  });
  const banners = bannerCountries
    .map(c => renderPriceChangesBanner(manualByIso[c.iso], c.iso))
    .join("");

  // v6.20: the two columns share ONE slot list — the union of the canonical
  // sizes and every size EITHER column offers — so both render the same GB rows
  // in the same order (a size only one type has still gets a "לא קיים" row in
  // the other). With one row per slot + a uniform row height, the columns align.
  const physScan = physCountry ? manualScanFor(physCountry, "physical_sim") : null;
  const esimScan = esimCountry ? manualScanFor(esimCountry, "esim") : null;
  const simplifiedHidden = on ? new Set([1, 7]) : new Set();
  const presentAll = [
    ...(physScan ? getDisplayGlobalPackages(physScan.packages || [], on) : []),
    ...(esimScan ? getDisplayGlobalPackages(esimScan.packages || [], on) : [])
  ].map(p => Number(p.dataGB));
  const sharedSlots = Array.from(new Set([...CANONICAL_PLAN_GBS, ...presentAll]))
    .filter(gb => !simplifiedHidden.has(gb))
    .sort((a, b) => a - b);

  // v7.22: gigaboost's exact shape — a slim shared strip (title, selection,
  // zone-codes copy, refresh) above TWO INDIVIDUAL CARDS in the same 2-up
  // grid the gigaboost tab uses (.giga-cards). Each card carries its own
  // toolbar; the shared simplify state renders as a toggle on both.
  return `
    <div class="basic-strip">
      <div class="basic-strip-title">
        <h3>תוכניות בסיסי <span class="zone-pill">אזור ${headerZone}</span></h3>
        <span class="global-clean-subtitle">${escapeHtml(countryNames)}</span>
      </div>
      <div class="block-actions">
        <button class="copy-btn" onclick="copyZoneCountries(${headerZone})" title="העתק את כל קודי המדינות באזור ${headerZone} (מופרד בפסיק)">📋 כל מדינות האזור</button>
        <button class="copy-btn" onclick="refreshGlobalZone()" title="רענן מחירים מה‑API">🔄 רענן</button>
      </div>
    </div>
    ${banners}
    <div class="giga-cards basic-cards">
      ${renderGlobalSimColumn("physical_sim", physCountry, isos, loading, on, sharedSlots, key)}
      ${renderGlobalSimColumn("esim", esimCountry, isos, loading, on, sharedSlots, key)}
    </div>
  `;
}

/** The בסיסי tab's main card. Each SIM type is priced from the selection's
 *  operative country's DIRECT scan (the site's own answer). Before any scan
 *  lands, shows a loading / "load now" placeholder; once one lands the card
 *  renders and a lagging column shows its own loading state. */
function renderGlobalPlans() {
  if (!selected.length) return "";

  // v6.27: shop-catalog cards render for every selected country that has an
  // entry — and for catalog-ONLY countries they are the whole basic tab (no
  // site scan exists for them, so the zone block is skipped entirely).
  if (selected.every(c => c.catalogOnly)) return renderBasicShopCards();

  const headerZone = getHighestZone(); // general zone — header pill + copy
  const isos = selected.map(c => c.iso);
  const countryNames = selected.map(c => c.name.he).join(", ");
  const anyLoading = selected.some(c => manualLoading[c.iso]);
  const anyScanned = selected.some(c => manualByIso[c.iso]);

  if (!anyScanned) {
    const msg = anyLoading ? "טוען API חדש..." : "עוד לא נטען.";
    const action = anyLoading ? "" : `<button class="copy-btn" onclick="loadGlobalForSelected()">טען עכשיו</button>`;
    return `
      <div class="block global-loading-card">
        <h3>מחירים חדשים — אזור ${headerZone}</h3>
        <div class="global-clean-subtitle">${escapeHtml(countryNames)}</div>
        <p>${msg}</p>
        ${action}
      </div>
    ` + renderBasicShopCards();
  }

  // Operative country per SIM type = the scanned selected country with the
  // highest REAL product_zone for that type (covers all; prices are
  // consistent within a real zone). Falls back to an ERRORED country so
  // the column renders the scan error instead of "אין חבילות" (v7.26).
  const esimCountry = operativeOrErroredCountry("esim");
  const physCountry = operativeOrErroredCountry("physical_sim");

  return renderGlobalZoneBlock({
    headerZone, isos, countryNames, esimCountry, physCountry, loading: anyLoading
  }) + renderBasicShopCards();
}

            <button class="ob-incog-dl" onclick="downloadIncognitoInstaller()" title="מוריד giga-incognito-setup.reg — לחיצה כפולה עליו מתקינה את הפותחן (Chrome). אם Windows חוסם את הקובץ: קליק ימני → Properties → Unblock → OK, ואז שוב לחיצה כפולה. באישור הראשון של Chrome סמן 'תמיד לאפשר'.">⬇ קובץ התקנה</button>
