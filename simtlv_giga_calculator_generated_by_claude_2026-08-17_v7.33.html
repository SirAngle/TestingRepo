/* ── catalog tab state (not persisted — reference views) ───────────────── */
let dealsMode = "compare";        // compare | browse
let dealsSection = "countries";   // browse: countries | global | zones | unlimited | other
let dealsFilter = "";
let dealsOnly = "all";            // all | cheap | pricey | odd
const DEALS_PAGE = 24;            // cards per page (card sections)
const DEALS_PAGE_ROWS = 60;       // rows per page (flat sections)
let dealsLimit = DEALS_PAGE;

function setDealsMode(m) { dealsMode = m; dealsFilter = ""; dealsLimit = DEALS_PAGE; renderAll(); }
function setDealsSection(id) { dealsSection = id; dealsFilter = ""; dealsOnly = "all"; dealsLimit = DEALS_PAGE; renderAll(); }
function setDealsOnly(v) { dealsOnly = v; dealsLimit = DEALS_PAGE; renderAll(); }
function showMoreDeals() { dealsLimit += DEALS_PAGE; renderAll(); }

/** "הצג עוד" footer for a paged section (empty when everything is shown). */
function dealsMoreBar(shown, total, unit) {
  if (shown >= total) return "";
  return `<div class="deals-more">
      <button class="deals-morebtn" onclick="showMoreDeals()">הצג עוד (${shown} מתוך ${total} ${unit})</button>
    </div>`;
}

/** Debounced filter: the <input> keeps the typed text itself, so only the
 *  (expensive) full re-render is deferred; the caret is restored after. */
let __dealsFilterTimer = null;
function setDealsFilter(v) {
  dealsFilter = String(v || "");
  dealsLimit = DEALS_PAGE;
  clearTimeout(__dealsFilterTimer);
  __dealsFilterTimer = setTimeout(() => {
    renderAll();
    const el = document.getElementById("dealsSearch");
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 180);
}

/* ── joining the shop catalog to app countries ─────────────────────────── */
/** Hebrew names differ between the shop and the API ("דובאי (איחוד…)" vs
 *  "איחוד האמירויות הערביות") — compare stripped of niqqud/quotes/brackets,
 *  containment counts. */
function normHe(s) {
  return String(s || "")
    .replace(/[֑-ׇ]/g, "")
    .replace(/["'׳״()\[\]־–-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}
/** Shop↔API spelling bridges the containment match can't cover
 *  (normHe turns ארה״ב into "ארה ב", which shares nothing with
 *  ארצות הברית — so without the alias the shop's USA products spawned a
 *  phantom pseudo-USA next to the real one). */
const HE_NAME_ALIASES = { "ארה ב": "ארצות הברית" };
function canonHe(s) {
  const t = normHe(s);
  return HE_NAME_ALIASES[t] || t;
}
let __catalogIndex = null;
function catalogIndex() {
  if (__catalogIndex) return __catalogIndex;
  __catalogIndex = SPECIAL_CATALOG.countries.map(c => ({ c, n: canonHe(c.he) }));
  return __catalogIndex;
}
/** The catalog entry for an app country, or null (Germany: null on purpose —
 *  plain standard pricing is not in the catalog). */
function catalogEntryFor(country) {
  if (!country || !country.name) return null;
  const t = canonHe(country.name.he);
  if (!t) return null;
  const idx = catalogIndex();
  let hit = idx.find(e => e.n === t);
  if (!hit) hit = idx.find(e => e.n.includes(t) || t.includes(e.n));
  return hit ? hit.c : null;
}

/* ── the three price sources (per country + GB size) ───────────────────── */
/** LIVE manual-site price — the same packages the בסיסי tab prices from. */
function sitePriceFor(country, gb) {
  const scan = manualScanFor(country, "esim");
  if (!scan) return null;
  const pkg = (scan.packages || []).find(p => Number(p.dataGB) === Number(gb));
  if (!pkg || !pkg.base) return null;
  const deal = getBestDeal(pkg);
  return { price: Number(pkg.base.totalILS), url: pkg.base.checkoutUrl || "",
           deal: deal ? Number(deal.perUnitILS) : null, pkg };
}
/** Gigaboost price (country.plans.esim, USD → ILS). */
function gigaPriceFor(country, gb) {
  const p = getOldComparablePriceILS(country, "esim", gb);
  return p ? { price: Number(p) } : null;
}
/** Static shop-catalog price. */
function shopPriceFor(entry, gb) {
  if (!entry) return null;
  const s = entry.sizes.find(x => Number(x.gb) === Number(gb));
  return s ? { price: Number(s.p), id: s.id, slug: s.s, std: s.std, v: s.v, days: s.d } : null;
}

/* ── COMPARE mode: which option to offer the client ────────────────────── */
/** One country's three-way table (site | gigaboost | shop) — the cheapest
 *  available cell per size is marked green. Missing sources render "—"
 *  instead of hiding, so a gap can't silently bias the choice. */
function renderCompareCountry(country) {
  const entry = catalogEntryFor(country);
  const scan = manualScanFor(country, "esim");

  const sizes = new Set(CANONICAL_PLAN_GBS);
  (scan && scan.packages || []).forEach(p => sizes.add(Number(p.dataGB)));
  ((country.plans && country.plans.esim) || []).forEach(p => sizes.add(Number(p.dataGB)));
  (entry ? entry.sizes : []).forEach(s => sizes.add(Number(s.gb)));

  const rows = [...sizes].filter(n => n > 0).sort((a, b) => a - b).map(gb => {
    const site = sitePriceFor(country, gb);
    const giga = gigaPriceFor(country, gb);
    const shop = shopPriceFor(entry, gb);
    if (!site && !giga && !shop) return "";

    const cands = [];
    if (site) cands.push(["site", site.price]);
    if (giga) cands.push(["giga", giga.price]);
    if (shop) cands.push(["shop", shop.price]);
    const best = cands.length ? cands.slice().sort((a, b) => a[1] - b[1])[0][0] : null;

    const cell = (key, obj, extraHtml) => {
      if (!obj) return `<span class="cmp-cell is-none">—</span>`;
      return `<span class="cmp-cell${key === best ? " is-best" : ""}">₪${obj.price.toFixed(0)}${extraHtml || ""}</span>`;
    };

    const days = shop ? shop.days : 30;
    const actions = shop
      ? dealBuyButtons(shop.id, shop.slug, "", `${country.name.he} · ${gb}GB (חנות · eSIM)`, shop.price)
      : "";

    return `
      <div class="cmp-row">
        <span class="cmp-size">${gb}GB<small>${days} ימים</small></span>
        ${cell("site", site, site && site.deal ? `<small>זוג ₪${site.deal.toFixed(0)}</small>` : "")}
        ${cell("giga", giga)}
        ${cell("shop", shop, shop && shop.v > 0 ? `<small>‎-${shop.v}%</small>` : "")}
        <span class="cmp-actions">${actions}</span>
      </div>`;
  }).join("");

  const note = !scan
    ? `<span class="cmp-note">מחירי האתר עדיין נטענים (או שאין סריקה ליעד זה)</span>`
    : (!entry ? `<span class="cmp-note">אין מוצר ייעודי בחנות ליעד זה</span>` : "");

  return `
    <div class="block cmp-card">
      <div class="deal-head">
        <h3>${escapeHtml(country.name.he)} <small class="cmp-type">eSIM</small></h3>
        <div class="block-actions">
          ${note}
          <button class="copy-btn oa-copy" data-copy="${escapeHtml(compareCountryText(country))}" title="העתק את טבלת ההשוואה">📋 העתק השוואה</button>
        </div>
      </div>
      <div class="cmp-head">
        <span class="cmp-size">גודל</span>
        <span class="cmp-cell">אתר רגיל</span>
        <span class="cmp-cell">גיגהבוסט</span>
        <span class="cmp-cell">חנות</span>
        <span class="cmp-actions"></span>
      </div>
      <div class="cmp-rows">${rows}</div>
    </div>`;
}

/** One comparison row as text (the השוואה copy blob keeps being TEXT — it IS
 *  the explanation; row-level 📋 copies links like everywhere else). */
function compareRowText(country, gb) {
  const entry = catalogEntryFor(country);
  const site = sitePriceFor(country, gb), giga = gigaPriceFor(country, gb), shop = shopPriceFor(entry, gb);
  const parts = [];
  if (site) parts.push(`אתר ₪${site.price.toFixed(0)}`);
  if (giga) parts.push(`גיגהבוסט ₪${giga.price.toFixed(0)}`);
  if (shop) parts.push(`חנות ₪${shop.price.toFixed(0)}`);
  return `${country.name.he} ${gb}GB — ${parts.join(" · ")}`;
}
function compareCountryText(c) {
  const entry = catalogEntryFor(c);
  const sizes = new Set(CANONICAL_PLAN_GBS);
  (entry ? entry.sizes : []).forEach(s => sizes.add(Number(s.gb)));
  let out = `${c.name.he} — השוואת מחירים (eSIM):\n`;
  [...sizes].sort((a, b) => a - b).forEach(gb => {
    const t = compareRowText(c, gb);
    if (/₪/.test(t)) out += t + "\n";
  });
  return out.trim();
}
function renderDealsCompare() {
  if (!selected.length) {
    return `<div class="deals-none">בחר מדינה כדי להשוות בין מחיר האתר, גיגהבוסט והחנות.</div>`;
  }
  return `<div class="cmp-cards">${selected.map(renderCompareCountry).join("")}</div>`;
}

/* ── BROWSE mode: the raw shop catalog ─────────────────────────────────── */
/** Customer-facing line for one shop row (kept for the text-copy helpers). */
function specialDealLine(he, s) {
  const cmp = (s.v === null || s.v === undefined) ? "גודל חריג"
    : s.v > 0 ? `במקום ₪${Math.round(s.std)}, ‎-${s.v}%`
    : s.v < 0 ? `יקר מהתקן ₪${Math.round(s.std)} ב-${Math.abs(s.v)}%` : "מחיר תקן";
  return `${he} ${s.gb}GB · ${s.d} ימים – ₪${Math.round(s.p)} (${cmp})`;
}
/* (v7.26: copySpecialDealRow removed — dead since the v7.10 sweep that
   converted shop-row copies to data-copy delegation; nothing called it.) */
function renderDealsCountries() {
  const q = dealsFilter.trim();
  const keep = s => dealsOnly === "all" ? true
    : dealsOnly === "cheap" ? s.v > 0
    : dealsOnly === "pricey" ? s.v < 0
    : s.v === null;
  const list = SPECIAL_CATALOG.countries
    .map(c => ({ ...c, sizes: c.sizes.filter(keep) }))
    .filter(c => c.sizes.length && (!q || c.he.includes(q)));
  if (!list.length) return `<div class="deals-none">לא נמצאו תוצאות עבור הסינון הנוכחי.</div>`;

  const totalCountries = list.length;
  const totalRows = list.reduce((a, c) => a + c.sizes.length, 0);
  const page = list.slice(0, dealsLimit);

  const cards = page.map(c => {
    // v7.11: state the SIM type — country catalog plans are all eSIM (the
    // physical products live in the אחר/פיזי section, named as such).
    const rows = c.sizes.map(s => catalogRow(
      cellSize(`${s.gb}GB`, `${s.d} ימים · eSIM`),
      cellPrice(s.p, s.std),
      dealBadge(s.v),
      dealBuyButtons(s.id, s.s, "", `${c.he} · ${s.gb}GB (חנות · eSIM)`, s.p))).join("");
    const pill = c.best !== null && c.best > 0
      ? `<span class="deal-save">עד ‎-${c.best}%</span>`
      : (c.worst !== null && c.worst < 0 ? `<span class="deal-over">יקר מהתקן</span>` : `<span class="deal-odd">גודל חריג</span>`);
    return catalogCard(escapeHtml(c.he),
      pill + headCopyAll(catalogCartLinks(c.sizes), "העתק את כל קישורי העגלה של יעד זה"),
      rows);
  }).join("");

  return `<div class="deals-count">${totalCountries} יעדים · ${totalRows} חבילות</div>` +
    `<div class="deals-cards">${cards}</div>` +
    dealsMoreBar(page.length, totalCountries, "יעדים");
}

/** The Simtlv Global (P-tier) and zone-topup sections are the same shape:
 *  rows grouped into cards, each row size|price|topup-or-new|actions. The
 *  tier section has few cards but MANY rows, so it pages by a ROW budget;
 *  the zone section pages by cards. */
function renderGroupedRows(groups, titleOf, rowMeta, pageInfo) {
  const cards = groups.map(g => {
    if (!g.rows.length) return "";
    const body = g.rows.map(r => {
      const m = rowMeta(g, r);
      return catalogRow(
        cellSize(`${r.gb}GB`, m.sub),
        cellPrice(r.p),
        `<span class="${r.tu ? "deal-topup" : "deal-new"}">${r.tu ? "טעינה" : "חדש"}</span>`,
        dealBuyButtons(r.id, r.s, "", m.label, r.p));
    }).join("");
    return catalogCard(titleOf(g), headCount(g.rows.length, "חבילות"), body);
  }).join("");
  return cards
    ? `<div class="deals-cards">${cards}</div>` + pageInfo
    : `<div class="deals-none">אין תוצאות.</div>`;
}

function renderDealsGlobal() {
  const q = dealsFilter.trim().toLowerCase();
  const unit = u => u === "Y" ? "שנים" : u === "M" ? "חודשים" : "ימים";
  const byTier = {};
  SPECIAL_CATALOG.tier.forEach(r => (byTier[r.t] = byTier[r.t] || []).push(r));
  const budget = Math.max(DEALS_PAGE_ROWS, dealsLimit * 6);
  let usedRows = 0, totalRows = 0;
  const groups = Object.keys(byTier).map(Number).sort((a, b) => a - b).map(t => {
    let rows = byTier[t];
    if (q) rows = rows.filter(r => (`${r.gb}gb ${r.n}${unit(r.u)} p${t}`).toLowerCase().includes(q));
    totalRows += rows.length;
    const room = Math.max(0, budget - usedRows);
    rows = rows.slice(0, room);
    usedRows += rows.length;
    return { t, rows };
  });
  return renderGroupedRows(groups,
    g => g.t ? `אזור P${g.t}` : "ללא אזור",
    (g, r) => ({ sub: `${r.n} ${unit(r.u)}`,
                 label: `Simtlv Global ${r.gb}GB · ${r.n} ${unit(r.u)}${g.t ? ` · P${g.t}` : ""}${r.tu ? " · טעינה" : ""}` }),
    dealsMoreBar(usedRows, totalRows, "חבילות"));
}

function renderDealsZones() {
  const q = dealsFilter.trim().toLowerCase();
  const byZ = {};
  SPECIAL_CATALOG.zone.forEach(r => (byZ[r.z] = byZ[r.z] || []).push(r));
  const zones = Object.keys(byZ).map(Number).sort((a, b) => a - b);
  const zonePage = zones.slice(0, dealsLimit);
  const groups = zonePage.map(z => {
    let rows = byZ[z];
    if (q) rows = rows.filter(r => (`zone ${z} ${r.gb}gb`).toLowerCase().includes(q));
    return { z, rows };
  });
  return renderGroupedRows(groups,
    g => `Zone ${g.z}`,
    (g, r) => ({ sub: `${r.d} ימים`,
                 label: `SIMTLV Global Card ${r.gb}GB · ${r.d} ימים · Zone ${g.z}${r.tu ? " · טעינה" : ""}` }),
    dealsMoreBar(zonePage.length, zones.length, "אזורים"));
}

function renderDealsFlat(items, emptyMsg, title) {
  const q = dealsFilter.trim();
  const matched = q ? items.filter(i => i.n.includes(q)) : items;
  if (!matched.length) return `<div class="deals-none">${emptyMsg}</div>`;
  const limit = Math.max(DEALS_PAGE_ROWS, dealsLimit * 2);
  const page = matched.slice(0, limit);
  const rows = page.map(i => `
    <div class="deal-row deal-row--wide">
      <span class="deal-name">${escapeHtml(i.n)}</span>
      <span class="deal-price">₪${(+i.p).toFixed(0)}</span>
      ${dealBuyButtons(i.id, i.s, "", i.n, i.p)}
    </div>`).join("");
  // v7.27: the flat card was the ONLY card in the app with no header —
  // no title, no count, no card-level copy (F4).
  return catalogCard(title, headCount(matched.length, "פריטים") + headCopyAll(catalogCartLinks(page)), rows, "deal-card--wide") +
    dealsMoreBar(page.length, matched.length, "פריטים");
}

/* ── the T-Mobile tab: a MIRRORED pSIM/eSIM pair ───────────────────────── */
/** Per-day cost (null for custom); multi-packs divide by their SIM count. */
function tmPerDay(r) {
  return r.d && r.p ? Math.round((r.p / (r.pack || 1) / r.d) * 100) / 100 : null;
}
/** Every row lands in exactly one slot; the slot list is SHARED by both
 *  cards, so the two charts always have identical row counts and heights. */
function tmSlotKey(r) {
  if (r.pack > 1) return "pack";
  if (r.d) return "d" + r.d;
  return r.id ? "custom" : "payg";
}
function tmSlotLabel(k) {
  if (k === "pack") return "4× 30 ימים";
  if (k === "custom") return "חבילה בהתאמה אישית";
  if (k === "payg") return "Pay as you go — מעל 30 יום";
  return k.slice(1) + " ימים";
}

function renderTmobileMirroredCard(title, rows, slots, extra) {
  const by = {};
  rows.forEach(r => { by[tmSlotKey(r)] = r; });
  const perDays = rows.map(tmPerDay).filter(v => v !== null);
  const bestPerDay = perDays.length ? Math.min(...perDays) : null;

  const body = slots.map(k => {
    const r = by[k];
    if (!r) {
      return `<div class="deal-row is-missing" title="החבילה הזו לא קיימת בסוג הסים הזה">
          <span class="deal-missing">${tmSlotLabel(k)} – לא קיים</span>
        </div>`;
    }
    const pd = tmPerDay(r);
    const label = r.d
      ? `${title} · ${r.d} ימים${r.pack > 1 ? ` · ${r.pack} כרטיסים` : ""}`
      : `${title} · ${r.n || "חבילה בהתאמה אישית"}`;
    return catalogRow(
      r.d ? cellSize(String(r.d), `ימים${r.pack > 1 ? ` ×${r.pack}` : ""}`)
          : `<span class="deal-size"><small>${escapeHtml(r.n || "בהתאמה אישית")}</small></span>`,
      cellPrice(r.p),
      pd !== null
        ? `<span class="${pd === bestPerDay ? "deal-save" : "deal-same"}">₪${pd.toFixed(1)}/יום</span>`
        : `<span class="deal-odd">גמיש</span>`,
      dealBuyButtons(r.id, r.s, extra, label, r.p));
  }).join("");

  return catalogCard(escapeHtml(title),
    headCount(rows.length, "חבילות") + headCopyAll(catalogCartLinks(rows, extra)),
    body);
}

function renderTmobileTab() {
  const days = [...new Set([...TMOBILE.esim, ...TMOBILE.psim]
    .filter(r => r.d && !(r.pack > 1)).map(r => r.d))].sort((a, b) => a - b);
  const slots = [...days.map(d => "d" + d), "pack", "custom", "payg"];

    dealBuyButtons(r.id, r.s, TMOBILE_PSIM_EXTRA, `T-Mobile ארה״ב+קנדה+מקסיקו · ${r.d} ימים`, r.p))).join("");

  return `
    <div class="deals-intro">
      <h2>📶 T-Mobile — ארה״ב ללא הגבלה</h2>
      <p>גלישה ללא הגבלה לפי משך. שני הלוחות מראים את אותם משכים —
        משך שקיים רק בסוג סים אחד מסומן "לא קיים" בשני.
        🧺 מוסיף לסל ההזמנה; 📋 מעתיק את קישור העגלה · 📋 כל הקישורים שבכותרת מעתיק את כל קישורי הכרטיס.
        <br><span class="deals-note">קטלוג סטטי — מהסימניות ומייצוא החנות.</span></p>
    </div>
    <div class="tm-pair">
      ${renderTmobileMirroredCard("T-Mobile סים פיזי", TMOBILE.psim, slots, TMOBILE_PSIM_EXTRA)}
      ${renderTmobileMirroredCard("T-Mobile eSIM", TMOBILE.esim, slots, "")}
    </div>
    <div class="deals-cards">
      ${catalogCard("T-Mobile — ארה״ב + קנדה + מקסיקו (פיזי)",
        headCount(TMOBILE.canmex.length, "חבילות") + headCopyAll(catalogCartLinks(TMOBILE.canmex, TMOBILE_PSIM_EXTRA)),
        cm)}

/** Rough English name from a product slug ("faroe-islands-3gb-…" → "Faroe
 *  Islands"), so English typing matches too; falls back to Hebrew. */
function catalogEnglishName(entry) {
  for (const sz of entry.sizes) {
    const base = String(sz.s || "").replace(/^esim-/, "");
    const m = base.match(/^([a-z][a-z-]*[a-z])/i);
    if (m) {
      const t = m[1].replace(/-/g, " ")
        .replace(/\b(esim|e sim|days?|gb|and)\b/gi, " ")
        .replace(/\s+/g, " ").trim();
      if (t.length >= 3) return t.replace(/\b\w/g, ch => ch.toUpperCase());
    }
  }
  return entry.he;
}

/** Kept in their OWN array — pushing pseudo-countries into `data` corrupts
 *  everything that iterates the country model (regions, the cheaper list,
 *  counts). Only searchMatches reads this list; a selected pseudo-country
 *  carries catalogOnly:true, which the scan/topup/render paths all check. */
let CATALOG_PSEUDO = [];
function injectCatalogOnlyCountries() {
  try {
    const have = data.map(c => canonHe(c.name && c.name.he)).filter(Boolean);
    CATALOG_PSEUDO = [];
    SPECIAL_CATALOG.countries.forEach((entry, i) => {
      const t = canonHe(entry.he);
      if (!t) return;
      if (have.some(h => h === t || h.includes(t) || t.includes(h))) return;
      CATALOG_PSEUDO.push({
        iso: "#C" + i,
        catalogOnly: true,
        name: { en: catalogEnglishName(entry), he: entry.he },
        zone: null, esimZone: null, physicalZone: null,
        credit_price_per_gb: null,
        plans: { esim: [], physical: [] }
      });
    });
    __catalogIndex = null;
    return CATALOG_PSEUDO.length;
  } catch (e) { return 0; }
}

/* v7.11: the shop card must EARN its screen space (operator request). The
   reference price per size is the cheapest of בסיסי (live scan) and
   גיגהבוסט — the two channels the workers actually sell from. A shop plan
   "wins" when it is STRICTLY cheaper than that reference, or when the
   regular channels don't offer the size at all (a shop-unique offer —
   e.g. the catalog-only destinations, which have no other source). A card
   with no winning plan renders COLLAPSED (title + note only), expandable
   on demand. All country catalog plans are eSIM — 582/585 slugs say so
   and the 3 stragglers were verified on the live product pages
   (2026-08-17) — so the card and its rows say eSIM explicitly. */
let basicShopOpen = {}; // iso → operator expanded a collapsed card (session-only)
function toggleBasicShopCard(iso) {
  basicShopOpen[iso] = !basicShopOpen[iso];
  renderAll();
}

/** Cheapest regular-channel price for a size: min(בסיסי, גיגהבוסט), or
 *  null when neither offers the size. */
function bestRefPriceFor(country, gb) {
  const site = sitePriceFor(country, gb);
  const giga = gigaPriceFor(country, gb);
  const cands = [];
  if (site) cands.push(site.price);
  if (giga) cands.push(giga.price);
  return cands.length ? Math.min(...cands) : null;
}

/** Shop-vs-reference badge: green when the shop beats בסיסי/גיגהבוסט, red
 *  when pricier, = when identical, purple when the size is shop-unique. */
function shopVsRefBadge(p, ref) {
  if (ref === null) return `<span class="deal-odd" title="אין מחיר בסיסי/גיגהבוסט לגודל הזה — הצעה ייחודית של החנות">ייחודי</span>`;
  const pct = Math.round(Math.abs(ref - p) / ref * 100);
  if (p < ref) return `<span class="deal-save" title="זול מהזול מבין בסיסי/גיגהבוסט (₪${Math.round(ref)})">‎-${pct}%</span>`;
  if (p > ref) return `<span class="deal-over" title="יקר מהזול מבין בסיסי/גיגהבוסט (₪${Math.round(ref)})">‎+${pct}%</span>`;
  return `<span class="deal-same" title="זהה לזול מבין בסיסי/גיגהבוסט">=</span>`;
}

/** The "🛒 מהחנות" card for one selected country on the BASIC tab. */
function renderBasicShopCard(country) {
  const entry = catalogEntryFor(country);
  if (!entry) return "";
  const assessed = entry.sizes.map(s => {
    const ref = bestRefPriceFor(country, Number(s.gb));
    return { s, ref, win: ref === null || Number(s.p) < ref };
  });
  const relevant = assessed.some(x => x.win);
  const title = `🛒 מהחנות — ${escapeHtml(country.name.he)} · eSIM`;

  if (!relevant && !basicShopOpen[country.iso]) {
    return `

      <div class="deal-head">
        <h3>${title}</h3>

        </div>

  const rows = assessed.map(({ s, ref }) => catalogRow(
    cellSize(`${s.gb}GB`, `${s.d} ימים · eSIM`),
    cellPrice(s.p, null),
    shopVsRefBadge(Number(s.p), ref),
    dealBuyButtons(s.id, s.s, "", `${entry.he} · ${s.gb}GB (חנות · eSIM)`, s.p))).join("");
  // v7.10: העתק הכל copies the customer-ready PRICE SHEET in the standard
  // copy format (business rule #7 — en-dash, ₪ before the number), not the
  // raw cart-link dump. Per-row 📋 still copies that row's cart link.
  const sheet = `חבילות מהחנות — ${country.name.he} (eSIM):\n`
    + entry.sizes.filter(s => s.p !== null && s.p !== undefined)
        .map(s => `${s.gb} גיגה – ${s.d} ימים – ₪${s.p}`).join("\n");
  const closeBtn = relevant ? "" :
    `<button class="copy-btn" onclick="toggleBasicShopCard('${country.iso}')" title="קפל בחזרה">סגור</button>`;
  return catalogCard(title,
    headCount(entry.sizes.length, "חבילות") + headCopyAll(sheet, "העתק מחירון ללקוח", "📋 העתק הכל") + closeBtn,
    rows, "basic-shop-card");
}

/** Builds the direct payment link for one gigaboost plan.
 *  @param {"esim"|"physical"} type
 *  @param {number} gbAmount - plan size in GB
 *  The plan id is looked up in the HIGHEST per-type zone among the
 *  selection (three-zone model); the URL covers ALL selected countries.
 *  Falls back to a legacy constructed URL if the API entry had no id. */
function buildOrderLink(type, gbAmount) {
  if (!selected.length) return "";

  const zoneField = type === "esim" ? "esimZone" : "physicalZone";
  const topZone = Math.max(...selected.map(c => c[zoneField] ?? c.zone));
  const country = selected.find(c => (c[zoneField] ?? c.zone) === topZone) || selected[0];
  const plan = (country.plans[type === "esim" ? "esim" : "physical"] || [])
    .find(p => Number(p.dataGB) === Number(gbAmount));
  const isoSegment = encodeURIComponent(selected.map(c => c.iso).join(","));

  if (plan && plan.appId !== undefined && plan.appId !== null && plan.appId !== "") {
    const kind = type === "esim" ? "esim" : "physical";
    return `${CUSTOMER_APP_BASE}/${isoSegment}/${gbAmount}gb/${kind}/${plan.appId}?ref=${REFERRAL_CODE}`;
  }

  // Fallback: old constructed link if the API entry had no id.
  const base = type === "esim"
    ? `${CUSTOMER_APP_BASE}/esim/package`
    : `${CUSTOMER_APP_BASE}/physicalsim/package`;
  return `${base}?ref=${REFERRAL_CODE}&countries=${isoSegment}&plan=${gbAmount}gb`;
}

/* (v7.26: buildGenericAppLink removed — its own comment admitted it was
   kept "for reference"; no caller existed.) */

/** v6.6 — the "product page" link the top גיגהבוסט strip should use: a
 *  package page for the selection, e.g.
 *    {app}/physicalsim/package?countries=GR,DE,US&plan=5gb&ref=…
 *  ALWAYS this constructed form (never the id-based per-plan link), so the
 *  general link is stable regardless of whether a plan carries an appId.
 *  `type` is "esim" | "physical"; the default plan size is a general starting
 *  point — the customer can still switch size on the product page. */
const GIGABOOST_GENERAL_DEFAULT_GB = 5;
function buildProductPageLink(type, gbAmount = GIGABOOST_GENERAL_DEFAULT_GB) {
  if (!selected.length) return "";
  const isoSegment = encodeURIComponent(selected.map(c => c.iso).join(","));
  const path = type === "esim" ? "esim/package" : "physicalsim/package";
  const planParam = gbAmount ? `&plan=${gbAmount}gb` : "";
  return `${CUSTOMER_APP_BASE}/${path}?countries=${isoSegment}${planParam}&ref=${REFERRAL_CODE}`;
}

/** 📋 button handler: copies a plan's direct payment link. */
function copyOrderLink(type, gbAmount) {
  const url = buildOrderLink(type, gbAmount);
  if (url) copyText(url);
}

/** v7.26: guard for URLs the app will NAVIGATE to (the order runner and
 *  the standalone portal, whose items arrive base64-encoded in the query
 *  string and are therefore attacker-craftable). Only the shop's own
 *  https origin may be executed; everything else is rejected before any
 *  window.open / location.href. Checkout lives on the apex — no
 *  subdomain wildcard on purpose. */
function isAllowedCheckoutUrl(u) {
  try {
    const p = new URL(String(u));
    return p.protocol === "https:" &&
      (p.hostname === "simtlv.co.il" || p.hostname === "www.simtlv.co.il");
  } catch (e) {
    return false;
  }
}

/** Adapts a WooCommerce checkout URL to the current selection/settings:
 *    * fly_countries ← the given ISOs, SORTED and pipe-joined (KH|VN);
 *    * ref ← REFERRAL_CODE (always);
 *    * empty_cart ← forceEmptyCart (defaults to the cart toggle);
 *    * quantity — an explicit quantityOverride always wins (the order
 *      runner passes the item's quantity, incl. a deal's, v6.12); with no
 *      override, base links use the cart's quantity and deal links are
 *      left untouched, keeping any quantity=N the deal URL already carries.
 *      (A "pair" is the SAME product added quantity=2 — verified live —
 *      NOT a pre-bundled 2-pack; see buildOrderItemUrl.)
 *  Pipes are kept literal (KH|VN, not KH%7CVN) to match the real site.
 *  Falls back to string surgery when the URL doesn't parse. */
function buildCheckoutUrl(url, isBase, isos, quantityOverride = null, forceEmptyCart = cartSettings.emptyCart) {
  if (!url) return url;
  const list = (isos || []).slice().sort();   // stable order, e.g. KH|VN

  const explicitQty = quantityOverride !== null && quantityOverride !== undefined;
  const qty = explicitQty
    ? parseInt(quantityOverride, 10)
    : (isBase ? parseInt(cartSettings.quantity || 1, 10) : null);

  try {
    const u = new URL(url);
    if (list.length) u.searchParams.set("fly_countries", list.join("|"));
    u.searchParams.set("ref", REFERRAL_CODE);

    if (forceEmptyCart) u.searchParams.set("empty_cart", "true");
    else u.searchParams.delete("empty_cart");

    if (Number.isFinite(qty) && qty > 1) u.searchParams.set("quantity", String(qty));
    else if (explicitQty || isBase) u.searchParams.set("quantity", "1");

    // Keep the pipe readable like the real site (KH|VN, not KH%7CVN).
    return u.toString().replace(/%7C/gi, "|");
  } catch (e) {
    let out = String(url);
    if (list.length) {
      out = out.includes("fly_countries=")
        ? out.replace(/fly_countries=[^&]*/g, `fly_countries=${list.join("|")}`)
        : out + (out.includes("?") ? "&" : "?") + `fly_countries=${list.join("|")}`;
    }
    const joiner = out.includes("?") ? "&" : "?";
    if (forceEmptyCart && !out.includes("empty_cart=")) out += `${joiner}empty_cart=true`;
    return out;
  }
}

/** Extracts the interesting query parameters from a checkout URL (used
 *  by the topup meta line to show what a catalog's links carry). */
function getCheckoutUrlInfo(url) {
  const out = { flyCountries: "", productZone: "", physicalSimType: "", countryNameInRegion: "" };
  if (!url) return out;
  try {
    const u = new URL(url);
    out.flyCountries = u.searchParams.get("fly_countries") || "";
    out.productZone = u.searchParams.get("product_zone") || "";
    out.physicalSimType = u.searchParams.get("physical_sim_type") || "";
    out.countryNameInRegion = u.searchParams.get("country_name_in_region") || "";
  } catch (e) { /* malformed URL → empty meta, caller renders what it has */ }
  return out;
}

/* ---- Price comparison + display formatting ------------------------------ */

/** The old app-link API's price (in ILS) for the same size/type, used to
 *  badge manual-site rows as cheaper/dearer. eSIM prices arrive in USD
 *  and are converted at the current rate. Null when no comparable plan. */
function getOldComparablePriceILS(country, simType, dataGB) {
  if (!country) return null;

  if (simType === "esim") {
    const match = (country.plans.esim || []).find(p => Number(p.dataGB) === Number(dataGB));
    return match ? round2(Number(match.priceUSD) * USD_TO_ILS) : null;
  }

  if (simType === "physical_sim") {
    const match = (country.plans.physical || []).find(p => Number(p.dataGB) === Number(dataGB));
    return match ? Number(match.priceILS) : null;
  }

  return null;
}

/** Price badge markup comparing manual-site vs old-API price
 *  (green = site cheaper, red = site dearer, gray = same). */
/** Site-vs-gigaboost badge, catalog style: green ‎-N% cheaper, red ‎+N%
 *  pricier. The old verbose sentence lives on in the tooltip. */
function comparePriceMark(newPrice, oldPrice) {
  if (!oldPrice || !newPrice) return "";
  const diff = round2(newPrice - oldPrice);
  if (diff === 0) return `<span class="deal-same" title="זהה למחיר גיגהבוסט">=</span>`;
  const pct = Math.round(Math.abs(diff) / oldPrice * 100);
  return diff < 0
    ? `<span class="deal-save" title="האתר זול ב-₪${Math.abs(diff)} לכל סים">‎-${pct}%</span>`
    : `<span class="deal-over" title="האתר יקר ב-₪${diff} לכל סים">‎+${pct}%</span>`;
}

/** The cheapest deal of a package by per-unit price (ties broken by
 *  smaller quantity). Null when the package has no deals. */
function getBestDeal(pkg) {
  if (!pkg.deals || !pkg.deals.length) return null;
  return [...pkg.deals].sort((a,b) => a.perUnitILS - b.perUnitILS || a.quantity - b.quantity)[0];
}

/** Short human label for a deal ("זוג ב99 ש"ח" / "3 יח׳ ב…"). */
function formatDealShort(deal) {
  if (!deal) return "";
  if (deal.quantity === 2) return `זוג ב${deal.totalILS} ש"ח`;
  return `${deal.quantity} יח׳ ב${deal.totalILS} ש"ח`;
}

/** v7.26: a self-contained pricing snapshot stored ON a cart line, so the
 *  cart's −/+ stepper can re-run chooseOrderVariant after the per-render
 *  registry is gone — and across session restores (orderBuilderItems is
 *  persisted). Carries exactly the fields chooseOrderVariant and
 *  formatDealShort read; shaped like a pkg so it feeds chooseOrderVariant
 *  directly. */
function snapshotPkgPricing(pkg) {
  return {
    base: {
      checkoutUrl: pkg.base?.checkoutUrl,
      productId: pkg.base?.productId,
      perUnitILS: pkg.base?.perUnitILS
    },
    deals: (pkg.deals || []).map(d => ({
      quantity: d.quantity,
      checkoutUrl: d.checkoutUrl,
      productId: d.productId,
      perUnitILS: d.perUnitILS,
      totalILS: d.totalILS
    }))
  };
}

/** One copy-format line for a manual-site package.
 *  ⚠ Customer-facing copy format (business rule #7): en-dash separators,
 *  ₪ before the number. Deals append in the same dash style. */
function formatGlobalPlanLine(pkg) {
  const parts = [
    `${pkg.dataGB} גיגה`,
    `${pkg.validityDays} ימים`,
    `₪${pkg.base.totalILS}`
  ];

  const bestDeal = getBestDeal(pkg);
  if (bestDeal) {
    parts.push(`${formatDealShort(bestDeal)} (₪${bestDeal.perUnitILS} לכרטיס)`);
  }

  return parts.join(" – ");
}

/** Copy-format text block for a whole package list (one line each). */
function formatGlobalPlanListText(displayPackages) {
  return (displayPackages || []).map(formatGlobalPlanLine).join("\n");
}


/* ═══════════════════════════════════════════════════════════════════════
   § 14. ORDER BUILDER (the cart)
   Rows on the בסיסי / topup cards add lines to the generated order (🧺
   increments; the qty pill edits the COPY link only). One order can mix physical SIMs, eSIMs,
   and topups. Lines are SELF-CONTAINED (own resolved checkoutUrl) so
   they survive re-renders and tab switches — see orderPackageRegistry's
   lifetime warning in § 2.
   ═══════════════════════════════════════════════════════════════════════ */

/** Registers a visible package row so its qty control can find the
 *  package later. Key = type + product + size + validity (sanitized).
 *  Registry entries live only until the next render. */
function registerOrderPackage(simType, pkg, isos) {
  const key = [simType, pkg.base?.productId || "noid", pkg.dataGB, pkg.validityDays]
    .join("_")
    .replace(/[^a-zA-Z0-9_\-]/g, "_");
  orderPackageRegistry[key] = { simType, pkg, isos: (isos || []).slice().sort() };
  return key;
}

/** The quantity already in the cart for a registry key ("" when none) —
 *  used to prefill the row's qty input after re-renders. */
function getBuilderQtyForKey(key) {
  const item = orderBuilderItems.find(x => x.key === key);
  return item ? item.qty : "";
}

/** Picks how to order `qty` units of a package:
 *    * a deal whose quantity EXACTLY matches → use the bundle URL
 *      (cheapest such deal), flagged isBase:false / source:"deal";
 *    * otherwise → the base URL with a quantity multiplier.
 *  A deal is only picked when qty EXACTLY equals the deal size, so the
 *  item's quantity already equals the deal quantity (a pair = the same
 *  product at quantity=2 — see buildOrderItemUrl, v6.12). The isBase/source
 *  flags drive the price label and the display-link quantity handling. */
function chooseOrderVariant(pkg, qty) {
  const exactDeal = (pkg.deals || [])
    .filter(d => d.checkoutUrl && Number(d.quantity) === Number(qty))
    .sort((a,b) => a.perUnitILS - b.perUnitILS)[0];

  if (exactDeal) {
    return {
      isBase: false,
      source: "deal",
      checkoutUrl: exactDeal.checkoutUrl,
      productId: exactDeal.productId,
      perUnitILS: exactDeal.perUnitILS,
      totalILS: exactDeal.totalILS,
      sourceLabel: formatDealShort(exactDeal)
    };
  }

  return {
    isBase: true,
    source: "base",
    checkoutUrl: pkg.base?.checkoutUrl,
    productId: pkg.base?.productId,
    perUnitILS: pkg.base?.perUnitILS,
    totalILS: round2((pkg.base?.perUnitILS || 0) * qty),
    sourceLabel: "מחיר יחיד לפי מספר"
  };
}

/** Sets a בסיסי package's cart line to an EXPLICIT quantity (qty ≤ 0
 *  removes it). Fed by 🧺 increments and the cart shortcuts. Lines are
 *  sorted physical-first, then by size. */
/** 🧺 on a basic row: each click adds one more copy of that package to the
 *  basket. Pair-deal pricing still applies automatically — the line is
 *  re-priced by chooseOrderVariant at every new quantity. */
function incrementPackageOrder(key) {
  const item = orderBuilderItems.find(x => x.key === key);
  if (applyPackageOrderQuantity(key, (item ? item.qty : 0) + 1)) {
    showCopyToast("נוסף לסל 🧺");
  }
}
/** Right-click on a basic row's 🧺: one copy less (removes the line at 0). */
function decrementPackageOrder(key) {
  const item = orderBuilderItems.find(x => x.key === key);
  if (!item) return;
  applyPackageOrderQuantity(key, item.qty - 1);
  showCopyToast("הוסר מהסל −1");
}

/** Sets a basic package's cart line to an EXPLICIT quantity. Called by the
 *  🧺 increment button (v7.3) and the v6.5 cart shortcut. Replaces that
 *  package's cart line (qty ≤ 0 just removes it). Returns true when a line
 *  was added. */
function applyPackageOrderQuantity(key, qty) {
  const entry = orderPackageRegistry[key];
  if (!entry) return false;

  orderBuilderItems = orderBuilderItems.filter(x => x.key !== key);

  if (!Number.isFinite(qty) || qty <= 0) {
    renderAll();
    return false;
  }

  const { simType, pkg, isos } = entry;
  const variant = chooseOrderVariant(pkg, qty);

  if (!variant.checkoutUrl) {
    showCopyToast("אין קישור הזמנה לחבילה הזו");
    return false;
  }

  const label = `${simTypeHebrew(simType)} ${pkg.dataGB}GB ×${qty} · ${variant.perUnitILS}₪ ליח׳ · ${variant.sourceLabel}`;

  orderBuilderItems.push({
    key,
    simType,
    dataGB: pkg.dataGB,
    validityDays: pkg.validityDays,
    qty,
    label,
    checkoutUrl: variant.checkoutUrl,
    productId: variant.productId,
    isBase: variant.isBase,
    isos,
    perUnitILS: variant.perUnitILS,
    totalILS: variant.totalILS,
    source: variant.source,
    pricing: snapshotPkgPricing(pkg)
  });

  sortOrderBuilderItems();

  renderAll();
  return true;
}

/** One basket order for all item kinds: physical, eSIM, topup, catalog. */
function sortOrderBuilderItems() {
  const rank = { physical_sim: 1, esim: 2, topup: 3, catalog: 4 };
  orderBuilderItems.sort((a, b) =>
    ((rank[a.simType] || 9) - (rank[b.simType] || 9)) ||
    ((a.dataGB || 0) - (b.dataGB || 0)));
}

/** v6.28: the cart popup's −/+ stepper. Adjusts a line's quantity in place:
 *  totals recompute from the stored per-unit price, the ×N in the label is
 *  rewritten, and the runner URL follows automatically (it reads item.qty).
 *  Dropping to 0 removes the line. */
function bumpOrderBuilderItemQty(key, delta) {
  const item = orderBuilderItems.find(x => x.key === key);
  if (!item) return;
  const qty = (Number(item.qty) || 1) + (Number(delta) || 0);
  if (qty <= 0) { removeOrderBuilderItem(key); return; }
  item.qty = qty;
  if (item.pricing) {
    // v7.26: re-pick base-vs-deal for the new quantity, exactly like the
    // 🧺 path does — before this, + from 1→2 kept the base URL ×2 while
    // clicking 🧺 twice picked the pair-deal URL: same items, two
    // different prices. Lines from older sessions (no snapshot) keep the
    // plain arithmetic below.
    const variant = chooseOrderVariant(item.pricing, qty);
    item.checkoutUrl = variant.checkoutUrl;
    item.productId = variant.productId;
    item.isBase = variant.isBase;
    item.source = variant.source;
    item.perUnitILS = variant.perUnitILS;
    item.totalILS = variant.totalILS;
    item.label = item.label.replace(/· [\d.]+₪ ליח׳ · [^·]*$/,
      `· ${variant.perUnitILS}₪ ליח׳ · ${variant.sourceLabel}`);
  } else {
    const unit = Number(item.perUnitILS);
    if (Number.isFinite(unit)) item.totalILS = round2(unit * qty);
  }
  item.label = /×\d+/.test(item.label)
    ? item.label.replace(/×\d+/, "×" + qty)
    : item.label + " ×" + qty;
  renderAll();
}

/** Removes one cart line (the ✕ on a builder row). */
function removeOrderBuilderItem(key) {
  orderBuilderItems = orderBuilderItems.filter(x => x.key !== key);
  renderAll();
}

/** Empties the cart (the "נקה הכל" button — armed, see below). */
function clearOrderBuilder() {
  orderBuilderItems = [];
  renderAll();
}

/* v7.27 (I12): two-click ARMING for destructive buttons — the app's
   confirm idiom (the keyboard clears already work as press-twice; native
   confirm() stays out of the file). First activation arms the button
   (red "בטוח? לחץ שוב", auto-disarms after 2.5s); a second activation
   while armed runs the action. State survives re-renders like
   capturingBinding does. */
let armedDestructive = null;
let armedDestructiveTimer = null;

function armDestructive(kind, fn) {
  if (armedDestructive === kind) {
    clearTimeout(armedDestructiveTimer);
    armedDestructive = null;
    fn();
    renderAll();
    return;
  }
  armedDestructive = kind;
  clearTimeout(armedDestructiveTimer);
  armedDestructiveTimer = setTimeout(() => { armedDestructive = null; renderAll(); }, 2500);
  renderAll();
}

/* ---- Direct WooCommerce order creation (v6.8) -----------------------------
   Turn the cart into a WooCommerce REST order and create it via the operator's
   proxy endpoint, which returns a payment_url to send to the customer. The
   order is created as "pending" (unpaid) — the customer still pays via the
   returned link. Per the operator's choice, line items carry product_id +
   quantity + the cart meta ONLY (no forced total/subtotal) — WooCommerce /
   the SimTLV plugin re-prices the order. */

/** The FINAL checkout URL for one order item, applying the rules that
 *  keep multi-item orders correct:
 *    * quantity is ALWAYS the item's own quantity (v6.12). A "pair" deal
 *      is NOT a pre-bundled 2-pack product — verified live, both the eSIM
 *      (add-to-cart=68905&quantity=2) and physical (27855&quantity=2) pair
 *      deals are the SAME product as the single, with quantity=2 driving
 *      the "buy 2 for X" cart price. chooseOrderVariant only picks a deal
 *      when the requested qty EXACTLY equals the deal size, so item.qty
 *      already IS the deal quantity. The old "rule #1" clamped it to 1,
 *      which added only ONE SIM — the "2 items became 1" bug;
 *    * empty_cart: SINGLE-item orders still clear+add in one page load
 *      (isFirst && toggle). MULTI-item orders pass forceNoEmptyCart —
 *      the runner clears the cart ONCE up front as its own awaited step
 *      (v6.11), so NO add-to-cart carries empty_cart and a late-arriving
 *      clear can never wipe an item that was already added;
 *    * topup lines route through buildTopupCheckoutUrl with their OWN
 *      per-line ICCID (multi-card orders). */
function buildOrderItemUrl(item, index, opts = {}) {
  const isFirst = index === 0;
  const emptyCart = opts.forceNoEmptyCart ? false : (isFirst && cartSettings.emptyCart);
  // v6.12: the item's quantity IS the deal quantity for deals (a pair = the
  // same product with quantity=2), so pass it straight through — see above.
  const urlQty = item.qty;
  // v6.27: catalog basket lines carry a finished base URL (ref + add-to-cart
  // + product params) — append only the runner-level empty_cart + quantity.
  if (item.catalog) {
    let url = item.checkoutUrl;
    if (emptyCart) url += "&empty_cart=true";
    if (Number.isFinite(urlQty) && urlQty > 1) url += "&quantity=" + urlQty;
    return url;
  }
  if (item.preserveUrl || item.topup) {
    return buildTopupCheckoutUrl(item.checkoutUrl, urlQty, emptyCart, item.topupIccid || topupState.customerIccid || topupState.iccid || "");
  }
  return buildCheckoutUrl(item.checkoutUrl, item.isBase, item.isos || selected.map(c => c.iso), urlQty, emptyCart);
}

/** A bare "clear the cart" URL for the runner's up-front step (v6.11):
 *  the checkout page with empty_cart=true and the ref, but NO add-to-cart
 *  and none of an item's product params — so it only empties the cart and
 *  can't accidentally add anything. Derived from a real item's URL so the
 *  origin/path always match the live adds. */
function buildCartClearUrl(sampleUrl) {
  try {
    const u = new URL(sampleUrl);
    const clear = new URL(u.origin + u.pathname);
    clear.searchParams.set("empty_cart", "true");
    clear.searchParams.set("ref", REFERRAL_CODE);
    return clear.toString();
  } catch (e) {
    return `https://simtlv.co.il/checkout/?empty_cart=true&ref=${encodeURIComponent(REFERRAL_CODE)}`;
  }
}

/** v7.17: a product-free SESSION WARM-UP URL (the checkout page, no
 *  params) for multi-item runs with the empty-cart toggle OFF — the
 *  first navigation must only establish the site's session cookie, so
 *  no add ever rides a cold session (see the pacing note in § 2). */
function buildSessionWarmupUrl(sampleUrl) {
  try {
    const u = new URL(sampleUrl);
    return u.origin + u.pathname;
  } catch (e) {
    return "https://simtlv.co.il/checkout/";
  }
}

/* ---- Shareable generated-order link --------------------------------------
   The whole cart can be encoded into a URL: open it anywhere and the
   page boots straight into the standalone order portal (§15). */

/** Encodes a payload object as URL-safe base64 (UTF-8 safe, no padding). */
function encodeOrderPayload(payload) {
  const json = JSON.stringify(payload);
  const encoded = btoa(unescape(encodeURIComponent(json)));
  return encoded.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
}

/** Reverses encodeOrderPayload (restores padding, then decodes). */
function decodeOrderPayload(value) {
  const padded = String(value || "").replace(/-/g, "+").replace(/_/g, "/") + "===".slice((String(value || "").length + 3) % 4);
  return JSON.parse(decodeURIComponent(escape(atob(padded))));
}

/** The shareable order link for the current cart: this page's own URL
 *  with the encoded payload as its only query parameter. */
function getGeneratedOrderLink() {
  const payload = {
    version: 4,
    emptyCart: cartSettings.emptyCart,
    items: orderBuilderItems.map(item => ({
      label: item.label,
      checkoutUrl: item.checkoutUrl,
      qty: item.qty,
      isBase: item.isBase,
      isos: item.isos,
      totalILS: item.totalILS,
      preserveUrl: !!item.preserveUrl,
      topup: !!item.topup,
      catalog: !!item.catalog,
      topupIccid: item.topupIccid || "",
      topupProfile: item.topupProfile || ""
    }))
  };
  const url = new URL(window.location.href);
  url.search = "";
  url.hash = "";
  url.searchParams.set(ORDER_PAYLOAD_PARAM, encodeOrderPayload(payload));
  return url.toString();
}

/* ── 🕶️ TRUE incognito open (v7.14) ─────────────────────────────────────
   Browsers do not allow a page to open an incognito window — no such API
   exists, by design. The ONLY reliable route is OS-side: a one-time .reg
   install registers a tiny `gigaincognito:` URL protocol whose handler
   launches `chrome.exe --incognito <url>`. After the operator installs it
   (double-click the downloaded file) and ticks the cart checkbox, 🕶️
   really opens incognito in one click (Chrome asks once to "always
   allow" the protocol). Without the install, 🕶️ keeps the old behavior:
   normal tab + copied link + the Ctrl+Shift+N hint.
   ⚠ The handler passes the FULL portal URL after the scheme prefix, so
   it keeps working when the calculator file moves or a new version gets
   a new filename — nothing is baked into the registry but the launcher. */
const INCOGNITO_REG_CONTENT = [
  "Windows Registry Editor Version 5.00",
  "",
  "; SimTLV Giga Calculator - one-time incognito opener install.",
  "; Double-click this file, confirm, done. Requires Google Chrome.",
  "; Microsoft Edge instead: replace chrome.exe with msedge.exe and",
  ";   --incognito with --inprivate.",
  "",
  "[HKEY_CURRENT_USER\\Software\\Classes\\gigaincognito]",
  "@=\"URL:Giga Incognito Opener\"",
  "\"URL Protocol\"=\"\"",
  "",
  "[HKEY_CURRENT_USER\\Software\\Classes\\gigaincognito\\shell\\open\\command]",
  "@=\"cmd.exe /v:on /s /c \\\"set \\\"u=%1\\\" & start \\\"\\\" chrome.exe --incognito \\\"!u:gigaincognito:=!\\\"\\\"\"",
  ""
].join("\r\n");

/* v7.15: strict Windows security settings refuse to OPEN a downloaded
   .reg at all ("These files can't be opened" — the Mark-of-the-Web on
   the dangerous-extension list). Two remedies, both shipped:
     1. the ⬇ button's tooltip now teaches the classic unblock
        (right-click → Properties → Unblock → OK), and
     2. a 📋 button copies the SAME install as one PowerShell line —
        pasted text carries no Mark-of-the-Web and HKCU needs no admin,
        so nothing blocks it. One-time per computer, by the operator;
        the workers only ever click 🕶️. */
const INCOGNITO_PS_COMMAND =
  "New-Item -Path 'HKCU:\\Software\\Classes\\gigaincognito\\shell\\open\\command' -Force | Out-Null; " +
  "Set-ItemProperty -Path 'HKCU:\\Software\\Classes\\gigaincognito' -Name '(default)' -Value 'URL:Giga Incognito Opener'; " +
  "New-ItemProperty -Path 'HKCU:\\Software\\Classes\\gigaincognito' -Name 'URL Protocol' -Value '' -PropertyType String -Force | Out-Null; " +
  "Set-ItemProperty -Path 'HKCU:\\Software\\Classes\\gigaincognito\\shell\\open\\command' -Name '(default)' -Value 'cmd.exe /v:on /s /c \"set \"u=%1\" & start \"\" chrome.exe --incognito \"!u:gigaincognito:=!\"\"'";

/* v7.16: the bundled setup script (simtlv_incognito_setup_*.ps1, shipped
   next to this file) ends by reopening the calculator with
   ?incognito_ready=1 — the boot consumes the flag, arms 🕶️ mode,
   persists it, and cleans the address bar. So "run the script once" is
   the WHOLE setup: no checkbox for anyone to remember. */
function applyIncognitoReadyParam(search) {
  const params = new URLSearchParams(search || "");
  if (!params.has("incognito_ready")) return false;
  cartSettings.incognitoOpen = true;
  persistSession();
  try {
    params.delete("incognito_ready");
    const qs = params.toString();
    history.replaceState(null, "", window.location.pathname + (qs ? "?" + qs : ""));
  } catch (e) { /* file:// or jsdom may refuse replaceState — the flag is set anyway */ }
  showCopyToast("🕶️ פתיחה באינקוגניטו הופעלה במחשב הזה");
  return true;
}

/** Copies the PowerShell one-line install (the unblockable path). */
function copyIncognitoInstallCommand() {
  copyText(INCOGNITO_PS_COMMAND);
  const msg = "הפקודה הועתקה — Win, הקלד powershell, Enter, הדבק ו-Enter. ואז סמן 🕶️";
  showCopyToast(msg);
  setTimeout(() => showCopyToast(msg), 450);
}

/** Downloads the installer file; falls back to copying the file content
 *  when Blob URLs are unavailable. */
function downloadIncognitoInstaller() {
  try {
    const blob = new Blob([INCOGNITO_REG_CONTENT], { type: "application/octet-stream" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "giga-incognito-setup.reg";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => { try { URL.revokeObjectURL(a.href); } catch (e) {} }, 5000);
    showCopyToast("קובץ ההתקנה ירד — לחיצה כפולה עליו, אישור, ואז סמן 🕶️ בעגלה");
  } catch (e) {
    copyText(INCOGNITO_REG_CONTENT);
    showCopyToast("תוכן הקובץ הועתק — הדבק לקובץ בשם giga-incognito-setup.reg והרץ אותו");
  }
}

/** Fires the gigaincognito: handler with the full portal URL. */
function openIncognitoScheme(url) {
  try { window.location.href = "gigaincognito:" + url; } catch (e) { /* jsdom/no handler */ }
}

/** Persists the 🕶️ mode choice (rides the session like the rest of
 *  cartSettings) and re-renders so the cart reflects it. */
function setIncognitoOpen(on) {
  cartSettings.incognitoOpen = !!on;
  renderAll();
}

/** 🕶️ התחל הזמנה: copies the portal link, then opens it — for real in
 *  incognito when the handler is installed+enabled, otherwise in a normal
 *  tab with the Ctrl+Shift+N hint. */
function startOrderPortal() {
  if (!orderBuilderItems.length) { showCopyToast("הסל ריק — הוסף פריטים קודם"); return; }
  const link = getGeneratedOrderLink();
  copyText(link);
  const msg = cartSettings.incognitoOpen
    ? "נפתח באינקוגניטו 🕶️ (והקישור הועתק)"
    : "הקישור הועתק — Ctrl+Shift+N ואז הדבקה לאינקוגניטו 🕶️";
  if (cartSettings.incognitoOpen) openIncognitoScheme(link);
  else window.open(link, "_blank", "noopener");
  // copyText's clipboard promise fires its own toast asynchronously —
  // re-post ours after it so the instructive message is what sticks.
  showCopyToast(msg);
  setTimeout(() => showCopyToast(msg), 450);
}

/** Copies the shareable order link (cart drawer button). */
function copyGeneratedOrderLink() {
  if (!orderBuilderItems.length) {
    showCopyToast("אין פריטים להזמנה");
    return;
  }
  copyText(getGeneratedOrderLink());
  setExportStatus("קישור הזמנה משולבת הועתק ללוח.");
}


/* ═══════════════════════════════════════════════════════════════════════
   § 15. ORDER RUNNER
   Adds every cart item to the real site's cart, one navigation at a
   time, then lands on checkout.

   ⚠ POPUP DISCIPLINE (business rule #6): browsers allow ONE popup per
   user gesture. The runner opens a single NAMED background window
   synchronously inside the click, then RE-NAVIGATES it per item —
   re-navigating an existing window needs no popup permission, so any
   number of items works with exactly one popup. The previous N-windows
   approach silently dropped middle items on 3+ item orders. Any new
   multi-navigation feature must reuse this pattern.
   ═══════════════════════════════════════════════════════════════════════ */

/** Markup for the runner card (item list + progress dots). Also used by
 *  the standalone portal, where showButton adds the big checkout CTA. */
function orderRunnerMarkup(items, title = "Your Order is Ready", status = "Tap below to add everything to your cart.", showButton = false) {
  const itemRows = items.map(item => `
    <div class="order-runner-item">
      <span class="order-runner-dot"></span>
      <span>${escapeHtml(item.label)}</span>
      <span class="order-runner-qty">Qty: ${escapeHtml(item.qty)}</span>
    </div>
  `).join("");

  const dots = items.map((_, i) => `<span id="orderDot_${i}"></span>`).join("");

  return `
    <div class="order-runner-card">
      <button class="order-runner-close" onclick="closeOrderOverlay()" title="סגור">×</button>
      <div class="order-runner-logo">Sim<span>TLV</span></div>
      <div class="order-runner-sub">Generated Order</div>
      <div class="order-runner-icon" id="orderRunnerIcon">🛒</div>
      <div class="order-runner-title" id="orderRunnerTitle">${escapeHtml(title)}</div>
      <div class="order-runner-status" id="orderRunnerStatus">${escapeHtml(status)}</div>
      <div class="order-runner-items">${itemRows}</div>
      <div class="order-runner-progress" id="orderRunnerProgress">${dots}</div>
      ${showButton ? `<button class="run-order" onclick="startGeneratedOrderItems(window.__standaloneOrderItems || [])">Proceed to Checkout →</button>` : ""}
    </div>
  `;
}

/** Shows the full-screen runner overlay (created lazily, reused after). */
function openOrderOverlay(items) {
  let overlay = document.getElementById("orderOverlay");
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "orderOverlay";
    overlay.className = "order-overlay";
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = orderRunnerMarkup(items, "Preparing your order", "Please keep this page open while each item is added.");
  overlay.classList.add("is-open");
}

/** Hides the runner overlay. */
function closeOrderOverlay() {
  const overlay = document.getElementById("orderOverlay");
  if (overlay) overlay.classList.remove("is-open");
}

/** v7.26: where runner status updates go. The standalone portal renders
 *  orderRunnerMarkup TWICE — the static portal card in .app AND the live
 *  overlay — with the same ids, and getElementById used to hit the HIDDEN
 *  portal copy (earlier in the DOM), freezing the customer-facing overlay
 *  for the whole run. Whenever the overlay is open it IS the live runner,
 *  so scope every lookup to it; with no overlay this degrades to the
 *  document (the in-app pre-overlay case). */
function orderRunnerRoot() {
  const o = document.getElementById("orderOverlay");
  return (o && o.classList.contains("is-open")) ? o : document;
}

/** Updates the progress dots: done / active / pending.
 *  ⚠ Query by ATTRIBUTE/CLASS inside the root, never by #id: with the
 *  portal's duplicate ids an engine's id fast-path can resolve the OTHER
 *  copy (observed in jsdom) — a subtree attribute match cannot. */
function setOrderRunnerProgress(activeIndex, itemsLength) {
  const root = orderRunnerRoot();
  for (let i = 0; i < itemsLength; i++) {
    const dot = root.querySelector(`[id="orderDot_${i}"]`);
    if (!dot) continue;
    dot.className = i < activeIndex ? "done" : (i === activeIndex ? "active" : "");
  }
}

/** Updates the runner card's title / status line / icon. */
function setOrderRunnerText(title, status, icon = "🛒") {
  const root = orderRunnerRoot();
  const titleEl = root.querySelector(".order-runner-title");
  const statusEl = root.querySelector(".order-runner-status");
  const iconEl = root.querySelector(".order-runner-icon");
  if (titleEl) titleEl.textContent = title;
  if (statusEl) statusEl.textContent = status;
  if (iconEl) iconEl.textContent = icon;
}

/** Runs a generated order. MUST be called from inside a user gesture
 *  (the popup permission depends on it). Flow:
 *    1. open ONE named background window ("simtlv_bg_runner") — if the
 *       browser blocks it, ABORT with an explanatory alert rather than
 *       place a partial order;
 *    2. (v6.11) if the "empty cart" toggle is on, clear the cart ONCE up
 *       front as its own awaited navigation, then add every item with NO
 *       empty_cart — see the race note below;
 *    3. navigate the helper to each middle item's URL, pacing with
 *       sleepOrder so the site can process each add-to-cart;
 *    4. close the helper window and send THIS page to the final item's
 *       URL, which lands on checkout with the full cart.
 *
 *  ⚠ The "sometimes 2 items become 1" bug (v6.11): empty_cart used to ride
 *  on the FIRST item's add-to-cart, fired into the background window. That
 *  add races the other adds, and we can't see when the cross-origin site
 *  finishes it — so a late-arriving empty_cart could wipe an item already
 *  added, or the first add simply didn't complete before teardown. Fix:
 *  make the clear a separate, awaited, product-free step BEFORE any add,
 *  and never let an add carry empty_cart in a multi-item run.
 *
 *  v7.26 hardening:
 *    * __orderRunning re-entrancy guard — a double-click used to start a
 *      SECOND loop driving the same named helper window, interleaving its
 *      clears/adds with the first run's (the v6.11 race class again);
 *    * every checkout URL is allow-listed (isAllowedCheckoutUrl) before
 *      any navigation — portal payloads are attacker-craftable;
 *    * a helper window closed mid-run ABORTS instead of silently
 *      "adding" the rest into a dead window and checking out short;
 *    * the whole run is try/caught — any failure shows the overlay's
 *      error state instead of an unhandled rejection + wedged overlay. */
let __orderRunning = false;

async function startGeneratedOrderItems(items) {
  if (!items || !items.length) {
    showCopyToast("אין פריטים להזמנה");
    return;
  }
  // Re-entrant click while a run is in flight: the open overlay is the
  // feedback; the repeat is idempotence, not an error.
  if (__orderRunning) return;
  __orderRunning = true;

  let bg = null;
  try {
    openOrderOverlay(items);

    if (!items.every(it => it && isAllowedCheckoutUrl(it.checkoutUrl))) {
      throw new Error("blocked: checkout URL outside simtlv.co.il");
    }

    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
      || (navigator.maxTouchPoints > 1);
    // Desktop: shove the helper window off-screen. Mobile: default features
    // (tiny off-screen popups aren't honored there anyway).
    const features = isMobile ? "" : "width=1,height=1,left=-9999,top=-9999";

    const multi = items.length > 1;
    if (multi) {
      try { bg = window.open("about:blank", "simtlv_bg_runner", features); } catch (e) { bg = null; }
      if (!bg) {
        closeOrderOverlay();
        alert("הדפדפן חסם את חלון הרקע. אשר חלונות קופצים (Popups) לאתר הזה ונסה שוב.");
        return;
      }
      try { bg.blur(); window.focus(); } catch (e) { /* cross-origin after nav — expected */ }

      // v6.11: one dedicated, awaited cart-clear up front — so no add-to-cart
      // carries empty_cart and a late clear can't wipe an already-added item.
      // v7.17: with the toggle OFF the warm-up still runs (product-free
      // checkout page) — the FIRST navigation only establishes the site's
      // session cookie, so no add ever rides a cold session. A real 3-item
      // order lost its first item to exactly that race.
      // v7.18: every hop is now LOAD-DRIVEN (navigateBgAndWait) instead of
      // a blind timer — see the pacing note in § 2.
      if (cartSettings.emptyCart) {
        setOrderRunnerText("Preparing your order", "Clearing the cart…", "🧹");
        await navigateBgAndWait(bg, buildCartClearUrl(items[0].checkoutUrl));
      } else {
        setOrderRunnerText("Preparing your order", "Connecting to the store…", "🔗");
        await navigateBgAndWait(bg, buildSessionWarmupUrl(items[0].checkoutUrl));
      }
      if (bg.closed) throw new Error("helper window closed during warm-up");
    }

    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      // In a multi-item run the up-front step already cleared the cart, so
      // force empty_cart OFF for every add (see the race note above).
      const url = buildOrderItemUrl(item, i, { forceNoEmptyCart: multi });

      setOrderRunnerProgress(i, items.length);
      setOrderRunnerText(i === 0 ? "Preparing your order" : "Almost there", `Adding ${item.label}…`, "🛒");

      if (i < items.length - 1) {
        // Middle items: re-navigate the SAME background window, waiting for
        // each page's load signal (or its ceiling) before the next hop.
        // A CLOSED helper is fatal (this add and the rest would be lost);
        // a mere ceiling timeout stays lenient — the add usually landed.
        const loaded = await navigateBgAndWait(bg, url);
        if (bg.closed) throw new Error("helper window closed mid-run");
        if (loaded) setOrderRunnerText("Almost there", `${item.label} — נקלט ✓`, "🛒");
      } else {
        // Final item: close the helper and take this page to checkout.
        try { if (bg && !bg.closed) bg.close(); } catch (e) { /* window already gone */ }
        setOrderRunnerText("Loading checkout", "Final item is being added. Redirecting to checkout…", "✨");
        setOrderRunnerProgress(items.length - 1, items.length);
        await sleepOrder(ORDER_FINAL_SETTLE_MS);
        window.location.href = url;
      }
    }
  } catch (err) {
    // Never swallow: log for diagnosis, kill the helper, and turn the
    // overlay into the error surface (its copy is the operator/customer
    // alert in both the app and the standalone portal — no checkout
    // navigation happens on this path, and the ✕ still closes it).
    console.error("order runner failed", err);
    try { if (bg && !bg.closed) bg.close(); } catch (e) { /* already gone */ }
    setOrderRunnerProgress(-1, items.length);
    setOrderRunnerText("Something went wrong", "The order was stopped — no more items will be added. Close this and try again.", "⚠️");
  } finally {
    __orderRunning = false;
  }
}

/** v7.18: one LOAD-DRIVEN hop of the background helper window.
 *  1. Reset to about:blank — same-origin, so bg.location.href is READABLE
 *     and we can PROVE the frame count starts at 0 (otherwise the
 *     previous page's frames would satisfy the signal instantly).
 *  2. Navigate to `url` and poll the two cross-origin-readable facts:
 *     "is it still about:blank?" (href read throws once the new page
 *     commits — that throw IS the commit signal) and bg.length (the
 *     page's frame count; simtlv pages inject ≥1 iframe at runtime).
 *     Both true ⇒ the server processed the request AND the page's own
 *     scripts are running. Returns true when detected, false when the
 *     iteration ceiling elapsed instead (the timer fallback — never
 *     slower than ORDER_HOP_CEILING_MS).
 *  Iteration-bounded so the harness's stubbed sleepOrder fast-forwards
 *  it; each real iteration awaits ORDER_POLL_MS. */
async function navigateBgAndWait(bg, url) {
  try { bg.location.href = "about:blank"; } catch (e) { /* helper gone */ }
  for (let p = 0; p < ORDER_BLANK_CEILING_MS / ORDER_POLL_MS; p++) {
    // Two reset signals, either suffices: href readable as about:blank
    // (same-origin case), or the frame count dropping to 0 (readable even
    // when a file:// opener can't read its own spawned about:blank — a
    // page that HAD frames reaching 0 means the blank page committed; a
    // page that had none makes waiting pointless anyway, since detection
    // below requires a fresh 0→N rise).
    let blank = false;
    try { blank = bg.location.href === "about:blank"; } catch (e) { blank = false; }
    let frames = 1;
    try { frames = Number(bg.length) || 0; } catch (e) { frames = 1; }
    if (blank || frames === 0 || bg.closed) break;
    await sleepOrder(ORDER_POLL_MS);
  }

  try { bg.location.href = url; bg.blur(); window.focus(); } catch (e) { /* cross-origin after nav — expected */ }
  let detected = false;
  for (let p = 0; p < ORDER_HOP_CEILING_MS / ORDER_POLL_MS; p++) {
    if (bg.closed) break;
    let stillBlank = false;
    try { stillBlank = bg.location.href === "about:blank"; } catch (e) { stillBlank = false; }
    let frames = 0;
    try { frames = Number(bg.length) || 0; } catch (e) { frames = 0; }
    if (!stillBlank && frames > 0) { detected = true; break; }
    await sleepOrder(ORDER_POLL_MS);
  }
  await sleepOrder(ORDER_LOAD_SETTLE_MS);
  return detected;
}

/** "צור הזמנה אוטומטית" handler: runs the current cart. */
function startGeneratedOrderFromBuilder() {
  startGeneratedOrderItems(orderBuilderItems.slice());
}

/** Boots the page as a STANDALONE ORDER PORTAL (URL carries
 *  ORDER_PAYLOAD_PARAM): decodes the payload, adds body.order-mode
 *  (which hides all normal chrome — extend its CSS display:none list if
 *  you add new chrome), and shows only the runner card with a checkout
 *  button. Invalid payloads get a friendly error card. */
function renderStandaloneOrderPortal() {
  const loadingEl = document.getElementById("loading");
  if (loadingEl) loadingEl.style.display = "none";

  let items = [];
  try {
    const raw = new URLSearchParams(window.location.search).get(ORDER_PAYLOAD_PARAM);
    const payload = decodeOrderPayload(raw);
    cartSettings.emptyCart = payload.emptyCart !== false;
    items = Array.isArray(payload.items) ? payload.items : [];
    // v7.26: the payload rides the query string, so anyone can craft one.
    // A single foreign checkout URL rejects the WHOLE payload — a
    // partially-tampered link is not trustworthy — and the customer gets
    // the plain "Link error" card instead of a branded card that would
    // navigate off-site.
    if (items.length && !items.every(it => it && isAllowedCheckoutUrl(it.checkoutUrl))) {
      console.warn("order payload rejected: checkout URL outside simtlv.co.il");
      items = [];
    }
  } catch (e) {
    items = [];
  }

  window.__standaloneOrderItems = items;
  document.body.classList.add("order-mode");
  const container = document.querySelector(".app");
  if (!container) return;

  if (!items.length) {
    container.innerHTML = `<div class="order-runner-card"><div class="order-runner-title">Link error</div><div class="order-runner-status">Missing or invalid order data.</div></div>`;
    return;
  }

  container.innerHTML = `<div class="standalone-order-card">${orderRunnerMarkup(items, "Your Order is Ready", "Your generated bundle is ready. Tap below to add everything to the cart.", true)}</div>`;
}


/* ═══════════════════════════════════════════════════════════════════════
   § 16. TOP-UP SYSTEM
   Topping up existing customer cards. The workflow:
     1. The operator picks a SIM version (or types an ICCID and lets the
        autodetector pick it — see ICCID_TYPE_PREFIXES in §1).
     2. A catalog for that version is loaded, ONCE, from cache or by
        probing the site with a known sample ICCID:
          * esim_v3 — no scan at all; derived from the manual-site eSIM
            prices already cached per zone (§11);
          * psim_v2 — one scan per price zone via the zone's
            representative country;
          * psim_v1 — one scan via Germany, valid for all of Europe.
     3. The catalog's checkout URLs are "materialized" for the current
        selection: fly_countries / product_zone / country names are
        rewritten, the probe ICCID is swapped for the CUSTOMER's ICCID,
        and the referral code is stamped on.
   Business rules #2–#5 (REUP, probe-ISO scrub, highest-zone-only,
   per-ICCID cart keys) are all enforced in this section — the enforcing
   lines are marked with ⚠ comments.
   ═══════════════════════════════════════════════════════════════════════ */

/* ---- ICCID basics ------------------------------------------------------- */

/** Strips non-digits and caps at 24 digits (ICCIDs are 18–22; the cap
 *  just guards against garbage paste). */
function normalizeIccid(value) {
  return String(value || "").replace(/\D/g, "").slice(0, 24);
}

/** Display-shortened ICCID: "894801…1457". */
function shortIccid(iccid) {
  const value = String(iccid || "");
  return value.length > 8 ? `${value.slice(0, 6)}…${value.slice(-4)}` : value;
}

/* ---- Topup state bootstrap ---------------------------------------------- */

/** Lazily initializes the topup tab's auto-mode fields on topupState
 *  (idempotent — guarded by autoModeReady). Restores the last chosen SIM
 *  version + customer ICCID, and loads the persisted catalog cache
 *  (falling back to the legacy store so upgrades keep their cache). */
function ensureAutoTopupState() {
  if (!topupState.autoModeReady) {
    topupState.autoModeReady = true;
    topupState.simVersion = localStorage.getItem(TOPUP_SELECTED_VERSION_STORAGE_KEY) || topupState.simVersion || "esim_v3";
    topupState.customerIccid = normalizeIccid(localStorage.getItem(TOPUP_CUSTOMER_ICCID_STORAGE_KEY) || topupState.customerIccid || topupState.iccid || "");
    topupState.iccid = topupState.customerIccid;
    topupState.batchMode = topupState.batchMode || false;
    topupState.batchRaw = topupState.batchRaw || "";
    topupState.batchIccids = topupState.batchIccids || [];
    topupState.catalogCache = {};
    topupState.autoPreloadStarted = false;
    topupState.autoPreloading = false;
    topupState.autoPreloadDone = false;
    topupState.autoPreloadMessage = "";
    topupState.autoPreloadErrors = [];
    topupState.autoEnsureRunning = false;

    try {
      const saved = localStorage.getItem(TOPUP_AUTO_CATALOG_STORAGE_KEY) || localStorage.getItem(TOPUP_VERSION_CATALOG_STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === "object") topupState.catalogCache = parsed;
      }
    } catch (e) {
      console.warn("Could not load automatic topup catalog cache", e);
    }
  }
}

/** Persists the topup catalog cache. */
function persistTopupCatalogCache() {
  try {
    localStorage.setItem(TOPUP_AUTO_CATALOG_STORAGE_KEY, JSON.stringify(topupState.catalogCache || {}));
  } catch (e) {
    console.warn("Could not save automatic topup catalog cache", e);
  }
}

/* ---- Version selection + ICCID autodetection ----------------------------- */

/** True for the eSIM topup generations that share the SAME search_topup scan
 *  and catalog (v6.15). V4 is identical to V3 for now; grouping them here lets
 *  the whole topup pipeline treat them alike. When V4 diverges (its own
 *  single-country plans), split it out of this predicate. */
function isEsimTopupProfileId(id) { return id === "esim_v3" || id === "esim_v4"; }

/** The active version profile (falls back to esim_v3 on bad state). */
function getTopupProfile() {
  ensureAutoTopupState();
  return TOPUP_VERSION_PROFILES[topupState.simVersion] || TOPUP_VERSION_PROFILES.esim_v3;
}

/** Switches the topup SIM version, refreshes the shown catalog, and
 *  persists the choice. */
function setTopupVersion(version) {
  ensureAutoTopupState();
  topupState.simVersion = TOPUP_VERSION_PROFILES[version] ? version : "esim_v3";
  topupState.catalogResult = getCurrentTopupCatalog();
  topupState.result = topupState.catalogResult;
  topupState.error = "";
  storageSet(TOPUP_SELECTED_VERSION_STORAGE_KEY, topupState.simVersion);
  renderAll();
}

/** SIM type for an ICCID via longest-matching-prefix over
 *  ICCID_TYPE_PREFIXES. Returns null when unknown — callers MUST NOT
 *  auto-switch on null. */
function detectSimTypeFromIccid(iccid) {
  const ic = normalizeIccid(iccid);
  if (ic.length < 13) return null; // the tricky families need 13 digits
  let best = null;
  for (const rule of ICCID_TYPE_PREFIXES) {
    if (ic.startsWith(rule.prefix) && (!best || rule.prefix.length > best.prefix.length)) best = rule;
  }
  return best ? best.type : null;
}

/** Auto-switches the version selector to match a typed ICCID.
 *  Fires only on a FULL ICCID (≥18 digits) so the selector doesn't
 *  flicker mid-typing, and announces the switch with a toast. */
function autoDetectAndSwitchSimType(iccid) {
  const ic = normalizeIccid(iccid);
  if (ic.length < 18) return; // wait for a full ICCID — no flicker mid-typing
  const type = detectSimTypeFromIccid(ic);
  if (!type) return;
  ensureAutoTopupState();

  // v6.15: V2 eSIM can't be topped up through this CRM — only manually on the
  // website. Pop a message once per ICCID and DON'T switch the version selector.
  if (type === "esim_v2_manual") {
    if (topupState.lastManualAlertIccid !== ic) {
      topupState.lastManualAlertIccid = ic;
      alert("כרטיס eSIM V2 — יש לבצע טעינה (Topup) ידנית באתר, לא דרך המערכת הזו.");
    }
    return;
  }

  if (!TOPUP_VERSION_PROFILES[type]) return; // safety: non-scannable / unknown
  if (topupState.simVersion === type) return;
  setTopupVersion(type);
  showCopyToast(`🔍 זוהה ${TOPUP_VERSION_PROFILES[type].label} — הוחלף אוטומטית`);
}

/** ICCID input handler. ⚠ Deliberately does NOT re-render by default:
 *  renderAll would recreate the input and destroy focus mid-typing (see
 *  the rendering-model note in the header). State + storage + detection
 *  only; pass rerender=true for programmatic updates. */
function setTopupCustomerIccid(value, rerender = false) {
  ensureAutoTopupState();
  const iccid = normalizeIccid(value);
  topupState.customerIccid = iccid;
  topupState.iccid = iccid;
  const input = document.getElementById("topupIccid");
  if (input && input.value !== iccid) input.value = iccid;
  storageSet(TOPUP_CUSTOMER_ICCID_STORAGE_KEY, iccid);
  updateIccidLuhnBadge(iccid);
  autoDetectAndSwitchSimType(iccid);
  if (rerender) renderAll();
}

/* ---- Batch mode ------------------------------------------------------------
   Paste many ICCIDs, one per line; 🧺 then adds a cart line per card. */

/** Shows/hides the batch textarea. */
function toggleTopupBatchMode() {
  ensureAutoTopupState();
  topupState.batchMode = !topupState.batchMode;
  renderAll();
}

/** Batch textarea handler: parses ICCIDs (18+ digits, split on newlines/
 *  commas/semicolons). ⚠ Like the ICCID input, this must NOT re-render —
 *  the counter on the toggle button is updated via direct DOM instead.
 *  Preserve this pattern for any new live-typed field. */
function setTopupBatchIccids(value) {
  ensureAutoTopupState();
  topupState.batchRaw = String(value || "");
  topupState.batchIccids = topupState.batchRaw
    .split(/[\n,;]+/)
    .map(s => normalizeIccid(s))
    .filter(ic => ic.length >= 18);
  // Live-update the counter on the toggle without a focus-stealing re-render.
  const btn = document.querySelector(".topup-batch-toggle");
  if (btn) btn.textContent = `📚 מרובה${topupState.batchIccids.length ? ` · ${topupState.batchIccids.length}` : ""}`;
  if (topupState.batchIccids.length) autoDetectAndSwitchSimType(topupState.batchIccids[0]);
}

/* ---- Selection helpers (highest-zone rule) ------------------------------- */

/** The raw selection (kept as a function so call sites read uniformly). */
function getTopupCountries() {
  return selected.slice();
}

/** Canonical key for a set of countries: sorted ISOs, pipe-joined. */
function getTopupCountryKey(countries = getTopupCountries()) {
  return countries.map(c => c.iso).sort().join("|");
}

/** Cache key for one ICCID + country set (used on scan results). */
function getTopupCacheKeyFor(iccid, countries = getTopupCountries()) {
  return `${normalizeIccid(iccid)}|${getTopupCountryKey(countries)}`;
}

/** ⚠ Business rule #4: topups operate on the HIGHEST-zone selection
 *  only, mirroring how base plan cards behave with mixed selections.
 *  Without this, a mixed-zone selection (e.g. US zone 1 + JP zone 2)
 *  would put off-zone ISOs into fly_countries while pricing against the
 *  top zone. */
function getSelectedTopupCountries() {
  const zone = getHighestZone();
  if (zone === null) return [];
  return selected.filter(c => c.zone === zone);
}

/** The zone topups price against (the highest general zone). */
function getSelectedTopupZone() {
  return getHighestZone();
}

/** Pipe-joined HEBREW names of the active topup countries — the value
 *  the checkout URL's country_name_in_region parameter expects. */
function getSelectedTopupCountryNamesForUrl() {
  return getSelectedTopupCountries()
    .map(c => c.name?.he || c.name?.en || c.iso)
    .filter(Boolean)
    .join("|");
}

/** First country of a zone (used as that zone's scan representative). */
function getZoneRepresentative(zone) {
  const z = Number(zone);
  return data.find(c => Number(c.zone) === z) || null;
}

/** One { zone, country } representative for EVERY zone, zone-sorted
 *  (drives the automatic V2 all-zones preload). */
function getAllZoneRepresentatives() {
  const byZone = new Map();
  data.forEach(country => {
    const z = Number(country.zone);
    if (!byZone.has(z)) byZone.set(z, country);
  });
  return [...byZone.entries()]
    .sort((a,b) => Number(a[0]) - Number(b[0]))
    .map(([zone, country]) => ({ zone: Number(zone), country }));
}

/* ---- Catalog cache keys ---------------------------------------------------
   V3/V2 catalogs are per ZONE (prices are zone-wide); V1 has exactly one
   Europe-wide catalog probed via Germany. */

/** Catalog cache key for the CURRENT selection + a profile. */
function getTopupCatalogKey(countries = getTopupCountries(), simVersion = getTopupProfile().id) {
  const profileId = simVersion || "esim_v3";
  if (isEsimTopupProfileId(profileId)) {
    // v6.10: V3 is a real search_topup scan (per selection), so the topup
    // PRODUCT ids come from the site — not the eSIM "new purchase" catalog.
    // v6.15: V4 shares this same key on purpose (it's identical to V3 for
    // now), so the single V3 preload scan serves both.
    const iso = getTopupCountryKey(countries);
    return iso ? `esim_v3|${iso}` : "esim_v3|none";
  }
  if (profileId === "psim_v2") {
    const zone = getSelectedTopupZone();
    return zone === null ? "psim_v2|none" : `psim_v2|zone:${zone}`;
  }
  if (profileId === "psim_v1") return "psim_v1|europe:DE";
  return `${profileId}|${getTopupCountryKey(countries)}`;
}

/** Catalog cache key for an EXPLICIT zone (preload loops). */
function getTopupCatalogKeyForZone(profileId, zone) {
  if (profileId === "psim_v2") return `psim_v2|zone:${Number(zone)}`;
  if (profileId === "esim_v3") return `esim_v3|zone:${Number(zone)}`;
  if (profileId === "psim_v1") return "psim_v1|europe:DE";
  return `${profileId}|zone:${Number(zone)}`;
}

/* ---- V1 Europe restriction ------------------------------------------------ */

/** Is this country allowed for V1 pSIM? (ISO or Hebrew-name match.) */
function isV1CountryAllowed(country) {
  const iso = String(country?.iso || "").toUpperCase();
  const he = String(country?.name?.he || "").trim();
  return TOPUP_V1_EUROPE_ALLOWED_ISOS.has(iso) || TOPUP_V1_EUROPE_ALLOWED_HE.has(he);
}

/** The subset of `countries` V1 does NOT allow. */
function getV1DisallowedCountries(countries = getTopupCountries()) {
  return (countries || []).filter(c => !isV1CountryAllowed(c));
}

/** Validates the selection for a profile. Returns a user-facing error
 *  string, or "" when the selection is fine. */
